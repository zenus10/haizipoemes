\n脖子莫非是别人的通道？\n木鱼儿，木鱼儿\n大劫后的鼻音\n---\n● 1984.11"},{"id":"short/1986/给托尔斯泰","title":"给托尔斯泰","type":"short","year":"1986","body":"我想起你如一位俄国农妇暴跳如雷\n补一只旧鞋的\n手\n时时停顿\n这手掌混同于\n兵士的臭脚、马肉和盐\n你的灰色头颅一闪而过\n教堂的裸麦中央\n北方流注的河流马的脾气暴跳如雷\n胸膛上面排排旧俄的栅栏暴跳如雷\n低矮的天空、灯火和农妇暴跳如雷\n吹灭云朵\n吹灭火焰\n吹灭灯盏\n吹灭一切妓女\n和善良女人的\n嘴唇\n你可以耕地，补补旧鞋\n你可以爱他人，读读福音书\n我记得陈旧的河谷端坐老人\n端坐暴跳如雷的老人\n1985.12草摘\n---\n● 1986.12修改"},{"id":"short/1987/公爵的私生女","title":"公爵的私生女","type":"short","year":"1987","body":"——给波德莱尔\n我们偶然相遇\n没有留下痕迹\n那个庸俗的故事\n使用货币或麦子\n卖鱼的卖鱼\n抓药的抓药\n在天堂的黄昏\n躲也躲不开\n我们的生存\n唯一的遭遇是一首诗\n一首诗是一个被谋杀的生日\n月光下　诗篇犹如\n每一个死婴背着包袱\n在自由的行进\n路途遥远却独来独往\n死婴\n我的朋友\n我的亲人\n来路已逝去路以断\n我们偶然相遇\n没有留下痕迹\n石头门外，守夜人\n抱着三枝火焰\n埋下双眼，一夜长眠\n1986.8初稿\n---\n● 1987.10.31改"},{"id":"short/1988/日记","title":"日记","type":"short","year":"1988","body":"姐姐，今夜我在德令哈，夜色笼罩\n姐姐，我今夜只有戈壁\n草原尽头我两手空空\n悲痛时握不住一颗泪滴\n姐姐，今夜我在德令哈\n这是雨水中一座荒凉的城\n除了那些路过的和居住的\n德令哈……今夜\n这是唯一的，最后的，抒情。\n这是唯一的，最后的，草原。\n我把石头还给石头\n让胜利的胜利\n今夜青稞只属于她自己\n一切都在生长\n今夜我只有美丽的戈壁　空空\n姐姐，今夜我不关心人类，我只想你\n---\n● 1988.7.25火车经过德令哈"},{"id":"short/1989/桃树林","title":"桃树林","type":"short","year":"1989","body":"内脏外的太阳\n照着内脏内的太阳\n寂静\n血红\n九个公主\n九个发疯的公主身体内部的黑夜\n也这样寂静，血红\n桃树林，你的黑铁已染上了谁的血\n打碎了灯，打碎了头颅，打碎了女人流血的月亮\n他的内脏抱住太阳\n什么是黑夜？\n黑夜的前面首先是什么？\n黑夜的后面又紧跟着什么？紧跟着谁？\n内脏外的太阳\n照着寂静的稻麦\n田野上圆润的裸体\n少女的黄金在内部流淌\n1988草稿\n---\n● 1989.3.15改"},{"id":"short/1983/喜马拉雅","title":"喜马拉雅","type":"short","year":"1983","body":"高原悬在天空\n天空向我滚来\n我丢失了一切\n面前只有大海\n我是在我自己的远方\n我在故乡的海底——\n走过世界最高的地方\n喜马拉雅　喜马拉雅\n你是谁\n饥饿\n怀孕\n把无尽的\n滚过天空的头颅\n放回天空\n我从大海来到落日的中央\n飞遍了天空找不到一块落脚之地\n今日有粮食却没有饥饿\n今天的粮食飞遍了天空\n找不到一只饥饿的腹部\n饥饿用粮食喂养\n更加饥饿，奄奄一息\n草原上的天空不可阻挡\n嘴唇和我抱住河水\n头颅和他的姐妹\n在大河底部通向海洋\n割下头颅的身子仍在世上\n最高的一座山\n仍在向上生长"},{"id":"short/1985/十四行-夜晚的月亮","title":"十四行：夜晚的月亮","type":"short","year":"1985","body":"推开树林\n太阳把血\n放入灯盏\n我静静坐在\n人的村庄\n人居住的地方\n一切都和本原一样\n一切都存入\n人的世世代代的脸\n一切不幸\n我仿佛\n一口祖先们\n向后代挖掘的井。\n一切不幸都源于我幽深而神秘的水\n---\n● 1985.6.19"},{"id":"short/1984/民间艺人","title":"民间艺人","type":"short","year":"1984","body":"平原上有三个瞎子\n要出远门\n红色的手鼓在半夜\n突然敲响\n并没有死人\n并没有埋下枣木拐杖\n敲响，敲响\n心在最远的地方沉睡\n平原上有三个瞎子\n要出远门\n那天夜里\n摸黑吃下高粱饼\n---\n● 1984.11"},{"id":"short/1986/肉体之一","title":"肉体（之一）","type":"short","year":"1986","body":"在甜蜜果仓中\n一枚松鼠肉体般甜蜜的雨水\n穿越了天空　蓝色\n的羽翼\n光芒四射\n并且在我的肉体中\n停顿了片刻\n落到我的床脚\n在我手能摸到的地方\n床脚变成果园温暖的树桩\n它们抬起我\n在一只飞越山梁的大鸟\n我看见了自己\n一枚松鼠肉体\n般甜蜜的雨水\n在我的肉体中停顿\n了片刻\n---\n● 1986.6"},{"id":"short/1987/冬天","title":"冬天","type":"short","year":"1987","body":"火的叫声传来\n火的叫声微弱\n山坡上牛羊拥挤\n想起你使我眩晕\n＊\n英雄的猎人\n拥着一家酒店\n坐在白雪中\n心中的黑夜寒冷\n1988.2.10.　故乡\n＊\n在黑夜里为火写诗\n在草原上为羊写诗\n在北风中为南风写诗\n在思念中为你写诗\n---\n● 1988.8.15.　日喀则\n＊\n夜的中心幽暗\n边缘发亮　寒冷\n这是　火儿\n照亮雪山和马\n＊\n大地薄弱\n两端锋利\n使中心幽暗\n难以分辨"},{"id":"short/1988/星","title":"星","type":"short","year":"1988","body":"我死于语言和诉说的旷野\n是的，这些我全都听见了。虽然\n草原神秘异常\n秋天，美丽处女是竖起风暴的花纹\n虽说一个断臂的人\n不能用手\n却可以用牙齿\n和嘴唇　打开我的诗集——\n那是在大火中\n那就是星\n是——他是你们的哥哥。\n诗人高喊\n带火者，上山来！\n牵着骆驼\n的鬼魂\n出现在黄昏\n星\n我是多么爱你\n不爱那些鬼魂\n---\n● 1988.5"},{"id":"short/1989/桃花_1","title":"桃花","type":"short","year":"1989","body":"曙光中黄金的车子上\n血红的，爆炸裂开的\n太阳私生的女儿\n在迟钝的流着血\n像一个起义集团内部\n草原上野蛮荒凉的弯刀\n---\n● 1989.3.15"},{"id":"short/1983/在昌平的孤独","title":"在昌平的孤独","type":"short","year":"1983","body":"孤独是一只鱼筐\n是鱼筐中的泉水\n放在泉水中\n孤独是泉水中睡着的鹿王\n梦风的猎鹿人\n就是那用鱼筐提水的人\n以及其他的孤独\n是柏木之舟中的两个儿子\n和所有女儿，围着诗经桑麻沅湘木叶\n在爱情中失败\n他们是鱼筐中的火苗\n沉到水底\n拉到岸上还是一只鱼筐\n孤独不可言说\n---\n● 1986"},{"id":"short/1985/夏天的太阳","title":"夏天的太阳","type":"short","year":"1985","body":"夏天\n如果这条街没有鞋匠\n我就打赤脚\n站到太阳下看太阳\n我想到在白天出生的孩子\n一定是出于故意\n你来人间一趟\n你要看看太阳\n和你的心上人\n一起走在街上\n了解她\n也要了解太阳\n（一组健康的工人\n正午抽着纸烟）\n夏天的太阳\n太阳\n当年基督入世\n他也在这阳光下长大\n---\n● 1985.1"},{"id":"short/1984/海上","title":"海上","type":"short","year":"1984","body":"所有的日子都是海上的日子\n穷苦的渔夫\n肉疙瘩象一卷笨拙的绳索\n在波浪上展开\n想抓住远方\n闪闪发亮的东西\n其实那只是太阳的假笑\n他抓住的只是几块会腐烂的木板：\n房屋、船和棺材\n成群游来鱼的脊背\n无始无终\n只有关于青春的说法\n一触即断\n---\n● 1984.6"},{"id":"short/1986/葡萄园之西的话语","title":"葡萄园之西的话语","type":"short","year":"1986","body":"也好\n我感到\n我被抬向一面贫穷而圣洁的雪地\n我被种下，被一双双劳动的大手\n仔仔细细地种\n于是，我感到所罗门的帐幔被一阵南风掀开\n所罗门的诗歌\n一卷卷\n滚下山腰\n如同泉水\n打在我脊背上\n涧中黑而秀美的脸儿\n在我的心中埋下。也好\n我感到我被抬向一面贫穷而圣洁的雪地\n你这女子中极美丽的，你是我的棺材，我是你的棺材\n---\n● 1986.8.25"},{"id":"short/1987/冬天的雨","title":"冬天的雨","type":"short","year":"1987","body":"冬天的雨 \n一只船停在荒凉的河岸\n那就是你居住的城市\n我的外套肮脏，扔在河岸上\n我的心情开始平静而开朗\n河水上面还是山冈\n许多年前冒起了白烟\n部落来到这里安下了铁锅\n在潮湿的天气里\n我的心情开始平静而开朗\n这不是别人的街头，也不是我梦中的景色\n街头上卖艺人收起了他彩色的帐篷\n冬天的雨下在石头上\n飘过山梁仍旧是冬天的雨\n打一只火把走到船外去看山头的麦地\n然后在神像前把火把熄灭\n我们沉默地靠在一起\n你是一个仙女，是冬天潮湿的石头\n你的外表是一把雨伞\n你躲在伞中像拒绝天地的石头\n你的黑发披散在冬天的雨中\n混同于那些明媚的两省交界的姑娘\n在大山的边缘，山顶的雪已隐然远去\n像那些在大河上凝固的白帆\n我摘下你的头巾，走到你的麦地\n这里粮食虽然是潮湿的\n仍然是山顶的粮食\n野兽在雨中说过的话，我们还要再说一遍\n我们在火把中把野兽说过的话重复一遍\n我看见一个铁匠的火屑飞溅\n我看到一条肮脏的河流奔向大海，越来越清澈，平静而广阔\n这都是你的赐予，你手提马灯，手握着艾\n平静得像一个夜里的水仙\n你的黑发披散着盖住了我的胸脯\n我将我那随身携带的弓箭挂到墙上\n那弓箭我随身携带了一万年\n我的河流这时平静而广阔\n容得下多少小溪的混浊\n我看见你提着水罐举向我的胸脯\n我足够喂养你的嘴唇和你的羊群\n我在冬天的雨中奔腾，我的胸脯上藏有明天早晨\n明天早晨我的两腿画满了野兽和村落\n有的跳跃着，用翅膀用肉体生活\n有的死于我的弓箭，长眠不醒\n---\n● 1987.1.11 达县\n——————————\n　此诗大概是《雨》的初稿。"},{"id":"short/1988/桃花","title":"桃花","type":"short","year":"1988","body":"桃花开放\n像一座囚笼流尽了鲜血\n像两只刀斧流尽了鲜血\n像刀斧手的家园\n流尽了鲜血\n花儿为什么这样红\n像一座雪山壮丽燃烧\n我的囚笼起火\n我的牢房坍塌\n一根根锁链和铁条　戴着火\n投向四周黑暗的高原\n1987.11.1草稿\n---\n● 1988.2.5改"},{"id":"short/1989/桃花开放","title":"桃花开放","type":"short","year":"1989","body":"秋天的火把断了　是别的花在开放\n冬天的火把是梅花\n现在是春天的火把\n被砍断\n悬在空中\n寂静的\n抽搐四肢\n罩住一棵树　树林根深叶茂　花朵悬在空中\n零散的抒情小诗像桃树　散放在山丘上\n桃花抽搐四肢倒在我身上\n桃花开放\n从月亮飞出来的马\n钉在太阳那轰轰隆隆的春天的本上\n1987草稿\n---\n● 1989.3.14改"},{"id":"short/1983/坛子","title":"坛子","type":"short","year":"1983","body":"这就是我张开手指所要叙说的故事\n那洞窟不会在今夜关闭。明天夜晚也不会关闭\n额头披满钟声的\n土地\n一只坛子\n我头一次也是最后一次进入这坛子\n因为我知道只有一次\n脖颈围着野兽的线条\n水流拥抱的\n坛子\n长出朴实的肉体\n这就是我所要叙说的事\n我对你这黑色盛水的身体并非没有话说\n敬意由此开始，接触由此开始\n这一只坛子，我的土地之上\n从野兽演变而出的\n秘密的脚，在我自己尝试的锁链之中\n正好我把嘴唇埋在坛子里，河流\n糊住四壁，一棵又一棵\n栗树像伤疤在周围隐隐出现\n而女人似的故乡，双双从水底浮上，询问生育之事"},{"id":"short/1985/夜月","title":"夜月","type":"short","year":"1985","body":"一扇又一扇门\n推开树林\n太阳把血\n放入灯盏\n河静静卧在\n人的村庄\n人居住的地方\n人的门环上\n鸟巢挂在\n离人间八尺\n的树上\n我仿佛离人间二丈\n一切都原模原样\n一切都存入\n人的\n世世代代的脸，一切不幸\n我仿佛\n一口祖先们\n向后代挖掘的井\n一切不幸都源于，我幽深的水\n---\n● 1985.6.19"},{"id":"short/1984/煤堆","title":"煤堆","type":"short","year":"1984","body":"煤堆\n闯进冬天的\n黑色主人\n拉着大家的手\n径直走进房屋\n火\n闪着光\n把病牛牵进来！\n它象一片又瘦又长的树叶\n落上稻草：唉，这没有泥土的日子\n但是煤说：\n火\n闪着光\n---\n● 1984.11"},{"id":"short/1986/让我把脚丫搁在黄昏中一位木匠的工具箱上","title":"让我把脚丫搁在黄昏中一位木匠的工具箱上","type":"short","year":"1986","body":"我坐在中午，苍白如同水中的鸟\n苍白如同一位户内的木匠\n在我钉成一支十字木头的时刻\n在我自己故乡和门前\n对面屋顶的鸟\n有一只苍老而死\n是谁说，寂静的水中，我遇见了这只苍老的鸟\n就让我歇脚在马厩之中\n如果不是因时辰不好\n我记得我自己来自一个更美好的地方\n让我把脚丫搁在黄昏中一位木匠的工具箱上\n或者让我的脚丫在木匠家中长成一段白木\n正当鸽子或者水中的鸟穿行于未婚妻的腹部\n我被木匠锯子锯开，做成木匠儿子\n的摇篮。十字架\n---\n● 1986.6.15"},{"id":"short/1987/北方的树林","title":"北方的树林","type":"short","year":"1987","body":"槐树在山脚开花\n我们一路走来\n躺在山坡上　感受茫茫黄昏\n远山像幻觉　默默停留一会\n摘下槐花\n槐花在手中放出香味\n香味　来自大地无尽的忧伤\n大地孑然一身　至今孑然一身\n这是一个北方暮春的黄昏\n白杨萧萧　草木葱茏\n淡红色云朵在最后静止不动\n看见了饱含香脂的松树\n是啊，山上只有槐树　杨树和松树\n我们坐下　感受茫茫黄昏\n莫非这就是你我的黄昏\n麦田吹来微风　倾刻沉入黑暗\n---\n● 1987.5"},{"id":"short/1988/海底卧室","title":"海底卧室","type":"short","year":"1988","body":"月亮，喂养耳朵的宝石\n杯子，水中的鸡群\n草，那嘴唇的发动——花朵\n日子，闪电中的七人\n原野，用木头送礼\n天空，空中散布的白云之药，活动着母亲之卧室\n星星，黑色寨子中的夫人，众夫人，胳膊刺花\n火种，一只老虎游过皮肤，露出水面\n---\n● 1988.9"},{"id":"short/1989/桃花时节","title":"桃花时节","type":"short","year":"1989","body":"桃花开放\n太阳的头盖骨一动一动，火焰和手从头中伸出\n一群群野兽舔着火焰　刃\n走向没落的河谷尽头\n割开血口子。他们会把水变成火的美丽身躯\n水在此刻是悬挂在空气的火焰\n但在更深的地方仍然是水\n翅膀血红，富于侵略\n那就是独眼巨人的桃花时节\n独眼巨人怀抱一片桃林\n他看见的　全是大地在滔滔不绝地纵火\n他在一只燃烧的胃的底部\n与桃花骤然相遇\n互为食物和王妻\n在断头台上疯狂地吐火\n乳房吐火\n挂在陆地上\n从笨重天空跌落的\n撞在陆地上　撞碎了头撞烂了四肢\n在春天　在亿万人民中间　在群兽吐火的地方\n她们产生了幻觉\n群兽一排排　肉包着骨　长成树林\n吐火就是花朵　多么美丽的景色\n你在一种较为短暂的情形下完成太阳和地狱\n内在的火，寒冷无声地燃烧\n生出了河流两岸大地之上的姐妹\n朝霞和晚霞\n无声的在山峦间飘荡\n我俩在高原　在命运三姐妹无声的织机织出的牧场上相遇\n1987初稿\n1988初改\n1988底再改\n---\n● 1989.3.14再改"},{"id":"short/1983/城里","title":"城里","type":"short","year":"1983","body":"面对棵棵绿树\n坐着\n一动不动\n汽车声音响起在\n脊背上\n我这就想把我这\n盖满落叶的旧外套\n寄给这城里\n任何一个人\n这城里\n有我的一份工资\n有我的一份水\n这城里\n我爱着一个人\n我爱着两只手\n我爱着十只小鱼\n跳进我的头发\n我最爱煮熟的麦子\n谁在这城里快活地走着\n我就爱谁\n---\n● 1985"},{"id":"short/1985/孤独的东方人","title":"孤独的东方人","type":"short","year":"1985","body":"孤独的东方人第一次感到月光遍地\n月亮如轻盈的野兽\n踩入林中\n孤独的东方人第一次随我这月亮爬行\n（爱人像一片叶子完整地藏在树上\n正是她只身随我进入河流）\n爬行中\n不能没有\n一路思念\n让我谢谢你，几番追逐之后\n爱情远遁心中\n让我在树下和夜晚对面而坐\n（爱人说孩子\n孩子是\n落入怀中的阳光\n哇哇大哭）\n于是\n孤独的东方人开口闭口之间\n太阳已出\n我爬行只求：\n孩子平安\n我爬行只求：人爱我心\n---\n● 1985.6.14"},{"id":"short/1984/爱情故事","title":"爱情故事","type":"short","year":"1984","body":"两个陌生人\n朝你的城市走来\n今天夜晚\n语言秘密前进\n直到完全沉默\n完全沉默的是土地\n传出民歌沥沥\n淋湿了\n此心长得郁郁葱葱\n两个猎人\n向这座城市走来\n向王后走来\n身后哒姆哒姆\n迎亲的鼓\n代表无数的栖息与抚摸\n两个陌生人\n从不说话\n向你的城市走来\n是我的两只眼睛\n---\n● 1984.12"},{"id":"short/1986/诗人叶赛宁组诗","title":"诗人叶赛宁（组诗）","type":"short","year":"1986","body":"1.诞　生\n星日朗朗\n野花的村庄\n湖水荡漾\n野花！\n生下诗人\n湖水在怀孕\n在怀孕\n一对蓓蕾\n野花的小手在怀孕\n生下诗人叶赛宁\n野花的村庄漆黑\n如同无人居住\n野花，我的村庄公主\n安坐痛苦的北方\n生下诗人\n谁家的窗户\n灯火明亮\n是野花，一只安详燃烧的灯\n坐在泥土的灯台上\n生下诗人叶赛宁\n2.乡村的云\n乡村的云\n故乡\n你们俩是\n水上的一对孩子\n云朵的门啊，请为幸福的人们打开\n请为幸福\n和山坡上无处躲藏的忧伤的眼睛\n打开！\n3.少　女\n少女\n头枕斧头和水\n安然睡去\n一个春天\n一朵花\n一片海滩　一片田园\n少女\n一根伐自上帝\n美丽的枝条\n少女\n月亮的马\n两颗水滴\n对称的乳房\n4.诗人叶赛宁\n我是中国诗人\n稻谷的儿子\n茶花的女儿\n也是欧罗巴诗人\n儿子叫意大利\n女儿叫波兰\n我饱经忧患\n一贫如洗\n昨日行走流浪\n来到波斯酒馆\n别人叫我\n诗人叶赛宁\n浪子叶赛宁\n叶赛宁\n俄罗斯的嘴唇\n梁赞的屋顶\n黄昏的面容\n农民的心\n一颗农民的心\n坐在酒馆\n像坐在一滴酒中\n坐在一滴水中\n坐在一滴血中\n仙鹤飞走了\n桌子抬走了\n尸体抬走了\n屋里安坐忧郁的诗人\n仍然安坐诗人叶赛宁\n叶赛宁\n不曾料到又一次\n春回大地\n大地是我死后爱上的女人\n大地啊\n美丽的是你\n丑陋的是我\n诗人叶赛宁\n在大地中\n死而复生\n5.玉米地\n微风吹过这座小小的山冈\n玉米地里棵棵玉米又瘦又小\n我浇水　看着这些小小的可爱又瘦小的叶子\n青青杨树叶子喧响在那一头\n太阳远远地燃烧\n落入一座空空的山谷\n树叶是采自诸神的枪枝和婚床\n圆形盾牌镌刻着无知的文字\n6.醉卧故乡\n故乡的夜晚醉倒在地\n在蓝色的月光下\n飞翔的是我\n感觉到心脏，一颗光芒四射的星辰\n醉倒在地，头举着王冠\n头举着五月的麦地\n举着故乡晕眩的屋顶\n或者星空，醉倒在大地上！\n大地，你先我而醉\n我要扶住你\n大地！\n我醉了\n我是醉了\n我称山为兄弟、水为姐妹、树林是情人\n我有夜难眠，有花难戴\n满腹话儿无处诉说\n只有碰破头颅\n霞光落在四邻屋顶\n我的双脚踏在故乡的路上变成亲人的双脚\n一路蹒跚在黄昏　升上南国星座\n双手飞舞，口中喃喃不绝\n我在飞翔\n急促而深情\n飞翔的是我的心脏\n我感觉要坐稳在自己身上\n故乡，一个姓名\n一句\n美丽的诗行\n故乡的夜晚醉倒在地\n7.浪子旅程\n我是浪子\n我戴着水浪的帽子\n我戴着漂泊的屋顶\n灯火吹灭我\n家乡赶走我\n来到酒馆和城市\n我本是农家子弟\n我本应该成为\n迷雾退去的河岸上\n年轻的乡村教师\n从都会师院毕业后\n在一个黎明\n和一位纯朴的农家少女\n一起陷入情网\n但为什么\n我来到了酒馆\n和城市\n虽然我曾与母牛狗仔同歇在\n露西亚天国\n虽然我在故乡山冈\n曾与一个哑巴\n互换歌唱\n虽然我二十年不吱一声\n爱着你，母亲和外祖父\n我仍下到酒馆——俄罗斯船舱底层\n啜泣酒杯的边缘\n为不幸而凶狠的人们\n朗诵放荡疯狂的诗\n我要还家\n我要转回故乡，头上插满鲜花\n我要在故乡的天空下\n沉默寡言或大声谈吐\n我要头上插满故乡的鲜花\n8.绝　命\n此刻在美丽的小镇上\n苦荞麦儿香\n说声分手吧\n和另一位叶赛宁　双手紧紧握住\n点着烛火，烧掉旧诗\n说声分手吧\n分开编过少女秀发的十指\n秀发像五月的麦苗　曾轻轻含在嘴里\n和另一位叶赛宁分手\n用剥过蛇皮蒙上鼓面的人类之手\n自杀身亡，为了美丽歌谣的神奇鼓面\n蛇皮鼓啊如今你在村中已是泪水灯笼\n说声分手吧　松开埋葬自己的十指\n把自己在诗篇中埋葬\n此刻在美丽的小镇上\n不会有苦荞麦儿香\n9.天　才\n轻雷滚过的风中\n白杨树梢摇动\n在这个黄昏\n我想到天才的命运\n在此刻我想起你凡·高和韩波\n那些命中注定的天才\n一言不发\n心情宁静\n那些人\n站在月亮中把头颅轻轻摇晃\n手持火把，腰围面粉袋\n心情宁静\n暮色茫茫\n永不复返的人哪\n在孤寂的空无一人的打谷场上\n被三位姐妹苦苦留下。\n痛苦的天才们\n饥渴难捱\n可是河中滴水全无\n面粉袋中没有一点面粉\n轻雷滚过的风中\n死者的鞋子，仍在行走\n如车轮，如命运\n沾满谷物与盲目的泥土\n---\n● 1986.2-1987.5"},{"id":"short/1987/十四行-王冠","title":"十四行：王冠","type":"short","year":"1987","body":"我所热爱的少女\n河流的少女\n头发变成了树叶\n两臂变成了树干\n你既然不能做我的妻子\n你一定要成为我的王冠\n我将和人间的伟大诗人一同佩戴\n用你美丽的叶子缠绕我的竖琴和箭袋\n秋天的屋顶　时间的重量\n秋天又苦又香\n使石头开花　像一顶王冠\n秋天的屋顶又苦又香\n空中弥漫着一顶王冠\n被劈开的月桂和扁桃的苦香\n---\n● 1987.8.19夜"},{"id":"short/1988/生日","title":"生日","type":"short","year":"1988","body":"起风了\n太阳的音乐　太阳的马\n你坐在近处　坐在远方\n像鱼群跟着渔夫　长出了乳房\n葡萄牙村庄　长出了乳房\n牧羊人的皮鞭　长出了乳房\n当我们住在秋天\n大地上刮起了秋风\n秋天的雨　一阵又一阵\n你坐在近处　坐在远方\n那时我们多么寂寞\n多么遥远啊？\n而现在是生日\n我电亮烛火点亮新娘的两只耳朵\n其他的人和马的耳朵\n竖在北方——那一夜的屋顶\n---\n● 1988.5删"},{"id":"short/1989/献给太平洋","title":"献给太平洋","type":"short","year":"1989","body":"我的婚礼染红太平洋\n我的新娘是太平洋\n连亚洲也是我悲伤而平静的新娘\n你自己的血染红你内部孤独的天空\n上帝悲伤的新娘，你自己的血染红\n天空，你内部孤独的海洋\n你美丽的头发\n像太平洋的黄昏\n---\n● 1989.2"},{"id":"short/1983/大自然","title":"大自然","type":"short","year":"1983","body":"让我来告诉你\n她是一位美丽结实的女子\n蓝色小鱼是她的水罐\n也是她脱下的服装\n她会用肉体爱你\n在民歌中久久地爱你\n你上上下下瞧着\n你有时摸到了她的身子\n你坐在圆木头上亲她\n每一片木叶都是她的嘴唇\n但你看不见她\n你仍然看不见她\n她仍在远处爱着你"},{"id":"short/1985/得不到你","title":"得不到你","type":"short","year":"1985","body":"得不到你\n我用河水做成的妻子\n得不到你\n我的有弱点的妇女\n得不到你\n妻子滑动河水\n情意泥沙俱下\n其余的家庭成员俯伏在锅勺上\n得不到你\n有弱点的爱情\n我们确实被太阳烤焦，秋天内外\n我不能再保护自己\n我不能再\n让爱情随便受伤\n得不到你\n但我同时又在秋天成亲\n歌声四起\n---\n● 1985.11.11"},{"id":"short/1984/秋天","title":"秋天","type":"short","year":"1984","body":"秋天红色的膝盖\n跪在地上\n小花死在回家的路上\n泪水打湿\n鸽子的后脑勺\n一位少年去摘苹果树上的灯\n植物没有眼睛\n挂着冬天的身份牌\n一条干涸的河\n是动物的最后情感\n一位少年人去摘苹果树上的灯\n我的眼睛\n黑玻璃，白玻璃\n证明不了什么\n秋天一定在努力地忘记着\n嘴唇吹灭很少的云朵\n一位少年去摘苹果树上的灯\n---\n● 1984.11"},{"id":"short/1986/诗集","title":"诗集","type":"short","year":"1986","body":"诗集\n珠宝的粪筐\n母牛的眼睛把她的手搁在诗集上\n忧伤的灯把她的手搁在诗集上\n没有一棵树是我的\n感觉之树因而叫唤\n诗集，穷人的丁当作响的村庄\n第一台酒柜抬入村庄\n诗集，我嘴唇吹响的村庄\n王的嘴唇做成的村庄\n---\n● 1986.12"},{"id":"short/1987/十四行-玫瑰花","title":"十四行：玫瑰花","type":"short","year":"1987","body":"玫瑰花　蜜一样的身体\n玫瑰花园　黑夜一样的头发\n覆盖了白雪隆起的乳房\n白雪的门　白雪的门外被白雪盖住的两只酒盅\n白雪的窗户　白雪的窗内两只火红的玫瑰谷\n或两只火红的蜡烛……热情的蜡烛自行燃尽\n两只丁当作响的酒盅……热情的酒浆被我啜饮\n在秋天我感到了　你的乳房　你的蜜\n像夏天的火　春天的风　落在我怀里\n像太阳的蜂群落入黑夜的酒浆\n像波斯古国的玫瑰花园　使人魂归天堂\n肉体却必须永远活在设拉子　\n——千年如斯\n玫瑰花　你蜜一样的身体\n---\n● 1987.8\n————————————\n 设拉子，一译舍拉子，波斯（今伊朗）地名。"},{"id":"short/1988/眺望北方","title":"眺望北方","type":"short","year":"1988","body":"我在海边为什么却想到了你\n不幸而美丽的人　我的命运\n想起你　我在岩石上凿出窗户\n眺望光明的七星\n眺望北方和北方的七位女儿\n在七月的大海上闪烁流火\n为什么我用斧头饮水　饮血如水\n却用火热的嘴唇来眺望\n用头颅上鲜红的嘴唇眺望北方\n也许是因为双目失明\n那么我就是一个盲目的诗人\n在七月的最早几天\n想起你　我今夜跑尽这空无一人的街道\n明天，明天起来后我要重新做人\n我要成为宇宙的孩子　世纪的孩子\n挥霍我自己的青春\n然后放弃爱情的王位\n去做铁石心肠的船长\n走遍一座座喧闹的都市\n我很难梦见什么\n除了那第一个七月，永远的七月\n七月是黄金的季节啊\n当穷苦的人在渔港里领取工钱\n我的七月萦绕着我，像那条爱我的孤单的蛇\n——她将在痛楚苦涩的海水里度过一生\n1987.7草稿\n---\n● 1988.3改"},{"id":"short/1989/献诗_1","title":"献诗","type":"short","year":"1989","body":"废弃不用的地平线\n为我在草原和雪山升起\n脚下尘土黑暗而温暖\n大地也将带给我天堂的雷电\n家乡的屋顶下摆满了结婚的酒席\n陪伴我的全是海水和尘土，全是乡亲\n今天，太阳的新娘就是你\n太平洋上唯一的人，远在他方\n---\n● 1989.2."},{"id":"short/1983/天鹅","title":"天鹅","type":"short","year":"1983","body":"夜里，我听见远处天鹅飞越桥梁的声音\n我身体里的河水\n呼应着她们\n当她们飞越生日的泥土、黄昏的泥土\n有一只天鹅受伤\n其实只有美丽吹动的风才知道\n她已受伤。她仍在飞行\n而我身体里的河水却很沉重\n就像房屋上挂着的门扇一样沉重\n当她们飞过一座远方的桥梁\n我不能用优美的飞行来呼应她们\n当她们像大雪飞过墓地\n大雪中却没有路通向我的房门\n——身体没有门——只有手指\n竖在墓地，如同十根冻伤的蜡烛\n在我的泥土上\n在生日的泥土上\n有一只天鹅受伤\n正如民歌手所唱"},{"id":"short/1985/我请求-雨","title":"我请求：雨","type":"short","year":"1985","body":"我请求熄灭\n生铁的光、爱人的光和阳光\n我请求下雨\n我请求\n在夜里死去\n我请求在早上\n你碰见\n埋我的人\n岁月的尘埃无边\n秋天\n我请求：\n下一场雨\n洗清我的骨头\n我的眼睛合上\n我请求：\n雨\n雨是一生过错\n雨是悲欢离合\n---\n● 1985.3"},{"id":"short/1984/跳跃者","title":"跳跃者","type":"short","year":"1984","body":"老鼻子橡树\n夹住了我的蓝鞋子\n我却是跳跃的\n跳过榆钱儿\n跳过鹅和麦子\n一年跳过\n十二间空屋子和一些花穗\n从一口空气\n跳进另一口空气\n我是深刻的生命\n我走过许多条路\n我的袜子里装满了错误\n日记本是红色的\n是红色的流浪汉\n脖子上写满了遗忘的姓名，跳吧\n跳够了我就站住\n站在山顶上沉默\n沉默是山洞\n沉默是山洞里一大桶黄金\n沉默是因为爱情\n---\n● 1984.12"},{"id":"short/1986/谣曲","title":"谣曲","type":"short","year":"1986","body":"之一\n你是我的哥哥你招一招手\n你不是我的哥哥你走你的路\n小灯，小灯，抬起他埋下的眼睛\n你的树丛大而黑\n你的辕马不安宁\n你的嘴唇有野蜜\n你是丈夫——还是兄弟\n小灯，小灯，抬起他埋下的眼睛\n你是我的哥你招一招手\n你不是我的哥哥你走你的路\n之二\n白鸽，白鸽\n扎好我的头巾\n风吹着你们的身子\n像吹我白色头巾\n白鸽白鸽你别说\n美丽的脑袋小太阳\n到了黑夜变月亮\n白鸽白鸽你别说\n之三\n南风吹木\n吹出花果\n我要亲你\n花果咬破\n之四\n月亮月亮慢慢亮\n照着一只木头床\n河流河流快快流\n渡过我的心头肉\n白马过河一片白\n黑马过河一片黑\n这一条河流\n总是心头的河流\n白马过河是月圆\n黑马过河是月残\n这一只月亮\n总是床头的月亮\n---\n● 1986.8"},{"id":"short/1987/十四行-玫瑰花园","title":"十四行：玫瑰花园","type":"short","year":"1987","body":"明亮的夜晚\n我来到玫瑰花园\n脱下诗歌的王冠\n和沉重的土地的盔甲\n玫瑰花园　玫瑰花园\n我们住在绝色美人的身旁　仿佛住在月亮上\n我们谈论佛光中显出的美丽身影\n和雪水浇灌下你的美丽的家园\n我们谈到但丁　和他永恒的贝亚丽丝\n以及天国、通往永恒的天路历程\n四川，我诗歌中的玫瑰花园\n那儿诞生了你——像一颗早晨的星那样美丽\n明亮的夜晚　多么美丽而明亮\n仿佛我们要彻夜谈论玫瑰直到美丽的晨星升起。\n---\n● 1987.8.26"},{"id":"short/1988/绿松石","title":"绿松石","type":"short","year":"1988","body":"这时候　绿色小公主\n来到我的身边。\n青海湖，绿色小公主\n你曾是谁的故乡\n你曾是谁的天堂？\n当一只雪白的鸟\n无法用翅膀带走\n人类的小镇\n——它留在肮脏的山梁。\n和水相比　土地是多么肮脏而荒芜\n绿色小公主抹去我的泪水，\n说，你是年老的国土上\n一位年轻的国王，老年皇帝会伏在你的肩头死去。\n土地张开又合拢。\n---\n● 1988.7.24"},{"id":"short/1989/神秘的二月的时光","title":"神秘的二月的时光","type":"short","year":"1989","body":"噙住泪水，在神秘的\n二月的时光\n神秘的二月的时光\n经过北方单调的平原\n来到积雪的山顶\n群山正在下雪\n山坳中梅树流淌真今年冬天的血\n无人知道的，寂静的鲜血\n---\n● 1989.2"},{"id":"short/1983/女孩子","title":"女孩子","type":"short","year":"1983","body":"她走来\n断断续续走来\n洁净的脚印\n沾满清凉的露水\n她有些忧郁\n望望用泥草筑起的房屋\n望望父亲\n她用双手分开黑发\n一支野樱花斜插着默默无语\n另一支送给了谁\n却从没人问起\n春天是风\n秋天是月亮\n在我感觉到时\n她已去了另一个地方\n那里雨后的篱笆象一条蓝色的\n小溪"},{"id":"short/1985/打钟","title":"打钟","type":"short","year":"1985","body":"打钟的声音里皇帝在恋爱\n一枝火焰里\n皇帝在恋爱\n恋爱，印满了红铜兵器的\n神秘山谷\n又有大鸟扑钟\n三丈三尺翅膀\n三丈三尺火焰\n打钟的声音里皇帝在恋爱\n打钟的黄脸汉子\n吐了一口鲜血\n打钟，打钟\n一只神秘生物\n头举黄金王冠\n走于大野中央\n“我是你爱人\n我是你敌人的女儿\n我是义军的女首领\n对着铜镜\n反复梦见火焰”\n钟声就是这枝火焰\n在众人的包围中\n苦心的皇帝在恋爱\n---\n● 1985.5"},{"id":"short/1984/黑风","title":"黑风","type":"short","year":"1984","body":"掠过田野的那黑风\n那第四次的\n口粮和旗帜\n就要来了！\n聚拢的马群将被劫走\n星星将被吹散\n他在所有的脚印上覆盖\n一种新的草药\n遗忘的就要永远被遗忘了\n窗子忧伤地关上了\n有一两盏橘黄朴素的灯也要熄灭\n他们来了\n他们是黑色的风\n后来他们表达了一种失败的东西\n他们留下苦苦创生的胚芽\n他们哭了\n把所有的人哭醒之后\n又走了\n走得奇怪\n以后所有的早晨都非常奇怪\n马儿长久地奔跑，太阳不灭，物质不灭\n苹果突然熟了\n还有一些我们熟悉的将要死去\n我们不熟悉的慢慢生根\n人们啊，所有交给你的\n都异常沉重\n你要把泥沙握得紧紧\n在收获时应该微笑\n没必要痛苦地提起他们\n没必要忧伤地记住他们\n---\n● 1984.12"},{"id":"short/1986/黎明","title":"黎明","type":"short","year":"1986","body":"黎明以前的深水杀死了我。\n月光照耀仲夏之夜的脖子\n秋天收割的脖子。我的百姓\n秋天收起八九尺的水\n水深杀我，河流的丈夫\n收起我的黎明之前的头\n黎明之前的亲人抱玉入楚国\n唯一的亲人\n黎明之前双腿被砍断\n秋天收起他的双腿\n像收起八九尺的水\n那是在五月。黎明以前的深水杀死了我\n---\n● 1986.6.20"},{"id":"short/1987/吊半坡并给擅入都市的农民","title":"吊半坡并给擅入都市的农民","type":"short","year":"1987","body":"我\n径直走入\n潮湿的泥土\n堆起小小的农民\n——对粮食的嘴\n停留在西安　多少首饰的外围\n多少次擅入都市\n象水　血和酒——这些农夫的车辆\n运送着河流，生命和欲望\n父亲是死在西安的血\n父亲是粮食\n和丑陋的酿造者\n唱歌的嘴　食盐的嘴　填充河岸的嘴\n朝着无穷的半坡\n粘土守着粘土之上小小的陶器作坊\n一条肤浅而粗暴的沟外站立\n瓮内的白骨飞走了那些美丽少女\n半坡啊，再说，受孕也不是我一人的果实\n实在需要死亡的配合\n盲目的语言中有血和命运\n而俘虏回乡\n自由的血也有死亡的血\n智慧的血也有罪恶的血\n1985.11草稿\n---\n● 1987.7.14改"},{"id":"short/1988/花儿为什么这样红","title":"花儿为什么这样红","type":"short","year":"1988","body":"透过泪水看见马车上堆满了鲜花。\n豹子和鸟，惊慌地倒下，像一滴泪水\n——透过泪水看见\n马车上堆满了鲜花。\n风，你四面八方\n多少绿色的头发，多少姐妹\n挂满了雨雪。\n坐在夜王为我铺草的马车中。\n黑夜，你就是这巨大的歌唱的车辆\n围住了中间\n说话的火。\n一夜之间，草原如此深厚，如此神秘，如此遥远\n我断送了自己的一生\n在北方悲伤的黄昏的原野。\n---\n● 1988.11.20"},{"id":"short/1989/遥远的路程","title":"遥远的路程","type":"short","year":"1989","body":"——十四行献给89年初的雪\n我的灯和酒坛上落满灰尘\n而遥远的路程上却干干净净\n我站在元月七日的大雪中，还是四年以前的我\n我站在这里，落满了灰尘，四年多像一天，没有变动\n大雪使屋子内部更暗，待到明日天晴\n阳光下的大雪刺痛人的眼睛，这是雪地，使人羞愧\n一双寂寞的黑眼睛多想大雪一直下到他内部\n雪地上树是黑暗的，黑暗得像平常天空飞过的鸟群\n那时候你是愉快的，忧伤的混沌的\n大雪今日为我而下，映照我的肮脏\n我就是一把空空的铁锹\n铁锹空得连灰尘也没有\n大雪一直纷纷扬扬\n远方就是这样的，就是我站立的地方\n---\n● 1989.1.7"},{"id":"sun/太阳土地篇","title":"太阳·土地篇","type":"sun","year":"1986","body":"“土地死去了\r\n\r\n 用欲望能代替他吗？”\r\n\r\n\r\n\r\n 1987.8\r\n\r\n第一章 老人拦截少女\r\n\r\n（1月。冬。）\r\n\r\n情欲老人，死亡老人\r\n\r\n在森林中，你这古老神祗\r\n\r\n一位酒气熏天的老人\r\n\r\n情欲老人，死亡老人\r\n\r\n他又醉\r\n\r\n又饿\r\n\r\n像血泊，像大神的花朵\r\n\r\n他这大神的花朵\r\n\r\n生长与草原的千年经历\r\n\r\n我这和平与宁静的儿子\r\n\r\n同在这里\r\n\r\n情欲老人，死亡老人\r\n\r\n一条超于人类的河流\r\n\r\n像血泊，像大神的花朵\r\n\r\n森林中这老人\r\n\r\n死亡老人，情欲老人，啜饮葡萄藤\r\n\r\n他来自灰色的瓮、愿望之外\r\n\r\n他情欲和死亡的面容\r\n\r\n如和平的村庄\r\n\r\n血泊一样大神的花朵\r\n\r\n他又醉\r\n\r\n又饿\r\n\r\n在这位高原老人的压迫下\r\n\r\n月亮的众神，一如既往在戽水\r\n\r\n只有戽水，纺织月光\r\n\r\n（用少女的胫骨）\r\n\r\n情欲老人，死亡老人\r\n\r\n伸出双手高原的天空\r\n\r\n月亮的两角弯曲\r\n\r\n坐满神仙如愁苦的秋天\r\n\r\n秋天，不能航渡众神的秋天\r\n\r\n泪水中新月的双角弯曲\r\n\r\n秋天的歌滚动诸神的眼眶\r\n\r\n仿佛是在天国，在空虚的湖岸\r\n\r\n情欲老人，死亡老人\r\n\r\n在这草原上拦劫众人\r\n\r\n一条无望的财富之河上众牛滚滚\r\n\r\n月亮如魔鬼的花束\r\n\r\n情欲老人，死亡老人\r\n\r\n在这中午的森林\r\n\r\n喝醉的老人拦住了少女\r\n\r\n那少女本是我\r\n\r\n草原和平与宁静之子\r\n\r\n一个月光下自生自灭的诗中情侣\r\n\r\n情欲老人，死亡老人\r\n\r\n如醉中的花园倾斜\r\n\r\n伸出双手拦住了处女\r\n\r\n我多想喊：\r\n\r\n月亮的众神、幸福的姐妹\r\n\r\n你们在何方？\r\n\r\n有歌声众神难唱\r\n\r\n人类处女如雪\r\n\r\n人类原始的恐惧\r\n\r\n在黎明\r\n\r\n在蜂鸟时光\r\n\r\n在众神沉默中\r\n\r\n我像草原断裂\r\n\r\n湖泊上青藤绕膝\r\n\r\n我的舌头完全像寂静之子。\r\n\r\n在这无辜的山谷\r\n\r\n在这黄金草原上\r\n\r\n情欲老人，死亡老人\r\n\r\n强行占有了我——\r\n\r\n人类的处女欲哭无泪\r\n\r\n戽水者阻隔在与世隔绝的秋天\r\n\r\n戽水用少女的胫骨\r\n\r\n月亮的双角倾斜，坐满沉痛的众神\r\n\r\n我无所依傍的生涯倾斜在黄昏\r\n\r\n星辰泪珠悬挂天涯\r\n\r\n众泪水姐妹滚滚入河流\r\n\r\n黎明凄厉无边\r\n\r\n月亮的后奔赴人间的水\r\n\r\n请把我埋入秋天以后的山谷\r\n\r\n埋入与世隔绝的秋天\r\n\r\n让黄昏的山谷像王子的尸首\r\n\r\n青年王子的尸首永远坐在我身上\r\n\r\n黄昏和夜晚坐在我脸上\r\n\r\n我就是死亡和永生的少女\r\n\r\n叫月亮众神埋入原型的果园\r\n\r\n情欲老人，死亡老人\r\n\r\n又醉又饿，果园倾斜\r\n\r\n我就是死亡和永生的果园少女\r\n\r\n第二章 神秘的合唱队\r\n\r\n（2月。冬春之交。）\r\n\r\n（沉郁与宿命。一出古悲剧残剩的断片）\r\n\r\n情欲老人死亡老人：你是谁？\r\n\r\n王子：王子\r\n\r\n老人：你来自哪里？\r\n\r\n王子：母亲，大地的胸膛\r\n\r\n老人：你为何前来我的国度？聪明的王子，你难道不知这里只有死亡？\r\n\r\n王子：请你放开她，让她回家\r\n\r\n那位名叫人类的少女\r\n\r\n老人：凭什么你竟提出如此要求？\r\n\r\n王子：我可以放弃王位\r\n\r\n老人：什么王位\r\n\r\n王子：诗和生命\r\n\r\n老人：好，一言为定\r\n\r\n我拥有你的生命和诗\r\n\r\n第一歌咏\r\n\r\n鹰\r\n\r\n河上的肉\r\n\r\n打死豹子　揉合豹子\r\n\r\n用唱歌\r\n\r\n用嘴唇\r\n\r\n用想象的睡狮之王\r\n\r\n狮豹搏斗\r\n\r\n鹰盘旋\r\n\r\n河上的肉\r\n\r\n睁开双眼\r\n\r\n第二歌咏\r\n\r\n豹子是我的喜悦\r\n\r\n豹子在马的脸上摘下骨头\r\n\r\n在美丽处女脸上摘下骨头\r\n\r\n阴暗的豹\r\n\r\n在山梁上传下了阴郁的话语\r\n\r\n“我是暴君家族最后一位白痴\r\n\r\n用发疯掩盖真理的诗”\r\n\r\n豹子豹子\r\n\r\n我腹中满怀城市的毒药和疾病\r\n\r\n寻找喜悦的豹子　真理的豹子\r\n\r\n一切失败会导致一次繁忙的春天\r\n\r\n豹子响如火焰　哲学供你在无限的黄昏进行\r\n\r\n河流如绿色的羊毛燃烧\r\n\r\n此刻豹子命令一位老人抱着母狮坐上王位\r\n\r\n山巅上　故乡阴郁而瘟疫的粘土堆砌王座\r\n\r\n部落暗绿色灯火一齐向他臣服\r\n\r\n第三歌咏\r\n\r\n道……是实体前进时拿着的他自己的斧子\r\n\r\n坟墓中站起身裹尸布的马匹和猪\r\n\r\n拉着一辆车子\r\n\r\n在鼓点如火之夜\r\n\r\n扑向乡间刑场\r\n\r\n车上站立着盲目的巨人\r\n\r\n车上囚禁着盲目的巨人\r\n\r\n在厨娘酣然入睡之时\r\n\r\n在女巫用橡实喂养众人酣然入睡之时\r\n\r\n马匹和猪告诉我\r\n\r\n“我、的名字上了敌人的第一份名单”\r\n\r\n真实的道路吞噬了一切豹子　海牛　和羔羊\r\n\r\n在真实的道路上我通过死亡体会到刽子手的欢乐\r\n\r\n在一片混沌中挥舞着他自己的斧子\r\n\r\n在斧子她泪眼蒙蒙似乎看见了诗歌\r\n\r\n她在原始的道路上禁绝欲望\r\n\r\n在原始的秋天的道路上\r\n\r\n陪伴那些成熟的诗人　一同被绑往法场\r\n\r\n道路没有光泽　甚至没有忧愁\r\n\r\n闪闪发亮的斧子刃口上奔驰着丑陋的猪和壮丽之马\r\n\r\n拉着囚禁盲目巨人的车辆　默默无言的巨人\r\n\r\n这是死亡的车子　法官的车子\r\n\r\n他要携带一切奔向最后的下场\r\n\r\n车前奔跑着你的侍从　从坟墓中站起的马匹和猪\r\n\r\n车中囚禁着原始力量　你我在内心的刑场上相遇\r\n\r\n我们在噩梦的岩石　堆砌的站台\r\n\r\n梦想着简洁的道路\r\n\r\n真实的道路\r\n\r\n法官的车子奔驰其上的道路\r\n\r\n马匹和猪踢着蹄子　拥挤不堪重负\r\n\r\n泥土在你面前反复死亡\r\n\r\n原始力量反复死亡　实体享受着他自己的斧子\r\n\r\n数学和诗歌\r\n\r\n也是原始力量　从墓中唤醒身裹尸布的马和猪\r\n\r\n携带着我们\r\n\r\n短暂的生命来到这个世界上\r\n\r\n包括男人和女人、狮子和人类复合的盲目巨人\r\n\r\n原始的力量　他　孤独　辞退绝望的众神\r\n\r\n独自承担唤醒死亡的责任\r\n\r\n被法官囚禁却又在他的车上驾御他的马匹\r\n\r\n这就是在他斧刃上站立的我的诗歌\r\n\r\n诗歌罪恶深重\r\n\r\n构成内心财富\r\n\r\n农舍简陋　不同与死亡的法官的车辆\r\n\r\n却同是原始力量的姐妹\r\n\r\n都坐在道上　朝向斧刃\r\n\r\n“道”的老人　深思熟虑　欲望疲乏而平静\r\n\r\n果断放弃女人、孩子、田地和牲畜\r\n\r\n守着地窖中的一盏灯\r\n\r\n迹近熄灭\r\n\r\n乡下女人提着泥土　秘密款待着他　向他奉献\r\n\r\n那匹马奔驰其上\r\n\r\n泥土反复死亡　原始的力量反复死亡　却吐露了诗歌\r\n\r\n第四歌咏\r\n\r\n黑色的玫瑰\r\n\r\n诸神疲乏而颓丧\r\n\r\n在村镇外割下麦穗\r\n\r\n在村镇中割下羊头\r\n\r\n诸神疲乏而颓丧\r\n\r\n诸神令人困惑的永恒啊!\r\n\r\n诸神之夜何其黑暗啊!\r\n\r\n诸神的行程实在太遥远了!\r\n\r\n诸神疲乏而颓废\r\n\r\n就让羊群蹲在草原上\r\n\r\n羊群在草原上生羊群\r\n\r\n黑色的玫瑰是羊母亲\r\n\r\n歌中唱到一颗心\r\n\r\n“两只羊眼睛望着\r\n\r\n两条羊腿骨在前\r\n\r\n两条腿骨在后”\r\n\r\n“一条羊尾巴\r\n\r\n一条羊皮包裹上下\r\n\r\n羊羔死而复活”\r\n\r\n“一只羔羊在天空下站立\r\n\r\n他就是受难的你”\r\n\r\n黑色的玫瑰，羔羊之魂\r\n\r\n缄默者在天堂的黄昏\r\n\r\n在天堂这时正是美好的黄昏\r\n\r\n诸神渴了　让三个人彼此杀害却死了四个人\r\n\r\n死亡比诞生\r\n\r\n更为简单\r\n\r\n我们人类一共三个人\r\n\r\n我们彼此杀害\r\n\r\n在最后的地上\r\n\r\n倒着四具尸首\r\n\r\n使诸神面面相觑\r\n\r\n他是谁\r\n\r\n为什么来到人的村庄\r\n\r\n他是谁\r\n\r\n在众羊死亡之前\r\n\r\n我已经诞生\r\n\r\n我来过这座村庄\r\n\r\n我带着十二位面包师垒好我血肉的门窗\r\n\r\n——耶路撒冷　耶路撒冷\r\n\r\n你有唯一的牧羊人孤单一人任风吹拂\r\n\r\n村镇已是茫茫黄昏　死亡已经来临\r\n\r\n妈妈　可还记得\r\n\r\n与手艺人父亲领着我\r\n\r\n去埃及的路程\r\n\r\n黑色的玫瑰\r\n\r\n一个守墓人\r\n\r\n一个园丁\r\n\r\n在花园\r\n\r\n他的严峻使我想起正午\r\n\r\n斧头劈开守墓人的脑袋\r\n\r\n斧头劈开守墓人的脑袋\r\n\r\n第五歌咏 雪莱\r\n\r\n雪莱独白片断\r\n\r\n我写的使狂喜的诗歌　生命何其短促！\r\n\r\n平静的海将我一把抓住\r\n\r\n将我的嘴唇和诗歌一把抓住\r\n\r\n我写的是狂喜的诗歌　天空\r\n\r\n天空是内部抽搐的骆驼\r\n\r\n天才是哭泣的骆驼深入子宫\r\n\r\n骆驼和人\r\n\r\n四只手分开天空\r\n\r\n四只手怀孕\r\n\r\n两颗怪异而变乱的心\r\n\r\n骆驼和人民　没有回声也没有历史\r\n\r\n在镌刻万物的谁上难以梦见别的骆驼\r\n\r\n存在\r\n\r\n水上我的人民\r\n\r\n泪珠盈盈或丰收满筐\r\n\r\n我的人民\r\n\r\n这刻下众多头颅的果园理应让她繁荣!\r\n\r\n新鲜　锐利　痛楚　我的人民\r\n\r\n当人类脱离形象而去\r\n\r\n脱离再生或麦杆而去\r\n\r\n剧烈痛楚的大海会复归平静\r\n\r\n当水重归平静而理智的大海\r\n\r\n我的人民\r\n\r\n你该藏身何处?\r\n\r\n雪莱和天空的谈话\r\n\r\n(天空戴一蓝色面具)\r\n\r\n雪：太阳掰开一头雄狮和一个天才的内脏\r\n\r\n长出天空　云雀和西风\r\n\r\n太阳掰开我的内脏\r\n\r\n孕育天空的幻象\r\n\r\n孕自收缩和阴暗狭隘的内心\r\n\r\n天：当人类恐惧的灵魂抬着我的尸骨在大地上裸露\r\n\r\n在大地上飞舞\r\n\r\n生存是人类随身携带的无用行李 无法展开的行李\r\n\r\n——行李片刻消散于现象之中\r\n\r\n一片寂静\r\n\r\n代代延续\r\n\r\n雪：只有言说和诗歌\r\n\r\n坐在围困和饥谨的山上\r\n\r\n携带所有无用的外壳和居民\r\n\r\n谷物和她的外壳啊　只有言说和诗歌\r\n\r\n抛下了我们　直入核心\r\n\r\n一首陌生的诗鸣叫又寂静\r\n\r\n我\r\n\r\n诉说\r\n\r\n内脏的黑暗　飞行的黑暗\r\n\r\n我骑上　诉说　咒语　和诗歌\r\n\r\n一匹忧伤的马\r\n\r\n我骑上言语和眼睛\r\n\r\n内心怯懦的马和忧伤之马\r\n\r\n我的内脏哭泣　那个流亡的诗人\r\n\r\n抓住自己的头颅步行在江河之上\r\n\r\n路啊　诗歌苍茫的马\r\n\r\n在河畔怀孕的刹那禽兽不再喧响\r\n\r\n我不知道自己还要向前走得多远\r\n\r\n匆匆诞生匆匆了结的人性　还没有上路\r\n\r\n还在到处游荡　万物繁花之上悲惨的人\r\n\r\n头戴王冠纷纷倒下\r\n\r\n天：麦地收容躯壳和你的尸体　各种混乱的再生\r\n\r\n在季节的腐败或更新中\r\n\r\n只有你低声歌唱\r\n\r\n只有你这软弱的人才会产生诗句\r\n\r\n各种混乱的再生　凶手的双手——陌生又柔软的器官\r\n\r\n你是低声唱歌季节的腐败和更新\r\n\r\n雪莱（伟大的独白）\r\n\r\n大地　你为何唱歌和怀孕？\r\n\r\n你为何因万物和谐而痛苦\r\n\r\n叫内心的黑暗抓住了火种\r\n\r\n人民感到了我\r\n\r\n人民感动了我\r\n\r\n灵魂的幻象丛生\r\n\r\n一只摔打大地的鼓上盘坐万物　盘坐燃烧晃动的太阳\r\n\r\n一只泥土的太阳生物的太阳\r\n\r\n一齐鸣叫的太阳\r\n\r\n悲愤燃烧的灵魂满脸孕红地坐在河流中央\r\n\r\n山峰上的刀枪和门扇节育果实于万物森林\r\n\r\n树木和人民——一次次水的外壳，纷纷脱落于这种奇幻的森林\r\n\r\n草木和头颅又以各种怪异疯狂的歌唱和飞翔再生于水\r\n\r\n王子的光辉——献给雪莱\r\n\r\n歌队长：我的人民坐在水边　看着大海死去天才死去\r\n\r\n我的人民身边只剩下玉米和柴刀\r\n\r\n和一两个表妹　锡安的女儿容颜憔悴\r\n\r\n我的人民坐在水边　只剩下泪水耻辱和仇恨\r\n\r\n歌　队：拥抱大海的水已流尽\r\n\r\n拥抱一条龙的怪异、惊叫而平静的水\r\n\r\n已流尽\r\n\r\n八月水已流尽\r\n\r\n七月水已流尽\r\n\r\n雪莱是我的心脏哭泣　再无泪水\r\n\r\n理应明白再无复活！理由并不存在！无须寻找他！\r\n\r\n雪莱——我和手和头颅　在万物之河中并不存在　水已流尽！\r\n\r\n歌队长：我用我的全身寻找一条河　尤其是陌生的河\r\n\r\n我用全身寻找那一个灵魂\r\n\r\n歌　队：那个灵魂在群鼓敲响的十分就会孤单地跳下山峰！\r\n\r\n那颗灵魂是神圣的父母生下的灵魂\r\n\r\n一等群鼓敲响就会独自跳下山峰！\r\n\r\n雪山上这些美丽狮子陪伴着那个孤单的灵魂\r\n\r\n那颗灵魂也深爱着这些美丽的狮子\r\n\r\n那是些雪山上雪白的狮子呵\r\n\r\n在游荡中陪伴着那个孤单的灵魂\r\n\r\n深夜里我再也不敢梦见的灵魂呵\r\n\r\n总是在夜深人静时反复梦见我！\r\n\r\n一个孤独的灵魂坐在蓝色无边的水上鳞片剥落\r\n\r\n歌队长：我的人民坐在水边 看着大海死去天才死去\r\n\r\n我的人民身边只剩下玉米和柴刀\r\n\r\n和一两个表妹，锡安的女儿容颜憔悴\r\n\r\n第六歌咏\r\n\r\n种豆南山——给梭罗和陶渊明\r\n\r\n于水井照映我们互相摸手，表示镇定\r\n\r\n那天空不动，田地稀少\r\n\r\n移步向盈水的平原之瓮\r\n\r\n秋天如同我扶着腰安睡如地\r\n\r\n一只雨水卧在我久久张开的嘴里\r\n\r\n乳头之牛，亦在花色温柔的黄昏\r\n\r\n这可是宇宙\r\n\r\n土内之土\r\n\r\n豆内之豆\r\n\r\n灯中之灯\r\n\r\n屋里之屋\r\n\r\n寻找内心和土地\r\n\r\n才是男人的秘密\r\n\r\n打开一只芳香四溢的山谷\r\n\r\n雁鸣如烛火明灭在高堂\r\n\r\n城头撤离的诸神只留下风和豆架\r\n\r\n掌灯人来到山谷\r\n\r\n豆架如秋风吹凉的尸首\r\n\r\n葬到土地为止\r\n\r\n雪最深于坚强的内心冰封\r\n\r\n梭罗和陶渊明破镜重圆\r\n\r\n土地测量员和文人\r\n\r\n携手奔向神秘谷仓\r\n\r\n白色帝子飘于大风之上\r\n\r\n谁言田园？\r\n\r\n河上我翩然而飞\r\n\r\n河打开着水，逢我杀我\r\n\r\n河扼住喉咙　发出森林声音\r\n\r\n谁言田园？\r\n\r\n河上我重见面包师女儿\r\n\r\n涉世未深　到达浅水\r\n\r\n背负七只负债人的筐子\r\n\r\n两位饥饿中，灯火\r\n\r\n背负故乡鸡声鸟鸣而去\r\n\r\n鸟落南山，粮食飞走\r\n\r\n是只身前往的鸟闪于豆棵\r\n\r\n一座村落于夜外\r\n\r\n一斧子砍杀月亮群马安静\r\n\r\n“风吹月照的日子\r\n\r\n他来到这面山坡时我在村里\r\n\r\n他来到这面贫穷的山坡时我在村里看护庄稼……”\r\n\r\n＊ 　＊　 ＊\r\n\r\n施洗者：你们终于来到了这条施洗者的河流\r\n\r\n你们终于来到了这条通往永恒的河\r\n\r\n你们终于来到了 王子们\r\n\r\n精灵和浪子，你们终于来到这里\r\n\r\n王　子：那位老师呢\r\n\r\n从我们王子中成长起来的那位老师呢？\r\n\r\n施洗者：他已成为永恒。\r\n\r\n你们呢？你们想成为永恒吗？\r\n\r\n来接受我的施洗吧\r\n\r\n王　子：我们拒绝永恒\r\n\r\n因为永恒从未言说\r\n\r\n因为永恒从未关心过我们\r\n\r\n我们拒绝永恒\r\n\r\n我们要投往大地\r\n\r\n第七歌咏 韩波\r\n\r\n（颂歌体散文诗　）\r\n\r\n第八歌咏 马洛\r\n\r\n（颂歌体散文诗）\r\n\r\n第九歌咏 庄子\r\n\r\n（颂歌体散文诗）\r\n\r\n……\r\n\r\n————————————\r\n\r\n\\ 海子计划写而未写，因此只留下题目。下同\r\n\r\n第三章 土地固有的欲望和死亡\r\n\r\n(3月。春。)\r\n\r\n第三章 土地固有的欲望和死亡\r\n\r\n……从泪水中生长出来的马，和别的马一样\r\n\r\n死亡之马啊，永生之马，马低垂着耳朵\r\n\r\n像是用嘴在喊着我——那传遍天堂的名字\r\n\r\n那时我被斜置地上，脱下太阳脱在麦地的衣裳\r\n\r\n我会一无所有　　我会肤浅地死去\r\n\r\n在这之前我要紧紧抓住悲惨的土地\r\n\r\n土　从中心放射　延伸到我们披挂的外壳\r\n\r\n土地的死亡力　迫害我　形成我的诗歌\r\n\r\n土的荒凉和沉寂\r\n\r\n断头是双手执笔\r\n\r\n土地对我的迫害已深入内心\r\n\r\n羔羊身披羊皮提血上山剥下羊皮就写下朴素悲切的诗\r\n\r\n诗，我的头骨，我梦中的杯子\r\n\r\n他被迫生活于今天的欲望\r\n\r\n梦中寂静而低声啜泣的杯子\r\n\r\n变成我现在的头盖是由于溅上一滴血\r\n\r\n这原始的杯子　使我喜悦\r\n\r\n原始的血使我喜悦　部落愚昧的血使我喜悦\r\n\r\n我的原始的杯子在人间生殖　一滴紫色的血\r\n\r\n混同于他　从上帝光辉的座位抱着羔羊而下\r\n\r\n太阳双手捧给太阳和我\r\n\r\n她们逐渐暗淡的鲜血\r\n\r\n在这条河流上我丢失了四肢\r\n\r\n只剩下：欲望和家园\r\n\r\n心　在黄昏生殖并埋葬她的衣裙\r\n\r\n有一天水和肉体被鸟取走\r\n\r\n芳香而死亡的泥土\r\n\r\n对称于原始的水\r\n\r\n在落日殷红如血的河流上\r\n\r\n是丰收或腐败的景色\r\n\r\n女人这点点血迹、万物繁忙之水\r\n\r\n繁荣而凋零　痛苦而暧昧\r\n\r\n灾难之水如此浩瀚——压迫大地发光\r\n\r\n原始诸水的昔日宁静今日破坏无一幸存\r\n\r\n水上长满了爪子和眼睛　长满石头\r\n\r\n石头说话，大地发光\r\n\r\n水——漫长而具体的痛楚\r\n\r\n布满这睁开眼睛的土地和人皮！\r\n\r\n土　鞭打着农奴　和太阳\r\n\r\n土把羊羔抱到宰杀羊羔的村庄\r\n\r\n这时羊羔忽然吐出无罪的话语\r\n\r\n“土地，故乡景色中的那个肮脏的天使\r\n\r\n在故乡山岩对穷人传授犯罪和诗。”\r\n\r\n“土地，这位母亲\r\n\r\n以诗歌的雄辩和血的名义吃下了儿子。”\r\n\r\n苦难的土　腹中饥饿擂动\r\n\r\n我们的尸骨并非你的欲望\r\n\r\n映出你无辜而孤独的面容\r\n\r\n荒凉的海　带来母马　胎儿　和胃\r\n\r\n把这些新娘　倾倒在荒凉的海滩\r\n\r\n任凭她们在阴郁的土上疯狂生长\r\n\r\n这些尸体忽然在大海波涛滚滚中坐起\r\n\r\n在岩石上　用血和土　用小小粗糙的手掌\r\n\r\n用舌头　尸体建起了渔村和城\r\n\r\n远离蓝色沉睡的血\r\n\r\n彩色的庄稼就是巨大的欲望\r\n\r\n把众神遗弃在荒凉的海滩上。\r\n\r\n彩色的庄稼　也是欲望　也是幻象\r\n\r\n他是尸体中唯一幸存的婴儿　留下了诗歌\r\n\r\n欲望　你渐渐沉寂\r\n\r\n欲望　你就是家乡\r\n\r\n陪伴你的只有诗人的犹豫和缄默\r\n\r\n周围是坐落山下的庄稼\r\n\r\n双手纺着城市和病痛\r\n\r\n母亲很重，负在我身上\r\n\r\n亦剩公木头和母木头\r\n\r\n亦剩无角处女\r\n\r\n亦剩求食　繁殖和死亡\r\n\r\n土地抱着女人　这鲜艳的奴隶\r\n\r\n女人和马飞行在天上\r\n\r\n子宫散发土地腐败\r\n\r\n五谷在它们彩色鳞甲上摔打！\r\n\r\n而飘洋过海的是那些被我灌醉的男人\r\n\r\n拥有自己的欲望\r\n\r\n抱着一只酒桶和母鸡思考哲学：\r\n\r\n“欲望啊　你不能熄灭”\r\n\r\n这些欲望十分苍白\r\n\r\n这些欲望自生自灭\r\n\r\n像城市中喃喃低语\r\n\r\n而我对应于母亲　孕于荒野\r\n\r\n翅膀和腹部　对应于神秘的春天\r\n\r\n我死去的尸体躺在天堂的黄昏\r\n\r\n肮脏而平静\r\n\r\n我的诗歌镌刻在丰收和富裕之中\r\n\r\n诗歌\r\n\r\n语言之马\r\n\r\n渡过无形而危险的水上\r\n\r\n语言发自内心的创伤\r\n\r\n尸体中唯一的婴儿　留下了诗歌\r\n\r\n甚至春天纯洁的豹子也不能将他掩盖\r\n\r\n一块悲惨的人骨　被鹰抓往天上\r\n\r\n犹如夜晚孤独的灵魂闪现于马厩\r\n\r\n诗歌的豹子抓住灵车撕咬\r\n\r\n感情只是陪伴我们的小灯，时明时灭\r\n\r\n让我们从近处，从最近处而来迫近母亲脐带\r\n\r\n（人类时人类死后尸体的幻象和梦想\r\n\r\n被黑暗中无声的鸟骨带往四面八方）\r\n\r\n的确这样\r\n\r\n在神圣的春天\r\n\r\n春之火闪烁\r\n\r\n的确这样\r\n\r\n肉体被耕种和收割　千次万次\r\n\r\n动物的外壳\r\n\r\n坚强而绵长\r\n\r\n的确这样\r\n\r\n一面血红大鼓住在你这荒凉的子宫\r\n\r\n当吹笛人将爪子伸进我的喉管\r\n\r\n我欲歌唱的人皮上画满了手！\r\n\r\n悲惨的王子，你竟然在这短暂的一生同时遇见了生老病死？\r\n\r\n“我怕过，爱过，恨过，苦过，活过，死过”\r\n\r\n四位天王沉闷地托住你的马腿\r\n\r\n已经有的这么多死亡难道不足以使大地肥沃？\r\n\r\n四条马腿从原始的人性开始\r\n\r\n原始的欲望唱一支回归母亲的歌\r\n\r\n为了死亡我们花好月圆\r\n\r\n而死亡金色的林中我吹响生育之牛\r\n\r\n浑浑噩噩一块石头\r\n\r\n在行星的周期旋转中怀孕\r\n\r\n初生的少女坐满河弯散发谷物或雨水的腥味\r\n\r\n女人背好甜蜜的枣子　正在思乡\r\n\r\n或者转变念头　与年迈婆母一起打点行装\r\n\r\n路得坐在异乡麦田\r\n\r\n远离故乡的殡葬\r\n\r\n会使大地肥沃而广阔\r\n\r\n而土地的死亡力正是诗歌\r\n\r\n这秘密的诗歌歌唱你和你的女祖先\r\n\r\n——畜栏诞生的王啊！\r\n\r\n你的一双大腿在海底生病\r\n\r\n你的一双大腿　戴上母羊贵重光芒\r\n\r\n有神私于马厩　神私入马厩　神撕开马厩之门\r\n\r\n神撕开母马\r\n\r\n挪动胎位的地方　惨不忍睹\r\n\r\n合拢的圣杯——我的头骨\r\n\r\n秋　一匹身体在天空发出响声\r\n\r\n像是祖先刚刚用血洗过\r\n\r\n而双手的土地　正是新鲜的　正常的　可食的\r\n\r\n秋天的生殖器——我的双手\r\n\r\n如马匹　雄健而美丽\r\n\r\n仍在原始状态\r\n\r\n你这王\r\n\r\n王\r\n\r\n第四章 饥饿仪式在本世纪\r\n\r\n（4月。春。）\r\n\r\n第四章 饥饿仪式在本世纪\r\n\r\n饥饿是上帝脱落的羊毛\r\n\r\n她们锐利而丰满的肉体被切断　暗暗渗出血来\r\n\r\n上帝脱落的羊毛　因目睹相互的时间而疲倦\r\n\r\n上帝脱落的羊毛\r\n\r\n父、王，或物质\r\n\r\n饥饿　他向我耳语\r\n\r\n智慧与血不能在泥土中混杂合冶\r\n\r\n九条河流上九种灵魂的变化\r\n\r\n歪曲了龙本身\r\n\r\n只有豹子或羊毛　老虎偶尔的欲望\r\n\r\n超于原野的幼稚水准而生存\r\n\r\n到达必须的黑暗　把财富抛尽\r\n\r\n你就尽可吃我尸体与果实于实在的桶\r\n\r\n饥饿　胃上这常醉的酒桶\r\n\r\n饥饿　我摇动木柄　花蛾子白雪落在桶中\r\n\r\n从个人的昏暗中产生饥饿\r\n\r\n由于努力达到完美　而忍受宽恕\r\n\r\n收藏失败的武器\r\n\r\n在神的身旁居住\r\n\r\n倾听你那秘密和无上的诗歌\r\n\r\n在我们狂怒的诗行中　大地所在安然无恙\r\n\r\n坚硬的核从内心延伸到我们披挂的外壳\r\n\r\n在沙漠散布水源和秘密口语的血缘\r\n\r\n诗歌王子　你陪伴饥饿的老王\r\n\r\n把众兵把持的深宅\r\n\r\n掌灯度夜　度日如年\r\n\r\n围困此城的大兵已拥妻生子了吧\r\n\r\n以更慢的速度　船运载谷子或干草\r\n\r\n饥饿的金色羊毛上\r\n\r\n谁驮着谁飞逝了？\r\n\r\n神灵的雨中最后的虎豹也已消隐\r\n\r\n背叛亲人　已成为我的命运\r\n\r\n饥饿中我只有欲望却无谷仓\r\n\r\n太阳对我的驳斥　对我软弱的驳斥\r\n\r\n太阳自身　用理性　用钢铁　在饮酒\r\n\r\n饥饿和虚假的公牛　攀附于一种白痴　一种骗局\r\n\r\n忿怒砍伐我们　退回故乡麦粒的人\r\n\r\n砍伐言语退为家园诗歌的人\r\n\r\n只有羔羊　睡在山谷底　掰开一只水桶\r\n\r\n朗诵羊皮上沉痛的诗歌\r\n\r\n发出申辩的声音\r\n\r\n太阳于我的内脏分裂\r\n\r\n饥饿中猎人追逐的猎物\r\n\r\n亡命于秋天　他是羔羊在马厩歇息\r\n\r\n在护理伤口的间歇\r\n\r\n诗歌执笔于我\r\n\r\n又执笔于河道\r\n\r\n回忆我的亲人\r\n\r\n我已远离了你\r\n\r\n上帝脱落的羊毛　囚禁在路途遥远的车上\r\n\r\n原始的生命囚禁在路途遥远的车上\r\n\r\n车子啊　你前轮是谷仓　后轮是马厩\r\n\r\n一块车板是大木栅\r\n\r\n另一块板是干草场\r\n\r\n驾车人他叫故乡\r\n\r\n囚犯就是饥饿\r\n\r\n前后左右拥着绿色的豹子\r\n\r\n浑浊　悲痛而平静\r\n\r\n奔向远方的道路上\r\n\r\n羊毛悲痛地燃烧\r\n\r\n那辆车子仿佛羔羊在盲目行走\r\n\r\n故乡领着饥饿　仿佛一只羔羊\r\n\r\n酷律：刻在羊皮上　我是诗歌\r\n\r\n是为了远方的真情？而盲目上路\r\n\r\n奥秘　从灰烬中站起脱下过去的丑陋\r\n\r\n道　从灰烬中站起脱下了过去的诗歌\r\n\r\n过去的诗歌是永久的炊烟生起在亲切的泥土上\r\n\r\n如今的诗歌是饥饿的节奏\r\n\r\n火色的酒\r\n\r\n深入内心黑暗\r\n\r\n饥饿或仪式\r\n\r\n斧子割下天鹅或果园\r\n\r\n捡起第一块石头杀死第一只羊\r\n\r\n盲目的石头闪现出最初的光芒\r\n\r\n这就是才华王子的诗歌\r\n\r\n通过杀害解放了石头和羊　灵魂开始在山上自由飘荡\r\n\r\n手又回到泥土凶手悲惨的梦境\r\n\r\n饥饿或仪式\r\n\r\n这些造化的做梦的巨兽　驮负诗歌　明亮飞翔\r\n\r\n脆弱的河谷地带一家穷人葬身在花生地上\r\n\r\n这也是一次谈论诗歌的悲惨晚上\r\n\r\n他们受害脸孔面带笑容出现在凶手梦中\r\n\r\n第五章 原始力\r\n\r\n（5月。春夏之交。）\r\n\r\n第五章 原始力\r\n\r\n在水中发亮的种子\r\n\r\n合唱队中一灰色的狮子\r\n\r\n领着一豹　一少女\r\n\r\n坐在水中放出光芒的种子\r\n\r\n走出一匹灰色的狮子　领着豹子和少女\r\n\r\n在河上蹒跚\r\n\r\n大教堂饲养的豹子　悲痛饲养的豹子\r\n\r\n领着一位老人　一位少女\r\n\r\n在野外交配　生下圣人\r\n\r\n的豹子也生下忧郁诗篇\r\n\r\n提着灯　飞翔在岩石上　我与他在河中会面\r\n\r\n我向他斥问　他对我的迫害\r\n\r\n他缄默\r\n\r\n在荒凉的河岸\r\n\r\n因为饥饿而疲乏\r\n\r\n我们只能在一片废墟上才能和解\r\n\r\n最后晚餐　那食物径直通过了我们的少女\r\n\r\n她们的伤口　她们颅骨中的缝合\r\n\r\n最后的晚餐端到我们面前\r\n\r\n这一道筵席　受孕于我们自己\r\n\r\n丰收的女祖先\r\n\r\n大地幻觉的丰收\r\n\r\n荒凉的酒杯\r\n\r\n我的酒杯\r\n\r\n在人间行走　焚烧　痉挛\r\n\r\n我的生殖的酒杯\r\n\r\n驱赶着我疲倦的肉体\r\n\r\n子宫高高飞翔\r\n\r\n我问我的头颅　你是否还在饥饿\r\n\r\n早就存在\r\n\r\n岁年的中心\r\n\r\n掠夺一切的女祖先！\r\n\r\n丰收中心\r\n\r\n疲倦的泉水中心\r\n\r\n风暴中心\r\n\r\n女祖先衣衫华贵\r\n\r\n——土\r\n\r\n丰收的人皮\r\n\r\n坐满一只酒杯　坐满狼和狮子\r\n\r\n豹子的赤裸身子是我的嫁妆\r\n\r\n黎明和黄昏是我处女的脂香\r\n\r\n河流上　狮子的手采摘发亮的种子\r\n\r\n发亮的水\r\n\r\n绿色的豹子顺着忧郁的土地一路奔跑\r\n\r\n追赶我就像追赶一座漆黑的夜里埋葬尸体的花园\r\n\r\n尘土的豹子　跳跃的豹子\r\n\r\n豹子和斧子\r\n\r\n在河流上流淌\r\n\r\n我的肉体和木桶在河上沉睡着\r\n\r\n我肉体和木桶　被斧子劈开\r\n\r\n豹子撕裂……以此传授原始的血\r\n\r\n我喜悦过花朵　嘴唇　大麦的根和小麦的根\r\n\r\n我喜悦过秋风中诸神为我安排的新娘\r\n\r\n我粗壮的乳房　移向豹子和牛羊\r\n\r\n狮子和豹子在酒精中和解\r\n\r\n兄弟拥抱睡去\r\n\r\n古老的太阳如今变异\r\n\r\n女祖先\r\n\r\n披散着长发\r\n\r\n进入我的身体\r\n\r\n对我发号施令\r\n\r\n变异在太阳中心狂怒地杀你\r\n\r\n变异的女祖先\r\n\r\n在死亡中　高叫自我　疯狂掠夺\r\n\r\n难以生存的走投无路的诗人之王？\r\n\r\n谁能说出你那唯一的名字？！\r\n\r\n淫荡的乡间的酒馆内\r\n\r\n破败的瓮中唯一的盐\r\n\r\n你是否记得\r\n\r\n抛在荒凉的海滩\r\n\r\n盐田上坐着痴呆的我——走投无路的诗人之王？\r\n\r\n腐败的土地\r\n\r\n这时响起\r\n\r\n令人恐怖的\r\n\r\n丰收的鼓\r\n\r\n鼓　崩崩地响了\r\n\r\n内陆深处巨大的鼓\r\n\r\n欲望的鼓\r\n\r\n神气的鼓啊\r\n\r\n我多么渴望这正午或子夜神奇的鼓　命定而黑暗\r\n\r\n鼓！血和命！绿色脊背！红色血腥的王！\r\n\r\n沉闷的心脏打击我！露出河流与太阳\r\n\r\n我漠视祖先\r\n\r\n在这变异的时刻　在血红的山河\r\n\r\n一种痛感升遍我全身！\r\n\r\n大地微微颤抖\r\n\r\n我为何至今依然痛苦！\r\n\r\n我的血和欲望之王\r\n\r\n鼓！\r\n\r\n我为何至今仍然痛苦！\r\n\r\n（承受巨大失败和痛苦的一只血红的鼓在流血）\r\n\r\n擂起我们流血的鼓面\r\n\r\n滋生玉米　腐败的土地　变乱的太阳\r\n\r\n鼓！节奏！打击！死亡！快慰！欲望！\r\n\r\n鼓！欲望！打击！死亡！\r\n\r\n退向旷野！退向心脏！退向最后的生存\r\n\r\n变乱而嚣叫的荒野之神　血　污浊的血\r\n\r\n热烈而粘稠　浓稠的血　在燃烧也在腐败\r\n\r\n命定而黑暗！\r\n\r\n鼓！打击！独立！生存！自由！强烈而傲慢！\r\n\r\n血和命　只剩下我在大地上伸展腐烂的四肢\r\n\r\n承受巨大失败和痛苦的一只鼓在流血\r\n\r\n我的鼓使大地加快死亡步伐！\r\n\r\n血！打击！节奏！生存！自由！\r\n\r\n在海岸　　他们痛苦不安地吼叫\r\n\r\n为了他们之中保留一面血腥的鼓\r\n\r\n（这个人　像真理又像诗\r\n\r\n坐在烈日鼓面任我们宰杀）\r\n\r\n第六章 王\r\n\r\n（六月。夏。）\r\n\r\n第六章 王\r\n\r\n王，他双手提鸟，食着鸟头，张开双耳\r\n\r\n倾听那牛羊的声音\r\n\r\n岩石之王，性欲之王，草原之王\r\n\r\n你上肢肥壮、下肢肥壮\r\n\r\n如岩石　如草原　如天堂的大厅\r\n\r\n死亡只能使你改头换面\r\n\r\n王\r\n\r\n痉挛\r\n\r\n腹部在荒野行走\r\n\r\n一只月亮在荒野上行走\r\n\r\n蓝色幽暗的洞窟\r\n\r\n在荒野上行走\r\n\r\n我　手执陶土的灯　野猪的灯\r\n\r\n手执画笔　割下动物双眼的油脂\r\n\r\n并割下在树林中被野猪撕咬的你\r\n\r\n你身上的油脂\r\n\r\n浓厚的油脂\r\n\r\n涂抹在崖面\r\n\r\n王，火焰的情欲\r\n\r\n火焰的酒\r\n\r\n酒上站立粮食\r\n\r\n我的裸露\r\n\r\n我的头颅\r\n\r\n我的焚烧\r\n\r\n王　请开口言语　光——要有光\r\n\r\n这言语如同罪行的弓箭　寂静无声\r\n\r\n众眼睁开　寂静无声\r\n\r\n罪行的眼睛\r\n\r\n雨的眼睛\r\n\r\n四季的眼睛\r\n\r\n“口含天使舍弃马匹的歌声\r\n\r\n口含诸神舍弃圣地悲惨的歌声”\r\n\r\n“夏季瞬间和芳香手指的歌\r\n\r\n撇下洪水的歌\r\n\r\n诸神扛着天梯撤离我们\r\n\r\n撇下洪水的歌　玉黍和螺号重重的歌”\r\n\r\n是我在海边看见了直立的全身光芒肩生双翅的天使\r\n\r\n脚登着火的天梯\r\n\r\n天使如着火的谷仓升上天空\r\n\r\n众神撤离须弥山　是我一具尸体孤独留下\r\n\r\n我终于摔死在冷酷的地上　口含天使舍弃马匹的歌\r\n\r\n口含诸神舍弃圣地悲惨的歌声\r\n\r\n众神从我微温的尸体上移开了种子\r\n\r\n我的爪子是光明舞动的肝脏在高原上升\r\n\r\n我的眼睛是一对黑白狮子正抛弃黎明\r\n\r\n众神之手剥开我的心脏一座殷红如血的钟\r\n\r\n众神之手从我微温的尸体上移开了种子\r\n\r\n埋葬尸体的天空\r\n\r\n光明陌生而有奇迹\r\n\r\n光\r\n\r\n光明\r\n\r\n光明中父亲双手\r\n\r\n宰杀了我\r\n\r\n杀害的尸体照红岩石\r\n\r\n杀害如岩石照红云霞和山冈的棉花\r\n\r\n我　一具太阳中的尸体\r\n\r\n落入王的生日\r\n\r\n一具太阳中的尸体　横陈\r\n\r\n大地　犹如盲诗人的盲目\r\n\r\n盲诗人的盲目是光明中\r\n\r\n一只新娘咬在我的头颅中\r\n\r\n大地进入黄昏\r\n\r\n掩饰悲惨的泥土\r\n\r\n疲倦的泥土\r\n\r\n河水拍岸\r\n\r\n秋天遥遥远去\r\n\r\n流离失所的众神正焚烧河流\r\n\r\n尸体——那是我睡在大地上的感觉\r\n\r\n雨雪封住我的尸体\r\n\r\n我尸体是我自己的妹妹\r\n\r\n云朵中躲避雷电的妹妹\r\n\r\n云朵下埋葬谷物的妹妹\r\n\r\n名为人类\r\n\r\n近似妹妹的感觉\r\n\r\n近似长久的感觉\r\n\r\n大地躺卧而平坦　如一个故乡\r\n\r\n尸体是泥土的再次开始\r\n\r\n尸体不是愤怒也不是疾病\r\n\r\n其中包含愤怒、忧伤和天才\r\n\r\n人类没有罪过只有痛苦\r\n\r\n太阳火光照见大地两岸的门窗\r\n\r\n痛苦疲倦的泥土中有天才飞去\r\n\r\n王啊　这是我用你油脂画出的图画和故事\r\n\r\n在那似乎门楣和我稻麦环绕的窗户下\r\n\r\n那声音的女人　香气的女人　大腿的女人　散花的女人\r\n\r\n大片升起　乘坐云朵\r\n\r\n脚趾美丽清澈\r\n\r\n这些阴暗的花园　坐在不动的岩石上\r\n\r\n这些鸟群\r\n\r\n白色的鸟群\r\n\r\n带来半岛、群岛、花朵和雨雪\r\n\r\n这些阴暗的花园\r\n\r\n她们来自哪里？\r\n\r\n为什么她们轻蔑而理性地看着群岛的太阳？\r\n\r\n王啊\r\n\r\n肉体的你　许多你\r\n\r\n飞翔的大腿果实沉落洞底\r\n\r\n蓝幽幽的岩石　在白云浮现的八月的山上\r\n\r\n王啊\r\n\r\n一只岩石裂开　凿开洞窟安慰你的孤寂\r\n\r\n王啊\r\n\r\n他们昏昏沉沉地走着\r\n\r\n（肉体和诗下沉洞窟）\r\n\r\n仿佛比酒还醉\r\n\r\n大地没有边缘和尽头\r\n\r\n（肉体和诗下沉洞窟）\r\n\r\n蜂巢\r\n\r\n比酒还醉\r\n\r\n我梦见自己的青春\r\n\r\n躺在河岸\r\n\r\n一片野花抬走了头颅\r\n\r\n蜜蜂抬走了我的头颅\r\n\r\n在原野上　在洞窟中\r\n\r\n甜蜜的野兽抬走了我的头颅\r\n\r\n月光下\r\n\r\n我颈项上\r\n\r\n开满了花朵\r\n\r\n我\r\n\r\n如蜂巢\r\n\r\n全身已下沉\r\n\r\n存蕴泉水和蜜\r\n\r\n一口井、洁净而圣洁\r\n\r\n图画的蜜\r\n\r\n如今是我的肉体\r\n\r\n蜜蜂如情欲抬走了头颅\r\n\r\n野兽如死亡抬走了头颅\r\n\r\n第七章 巨石\r\n\r\n（7月。夏。）\r\n\r\n第七章 巨　石\r\n\r\n诸神岩石的家乡\r\n\r\n河流流淌\r\n\r\n有何指望\r\n\r\n问众神，我己堕落，有何指望\r\n\r\n肉体像一只被众神追杀的\r\n\r\n载满凶手的船只，有何指望\r\n\r\n圣地有何指望\r\n\r\n众神岩石的家乡\r\n\r\n众神沉默　沉闷\r\n\r\n而啜饮\r\n\r\n在水\r\n\r\n在河流\r\n\r\n背负我肉体和罪过的万物之水上\r\n\r\n众神沉默　沉闷啜饮\r\n\r\n众神沉默\r\n\r\n在我的星辰\r\n\r\n在我的村庄沉闷啜饮\r\n\r\n在这如泣如诉的地方\r\n\r\n（有玉的国\r\n\r\n有猪的家）\r\n\r\n巨石的众神，巨石巨石\r\n\r\n能否拯救我们\r\n\r\n（猪圈和肉体）\r\n\r\n拯救这些陷于财富和欲望的五彩斑斑的锦鸡吧\r\n\r\n岩石巨大的岩石\r\n\r\n救救孩子\r\n\r\n救救我们\r\n\r\n巨大的岩石、岩石\r\n\r\n岩石　不准求食和繁殖\r\n\r\n只准死亡　只准死亡的焚烧　岩石！回答我！\r\n\r\n岩石吼叫　岩石歌唱\r\n\r\n歌唱然后死亡\r\n\r\n一只灵魂的手　伸出岩石　不准求食与繁殖\r\n\r\n一只灵魂的手众人痛苦的狮子\r\n\r\n焚烧北方最后一次焚烧\r\n\r\n岩石狂叫　岩石歌唱　岩石自言自语\r\n\r\n（群岛上，死亡梦见的岩石\r\n\r\n死亡梦见的太阳和平原的岩石）\r\n\r\n岩石　从黑暗中诞生　大家裸露身体　露齿狂笑\r\n\r\n远远哭泣的太阳的脊背\r\n\r\n头颅抬起，又在海面上沉沦\r\n\r\n太阳的光芒、太阳全身的果树、岩石！\r\n\r\n岩石吼叫！　岩石歌唱\r\n\r\n“如果我死亡\r\n\r\n我将明亮\r\n\r\n我将鲜花怒放”\r\n\r\n大地痛苦叫着向天空飞去\r\n\r\n火焰舔着我　红色裸体舔着我\r\n\r\n棵体的羊群围着我　大片裸露的红色狮子舔着我\r\n\r\n我——这广阔的天堂　头颅轰然炸开\r\n\r\n惊悸的大地　痛苦地叫着　向天空飞去\r\n\r\n在这狮子和婴儿看护的睡眠的岩石上\r\n\r\n惊悸的大地　痛苦地叫着　向天空飞去\r\n\r\n一只头颅焚毁大地的公牛\r\n\r\n大地黄金的森林中怀孕在哭泣\r\n\r\n河流长存的暮雪焚烧大地果园\r\n\r\n大地痛苦的诗！\r\n\r\n大地痛苦尖叫向天空飞去\r\n\r\n夜晚焚烧土地与河流　梦境辉煌\r\n\r\n天空的红色裸体　高高举起我\r\n\r\n一次次来到花朵\r\n\r\n太阳！\r\n\r\n让岩石吼叫让岩石疯狂歌唱\r\n\r\n饥饿无比的太阳　琴　采满嘴唇　潮湿的花朵\r\n\r\n饥饿无比的太阳、天空的红色裸体、高举着我\r\n\r\n饥饿无比的太阳\r\n\r\n双手捧着万物归宿\r\n\r\n太阳用完了我\r\n\r\n太阳用完了野兽和人\r\n\r\n岩石的花朵\r\n\r\n孤独的处女\r\n\r\n返回洞穴和夜晚\r\n\r\n岩石的花朵\r\n\r\n孤独的处女\r\n\r\n露出群山\r\n\r\n的麦和肢体！\r\n\r\n在岩石上\r\n\r\n我真正做到了死亡\r\n\r\n在岩石上\r\n\r\n我真正地\r\n\r\n坐下\r\n\r\n大地无限伸展\r\n\r\n双手摆动\r\n\r\n啜饮万物的河流\r\n\r\n岩石吼叫　岩石歌唱\r\n\r\n（群岛上死亡梦见的岩石在天空上焚烧\r\n\r\n太阳的焚烧茫然的大地居民的焚烧）\r\n\r\n填满野兽和人的太阳\r\n\r\n太阳！\r\n\r\n焚烧万物的河岸　悬在空中\r\n\r\n焚烧万物的岩石　歌唱的彩色的岩石　狂叫的岩石　悬在天空\r\n\r\n焚挠万物的河岸在于我们内心黑暗的焚烧\r\n\r\n——一块岩石　愤怒而野蛮　头颅焚烧\r\n\r\n悬在半空\r\n\r\n我们悬在空中，双目失明，吃梨和歌唱\r\n\r\n焚烧万物的河岸　悬在天空——我们内心万物的黑　暗\r\n\r\n焚烧\r\n\r\n敦煌在这块万物的岩石上\r\n\r\n填满了野兽和人\r\n\r\n的太阳\r\n\r\n敦烂在我们做梦的地方\r\n\r\n只有玉米与百合闪烁\r\n\r\n人生在世。\r\n\r\n玉米却归于食欲\r\n\r\n百合虽然开放，却很短暂\r\n\r\n第八章　红月亮……　女人的腐败或丰收\r\n\r\n（八月。夏秋之交。）\r\n\r\n第八章　红月亮……           　　　　　　　女人的腐败或丰收\r\n\r\n大地那不能愈合的伤口\r\n\r\n名为女人的马\r\n\r\n突然在太阳的子宫里生下另一个女人\r\n\r\n这匹马望着麦粒里的雨雪\r\n\r\n心境充满神圣与宁静\r\n\r\n马突然在太阳的子宫里生下一个女人\r\n\r\n那就是神奇的月亮\r\n\r\n大地的伤口先是长出了断肢残体\r\n\r\n一截一截　悲惨红透\r\n\r\n大地长出了我们的马　我们的女人\r\n\r\n像是大地悲惨的五脏\r\n\r\n突然破土而出\r\n\r\n为什么会有这么多安睡的水？\r\n\r\n会有这么多安详的水？灾难的水？\r\n\r\n鸣叫之夜高高飞翔\r\n\r\n对称于原始的水\r\n\r\n犹如十五只母狼　带着水\r\n\r\n哺乳动物的愿望\r\n\r\n使你光着屁股　漂浮在水上\r\n\r\n犹如一个战士　武装的人　剥下马皮　剥下羊皮\r\n\r\n用冰河流淌的雪水　披在身上\r\n\r\n写一首歌颂女人的诗　披在身上\r\n\r\n月亮的表面吸附著女人的盐和女人的血\r\n\r\n火灾中升起的灯光　把大地照亮\r\n\r\n月亮表面粗糙不平　充满梦境\r\n\r\n月亮的内心站着一匹忧伤的马　一个女人\r\n\r\n用死亡的麦粒喂活她\r\n\r\n人和悲惨的大地是如此相似\r\n\r\n以至吸引凄苦的月亮\r\n\r\n丰收的月亮　腐烂的月亮\r\n\r\n你鳞片剥落\r\n\r\n残暴轰击我的洞穴居民\r\n\r\n马和女人披散着长发　　人们啊\r\n\r\n我曾在水上呼唤过你们\r\n\r\n船长为何粗鲁塞住你们的双耳低垂\r\n\r\n那双手又为何被你们牢牢捆绑\r\n\r\n在桅杆上不得挣脱\r\n\r\n河流上忽然涌出了这些奇异的女人\r\n\r\n这些光滑的卵石和母马\r\n\r\n这些红色透明的蜜蜂　小小的腹部唱歌\r\n\r\n忧伤的胸前　果实微隆而低垂\r\n\r\n包括嘴唇　你是三棵拥有桑椹的桑树\r\n\r\n河流上忽然涌出了这些奇异的女人\r\n\r\n忧伤的河水沉醉\r\n\r\n涌上两岸浇灌麦地和金黄的王冠\r\n\r\n内含丰收或腐败　一只王冠。\r\n\r\n干草沁出香泽　微弱的湖泊飞舞\r\n\r\n我在洛阳遇见你\r\n\r\n在洛阳的水上遇见你\r\n\r\n以泉水为绿发\r\n\r\n以黄昏为马\r\n\r\n花朵般腹部在荒野飞翔\r\n\r\n那只领头的豹子在殷红如血的明月的河流上\r\n\r\n飞翔　驱赶着我的躯体\r\n\r\n——这些女人痛苦而暧昧\r\n\r\n灰蓝的豹子　黑豹子　这些梦中的歌手\r\n\r\n骑着我的头颅　逼迫着暴君般的双手伸向河岸上无知的\r\n\r\n果树\r\n\r\n手和子宫　你从石头死寂中茫然上升\r\n\r\n丰收时\r\n\r\n望见透明的母豹　脉动的母豹\r\n\r\n盘桓崖壁　再生小豹\r\n\r\n丰收是女人的历程\r\n\r\n女人是关在新马厩里忧郁的古马\r\n\r\n竖起耳朵听见了\r\n\r\n秋天的腐败和丰收\r\n\r\n月亮的内心站着一匹忧伤的马\r\n\r\n豹子　在丰收中　骑着我的头颅\r\n\r\n骑着这些抽搐而难产的母亲生产父亲\r\n\r\n原始诸水的昔日宁静\r\n\r\n今日被破坏无一幸存\r\n\r\n月亮　土地的内脏倒退　回到原始的梦境\r\n\r\n虎豹纷纷脱落于母亲\r\n\r\n群狮举首水上\r\n\r\n熄灭于月亮中\r\n\r\n月亮这面貌无限阴沉的女入\r\n\r\n这万物存在仪式中必备的药和琴\r\n\r\n光明的少女脊背上挂着鹌鹑　翅膀乍开　稻谷飘香\r\n\r\n流水淙淙\r\n\r\n一只手在平原上捡拾少女和雨水中的鹌鹑\r\n\r\n光明照耀森林中马和妻子的身体叭叭响了\r\n\r\n月亮　荒凉的酒杯　荒凉的子宫\r\n\r\n在古老的\r\n\r\n幻觉的丰收中\r\n\r\n手边的东西　并不能告诉\r\n\r\n我们什么又收进桶里\r\n\r\n收进繁荣　敏锐　沉寂的桶\r\n\r\n沉寂的桶\r\n\r\n苦难而弯曲的牛角\r\n\r\n容器　与贫乏的诗\r\n\r\n在古老幻象的丰收中\r\n\r\n腐败的土　低下头来\r\n\r\n这诗歌的脚镣明亮\r\n\r\n人们在河上乘坐香草和鱼群\r\n\r\n在女人光滑的脊背上\r\n\r\n我写着一首写给马匹的诗\r\n\r\n（太意如此：）\r\n\r\n月亮的马飞进酒中　痛楚地鸣叫\r\n\r\n那是我酩酊大醉的女人\r\n\r\n她们搂住泥土睡眠和舞蹈\r\n\r\n她们仿照河流休息和养育\r\n\r\n第九章 家园\r\n\r\n（9月。秋。）\r\n\r\n第九章 家园\r\n\r\n人们把你放在村庄\r\n\r\n秋风吹拂的北方\r\n\r\n神祗从四方而来　往八方而去\r\n\r\n经过这座村庄后杳无音信\r\n\r\n当秋天的采集者坐满天堂\r\n\r\n边缘的树林散放着异香\r\n\r\n提供孤独的平原\r\n\r\n来人啊　命运和水把你喂养\r\n\r\n人们把你放在敦煌\r\n\r\n这座中国的村庄\r\n\r\n水和沙漠　是幽幽的蓝子\r\n\r\n天堂的笑容也画在篮子上\r\n\r\n人们把你放在秋天\r\n\r\n这座中国的村庄\r\n\r\n秋风阵阵　在云高草低的山上\r\n\r\n居住一个灵魂\r\n\r\n秋天的灵魂啊\r\n\r\n你忧愁\r\n\r\n你美好\r\n\r\n你孤独而善良\r\n\r\n当我比你丑陋\r\n\r\n我深爱你容貌的美好\r\n\r\n当我比你罪恶\r\n\r\n我钦佩你善良和高尚\r\n\r\n隐隐河面起风\r\n\r\n秋天的灵魂啊\r\n\r\n怎样的疾病和泥土\r\n\r\n使你成为女人\r\n\r\n龙的女儿　她仍垂髫黄发\r\n\r\n守着村庄的篱笆\r\n\r\n衰老和泥土的龙\r\n\r\n身上填满死去的青年\r\n\r\n水和黎明\r\n\r\n静静落下\r\n\r\n闪烁青年王子\r\n\r\n尸体果园的光\r\n\r\n尸体头戴王冠\r\n\r\n光芒和火焰的边缘\r\n\r\n酷似井水的蓝色\r\n\r\n当苇草缠绕秋天\r\n\r\n大地敦煌\r\n\r\n开放一朵花\r\n\r\n一匹马　处女\r\n\r\n飞出湖泊\r\n\r\n这是一个秋天的果园\r\n\r\n像裸体天空\r\n\r\n光明的天空\r\n\r\n长出枝叶　绿色的血\r\n\r\n秋天的云和树\r\n\r\n秋天的死亡\r\n\r\n落入井水和言语\r\n\r\n水井　病了又圆\r\n\r\n家园\r\n\r\n你脆弱\r\n\r\n像火焰\r\n\r\n像裸体\r\n\r\n云冈　麦积山　龙门和敦煌\r\n\r\n这些鹰在水上搬运秋天的头颅\r\n\r\n果园和大地行程万里\r\n\r\n头颅埋葬的北方　山崖睡眠　涌出秋天\r\n\r\n在大地和水上\r\n\r\n秋夭千里万里\r\n\r\n回到我们的山上去\r\n\r\n从山顶看向平原\r\n\r\n痛楚\r\n\r\n秋天明灭\r\n\r\n黎明　黄昏的苦木\r\n\r\n树林\r\n\r\n果园\r\n\r\n酒\r\n\r\n溢出果实\r\n\r\n远方就是你一无所有的家乡\r\n\r\n风吹来的方向\r\n\r\n庄稼熟了\r\n\r\n磨快镰刀\r\n\r\n坐在秋天\r\n\r\n大地　美好的房子\r\n\r\n风吹　居住在大地的灵魂\r\n\r\n那时圣洁而美好\r\n\r\n回到我们的山上去\r\n\r\n第十章 迷途不返的人……酒\r\n\r\n（10月。秋。）\r\n\r\n第十章 迷途不返的人……酒\r\n\r\n“迷途不返的人哪，你们在哪里？                       我们的光芒能否照亮你的路？”                       　　　　　　　　　 ——叶赛宁\r\n\r\n大地　酒馆中酒徒们捧在手心的脆弱星辰\r\n\r\n漠视酒馆中打碎的其他器皿\r\n\r\n明日又在大地中完整　这才是我打碎一切的真情\r\n\r\n绳索或鲜艳的鳞　将我遮盖\r\n\r\n我的海洋升起着这些花朵\r\n\r\n抛向太阳的我们尸体的花朵　大地！\r\n\r\n太阳的手　爬回树上　秘密的春之火在闪烁\r\n\r\n破缺的王　打开大弓　羊群涌入饥饿的喉咙\r\n\r\n大地绵绵无期\r\n\r\n我们玉米身体的扩张绵绵无期\r\n\r\n是谁剥夺了我们的大地和玉米\r\n\r\n何方有一位拯救大地的人？\r\n\r\n何方有一位拯救岛屿的人？拯救半岛的人何日安在\r\n\r\n祭司和王纷纷毁灭　石头核心下沉河谷　养育\r\n\r\n马匹和水\r\n\r\n大地魔法的阴影深入我疯狂的内心\r\n\r\n大地啊，何日方在？\r\n\r\n大地啊，伴随着你的毁灭\r\n\r\n我们的酒杯举向哪里？\r\n\r\n我们的脚举向哪里？\r\n\r\n大地　盲目的血\r\n\r\n天才和语言背着血红的落日\r\n\r\n走向家乡的墓地\r\n\r\n想想我是多么疲倦\r\n\r\n想想我是多么衰老\r\n\r\n习惯于孕育的火焰今日要习惯熄灭\r\n\r\n绿色的妇女　阴郁的妇女　疯狂扑上一面腥红的大鼓\r\n\r\n土地的大腿为求雨水　向风暴阴郁撕裂\r\n\r\n绿色的妇女　阴郁的妇女\r\n\r\n在瓦解中搂住我一同坐在燃烧的太阳和酒精中心\r\n\r\n我在太阳中不断沉沦不断沉溺\r\n\r\n我在酒精中下沉　瓦解　在空中播开四肢\r\n\r\n大地是酒馆中酒徒们捧在手心的脆弱星辰\r\n\r\n天使背负羽翼　光照雪山……幻象散失\r\n\r\n光芒的马　光芒的麦芒　又侵入我的酒　我充满\r\n\r\n大地的头\r\n\r\n诗歌生涯本是受难王子乘负的马\r\n\r\n饮血食泪　苦难的盐你从大海流放于草原\r\n\r\n迁涉、杀伐、法令和先知的追逐\r\n\r\n皆成无头王子乘马飞翔\r\n\r\n“我曾在河畔用水　粗糙但是洁净\r\n\r\n我们大树下的家园\r\n\r\n在大地的背面　我曾升起炊烟——”\r\n\r\n“孩子　口含手指　梳理绿色的溪流\r\n\r\n美丽果实神圣而安然”\r\n\r\n“河畔秋风四起　女人披挂月亮银色的藤叶\r\n\r\n男人的弓箭也长成植物\r\n\r\n家园　为我们珍藏着诗歌　和用来劳动的斧头”\r\n\r\n“如泉没有水，时期不能投进冰河，木器不能潮湿做梦”\r\n\r\n“当我从海底向你们注视——\r\n\r\n事物、天空的儿女\r\n\r\n聚拢在家中　如尸体”\r\n\r\n“茫然地注视河川\r\n\r\n和我们自身的流逝\r\n\r\n王子，你徒增烦恼”\r\n\r\n故乡和家园是我们唯一的病　不治之症啊\r\n\r\n我们应乘坐一切酒精之马情欲之马一切闪电\r\n\r\n离开这片果园\r\n\r\n这条河流这座房舍这本诗集\r\n\r\n快快离开故乡跑得越远越好！\r\n\r\n（野花和石核下沉河谷）\r\n\r\n快快登上路程　任凭风儿把你们吹向四百八方\r\n\r\n最后一枝花朵你快快凋零\r\n\r\n反正我们已不可救药\r\n\r\n“回返的道路水波粼粼\r\n\r\n有一次大地泪水蒙蒙”\r\n\r\n大地酒馆中酒徒捧在手心\r\n\r\n漠视酒馆中打碎的其它器皿\r\n\r\n这才是我打碎一切的真情\r\n\r\n＊　　＊　　＊\r\n\r\n辽远的　残缺的生活中的酒啊\r\n\r\n请为我们倾倒\r\n\r\n秋天　千杯万盏\r\n\r\n无休无止的悲哀的秋夭的酒啊　请为我们倾倒！\r\n\r\n痛苦　放荡和家园你这三位姐妹\r\n\r\n乘坐酒的车子　酒的马\r\n\r\n坐在红色庄稼上\r\n\r\n酒　人类的皇后　雨的母亲　四季的情人\r\n\r\n我在观星的夜晚在村落布满泪珠\r\n\r\n猪鹿人的酒分布于草原之湖\r\n\r\n水上的\r\n\r\n一对孩子、吐出果核\r\n\r\n双腿在苹果林中坐成夫妻\r\n\r\n酒的刀\r\n\r\n酒的刃\r\n\r\n刃刀的刀刃\r\n\r\n酒的刀\r\n\r\n酒的芒刺\r\n\r\n果实　泉水　皇帝\r\n\r\n果实　牵着你的手大地摇晃\r\n\r\n麦穗的纹路　在你脊背上延伸　如刀刃　如火光\r\n\r\n大地在深处　放射光芒\r\n\r\n在靠近村庄的地方一棵果树爆炸\r\n\r\n我就是火光四起的果园\r\n\r\n麦地无边无际　从故乡涌向远方\r\n\r\n麦秆　麦秸　完整的麦地与远方　无边无际涌来\r\n\r\n让酒徒坐在麦地中独自把杯盏歌唱\r\n\r\n在花蕊的狮子和处女中\r\n\r\n雪中果实沉落\r\n\r\n＊　　＊　　＊\r\n\r\n歌队长：一座酒馆　傍着山崖在夕阳下燃烧\r\n\r\n是在寂寞的燃烧的一座酒馆\r\n\r\n坐满圣人和妓女\r\n\r\n你们是我的亲人\r\n\r\n在夕阳下的家园借酒浇愁\r\n\r\n众使徒：愤怒和游戏的酒啊！\r\n\r\n老师　你已如痴如醉\r\n\r\n恼怒和游戏的酒啊！\r\n\r\n歌队长：洪水退去　战祸纷止\r\n\r\n一个兵重返故里\r\n\r\n一个幸存的农民\r\n\r\n领着残剩的孩子\r\n\r\n“老板　容我在这家酒馆暂且安身”\r\n\r\n众使徒：这最后的屋顶摇晃\r\n\r\n只剩下内心的谷仓\r\n\r\n内心向着内心的谷仓，酒！\r\n\r\n歌队长：母亲和水病了\r\n\r\n我们对坐\r\n\r\n（我和从我身上\r\n\r\n脱下的公牛）\r\n\r\n在酒馆里对坐\r\n\r\n众使徒：如痴如醉的地方\r\n\r\n溢出的多余部分\r\n\r\n使两岸麦子丰收\r\n\r\n歌队长：公牛在我身上\r\n\r\n仿佛在故乡，踏上旧日道咯\r\n\r\n因而少言寡语\r\n\r\n公牛在我身上\r\n\r\n见一面，短一日，公牛病了\r\n\r\n我开始惧怕\r\n\r\n（人是大自然失败的产物）\r\n\r\n雨打风吹\r\n\r\n我最后的屋顶摇晃\r\n\r\n我灵魂的屋顶摇晃\r\n\r\n灯不安　守住自己的公牛\r\n\r\n我在酒馆里继续公牛的沉重和罪\r\n\r\n众使徒：在饮酒的时候\r\n\r\n我们对坐——\r\n\r\n心与树林中公牛倾听的耳朵\r\n\r\n歌队长：星辰上那些兽主们举刀侵入土地\r\n\r\n一两样野兽的头\r\n\r\n在果实的血汁中沉浮\r\n\r\n果木树林中高昂头颅嘶叫的野兽们\r\n\r\n大火　光　在火之中心　在花蕊的狮子和处女\r\n\r\n在酒中沉溺　呼叫诗人的名字\r\n\r\n百合花一样歌唱的野兽啊！\r\n\r\n听风缓缓地吹\r\n\r\n百合花一样歌唱金雀花一样舞蹈的野兽啊！\r\n\r\n一下一下听得见土壤灌进我体内\r\n\r\n又一次投入大地秘密的殉葬\r\n\r\n我的肉中之肉！殉葬\r\n\r\n大地短暂而转动\r\n\r\n众使徒：酒中的豹子　酒中的羊群\r\n\r\n面你而坐\r\n\r\n太阳在波浪上　驱赶着人群　果子传递\r\n\r\n歌队长：一只老野兽给我口诀：星宿韶美\r\n\r\n返回洞穴的雨水\r\n\r\n酒！太阳的舌头平放在群鸟与清水之上\r\n\r\n酒！飞禽的语言和吹向人类的和暖的风\r\n\r\n退向忧愁的河流\r\n\r\n斯河两岸有一只被野花熏醉的嘴唇\r\n\r\n和一只笨拙的酒杯\r\n\r\n一只孤独的瓮\r\n\r\n平原一只瓮\r\n\r\n一只瓮　粮食上的意外　故事和果实装饰你\r\n\r\n一只瓮：沉思的狂喜　掠夺的狂喜\r\n\r\n“酒　千杯万盏　血中之血”\r\n\r\n众使徒：果子传递\r\n\r\n手　长满一地\r\n\r\n花朵长满一地\r\n\r\n酒杯长满一地\r\n\r\n第十一章 土地的处境与宿命\r\n\r\n（11月。秋冬之交。）\r\n\r\n第十一章 土地的处境与宿命\r\n\r\n婆罗门女儿\r\n\r\n嫁与梵志子\r\n\r\n生了一个儿子\r\n\r\n又怀了孕\r\n\r\n丈夫送她回娘家生产\r\n\r\n带着大儿子一同上路\r\n\r\n夜幕徐临树林子\r\n\r\n丈失熟睡在土地\r\n\r\n夜枭声声\r\n\r\n她生产疼痛\r\n\r\n血腥引来蛇鳞\r\n\r\n咬了丈夫\r\n\r\n天亮她起身\r\n\r\n痛不欲生\r\n\r\n抱着一个　牵着一个\r\n\r\n一步步走向娘家人\r\n\r\n一条河\r\n\r\n断道路\r\n\r\n一条河上\r\n\r\n无桥也无人\r\n\r\n“娘先将弟抱过河”\r\n\r\n把婴儿放在绿草丛\r\n\r\n等她返身向着大儿子\r\n\r\n大儿子不小心滚入河水中\r\n\r\n河水之中\r\n\r\n娘呆立\r\n\r\n急流卷走\r\n\r\n他儿童的声音\r\n\r\n才又想起小婴儿\r\n\r\n连滚带爬回草中\r\n\r\n只剩血和骨\r\n\r\n已喂饱狼儿碧绿的眼睛\r\n\r\n夫亡子殇的女人\r\n\r\n一步步走向娘家人\r\n\r\n“你娘家不幸失火\r\n\r\n全家人葬身火中”\r\n\r\n她横身倒地\r\n\r\n风将她吹醒\r\n\r\n报丧的老人\r\n\r\n将她带回家中\r\n\r\n嫁给了一位酒鬼\r\n\r\n不久又临盆\r\n\r\n产子未毕\r\n\r\n醉丈夫狂呼开门\r\n\r\n她卧床难起\r\n\r\n生产的疼痛\r\n\r\n醉丈夫破门而入\r\n\r\n打得她鼻青脸肿\r\n\r\n凶残的手\r\n\r\n撕碎婴儿\r\n\r\n还以死相逼女人\r\n\r\n吃下自己爱婴\r\n\r\n夜深人静\r\n\r\n她奔出大门\r\n\r\n月亮照着\r\n\r\n这女人\r\n\r\n一路乞讨到\r\n\r\n波罗奈河滨\r\n\r\n一座大坟旁\r\n\r\n她安身\r\n\r\n遇见一位丧妻\r\n\r\n哭祭的富人\r\n\r\n怜倩生爱意\r\n\r\n又结为夫妻\r\n\r\n日升月落不长久\r\n\r\n新丈夫又染病\r\n\r\n暴死在\r\n\r\n女人怀中\r\n\r\n因为波罗奈风俗\r\n\r\n她被活埋坟中\r\n\r\n同时还埋下不少\r\n\r\n值钱的末西\r\n\r\n一群盗匪\r\n\r\n夜来掘墓盗金\r\n\r\n透入空气\r\n\r\n她又捡回性命\r\n\r\n盗匪头子将她\r\n\r\n拖回自己家中\r\n\r\n强逼为妻不久\r\n\r\n文夫砍头处死\r\n\r\n又把她和尸体\r\n\r\n一起埋入坟中\r\n\r\n三天后野狼\r\n\r\n爪子刨开墓\r\n\r\n吃尽了\r\n\r\n死尸\r\n\r\n她爬出墓穴\r\n\r\n站立\r\n\r\n这女人就是\r\n\r\n大地的处境\r\n\r\n第十二章 众神的黄昏\r\n\r\n（12月。冬。）\r\n\r\n第十二章 众神的黄昏\r\n\r\n一盏真理的灯\r\n\r\n照亮四季循环中古老的悔恨\r\n\r\n灯中囚禁的奴隶　米开朗琪罗\r\n\r\n在你的宫殿镌刻我模糊的诗歌\r\n\r\n割下我的头颅放在他的洞窟\r\n\r\n为了照亮壁画和暗淡的四季景色\r\n\r\n一盏真理的灯\r\n\r\n我从原始存在中涌起，涌现\r\n\r\n我感到我自己又在收缩　广阔的土地收缩为火\r\n\r\n给众神奠定了居住地\r\n\r\n我从原始的王中涌起　涌现\r\n\r\n在幻象和流放中创造了伟大的诗歌\r\n\r\n我回忆了原始力量的焦虑　和解　对话\r\n\r\n对我们的命令　指责和期望\r\n\r\n我技原始原素所持有\r\n\r\n他对我的囚禁、瓦解　他的阴郁\r\n\r\n羊群　干草车　马　秋天\r\n\r\n都在他的囚车上颠簸\r\n\r\n现代人　一只焦黄黄的老虎\r\n\r\n我们已丧失了土地\r\n\r\n替代土地的　是一种短暂而抽搐的欲望\r\n\r\n肤浅的积木　玩具般的欲望\r\n\r\n白雪不停地落进酒中\r\n\r\n像我不停地回到真理\r\n\r\n回到原始力量和王座\r\n\r\n我像一个诗歌皇帝　披挂着饥饿\r\n\r\n披挂着上帝的羊毛\r\n\r\n如魂中之魂　手执火把\r\n\r\n照亮那些洞穴中自行摔打的血红鼓面\r\n\r\n一盏真理的诗中之灯\r\n\r\n王　为神秘的孕育而徘徊雪中\r\n\r\n因为饥饿而享受过四季的馈赠\r\n\r\n那就是言语\r\n\r\n言语\r\n\r\n“壮丽的豹子\r\n\r\n灵感之龙\r\n\r\n闪现之龙　设想和形象之龙　全身全身燃烧\r\n\r\n芳香的巨大老虎　照亮整个海滩\r\n\r\n这灰烬中合上双睛的闪闪发亮的马与火种\r\n\r\n狮子的脚　羔羊的角\r\n\r\n在莽荒而饥饿的山上\r\n\r\n一万匹的象死在森林”\r\n\r\n那就是言语　抬起你们的头颅一起看向黄昏\r\n\r\n众神的黄昏　杀戳中　最后的寂静\r\n\r\n马的苦难和喊叫\r\n\r\n构成母亲和我的四只耳朵　倾听内心的风暴和诗\r\n\r\n季节循环中古老的悔恨\r\n\r\n狮子　豹　马　羔羊和骆驼\r\n\r\n公牛和焦黄的老虎　还有岩石和玫瑰\r\n\r\n这是一种复合的灵魂\r\n\r\n一种神秘而神圣的火　秘密的火　焦虑的火\r\n\r\n在苦难的土中生存、生殖并挽救自己\r\n\r\n季节是生存与生殖的节奏\r\n\r\n季节即是他们争斗的诗\r\n\r\n（众神的黄昏中土与火　他二人在我内心绞杀）\r\n\r\n太阳中盲目的荷马\r\n\r\n土地中盲目的荷马\r\n\r\n他二人在我内心绞杀\r\n\r\n争夺王位与诗歌\r\n\r\n须弥山巅　巨兽仰天长号\r\n\r\n手持牛羊壮美　手持光芒星宿\r\n\r\n太阳一巨大后嗣　仰天长号\r\n\r\n土……这复合的灵魂在海面上涌起\r\n\r\n毙命的马匹　在海中燃烧\r\n\r\n八月将要埋葬你，大地\r\n\r\n用一把歌唱的琴　一把歌唱的斧头\r\n\r\n黄昏落日内部荷马的声音\r\n\r\n在众神的黄昏　他大概也已梦见了我\r\n\r\n盲目的荷马　你是否仍然在呼唤着我\r\n\r\n呼唤着一篇诗歌　歇颂并葬送土地\r\n\r\n呼唤着一只盛满诗歌的敏锐的角\r\n\r\n我总是拖带着具体的　黑暗的内脏飞行\r\n\r\n我总是拖带着晦涩的　无法表白无以言说的元素飞行\r\n\r\n直到这些伟大的材料成为诗歌\r\n\r\n直到这些诗歌成为我的光荣或罪行\r\n\r\n我总是拖带着我的儿女和果实\r\n\r\n他们又软弱又恐惧\r\n\r\n这敏锐的的诗歌　这敏锐的内脏和蛹\r\n\r\n我必须用宽厚而阴暗的内心将他们覆盖\r\n\r\n天空牵着我流血的鼻子一直向上\r\n\r\n大阳的巨大后代生出土地\r\n\r\n在到达光明朗照的境界后　我的洞窟和土地\r\n\r\n填满的仍旧是我自己一如既往的阴暗和本能\r\n\r\n我那暴力的循环的诗　秘密的诗　阴暗的元素\r\n\r\n我体内的巨兽　我的锁链\r\n\r\n土地对于我是一种束缚\r\n\r\n也是阴郁的狂喜　秘密的暴力和暴行\r\n\r\n我的诗　追随敦煌　大地的艺术\r\n\r\n我的诗　在众神纠纷的酒馆\r\n\r\n在彩色野兽的果园　洞窟填满恐惧与怜悯\r\n\r\n我的诗，有原始的黑夜生长其中\r\n\r\n腹部或本能的蜜蜂\r\n\r\n破窑或库房中　马飞出马\r\n\r\n母牛或五谷中\r\n\r\n腐败的丰收之手\r\n\r\n那腹部　和平的麦根　庄严的麦根\r\n\r\n在丛林中央嚎叫不懈的黄色麦根\r\n\r\n在花园里　那腹部　容忍了群马骚动\r\n\r\n我的手坐在头颅下大叫大嚷“你会成功吗？”\r\n\r\n我一根根尖锐的骨骼做成笛子或弓箭，包裹着\r\n\r\n女人，我的母亲和女儿，我的妻子\r\n\r\n肉体暂且存在，他们飞翔已久\r\n\r\n他们在陌生的危险的生存之河上飞翔了很久\r\n\r\n而今他们面临覆灭的宿命\r\n\r\n是一个神圣而寂寞的春天\r\n\r\n天空上舞着羊毛般卷曲　洁白的云\r\n\r\n田野上鹅一样　成熟的油菜\r\n\r\n在这个春天你为何回忆起人类\r\n\r\n你为何突然想起了人类　神圣而孤单的一生\r\n\r\n想起了人类你宝座发热\r\n\r\n想起了人类你眼含孤独的泪水\r\n\r\n那来到冥河的掌灯人就是我的嘴唇\r\n\r\n穿过罪人的行列她要吐露诗歌\r\n\r\n诗歌是取走我尸骨的鸟群\r\n\r\n诗歌\r\n\r\n诗，像母马的手，沿着乳房，磨平石子\r\n\r\n诗像死去的骨骼手持烛火光明\r\n\r\n诗　是母马　胎儿和胃\r\n\r\n活在土地上\r\n\r\n果真这样？母亲沉睡而嗜杀\r\n\r\n（坐在水中的墓地进行这场狩猎\r\n\r\n在那人怀沙的第一条大江\r\n\r\n披水的她们从绿发之马下钻出\r\n\r\n怀抱头颅\r\n\r\n怀抱穷苦的流放的头颅——\r\n\r\n这盏灯在水上亮着\r\n\r\n镌刻诗歌）\r\n\r\n我忘记了　我的小镇卡拉拉　石头的父亲\r\n\r\n我无限的道路充满暮色和水　疼痛之马朝向罗马城\r\n\r\n父亲牵着一个温驯而怒气冲冲的奴隶\r\n\r\n沿着没落的河流走来\r\n\r\n我忘记了　只有他　追随贫穷的师傅学习了一生\r\n\r\n灯中囚禁的奴隶　孤独星辰上孤独的手\r\n\r\n在你的宫殿镌刻我模糊的诗歌，想起这些\r\n\r\n石头的财富言语的财富使我至今辛酸\r\n\r\n而他又干了些什么？\r\n\r\n两耳　茫茫无声\r\n\r\n一生骑着神秘的火　奢侈的火\r\n\r\n埋下乐器，专等嘶叫的骆驼！\r\n\r\n大地的泪水汇集一处　迅即干涸\r\n\r\n他的天才也会异常短暂　似乎没有存在\r\n\r\n这一点点可怜的命运和血是谁赋予？\r\n\r\n似乎实体在前进时手里拿着的是他的斧子\r\n\r\n我假装挣扎　其实要带回暴力和斧子\r\n\r\n投入你的怀抱\r\n\r\n“无以言说的灵魂　我们为何分手河岸\r\n\r\n我们为何把最后一个黄昏匆匆断送　我们为何\r\n\r\n匆匆同归太阳悲惨的燃烧　同归大地的灰烬\r\n\r\n我们阴郁而明亮的斧刃上站着你　土地的荷马”\r\n\r\n一把歌唱的斧子　荷马啊\r\n\r\n黄昏不会从你开始　也不会到我结束\r\n\r\n半是希望半是恐俱　面临覆灭的大地众神请注目\r\n\r\n荷马在前　在他后面我也盲目　紧跟着那盲目的荷马\r\n\r\n1986.8-1987.8"},{"id":"short/1983/妻子和鱼","title":"妻子和鱼","type":"short","year":"1983","body":"我怀抱妻子\n就象水儿抱鱼\n我一边伸出手去\n试着摸到小雨水，并且嘴唇开花\n而鱼是哑女人\n睡在河水下面\n常常在做梦中\n独自一人死去\n我看不见的水\n痛苦新鲜的水\n淹过手掌和鱼\n流入我的嘴唇\n水将合拢\n爱我的妻子\n小雨后失踪\n水将合拢\n没有人明白她水上\n是妻子水下是鱼\n或者水上是鱼\n水下是妻子\n离开妻子我\n自己是一只\n装满淡水的口袋\n在陆地上行走"},{"id":"short/1985/早祷与枭","title":"早祷与枭","type":"short","year":"1985","body":"1.\n早祷时刻\n请你接住我，枭\n用胸脯接住我\n你要忍痛带走我\n我是赠给你的爱情\n我是赠给你的子弹\n2.\n钟声，钟声响了\n眼睛全部打开\n我变成一只船\n死在沙漠的枭\n其实也足以死在\n二十丈桅杆上\n一匹意外的骆驼带水而来\n3.\n哭声从船的那一头传到\n这一头\n装满了新娘\n她们搓手而坐\n焦黄的脸\n留下居住的只有瞳仁\n放光的瞳仁\n河岸上\n几个小偷走过来\n几个小偷是树\n月亮被枭泪洗过又洗\n4.\n岁月吹落了四季之帽\n一一埋下\n淡色的花朵盛开\n只为小痛小苦\n在土地上\n傻张着嘴\n他不言又不语\n枭，枭又不能怎样？\n“呀，谁愿意与我\n一前一后走过沼泽\n派一个人先死\n另一位完成埋葬的义务”\n5.\n在这个时刻\n永远分别是唯一的理由\n6.\n死后\n风抬起你\n火速前进\n十指\n在风中\n张开如枭住的小巢\n死后\n几只枭\n分吃了你\n小南风细细如笛地吹在下午\n所有的小蜻蜓\n都找不到你的坟墓\n7.\n太阳太远了\n否则我要埋在那里\n8.\n早祷，早祷三遍\n黎明是一条亮丽之虹\n吃下了无数灯\n他变得更加明亮\n他一头三尾\n沉落在四方\n沉落在你的肩膀上\n你揉揉眼睛\n一只小枭\n爬出窗户\n获得天空\n9.\n早祷，早祷四遍\n要想着爱情的黄昏、黄昏\n牧羊人的绝壁上\n太阳\n一葬就是千里\n枭，飞过来，飞过来\n这时辰已属于你\n结巢，结缘\n已黑的天空坐满了头顶\n多少次\n人间的寻找\n其实是防止丢失\n10.\n杂乱之翅尚未长成\n也好\n我苦坐苦等\n我的身体是一家院子\n你进入时不必声张\n11.\n早祷时刻\n七个未婚的老头\n躺在床上\n眉毛挂霜地\n梦到了枭\n---\n● 1985.4"},{"id":"short/1987/四行诗","title":"四行诗","type":"short","year":"1987","body":"1.思　念\n像此刻的风\n骤然吹起\n我要抱着你\n坐在酒杯中\n2.星\n草原上的一滴泪\n汇集了所有的愤怒和屈辱\n泪水，走遍一切泪水\n仍旧只是一滴\n3.哭　泣\n天鹅像我黑色的头发在湖水中燃烧\n我要把你接进我的家乡\n有两位天使放声悲歌\n痛苦地拥抱在家乡屋顶上\n4.大　雁\n绿蒙蒙的草原上\n一个美好少女\n在月光照耀的地方\n说　好好活吧，亲爱的人\n5.　\n当强盗留下遗言后\n夜深独坐，把地牢当作果园\n月亮吹着一匹强盗的马\n流淌着泪水\n6.海　伦\n盲诗人荷马\n梦着　得到女儿\n看得见她　捧着杯子\n用我们的双眼站在他面前\n——————————\n　作者未列小标题"},{"id":"short/1988/西藏","title":"西藏","type":"short","year":"1988","body":"西藏，一块孤独的石头坐满整个天空\n没有任何夜晚能使我沉睡\n没有任何黎明能使我醒来\n一块孤独的石头坐满整个天空\n他说：在这一千年里我只热爱我自己\n一块孤独的石头坐满整个天空\n没有任何泪水使我变成花朵\n没有任何国王使我变成王座\n---\n● 1988.8"},{"id":"short/1989/遥远的路程_1","title":"遥远的路程","type":"short","year":"1989","body":"雨水中出现了平原上的麦子\n这些雨水中的景色有些陌生\n天已黑了，下着雨\n我坐在水上给你写信\n---\n● 1989.1.22"},{"id":"sun/太阳大札撒残稿","title":"太阳·大札撒（残稿）","type":"sun","year":"1986","body":"（抒情诗）　\n1\n八月的日子就要来到\n我的镰刀斜插在腰上\n我抱起了庄稼的尸体\n许多闪光的乳头在稻草杆上\n我让乳房竖起在我嘴上\n乳房在山上飞过，割倒了庄稼\n山顶洞中只有酒、粮食与阴部\n用火烤着一只雄壮的公兽\n用酒调着火所能留下的灰\n写下几首诗　谷子谷子\n谷子疯狂地长到腰部\n伤口和香气从腰部散出\n她们用头发悄悄收割\n五谷杂粮在乳房囤积\n回过头去那是一个原始人遮住了山顶\n洞穴中一千个妇女遮住了山顶\n2\n女人躲在月亮形斧头上\n血红色的斧头\n一只母狮\n一只肉　养育家乡\n阴森森的肉\n身穿山洞，照亮山洞\n身穿月亮，身穿白色酒杯\n使太阳倾斜　大海骚动\n你这来自何方的阴暗的\n神的女人？\n土地向上涌　各种阴暗的生长\n用火照亮\n黄金走出山顶洞\n白骨变成人\n化成浓烈的血　一声闷叫\n婴儿　你烧焦　红灼\n卷曲的血红色平面\n3\n只剩下披头散发的我\n抱住山脚，痛哭一晚\n明天要去什么地方？\n只好回家乡打铁，娶下麻脸老婆\n或者在山上打家劫舍\n杀人放火，无恶不做\n我披着羊皮飞回水围的山上\n和一群染得漆黑的野兽一块在山上滚动\n鲜艳的鳞甲来自四方黑暗的水洼和爪牙\n我披着一条荒芜的道路\n回到腐败的平原\n只有大河静静流过\n　　流过平原\n是我唯一的安慰\n4\n农舍，多么温暖多么多么温暖\n小而肮脏的房子，我栖身的内脏\n火把节的皇后在铺满柴禾的厨房里呕吐\n一盏最后的油灯，把自己的头颅\n变成了一张不会说话的嘴和弓箭\n黄金的稻草上随处可以做爱\n将会使她怀孕。这不是俘虏营\n一只羊咬着另一只母羊的尾巴\n一个接一个从她的腹腔走出产门\n这些绵羊绿色的胃，活在石器中\n从部落、部落、部落一直到人民公社\n多么温暖多么多么温暖的农舍\n5\n夜黑漆漆。有水的村子\n鸟叫不定、浅沙下荸荠\n那果实在地下长大像哑子叫门\n鱼群悄梢潜行如同在一个做梦少女怀中\n那时刻有位母亲昙花一现\n鸟叫不定，仿佛村子如一颗小鸟的嘴唇\n鸟叫不定小鸟没有嘴唇\n你是夜晚的一部分　谁都是黑夜的母亲\n那夜晚在门前长大像哑子叫门\n6\n七月里我是一头驴，在村庄的外围\n七月里我比他们家里的人还要愚蠢\n七月里我突然发现自己是食草的野兽\n迁移到人类的门前，拉下的粪便\n投入火中。七月里我是头疼的驴\n驮着一口袋杀人的刀子走进山里\n没人打开山门，是我自已闯进\n一口袋杀人的刀子全遗失路上\n七月里我是头痛的驴咀嚼绳索\n被人像新娘一样蒙上了双眼\n看不清眼前的事物，只剩下天堂\n那深不见底的天空被石头围在中央\n天空自己也是石头，长着一颗毛驴的心脏\n7\n我是一夜的病马\n饮水中的盐和血\n食盐的母马影子\n早上流血不止\n鸟儿的鸣叫：\n母马受伤又好了\n手牵生病的母马\n走在我身体之前\n名为月亮的身体\n伤口愈合又红肿\n隐隐含泪的母马\n她也是孤独的\n8\n一只白鸟飞越我的头顶去而不还\n两只乳房温暖过我也温暖着别人\n我大醉于肮脏镇子的十字路口\n醒来后发现自已连连砍死三人\n第一人是我们时代伟大的皇帝\n他的身体已喂肥了几亩青草地\n他的头颅悬挂在山顶上，像破碎的灯\n第二人是我情同手足的兄弟\n他写过漂泊的谣曲，死于贫困和疾病\n他和我一起享受过苦难和爱情\n但没有分担我的光荣和恐怖\n第三人是那位世上唯一的公主\n为了她我把自己那一只粗笨的头颅\n搬到了城市的铁砧……\n9\n北方是我们的屋顶\n下面是受伤的猎户和母马\n这个季节的黄昏最为漫长\n蜡烛像是酒精长出的白耳朵\n10\n你是一个和平的人\n你是一个善良的人\n你今夜住在一个黑店里\n那个玩着刀子的店主人\n就是我，手里还提着灯\n那盏灯照见过昔日的暴力　今夜的血腥\n兵器相交　杀气腾腾\n这殿堂里也仍有些鬼魂出没\n有些是皇帝，有些是兄弟\n书像一包蜡烛和刀子捆在一起\n可这一千年都是黑夜\n在兵器中你如何安身？\n今夜你歇息在我的黑店\n享受我黑暗而肮脏的酒\n你把你的马拴好，明日你和店主一同登程\n我收拾好行李，让刀疤止住血\n把刽子手们捆成一件兵器\n我们一同登程\n那时风和日丽高原万里无云\n11\n两个北方戴上的是同一个头颅\n火光纠缠着那个停止生长的地方\n老虎抱着琴，在山下哭\n哭一个被老虎咬死\n或打死了老虎的人\n就这样，北方如一个野兽抱琴\n大风之琴始终在山下哭\n他不知在哭谁：反正死了一个\n是我还是他老虎并不在意\n北方——为了一条死去或胜利的性命\n老虎抱着琴，在山下哭\n山上狂风怒号\n那是粗糙的北方\n一切的故事都已讲完\n12\n在原始的道路上禁绝欲望\n在原始的秋天的道路上\n陪伴那些成熟的诗人，一同被绑住法场\n欲望的老神擎火而来\n一根又一根排列在你身上\n可以为大火烧光的女人\n狮子和少女坐在山头上，照亮山顶洞\n使我突然想丧失一切\n母牛和五谷也会听从人类\n熄灭烛光，姿态美丽地来到集市\n绿色狮子陪伴她们嫁给汉人\n处女也会听从人类的父母\n身旁的姐妹痛哭失声\n我骑在水上，对抗着母亲的孕育\n13\n原始的妈妈\n躲避一位农民\n把他的柴刀丢在地里\n把自已的婴儿溺死井中\n田地任其荒芜\n灯下我恍惚遇见这个灵魂\n跳上海水她要踏浪而去\n大海在粮仓上汹涌\n似乎我雪白的头发在燃烧\n14\n老乡们，谁能在海上见到你们真是幸福\n一伙叛徒坐在同一只船舱\n远处的山洞大火熊熊，已经烧光\n我们会把幸福当成祖传的职业\n放下手中痛哭的诗篇\n今天的白浪真大　老乡们\n它高过你们的粮仓\n如果我中止诉说，把我自己的故乡抛在一边\n我连自己都放弃，更不会\n回到秋收　农民的家中温暖而贫困\n在七月我总能突然回到荒凉\n赶上最后一次\n我戴上麦秸，安静地死亡\n这一次不是葬在山头故乡的乱坟岗\n15\n一个岛屿取走了一颗英雄的脑袋\n一面镜子、一条河流和一个美人\n又取走另一颗英雄的脑袋\n谁来取走我的头颅？\n我从一本肮脏的书中跳起来杀人\n放火城廓。雨夜的酒馆多像一处牲口棚\n在寒冷的高原上，肮脏但是温暖\n我独自一人，呆在山上\n两个山头　两个皇帝　发动同一场革命\n他只有牙齿和爪子，抓到一切都是牺牲\n我是一只受伤而失败的从太阳上飞下的兽\n捧着火，用他们亲人的血\n我用粗糙的岩石也擦不尽爪子\n戈壁横在我心中，像一次抢劫扔下的武器\n16\n我不是你们的皇帝又是谁的皇帝\n火　或被残暴的豹子双爪捧上山\n献给男一个比豹子更孤独的皇帝\n17\n天空大亮　石头自己堆起\n四个城门\n一个皇帝满朝文武\n我在何方？我为何\n不在这里　不在此时此地\n火　点在岩穴的开口\n那里面昏暗而潮湿\n在给我那位难友摘脚镣时\n我站在一旁等着，然后我走到铁砧跟前\n铁匠们让我转过身去，背向着他们\n他们从后面抬起我的脚放在铁砧上\n他们忙乱了阵，都想\n把这件活干得更灵巧更出色\n铁镣掉在地上\n我把它拣起来，擎在手里\n最后看了它一眼，想起来多么奇怪\n它刚才还戴在我脚上\n18\n我丢失了一切\n面前只有大海\n我是在我自己的故乡\n在我自己的远方\n我在海底——\n走过世界上最高的地方\n天空向我滚来\n高原悬在天空\n你是谁？\n饥俄\n怀孕\n把无尽的滚过天空的头颅\n放回子宫和山洞\n头颅和他的姐妹\n嘴唇抱住河水　在大河底部喜马拉雅\n而割下头颅的身子仍在世上\n最高的一座山\n仍在向上生长\n19\n天空无法触摸到我手中这张肮脏的纸\n它写满了文字\n它歌颂大草原\n被扔在大草原\n被风吹来吹去\n仍然充满了香气\n这就是山顶洞中，一顶遗民的草帽\n和兽骨上文字的香气\n当语言死亡，说话的人全部死去\n河流的绿色头发飘荡\n荒野无尽的孕育使我惊慌\n人类，你这充满香气的肮脏的纸\n天空无法触摸到我手中这张肮脏的纸\n这就是我的胜利\n---\n　选自海子未完成的长诗《大札撒》。《大札撒》原为成吉思汗所制定的一部法典。海子《大札撒》的这一部分诗原题《山顶洞人写下的抒情诗》。因诗的内容可以独立成篇，故取出冠以《抒情诗》之名。海子原稿各诗的编号有混乱之处，今唯按其原稿先后次序一概重新编号，只对个别诗篇做了次序的调整。"},{"id":"short/1983/幸福","title":"幸福","type":"short","year":"1983","body":"（或我的女儿叫波兰）\n当我俩同在草原晒黑\n是否饮下这最初的幸福　最初的吻\n当云朵清楚极了\n听得见你我嘴唇\n这两朵神秘火焰\n这是我母亲给我的嘴唇\n这是你母亲给你的嘴唇\n我们合着眼睛共同啜饮\n像万里洁白的羊群共同啜饮\n当我睁开双眼\n你头发散乱\n乳房像黎明的两只月亮\n在有太阳的弯曲的木头上\n晾干你美如黑夜的头发\n---\n● 1986（？）\n——————————\n 海子喜欢“波兰”一词，“女儿叫波兰”并无特别所指"},{"id":"short/1985/明天醒来我会在哪一只鞋子里","title":"明天醒来我会在哪一只鞋子里","type":"short","year":"1985","body":"我想我已经够小心翼翼的\n我的脚趾正好十个\n我的手指正好十个\n我生下来时哭几声\n我死去时别人又哭\n我不声不响地\n带来自己这个包袱\n尽管我不喜爱自己\n但我还是悄悄打开\n我在黄昏时坐在地球上\n我这样说并不表明晚上\n我就不在地球上　早上同样\n地球在你屁股下\n结结实实\n老不死的地球你好\n或者我干脆就是树枝\n我以前睡在黑暗的壳里\n我的脑袋就是我的边疆\n就是一颗梨\n在我成形之前\n我是知冷知热的白花\n或者我的脑袋是一只猫\n安放在肩膀上\n造我的女主人荷月远去\n成群的阳光照着大猫小猫\n我的呼吸\n一直在证明\n树叶飘飘\n我不能放弃幸福\n或相反\n我以痛苦为生\n埋葬半截\n来到村口或山上\n我盯住人们死看：\n呀，生硬的黄土，人丁兴旺\n---\n● 1985.6.6"},{"id":"short/1987/土地忧郁死亡","title":"土地·忧郁·死亡","type":"short","year":"1987","body":"黄昏，我流着血污的脉管不能使大羊生殖。\n黎明，我仿佛从子宫中升起，如剥皮的兔子摆上早餐。\n夜晚，我从星辰上坠落，使墓地的群马阉割或受孕。\n白天，我在河上漂浮的棺材竟拼凑成目前的桥梁或婚娶之船。\n我的白骨累累是水面上人类残剩的屋顶。\n燕子和猴子坐在我荒野的肚子上饮食男女。\n我的心脏中楚国王廷面对北方难民默默无言。\n全世界人民如今在战争之前粮草齐备。\n最后的晚餐那食物径直通过了我们的少女\n她们的伤口　她们颅骨中的缝\n最的的晚餐端到我们的面前\n一道筵席，受孕于人群：我们自己。\n---\n● 1987.8"},{"id":"short/1988/跳伞塔","title":"跳伞塔","type":"short","year":"1988","body":"我在一个北方的寂寞的上午\n一个北方的上午\n思念着一个人\n我是一些诗歌草稿\n你是一首诗\n我想抱着满山火红的杜鹃花\n走入静静的跳伞塔\n我清楚地意识到\n前面就是一条大河\n和一个广大的北方平原\n美丽总是使我沉醉\n已经有人\n开始照耀我\n在那偏僻拥挤的小月台上\n你像星星照耀我的路程\n在这座山上\n为什么我只看见这么一棵\n美丽的杜鹃？\n我只看见过这么一棵\n果然火红而美丽\n我在这个夜晚\n我住在山腰\n房子里\n我的面前充满了泉水\n或溪涧之水的声音\n静静的跳伞塔\n心醉的屋子　你打开门\n让我永远在这幸福的门中\n北方　那片起伏的山峰\n远远的\n只有九棵树\n---\n● 1988.4.23"},{"id":"short/1989/面朝大海春暖花开","title":"面朝大海，春暖花开","type":"short","year":"1989","body":"从明天起，做一个幸福的人\n喂马，劈柴，周游世界\n从明天起，关心粮食和蔬菜\n我有一所房子，面朝大海，春暖花开\n从明天起，和每一个亲人通信\n告诉他们我的幸福\n那幸福的闪电告诉我的\n我将告诉每一个人\n给每一条河每一座山取一个温暖的名字\n陌生人，我也为你祝福\n愿你有一个灿烂的前程\n愿你有情人终成眷属\n愿你在尘世获得幸福\n我只愿面朝大海，春暖花开\n---\n● 1989.1.13"},{"id":"sun/太阳弑","title":"太阳·弑","type":"sun","year":"1986","body":"---\r\n\r\n+ 1988\r\n\r\n0.\r\n\r\n（三幕三十场）\r\n\r\n（非情节剧，程式和祭祀歌舞剧，为几只童谣而写，为一个皇帝和一场革命而写，为两个浪子而写）\r\n\r\n（三联剧之一）\r\n\r\n人　物\r\n\r\n巴比仑王\r\n\r\n宝剑\r\n\r\n吉卜赛\r\n\r\n青草\r\n\r\n红\r\n\r\n猛兽\r\n\r\n十二反王\r\n\r\n疯子头人\r\n\r\n女巫\r\n\r\n老女奴\r\n\r\n两只小鸟、两匹马、两车夫\r\n\r\n四位抬棺人\r\n\r\n小瞎子、稻草人、无名人\r\n\r\n魔\r\n\r\n大司祭\r\n\r\n老人和小女孩\r\n\r\n造剑师和几柄剑\r\n\r\n公主的众影子\r\n\r\n众兵器幻象\r\n\r\n众流浪儿\r\n\r\n众纵火者\r\n\r\n钦酒诗人和酒鬼\r\n\r\n众兵\r\n\r\n众回声\r\n\r\n廷臣若干\r\n\r\n收尸的农奴们\r\n\r\n（以上角色，演员可重复表演）\r\n\r\n（演员的行为动作和言语特征带有恍惚、错乱和幻象特征。不应太注重情节）\r\n\r\n（背景是太阳神庙——红色、血腥、粗糙——是大沙漠中一个废墟）\r\n\r\n（音乐用鼓、锣、钹、佛号、喇叭、鸟鸣、雷鸣和人声）\r\n\r\n（基调是红色）\r\n\r\n序　幕\r\n\r\n第一场\r\n\r\n（疯子头人，二小鸟）\r\n\r\n疯：你好，小鸟，你们今天起得格外早啊，是有什么喜事，还是有什么祸事，请告诉我，告诉我这疯子老头。从沙漠搬到这有着两条滔滔大河的国家，搬到巴比仑，这古老而没落的国家，我还没有听到一件真正有意思的事，今天你们小姐妹俩起得格外早，一定有什么话要对我说，一定有什么惊人的消息要告诉我，是不是啊，小姐妹？这几年在巴比仑的旷野上我们同甘共苦，我为你们俩捡树枝和碎小的石子，为你们垒窝，那可是一个温暖的小窝啊，你们俩从西边大沙漠中逃出来，从那个瞎子老头严酷的管教下逃出来，从那个瞎子先知那个沙窝窝的家中逃出来，第一次有了这样像样的巢，你们当时就许下了心愿，你们当时就答应我，要利用先知赋予你们姐妹俩的本领，好好报答我，要把这整个巴比仑王国的一切即将发生的大事告诉我，把大事提前告诉我，把一切吉和凶的预兆告诉我这疯子老头。我在这两条大河畔，在这荒芜的旷野上，已经生活了几千年，我曾是这两条大河畔百姓的祖先和头人，我已经十分衰老了，我衰老得忘记了自己的姓名和年月，我只知道太阳每天早上升起，又在每天黄昏落下，我只看见春天来了，南风来了，红花绿叶铺满我所在的旷野，结了果实，接着就是秋天和寒冷的冬天。我曾目睹巴比仑的多少兴衰，就像巴比伦河水的涨落，我看见多少王国的兴盛和衰亡，有游牧的骑马的王朝，有种地浇灌的农业王国，还有多少英雄多少诗人多少故事我都见过，如今我是老了，但我的心仍然渴望一次变化，渴望一次挣扎、流血和牺牲，只有流血在这没落而古老的土地上，也在我这没落而古老的老人心上才是新鲜的。告诉我吧，告诉我，亲爱的小姐妹，是不是那永远年轻的神魔又给这没落的巴比仑河带来了血腥而新鲜的风，是不是这永远年轻的神魔又来到巴比仑，披散他的长发，赤着他的双脚，行走在这没落的河水之上，是不是，又在巴比伦黑暗的午夜，圆睁着他邪恶而又新鲜的双眼。\r\n\r\n（于是，两个头戴鸟类面具的演员开始在舞台上做击剑决斗的舞蹈，仿佛向疯子头人做一种预兆。用鼓、喇叭与佛号）\r\n\r\n（一开始舞台全黑。\r\n\r\n暗中一片寂静。持续的时间较长。\r\n\r\n有一束光。打在一个舞剑者身上。\r\n\r\n一个疯狂舞剑的人做红色打扮。\r\n\r\n没有声音。五分钟或十分钟。舞台又沉入黑暗。另有一束光打在另一个舞剑者身上。一身黑色。舞台又沉入黑暗，继而两束光照着这舞台上两剑客。两柄剑移向对方。两束光变成一束大光。他们是在拼命、决斗。舞台又沉入黑暗。空中隐约传来兵器相交声。可同时从空中、从舞台，观众席背后传出。杀气腾腾然后剑声停歇。沉闷的鼓声、撕人心脏的佛号、喇叭呜咽。血红的光，照见两个倒地的人。这时候，疯子头人在舞台上再次出现。舞台背景可用滔滔的巴比仑河。）\r\n\r\n疯：大约在几千年前\r\n\r\n在几干年前的东方。\r\n\r\n有一个巴比仑王国。\r\n\r\n里面发生了这样一个故事。\r\n\r\n是关于几个年轻的诗人\r\n\r\n一个公主和一个老巴比仑王。\r\n\r\n现在就开始讲这个故事。\r\n\r\n第二场\r\n\r\n（女巫的岩石。中间有一堆火。远处空中传来海浪的声音。岩石红色。后壁上桂满了兵器。女巫坐在一辆小型战车上，身边有一纺车）\r\n\r\n（猛兽、吉卜赛、青草、女巫）\r\n\r\n猛兽：大娘，我们来了。我们要干一件惊天动地的大事。我们向你讨教来了。大娘，全巴比仑都知道你是未卜先知的巫女，是全巴比仑都引以自豪的人中神仙，我们今天来到你的岩石上，来到你的洞中，是为了请求你的指点。我们想要知道我们行动的时间，和最合适的地点。给我们一些劝告，一些线索吧，大娘。\r\n\r\n女巫：这事情必定成就在一个人身上。你们不可集体行动。你们必须分开。你们必须一个人一个地干。这样才会有希望。这人他还没有来到你们中间。如果很多年前的另一件事已经发生，如果该降生的婴儿己经降生，如果有一个人回到了自己的租国。这事惰必定成就，我手中的纺车、纺轮和纺线，这一纺锤，以及这一魔法都告诉我，这次你们所要询问的事，必定成功。这次是关于巴比仑王的生死。既然你们找到了我，我一定说出一切真实。我曾经多年生话在沙漠深处。在一万里沙漠中守着一口井、几面破锅、一堆火、几株棕榈。当然不是这海边的棕桐。我当时宁愿孤独。直到最近，我才从西部大沙漠移居到这东方大河的河畔、东方之海的海岸，在这个幽静的海湾中，在这个幽静的海水浸润的岩洞，我是有所为而来的，我不是白白从西方移到东方，从沙漠移往海岸——我知道东方大巴比仑\r\n\r\n即将发生变故。\r\n\r\n我的纺车在拼命地转。事情在成就\r\n\r\n囚禁在东方最深的牢狱里\r\n\r\n你们是我的孩子也是她的孩子\r\n\r\n我原意向你们讲述我的魔法所看到的\r\n\r\n我的纺车我的魔法心明眼亮\r\n\r\n孩子们，诗人们\r\n\r\n我搬到海岸上这小潮湿的岩洞里\r\n\r\n就为了等候你们\r\n\r\n从今日起三兄弟已不复存在\r\n\r\n你们要分开，你们都是孤独的\r\n\r\n要珍惜自己的孤独。\r\n\r\n三人：再见，女巫。再见、大娘。\r\n\r\n第一幕\r\n\r\n第三场\r\n\r\n（疯子头人，宝剑）\r\n\r\n疯：你从哪里来？陌生的客人，你为何如此忧伤而疲倦？你身上为何有这许多远行的尘土？你那目光表明你飘洋过海，不远万里来到这个国家，这又是为了什么？\r\n\r\n剑：老人，我从一个遥远的地方来，为了寻找一个人，不，也许是两个人，也许，我还到另一个更为遥远的远方去，没有人问过我，即使问过我，也从来没有人得到过回答。\r\n\r\n疯：孩子，可你来到这条大河边，来到这个古老而没落的国家，孩子——你要知道，来的时间错了，而且你的的确确是来错了地方。躲开这个地方，躲开这个时间吧，孩子，听从一个老得不知道自已年纪的老人的劝告，也许，在别的地方，你能完全忘了这忧伤，你能克服你的痛苦，也许，在别的地方，你能找到你的亲人和你的幸福。孩子，要知道，在今天的巴比仑，无论你要寻找的是谁，无论你要寻找的是亲人或者是仇人，你找到的都是痛苦。听　　我的话吧，孩子，离开这条大河，离开这个国家，离开　　这个时间。你既然是从远方来，为什么不回到远方去呢？\r\n\r\n剑：有人告诉我，我要寻找的人很可能就在这个国家，就在这条大河边，喝着这条大河的河水，在这条大河中沐浴。我要寻找的人很可能就在巴比仑。还有人告诉我，不，是暗示过我，我就是出生在这个国家，出生在这条大河畔。我和我所要寻找的人，都曾在这条大河畔出生。我的胞衣依然埋在这条大河的河岸上，一只用这里的粘土和河水制造的陶罐装着我的胎衣，就埋在这里的河岸上，也许早已变做泥土了。找到的是痛苦还是幸福，我并不是十分关心，只要找到了我要寻找的人。\r\n\r\n疯：孩子，愿你愿望实现。\r\n\r\n宝剑 （独白）：\r\n\r\n我终于回到了我的家园，我的祖国。为了寻找我心爱的妻子——也许她已经生了吧，啊，孩子，你是儿还是女——我终于回到了我的家乡。我看到的一切和我想像的和梦中的景色完全一样。这样的大河，这样的四季，这样的长满粮食的田野，这样的房屋和人们，我都在我最美的梦中梦过。我和我的爱人，不是在这样的地方出生还能在什么地方出生呢？这眼的故乡的风啊！吹在故乡的大河上！让我忘却了这两条劳累和疲惫的腿。我觉得我肯定会在这儿找到我的妻子，还有我从未见面的孩子。\r\n\r\n第四场\r\n\r\n（青草，宝剑，吉卜赛）\r\n\r\n青草：草原还那样吧？\r\n\r\n宝剑：还那样。\r\n\r\n吉卜赛：沙漠还那样吧？\r\n\r\n宝剑：一点没变。\r\n\r\n青草：给我们说说吧。\r\n\r\n宝剑：一直是那个样子。柔和的沙丘。落日。干涸的井。开满碎小野花的草原。黄  　　的，紫红的，甚至还有不少白的，如果你采来一大抱，闻一闻，大多是朴素  　　而没有香味。（停顿了好长时间，三人回忆草原和沙漠）\r\n\r\n青草：再讲讲吧。\r\n\r\n宝剑：没有了。\r\n\r\n青草：没有了？\r\n\r\n宝剑：没有了。\r\n\r\n（又停顿了好长时间）\r\n\r\n宝剑：哦，对了，还有，还有那些变幻不定的风，推着云朵，吹在脸上的风。草原\r\n\r\n上的风，跟平原上不一样。直接的，完全的风，只有在沙漠上才有那样粗\r\n\r\n暴。\r\n\r\n青草：对，风。\r\n\r\n宝剑：自由的风。\r\n\r\n青草：（近乎呓语）自由的风。\r\n\r\n宝剑：随意飘浮的风。\r\n\r\n青草：随意飘浮的风。\r\n\r\n宝剑：任意变幻。\r\n\r\n青草：任意变幻。\r\n\r\n宝剑：空荡荡的。\r\n\r\n青草：空荡荡的。\r\n\r\n宝剑：风。\r\n\r\n青草：风。\r\n\r\n青草：（突然的）家里的人好吧？\r\n\r\n宝剑：好，一切都好。\r\n\r\n吉卜赛：妈妈呢？\r\n\r\n宝剑：还好。只是更老了。走不动远路了。你走了。青草又走了。哭了好多回。总\r\n\r\n是偷偷地哭。从来不让我们看见。\r\n\r\n（又是很长时间的沉默。三人低头）\r\n\r\n第五场\r\n\r\n（红、宝剑、众影子）\r\n\r\n（红——公主，已经疯了，打扮成一个斯拉夫或新疆的少女挤奶员，头上有一块花头巾，身上系着白围裙。朴素而美丽。又有某种悲惨的气氛）\r\n\r\n（用鼓，配合公主的说话）\r\n\r\n剑：这些日子你上哪儿去了？找得我好苦啊。\r\n\r\n红：我哪儿也没去。我呆在我女儿的家里。她前些日子刚生下我。她累了。我也累了。我们都在家里休息。我呆在我女儿家里。她生下我来，又坐在那里，不，是躺在那里慢慢长大。我不想长大，就再没有长大。我呆在我女儿的家里。\r\n\r\n剑：（旁白）真的。真想不到这竟然是真的。真想不到巴比仑百姓们传说的，大街小巷都在议论的事是真的。我该怎么办？我应该把她从这种状态下救出，还是和她一起沉入疯狂。我就是抱住她，她也不会认出我是谁，我真的快疯了。\r\n\r\n（对红）：看看我是淮，看看我是谁，看看我是谁，还认得我是谁吗？\r\n\r\n红：你是沙漠来的人。你是从大沙漠上来的人。你是从大沙漠来到巴比仑的一位先生。看你的样子，不像是商人，也不像是学生，也不像是军人。那么，你那么疲惫，那么忧伤，你也许是一个在大沙漠上牵骆驼找水的人。你找到你的水井了吗？你到巴比仑来干什么。这儿巴比仑城全是全套自动化现代化的自来水设备和管道。有洗菜的水，有饮用的水，有洗马的水，有洗婴儿的水，有灌顶的水，有淋浴的水。这些水都是从地下暗河中抽出的，已分清是雨水，还是雪水。在这儿看不见寒冷而灿烂的雪山。没有大雪封山时人类心底的暖意。没有雪在沙漠飘落的壮观景色。你到巴比仑来干什么。这儿没有一口水井。我想不起来我是在哪儿见过那些棕搁树下的美丽的井。也许是在大沙漠上。你真是从大沙漠来的吗？\r\n\r\n剑：是的。巴比仑的公主。\r\n\r\n红：我不是公主。我是公主的影子。你看（她用手向前向后向四周指引）你看她走到哪儿我就走到哪儿。她在前面走，我就在后面跟着。她在左边站着行走，我就在右边的地上躺着行走。我恨死她了。我是身不由己（舞台上沉闷的鼓声响起）。我不是公主，我是公主的影子。她走到哪儿我就跟到哪儿。我是身不由己。我是她的证人。我是她的沉睡的证人。你看见。我们影子总爱在地上躺着睡着，不管那儿是小溪，是山冈，是草坡，是挤满牛的栅栏，我们可以没有身体的睡在那儿。风，天上静静地吹过的风，从四方地上静静吹起的风，是我们淡淡的血液。是我们淡淡的绿颜色的血液。但是在秋天的时候，我们田野里影子们的血液也会变成红色或黄色。那要看那儿是一片片什么样的树林。我们是影子。我们是树林里和草坡上的影子。我们是一些酷似灵魂的影子。在主人沉睡的时候，万物的影子都出来自由地飘荡。风，把我们送到四面八方。风把我们送到我们这些影子的内心十分想往的地方。但我们不会在一个地方呆得太久。我们都有自己的主人。沙漠上来的客人，你想见见我的那些美丽的姐妹们吧，我知道，你一定是想见见她们。因为她们是那么纯洁而美丽，又善良。从不伤害别人。姐妹们，让风把你吹送到我这里吧。有一位沙漠上来的客人十分想见见你们。\r\n\r\n（舞台灯暗。十个左右与红一样装束但颜色各不相同的影子走出。就像烛火一样在风吹下飘动。这里有一段影子的舞蹈。\r\n\r\n《女儿公主影子云舞》时间较长，美丽而悲惨。红和宝剑隐去。）\r\n\r\n第一只歌：山楂树\r\n\r\n落满火焰的山楂树\r\n\r\n今夜我不会遇见你\r\n\r\n今夜我遇见了世上的一切\r\n\r\n但我不会遇见你，流血的山楂树\r\n\r\n不知风起何处，又将吹往何方\r\n\r\n连村庄也睡意沉沉\r\n\r\n我是传说中那公主的影子\r\n\r\n但是我孤单一人，流血的山楂树\r\n\r\n我并未爱过\r\n\r\n也不曾许诺\r\n\r\n在公主的镜中筑起坟墓\r\n\r\n一棵流血的山楂树\r\n\r\n第二只歌：石头（男声）\r\n\r\n在你沉默的时候我却要滔滔不绝\r\n\r\n我就是石头，我无法从石头上跳下\r\n\r\n我没有一条道路可以从石头上走下\r\n\r\n我就是石头，我无法打开我自己\r\n\r\n我没有一扇门通向石头的外面\r\n\r\n我就是石头，我就是我自己的孤独\r\n\r\n第三只歌：千年（男声）\r\n\r\n在这一千年我只热爱我自己\r\n\r\n在这一千年我只热爱亲人和你\r\n\r\n在我这一千年在这一千年在这一千年\r\n\r\n我也曾拼着性命抬着棺材进行斗争\r\n\r\n我也曾装疯卖傻一路乞讨做一个疯狂的先知\r\n\r\n我也曾流尽泪水屈辱地活着做一个好人\r\n\r\n我也偷抢也杀人我的自由是两手空空\r\n\r\n我所憎恨的生活我日日在过\r\n\r\n我留下的只有苦难和悔恨\r\n\r\n我热爱的生命离我千年，火种埋入灰烬\r\n\r\n在这一千年我只热爱我自己的痛苦\r\n\r\n在这一千年我只热爱亲人和你\r\n\r\n我所在的地方空无一人\r\n\r\n那里水土全失　寸草不生\r\n\r\n大地是空空的坟场\r\n\r\n死去的全是好人\r\n\r\n天空像倒塌的殿堂\r\n\r\n支撑天空的是我弯曲的脊梁\r\n\r\n我把天空还给天空\r\n\r\n死亡是一种幸福\r\n\r\n（众影子散去）\r\n\r\n红：我很可能是中国的公主的影子。但我不是生活在巴比仑。也好像不是生活在中国。我好像生活在纽约。或者是在罗马。对，是在纽约。那么，你呢？你是王子吗？你是沙漠上的王子还是巴比仑的王子？对了，你是一个牵骆驼的王子。\r\n\r\n剑：不，我不是王子。我不是沙漠上的王子，也不是巴比仑的王子。也许。可能。对，我是一个牵骆驼的王子。我漫游世界，是想找到我唯一的亲人。不，也许是两个，还有一个是女儿。\r\n\r\n红：难道你也是你女儿生下的？\r\n\r\n剑：我是母亲所生。但我从未见过母亲。我从未见过我的亲生父母。是沙漠的母亲把我抚养大的。沙漠上那位无名的国王也对我很好。我是在沙漠上长大的。我不是女儿生的。\r\n\r\n红：你也许会认得我的女儿的。你们也许是熟人。很熟的熟人。是亲人。很可能是亲人。你为什么不承认呢。你，沙漠上来的牵骆驼的王子，也许跟我一样，是和我一起，是女儿生下的，牵骆驼的王子？\r\n\r\n我不是公主。我是公主的影子。我的姐妹们刚才你都看见了。在太阳出来的时候，我们就睡去了，就在睡着了还要跟着主人东跑西跑。只有在夜里，在黑漆漆的子夜，在主人沉睡之时我们才随风而来随风而去，唱歌跳舞过上一些自由的时光。我不是公主。我是公主的影子。我的公主也不是巴比仑的公主，不是巴比仑王的女儿。我是我女儿的影子。我是公主是女儿的女儿。是纽约的公主，是耶路撒冷的公主。是阿拉伯的公主。是波斯的公主。是印度的公主。是埃及的公主。是希腊的公主。是非洲的公主。是亚洲的公主。是欧罗巴的公主。是美丽的公主．是沙漠的公主。是吉卜赛的公主。是爱斯基摩的公主。是澳大利亚的公主。是岛屿的公主。是春天的公主。是大雪的公主。是风的公主。是鸟的公主。是红色印第安的公主。是毛利的公主。甚至我是中国的公主。\r\n\r\n（红向台下高喊：\r\n\r\n车夫！\r\n\r\n车夫！\r\n\r\n上来！）\r\n\r\n（两位老车夫上场）\r\n\r\n红：（对宝剑介绍）：\r\n\r\n这是我的两位车夫。\r\n\r\n一个叫老子。\r\n\r\n一个叫孔子。\r\n\r\n一个叫乌鸦。\r\n\r\n一个叫喜鹊。\r\n\r\n在家里叫乌鸦。\r\n\r\n在家外叫老子。\r\n\r\n在家外叫孔子。\r\n\r\n在家里叫喜鹊。\r\n\r\n他们是我的两位车夫！\r\n\r\n他们在道路上\r\n\r\n在东方的道路上\r\n\r\n在太阳经过的道路上\r\n\r\n为我——一位疯公主\r\n\r\n拼命拉车子。\r\n\r\n我知道我已疯狂。\r\n\r\n老子！\r\n\r\n乌鸦！\r\n\r\n快叫唤一声！\r\n\r\n给沙漠上的王子听听！\r\n\r\n（那老人哇哇呜呜叫了一阵）\r\n\r\n孔子！\r\n\r\n喜鹊！\r\n\r\n快叫唤一声！\r\n\r\n给沙漠上的王子听听！\r\n\r\n（那另一老人哇哇呜呜也叫了一阵）\r\n\r\n沙漠上的王子！\r\n\r\n你听见了吗！我看见你头骨向两边长出了两枝花！\r\n\r\n一点也不谦虚，\r\n\r\n一点也不鲜红，\r\n\r\n在那儿偷听，\r\n\r\n我这两位车夫，\r\n\r\n老子和孔子的对话，\r\n\r\n鸟鸦和喜鹊的对话。\r\n\r\n沙漠上的王子，\r\n\r\n你到是说一说，\r\n\r\n那到底是花，\r\n\r\n还是犄角？\r\n\r\n剑：是耳朵。\r\n\r\n他听见了使他心碎的一切。\r\n\r\n红：难道你的心碎了吗？\r\n\r\n心碎了是什么样子？\r\n\r\n像桅子花，\r\n\r\n还是像梅花？\r\n\r\n难道你的心碎了吗？\r\n\r\n你的几根肋骨下面\r\n\r\n难道冒出香气了吗？\r\n\r\n剑：没有什么香气\r\n\r\n只是在流血？\r\n\r\n红：还是流血好。\r\n\r\n血的香气更重更浓。\r\n\r\n在桅子花的日子 里梅花开放。\r\n\r\n一样的劳香。\r\n\r\n一样的幸福。\r\n\r\n这究竟是谁的时光？\r\n\r\n在巴比仑的日子中沙漠无边。\r\n\r\n一样的白天。\r\n\r\n一样的黑夜。\r\n\r\n一样的流血。\r\n\r\n一样的疯狂。\r\n\r\n这究竟是谁的地点？\r\n\r\n这究竟是谁。\r\n\r\n这、究、竟、是、谁？\r\n\r\n这究竟是谁？\r\n\r\n现在坐在我坐的车上。\r\n\r\n剑：你一点都想不起来了吗？\r\n\r\n你就是红。你就是你自己啊！\r\n\r\n红：背后传来歌声。\r\n\r\n背后美丽无比。\r\n\r\n鸟儿的活。鸟儿说\r\n\r\n我的什么我不说。\r\n\r\n你的什么我不说。\r\n\r\n你的话我不说。\r\n\r\n我的话我不说。\r\n\r\n你说什么我不说。\r\n\r\n你想什么我不说。\r\n\r\n你做什么我不说。\r\n\r\n你有什么我不说。\r\n\r\n你是什么我不说。\r\n\r\n——————————\r\n\r\n　原书此处为“日于”，疑是印刷错误，今改之。——骨注\r\n\r\n第六场\r\n\r\n（疯子头人，鸟）\r\n\r\n疯：一半是黑暗的时间。当时在大海边。海浪翻滚。在悬崖尽头沙滩尽头我们相遇。我与他相遇了。也许他并没有看见我。但是我看见他了。大概是两三年后，我又零星看了这位暴君的一些诗。这是一个黑暗的人写的。这是一个空虚之手暴君之手写下的。但是里面有一个梦。大同梦。正如同他即使\r\n\r\n宰了骨肉兄弟十二人，得罪全天下的老百姓，也要建造一座巨大无比的太阳神宫殿。如果说他在世纪面前还有一个证人的话，那个证人就是我。如果对他在巴比仑的罪行还有一个人辩护的话，那个辩护人就是我。我当时坐在沙漠的边缘，对这场大梦，对这场大同之梦，感到一种内在的寒冷。这些年我一直在研究天空的数学。那里有爆炸，但没有屠杀；有物质和光，但没有尸体。那里有最短的轨道……我看过一本真正的书。我记得里面的几句话。其中有一句是：圆形内最长的直线是直径。多么简单。多么明确。这是数学，而不是魔法和咒语。可是，看了他的那些诗，我感到一种内在的寒冷。因为这位沉浸于大地的魔法的最深和最黑暗的巴比仑王，那些咒语式的诗行中竟会有一两句是描述天空的数学，是描述飞行的。你知道，飞行是天空的数学的根本问题。后来那一次，我翻开我的天体物理之书。预感到这个黑暗而空虚的王有可能会乘坐这道上的车。终于在我的宝剑上染上了腥红的血。终于在这一柄锋利的宝剑上染上了腥红的血。宝剑宝剑。听说，巴比仑王要举行一次全国性的诗歌竞赛，以人头为代价。我是计算天空上轨道和星辰的人。我的父亲也是用一辈子计算星空。那是几千年前。天空。几千年过去了。我不光计算黄道，还要计算黄道对赤道的影响。我用天空来做大地的预言，大地的秘密已经囤积太多。此刻我只想天空的数学，它们的感应和生命的过程。我只想这许多的星辰，它们从哪儿来，又往何方去，活了多长。这许多的星辰怎样生活。这天空的数学可能是一首诗。天空的舞蹈。我甚至已经预见了他们的结局。他们镇定心神，走向自己的牺牲。吉卜赛和青草是牺牲。红是牺牲。十二反王是牺牲。巴比仑王和宝剑则是毁灭。好兄弟终究要分手。在一场伟大的行动中，好兄弟终究会有分手的那一天、必须一个人孤独地行动，必须以一个人的孤独来面临所有人类的孤独。以一个人的盲目来面临所有人类的盲目。\r\n\r\n——————————\r\n\r\n　此处原书为“既使”，今改之。——骨注\r\n\r\n第七场\r\n\r\n（疯子头人，鸟）\r\n\r\n（洒馆。巨大的酒柜。黑红相间。音乐亲切、抒情，或，断断续续 的海鸥叫声）               （青草、吉卜赛、猛兽）\r\n\r\n青草：我们俩没有按女巫的话去做。\r\n\r\n吉卜赛：我们不可能一个一个地单独干。\r\n\r\n青草：因为我们俩是不可分的。\r\n\r\n吉卜赛：我们是孪生兄弟。\r\n\r\n青草：亲密的，\r\n\r\n吉卜赛：双胞胎。\r\n\r\n青草：亲密得就像\r\n\r\n吉卜赛：一个人。\r\n\r\n青草：我们血液流动的速度都一样。\r\n\r\n吉卜赛：我们是两个身子一颗心。\r\n\r\n青草：两颗头颅一个念头。\r\n\r\n吉卜赛：两个人只有一条命。\r\n\r\n青草：我们曾在沙漠上并肩漫游，\r\n\r\n吉卜赛：我们在夜里背靠背互相用身子取暖，\r\n\r\n青草：还写下了许多漂泊的谣曲，\r\n\r\n吉卜赛：那是多么美好的日子！\r\n\r\n青草：只有草原，\r\n\r\n吉卜赛：和这里不一样；\r\n\r\n青草：还有白云，\r\n\r\n吉卜赛：还有变换的营地，\r\n\r\n青草：夜晚的火，\r\n\r\n吉卜赛：马和骆驼，\r\n\r\n青草：还有姑娘，\r\n\r\n吉卜赛：黝黑而健康，\r\n\r\n青草：乳房丰满，\r\n\r\n吉卜赛：弯腰的时候能从脖子上偷偷看一眼，\r\n\r\n青草：啊，故乡的姑娘，\r\n\r\n吉卜赛：仍然在流浪，\r\n\r\n青草：仍然在流浪的道路上歌唱。\r\n\r\n吉卜赛：我们为她们写了多少歌啊，\r\n\r\n青草：想数也数不清。\r\n\r\n吉卜赛：唱一点吧，\r\n\r\n青草：对，唱一点。\r\n\r\n两人合唱：\r\n\r\n远方除了遥远一无所有\r\n\r\n更远的地方更加孤独更加自由\r\n\r\n我是天空上飞过的\r\n\r\n天空黑下来，让我来到草原\r\n\r\n我想打搅你。\r\n\r\n又想让你安静。\r\n\r\n我把你当姐妹。\r\n\r\n又当心上人。\r\n\r\n你是那样熟悉。\r\n\r\n又是那样陌生。\r\n\r\n谁也无能为力\r\n\r\n为什么雷声隆隆？\r\n\r\n为什么无处躲避？\r\n\r\n就是双手捧住\r\n\r\n也不知是雨是泪\r\n\r\n还顺着手指流下\r\n\r\n该发生的没有发生。\r\n\r\n该来临的没有来临。\r\n\r\n一切梦已做尽。\r\n\r\n想做的梦却没有成。\r\n\r\n这几天我像是生活在梦中\r\n\r\n伸出双手\r\n\r\n双手在拒绝　又在乞求\r\n\r\n又在沉默　又在声明\r\n\r\n又有火种又有灰烬\r\n\r\n我就这样在远方生活\r\n\r\n我从黎明就倾听——\r\n\r\n一直到另一个黎明也没有对你关门\r\n\r\n吉卜赛：再唱一支短的吧。\r\n\r\n青草：好。\r\n\r\n两人合唱\r\n\r\n八月的日子就要来到\r\n\r\n我的镰刀斜插在腰上\r\n\r\n我抱起了庄稼的尸体\r\n\r\n许多闪光的豹头在稻草杆上……\r\n\r\n青草：再唱一首写给最后的草原的吧。\r\n\r\n吉卜赛：这一首叫《草原之夜》\r\n\r\n草原之夜\r\n\r\n那是一片冬季的草场\r\n\r\n草长得不高，但很兴旺\r\n\r\n我的头颅就埋在这里\r\n\r\n搂抱着夜色中的山冈\r\n\r\n山冈上这些草长得和去年一样\r\n\r\n似乎没有经历死亡\r\n\r\n短暂的夏天，美好的草原\r\n\r\n是两场暴风雪争夺中喘息的新娘\r\n\r\n今年的暴风雪会来得更凶猛\r\n\r\n暴风雪，五十年未遇\r\n\r\n我的头颅变得比岩石还要寒冷\r\n\r\n似乎在预感到天空许给草原的末日\r\n\r\n草原的末日也就是我的末日\r\n\r\n所有的牛羊都被抛弃，都逃不过死亡\r\n\r\n只有一个跛男孩跑到草原尽头\r\n\r\n抱住马脖子失声痛哭\r\n\r\n那时候天已大亮\r\n\r\n太阳落满天空　更为荒芜\r\n\r\n只有一个跛男孩\r\n\r\n抱住马脖子失声痛哭\r\n\r\n他就是我的儿子，他已成为孤儿\r\n\r\n他的母亲已成为草原的寡妇，这个女人将会顺从命运\r\n\r\n我那远嫁他方的小妹妹\r\n\r\n会在收割青稞时为我痛哭一场\r\n\r\n别的牧人去了夏天的草场\r\n\r\n他们和妹妹或新娘生活在一起\r\n\r\n这都是热爱生活的年轻人，青稞酒在草原之夜流淌\r\n\r\n他们都不能理解我此刻的悲痛\r\n\r\n青草：这些歌写得很不错。\r\n\r\n吉卜赛：词也好，\r\n\r\n青草：调子也好。\r\n\r\n吉卜赛：可我们俩为何跑到巴比仑。\r\n\r\n青草：我也不知道。大概因为这是父母的故乡。\r\n\r\n吉卜赛：可我们也没有在这儿出生，\r\n\r\n青草：我们出生在远方。\r\n\r\n吉卜赛：我们到这儿来是为了……\r\n\r\n青草：唱谣曲的也要杀人。\r\n\r\n吉卜赛：杀一个暴君。\r\n\r\n青草：两个牵骆驼的孪生兄弟，\r\n\r\n吉卜赛：两个沙漠部落的歌手，\r\n\r\n青草；来到巴比仑，\r\n\r\n吉卜赛：杀一个暴君。\r\n\r\n青草：为了沙漠部落，\r\n\r\n吉卜赛：为了远方，\r\n\r\n青草：为了草原，\r\n\r\n吉卜赛：为了大河，\r\n\r\n青草：为了百姓，\r\n\r\n吉卜赛：为了内心的憎恨，\r\n\r\n青草：为了庄稼，\r\n\r\n吉卜赛：也为了巴比仑。\r\n\r\n青草：两个牵骆驼的，\r\n\r\n吉卜赛：唱谣曲的，\r\n\r\n青草：要杀一个暴君。\r\n\r\n吉卜赛：咱们，\r\n\r\n青草：兄弟俩，\r\n\r\n吉卜赛：活要活在一块，\r\n\r\n青草：死也死在一块，\r\n\r\n吉卜赛：有个依靠，\r\n\r\n青草：有种依恋。\r\n\r\n（门被猛烈撞开。猛兽冲进来。这一段在猛兽回忆十三反王时，三人都戴红色面具坐在角落）\r\n\r\n（三人无言地围着小酒柜喝酒）\r\n\r\n猛兽：我给你们讲讲十三反王的事情吧\r\n\r\n二人：好。\r\n\r\n（回忆）\r\n\r\n（十三反王，刽子手）\r\n\r\n魔王：我是十三反王中最大的反王，我是被押上刑场的十三反王中最大的反王。我是\r\n\r\n魔王。弟兄们都爱喊我的绰号。我的绰号叫“老羊皮”。\r\n\r\n天王：我是第二位反王。我是天王。在另一个时间在另一个地点。我是天王洪秀全。\r\n\r\n地王：我是第三位反王。我是地王。我的绰号叫“一条山一条河”。\r\n\r\n雷王：我是第四位反王。我是雷王。兄弟们又叫我“打铁匠”。\r\n\r\n血王：我是第五位反王。我是血王。兄弟们和敌人，还有百姓都爱叫我“刽子手”。\r\n\r\n但决不是这位刽子手。（用手指指身后押送他们十三反王的刽子手）\r\n\r\n黑铁之王：我是第六位反王。我是黑铁之王。\r\n\r\n兄弟们爱叫我“岩石的儿子”和“枪手”。\r\n\r\n酒王：我是第七位反王。我是酒王。\r\n\r\n乞丐王：我是第九位反王。我是乞丐王。我的外号叫“一大帮”或“花子王”。\r\n\r\n霸王：我是第十二反王。我是霸王。在别的时间，在另外一个地点我是霸王项羽。\r\n\r\n闯王：我是第十一位反王。我是闯王。在另外一个时间另外一个地点我是闯王李自成。\r\n\r\n吉卜赛王：我是第十二位反王。我是吉卜赛王。我被兄弟们称为“歌手”。\r\n\r\n无名的 国王：我是最小的反王。我是第十三位反王。我是无名的国王。我的外号非常非常多。我头一个外号叫“断头台”。我的传说在十三反王中是最多的，一时半会说不清。以后有机会再说吧。我的外号可以捡几个主要的来说说。我叫河南王。又叫河北王。我叫山东王，又叫山西王。我叫旧石器，又叫新石器。最主要的一个传说就是我是不会死的。但今天我总算被押上了刑场，押上了断头台。谁知道，这里也许不是我呢？我也许不是无名的国王呢？我也许不是我呢？\r\n\r\n魔王：我们是十三反王，天不怕，地不怕。在数十年之中，我们过的是刀尖上舔血的日子。我们终于推翻了一个非常古老的统治了几千年的老王朝。我们终于夺得了天下。我们是十三反王，天不怕，地不怕，我们终于夺得了天下。我们推举我们之中的老八，也就是我们之中的第八个反王，第八个兄弟，第八个头领来当新的国王。我们以河流来为我们这个新的王朝命名。我们就把我们新的王国取名为巴比仑。老八就当上了巴比仑王。他不顾我们十二个兄弟和天下百姓的劝告，为了扬名万世，要修造一座从来没有人敢建造的巨大的宫殿。那就是太阳神宫殿和太阳神神庙。使得民不聊生。\r\n\r\n（舞台后景显示一座十分宏伟壮丽的宫殿神庙群）\r\n\r\n神庙终于造成了，宫殿也造成了。巴比仑的百姓死了奖金一半，国库也空了。我们兄弟十二人只好重新起来造反。我们兄第十二人只好重新取用自已以前给自己的封号。魔王。天王。地王。雷王。血王。黑铁之王。酒王。乞丐王。霸王。闯王。吉卜赛王。无名的国王。我们兄弟十二人只好重新起来造反。我们兄弟十二人只好重新成为十二反王。又过上快乐、冒险、自由和鲜血的日子。但我们终于失败了。我们全都被巴比仑王抓起来。该死的巴比仑王，该死的老八，我诅咒你，你的大哥诅咒你。兄弟们，今天是最高的日子，今天是断头的日子，今天是上断头台的日子，今天是受刑的日子，为了表明反王的意志，为了表示高兴，为了庆祝，让我们唱起“十三反王”歌吧。\r\n\r\n（歌唱时有流浪儿合唱队上来伴唱）\r\n\r\n十三反王打进京\r\n\r\n你有份，我有份\r\n\r\n十三反王掠进城\r\n\r\n你高兴，我高兴\r\n\r\n十三反王骑快马\r\n\r\n你也怕，我也怕\r\n\r\n十三反王回到家\r\n\r\n你的家，我的家\r\n\r\n十三反王不要命\r\n\r\n你的命，我的命\r\n\r\n于三反王一身金\r\n\r\n山头金，海底金\r\n\r\n十三反王进了京\r\n\r\n不要金，只要命\r\n\r\n人头杯子人血酒\r\n\r\n白骨佩戴响丁丁\r\n\r\n猛兽；要知道。我们都是反王的儿子。\r\n\r\n二人：我们在沙漠上就知道了。\r\n\r\n猛兽；兄弟，你们聊吧。我下去练一会儿靶子。\r\n\r\n（猛兽奔下。两兄弟恐怖而沉默地盯着他。然后又恐怖而沉默地互相对视着。像是被什么魔法镇住。都不敢说话。也没有动作。舞台声音必须中止。这时台下传来一声很闷的枪响）\r\n\r\n两人：他终于干了。虽然他干掉的是自己。可他还是一条好汉子。硬汉子。铁汉子。\r\n\r\n青草：我要为他写一首诗．\r\n\r\n吉卜赛：我也要为我的兄弟写一首诗。\r\n\r\n青草：你的题目？\r\n\r\n吉卜赛：你的题目？\r\n\r\n两人（异口同声）：弑。弑君。杀人。过一次不是羊皮纸上的诗也不是口中歌唱的   　　诗。而是干活。手中的诗。兵器的诗。\r\n\r\n弑！！ 弑君！！！\r\n\r\n——————————\r\n\r\n　此处原书为“断续续续”，今改之。——骨注\r\n\r\n幕间过场一场\r\n\r\n第八场\r\n\r\n（此场为两幕之间过场）           （幻象。两个头戴面具的人窜过舞台）\r\n\r\n绿马：我是身在其外的马。\r\n\r\n红马：我是身在其中的马。\r\n\r\n绿马：我是绿枝青叶的马。\r\n\r\n红马：我是烈火焚烧的马。\r\n\r\n绿马：我是生育之马。\r\n\r\n红马：我是死亡之马。\r\n\r\n绿马：我很快就要衰老。\r\n\r\n红马：我很快就要从火焰和灰烬中再生。\r\n\r\n绿马：我是生命之马。\r\n\r\n红马：我是超越生命之马。\r\n\r\n绿马：我甩开四蹄，飞上舞台。\r\n\r\n红马：我飞开四蹄，一直跃入生命。\r\n\r\n绿马：我多像春天，多像生命，多像万物之灵。\r\n\r\n红马：我多像国王，多像世界，多像太阳中心。\r\n\r\n绿马：我不会超出我的季节我就会腐烂。\r\n\r\n红马：我早已就在我的生命中心开始燃烧。\r\n\r\n绿马：我开花。\r\n\r\n红马：我流血。\r\n\r\n绿马：我结果。\r\n\r\n红马：我杀人。\r\n\r\n绿马：我开始在大地上繁衍。\r\n\r\n红马，你听我唱一只歌：\r\n\r\n在月光下，\r\n\r\n在荒凉的高原，\r\n\r\n在山顶，\r\n\r\n繁殖，该是多么幸福的一件事！\r\n\r\n红马：我的图腾不是你的图腾。\r\n\r\n你的禁忌不是我的禁忌。\r\n\r\n我从黎明开始飞翔。到黄昏还在飞翔。到第二个黎明还在飞翔。到第二个黄昏也还在飞翔。心在飞翔。头颅在飞翔。四肢在飞翔。一切都在燃烧，绿马，绿色的马，你难道没有看见吗？一个人扑向另一个人，他是要屠杀还是要拥抱？他是要屠杀吗？不是。他是要拥抱吗？更不是。绝对不是要屠杀和拥抱，而是要燃烧。那么，就容许我把你的歌词改一两个字，让我再唱一遍给你听\r\n\r\n在太阳下，\r\n\r\n在荒凉的人类，\r\n\r\n做国王，\r\n\r\n燃烧，该是多么幸福的一件事！\r\n\r\n第二幕\r\n\r\n第九场\r\n\r\n说明：这是巴比仑诗歌竞赛\r\n\r\n①舞台四周有许多穿着红色盔甲的兵——小剧场则布满剧场周园——注视着，拿着古代兵器——舞台上总有兵押着五花大绑的年轻人上场，或在剧场走动，默默穿过舞台、下场。\r\n\r\n②所有人物都被蒙上眼晴。\r\n\r\n③有一种幻觉、错乱、恍惚，类似宗教大法会的气氛。\r\n\r\n第九场\r\n\r\n（一条大河为渡口背景阴森幽暗巨浪滔天  （魔，巴比仑王，众幻象，抬棺人）\r\n\r\n王：我为何来到这幽魂横渡的荒凉的渡口\r\n\r\n是在什么时间，是在哪一个世纪\r\n\r\n我感到：是谁，是什么东西曾指引着我\r\n\r\n这种指引又为了什么？\r\n\r\n这是谁，他为什么又突然脱离了我\r\n\r\n脱离了我。像铁脱离了一把斧子\r\n\r\n他离开了我。我又变成了个生病老人\r\n\r\n孤独坐在一堆寒冷的石头堆砌的王座上。\r\n\r\n他是谁？没有了他王座又有什么用\r\n\r\n魔：是我，魔。魔王魔鬼恶魔的魔\r\n\r\n万物之中所隐藏的含而不露的力量\r\n\r\n万物咒语的主人和丈夫\r\n\r\n众魔的父亲和丈夫。众巫官的首领\r\n\r\n我以恶抗恶，以暴力反对暴力\r\n\r\n以理想反对理想，以爱抗爱。\r\n\r\n我来临，伴随着诸种杀伐的声音，兵器相交\r\n\r\n王：在这个阴暗的死亡的渡口。\r\n\r\n我自身的魔已经消失。\r\n\r\n却出现了过许多熟悉的幽灵\r\n\r\n这么多死去的同志们，同志们，你们好！\r\n\r\n矛！盾！戟！弓箭，枪，斧，锤，镰刀！\r\n\r\n（众兵器上台，众兵器以人物的形式上台，伴随着咒语和合唱队。他们是矛、盾，弓箭，剑，枪，斧……等。犁则作为一个众兵器的附属者和侍从出现）\r\n\r\n（可演一段或两段小故事：矛和盾的故事。射十日的故事。其\r\n\r\n他人暂时隐去）\r\n\r\n众兵 器：我们又一次冲出了武器库\r\n\r\n我们又一次漫天飞舞\r\n\r\n插上同伴和对手的肋骨\r\n\r\n我们要把命革掉！人类的鲜血\r\n\r\n擦去我们身上的灰尘\r\n\r\n蒙受了时间和厌倦的和平\r\n\r\n魔：召唤众兵器，跳起了兵器之舞\r\n\r\n我在这一瞬间离开了你\r\n\r\n我又回到了我自己的山顶\r\n\r\n手舞着斧子在石头上革命\r\n\r\n这就是在死亡渡口出现的革命和景色。\r\n\r\n仗是山上打，人在病中死\r\n\r\n或死于毒药或死于兵器\r\n\r\n但最终会在死亡渡口齐集\r\n\r\n（众兵器之舞）\r\n\r\n第十场\r\n\r\n（无名人，\r\n\r\n（舞台寂静，舞台幽暗。正中有一辆战车。\r\n\r\n四个轮子。中央可以坐人。演员茫然地站在那里，戴上了面具。外面还扎上了红布条。面具用中国殷商时代的钺——兵器——是粗笨的人形。朗诵要尽可能缓慢。）\r\n\r\n钺形 无名人：\r\n\r\n我败了。败得真惨。我是首领。我有一股无穷的杀气。但我败了。败得真惨。我一点预感都没有。我既没有成功的预感。也没有失败的预感。可这辆空空荡荡的战车使我脑子凝固。变成了月球上寒冷的岩石。我的血液变成了北极的冰块。我当时才感觉到什么是真正的恐惧。和内心的寒冷。但我在内心却感到无比幸福。虽虽然我败了。但我在内心却感到无比幸福。从南方到北方，全国都在进行热火朝天的诗歌大竞赛。我是一位年轻的诗人。我是一件古代的兵器。我叫钺。我的诗歌竞赛的对手就是这辆坦克，这辆战车，这堆什么也不是的十分现代化的钢铁。我的真正的对手呢？那位举世闻名的诗人—坦克和战车设计人呢？甚至我用望远镜亲眼目睹了他上这辆战车。我也变成了现在这个样子（指指自已脸上的面具）。我当时只有一个念头。参加这场全国诗歌大竞赛。打败他。可是你们看。战车中空空荡荡的。连一个人影。连一根人毛。连一个鬼影子也没有。既然我不能战胜和杀死他。我就要战胜和杀死这空白。坦克中的空白。战车中的空白。我在这战车或坦克周围拼命写了许多诗，搞了许多声音。但我还是掩盖不住这空白。但是，什么也没有。没有人在等我。没有人与我进行诗歌竞赛。只有一片空白。在无情地嘲弄我。这辆战车这堆钢铁中的空白在无情地嘲弄我。我连刺死自己的理由和杀死别人的理由都没有找到。这条路是从南方到北方。这条路是巴比仑青年诗人诗歌大竞赛。但是我们伟大的皇帝，我们伟大的巴比仑王，却把空白和空虚——无穷的滚滚的道路上的空白和空虚——战车、钢铁和坦克中的空白和空虚赐予了我。我怎样完成这件事。我只剩下绝望的诗歌。\r\n\r\n第十一场\r\n\r\n（背景中，一些年轻人拿着长矛，有的拿着书在舞台上追上追下，都用红布条蒙上眼睛。老女奴是一个盲目的老女人，被小瞎子牵上舞台，用黑布条蒙上眼睛）\r\n\r\n小瞎子：（面朝观众）\r\n\r\n我是小瞎子，我是老瞎子生下的小瞎子\r\n\r\n我的触须和眼睛在火焰中焦黑了，灰烬了\r\n\r\n我的眼睛在光明的中心彻底黑起来\r\n\r\n我是盲目的老诗人生下的小瞎子\r\n\r\n众人让我来参加巴比仑诗歌大竞赛\r\n\r\n我就来了。我用已瞎的双眼来看\r\n\r\n这巴比仑的屋顶越看越像棺材\r\n\r\n我带上帐篷　足够的食物和水\r\n\r\n带上我小瞎子己瞎的双眼\r\n\r\n我牵上骆驼　驮我双目失明的老母亲\r\n\r\n独自一人走上沙漠，寻找我那梦中稻草人\r\n\r\n风吹雨打中金黄又退色\r\n\r\n的稻草人。稻！草！人！\r\n\r\n人们让我来参加诗歌大竞赛\r\n\r\n都说这儿有棕榈、大沙漠\r\n\r\n还有骆驼和稻草人，我就来了\r\n\r\n我就牵着我的瞎母亲来了\r\n\r\n（小瞎子把老女奴牵到舞台中央，一架类似王座的大椅子上坐下）\r\n\r\n（有数人举着火把，加入那些举着长矛和书的年轻人队伍冲上冲下。其中有一人用火把点燃了一座火堆。小瞎子看着这景象，突然双膝向老女奴跪下）\r\n\r\n小瞎子：妈妈，我双膝跪下\r\n\r\n向着你，生身之母\r\n\r\n盲目的乳房和火把\r\n\r\n妈妈，你何日来到这柴房中\r\n\r\n你生下我后经受了多少磨难多少苦\r\n\r\n你在这柴房中身为女奴\r\n\r\n劈柴做饭干了多少年\r\n\r\n多少哺乳多少星光\r\n\r\n多少饥饿多少欺凌\r\n\r\n柴房生涯又是怎样谩长\r\n\r\n这二十多年小瞎子的生长\r\n\r\n就是五千年的重量\r\n\r\n（稻草人上场，也是蒙眼）\r\n\r\n（朗诵时舞合可根据诗另有哑剧情节）\r\n\r\n稻草人：我是稻草人\r\n\r\n我为人们看护粮食，我站在田野中\r\n\r\n我是老女奴的另一个儿子\r\n\r\n刚才小瞎子念的诗歌使我非常感动\r\n\r\n我从河南的麦田中央\r\n\r\n飞到这巴比仑诗歌竞赛的舞台\r\n\r\n我给大家念一念我写的诗歌\r\n\r\n我是稻草人\r\n\r\n我记得我的故乡，我记得那个小镇\r\n\r\n周围百里还有三个小村\r\n\r\n山头只有松树\r\n\r\n杨树和槐树\r\n\r\n五月槐花盛开花香满镇\r\n\r\n一到荒年\r\n\r\n人们就用一个长竹竿\r\n\r\n绑上一个铁钩子\r\n\r\n把高处的槐花弄下来\r\n\r\n放到地上的大篮子或小筐子\r\n\r\n回去当成粮食吃\r\n\r\n人类在饥饿时\r\n\r\n不仅吃过槐花\r\n\r\n还吃过草根\r\n\r\n还吃过牛粪\r\n\r\n不仅吃过牛粪\r\n\r\n还吃过人肉\r\n\r\n大人肉娃娃肉\r\n\r\n吃过死人的肉\r\n\r\n我是巴比仑的稻草人\r\n\r\n几千年站在田野中\r\n\r\n一年四季站在田野中\r\n\r\n我是一首饥饿的诗\r\n\r\n我为人类看护粮食\r\n\r\n我是一首饥饿的诗\r\n\r\n我为人类看护粮食\r\n\r\n第十二场\r\n\r\n（流浪儿\r\n\r\n可用成年演员戴上大头娃娃面具扮演。\r\n\r\n（一大一小两个女孩出场，唱或哼着）\r\n\r\n摘棉花谣\r\n\r\n小河流水哗啦啦\r\n\r\n我和姐姐摘棉花\r\n\r\n姐姐摘了一筐半\r\n\r\n我才只摘一朵花\r\n\r\n（重复一遍或多遍）\r\n\r\n（以下是童谣《看守瓜田谣》——几个小流浪儿的游戏。一个小女孩坐在中间——蹲下，其他小儿坐在周围，有一儿从远处而来，这个流浪儿让人一看就是巴比仑王）\r\n\r\n众儿问：干什么的？\r\n\r\n王：走大路的。\r\n\r\n众儿：大路有水。\r\n\r\n王：走小路。\r\n\r\n众儿：小路有鬼，\r\n\r\n王：走刺窝里。\r\n\r\n众儿：刺窝有刺，\r\n\r\n王：走瓜田里。\r\n\r\n众儿：瓜日有瓜，\r\n\r\n王：那我就摘一瓜，\r\n\r\n抱了就走。\r\n\r\n（王牵“瓜”手，众儿追他下，又追上）\r\n\r\n流浪儿合唱：\r\n\r\n老怪物，上了场\r\n\r\n没有枪的也有了枪\r\n\r\n老怪物，上了场\r\n\r\n不是王的做了王\r\n\r\n老怪物，上了场\r\n\r\n我们一起上战场\r\n\r\n老怪物，上了场\r\n\r\n兴风作浪的不是浪\r\n\r\n老怪物，上了场\r\n\r\n挖了洞，种了粮\r\n\r\n老怪物，上了场\r\n\r\n众流浪儿有爷娘\r\n\r\n第十三场\r\n\r\n（众纵火者举火把上，点燃一些火堆，朗诵或唱，冲下）\r\n\r\n白色的火焰\r\n\r\n我告诉你\r\n\r\n我祈求你\r\n\r\n我双膝跪在泥里\r\n\r\n我两眼红肿\r\n\r\n我是火焰\r\n\r\n我没有出路\r\n\r\n我没有锁链\r\n\r\n我一身通红\r\n\r\n我没有粮食\r\n\r\n我没有家园\r\n\r\n我不当强盗\r\n\r\n我不识文字\r\n\r\n我没有历史\r\n\r\n也没有心肝\r\n\r\n白色的火焰，我告诉你，祈求你\r\n\r\n我不能歌唱我没有棕榈\r\n\r\n没有铁锅没有草原没有三块岩石\r\n\r\n没有大理石没有萄萄园\r\n\r\n我不能哭泣没有鸽子没有山楂\r\n\r\n我只有你，白色的火红的你\r\n\r\n我没有死亡我没有生命我空无一人\r\n\r\n我没有伴侣没有仇恨也没有交谈\r\n\r\n我头也大了脚也肿了身子也垮了胃也坏了\r\n\r\n牙齿也掉了头发也落了我没有脑袋\r\n\r\n纵火犯一大帮，纵火犯好快活\r\n\r\n我的头颅埋在暗无天日的地牢\r\n\r\n我的手足斩断在刑台左右\r\n\r\n我的内脏活在高飞的猛禽的内脏\r\n\r\n我的躯体漂浮在死亡之河沉下又浮起\r\n\r\n我的心抛出早已供奉太阳\r\n\r\n我没有形体没有真理没有定律\r\n\r\n我没有伤疤没有财富\r\n\r\n我没有盘缠没有路程\r\n\r\n没有车轮滚滚没有大刀长矛\r\n\r\n我没有回忆也没有仇恨\r\n\r\n我甚至没有心情\r\n\r\n白色的火焰，我告诉你，祈求你，双膝跪下\r\n\r\n我两眼红肿，我只有你\r\n\r\n你快在山坡上烧起\r\n\r\n快在宫殿和诗歌上烧起\r\n\r\n这是诗歌竞赛场上我的一首诗，一首诗！\r\n\r\n第十四场\r\n\r\n（音乐只用喇叭。呜咽之声。一饮酒诗人醉态踉跄，冲过舞台，高喊：）\r\n\r\n我再也不想当诗人啦！\r\n\r\n我再也不当诗人啦！\r\n\r\n我不是诗人啦！我是烈士啦！\r\n\r\n我永垂不朽啦！\r\n\r\n万岁，我再不当诗人！\r\n\r\n万岁，我再不是诗人！\r\n\r\n万岁！非诗人万岁万万岁！万岁！\r\n\r\n（一个人抱着大酒桶在舞台上狂饮，然后像受伤的狼一样，披散着毛发对着背景的沙漠狂吼嚎叫：叫嚷的词同上，重复一遍）\r\n\r\n（几个酒鬼手挽手醉态万状上）（朗诵）\r\n\r\n山上有水\r\n\r\n水中有鬼\r\n\r\n此鬼叫酒鬼\r\n\r\n山东有酒王\r\n\r\n山西有酒狂\r\n\r\n河南有酒仙\r\n\r\n河北有酒山\r\n\r\n全世界都有酒鬼\r\n\r\n随着年龄的增长\r\n\r\n酒就是兄弟\r\n\r\n酒借人说话\r\n\r\n酒为人说话\r\n\r\n他自己要说出\r\n\r\n他必然要说的\r\n\r\n他要吃的\r\n\r\n他必然吃\r\n\r\n就是酒吃人\r\n\r\n你也没办法\r\n\r\n先让酒吃一遍血肉\r\n\r\n再让法律吃一遍骨头\r\n\r\n再让火吃一遍\r\n\r\n再让鬼吃一遍\r\n\r\n我已是纯粹的粮食\r\n\r\n粮食，\r\n\r\n已认不出自己\r\n\r\n饥饿的腹部\r\n\r\n第十五场\r\n\r\n（有一个兵拿着大斧子站在身后，一直站在身后。舞台在整个一场中每隔一会儿就有另一个兵押着五花大绑的年轻人上场、默默地穿过舞台，下场。\r\n\r\n（舞台上一点声音也没有\r\n\r\n在上场下场时有一些隐约而激烈的鼓声）\r\n\r\n第十六场\r\n\r\n（大沙漠巴比仑河。\r\n\r\n（戴着大司祭面具扮成大司祭的巴比仑王）\r\n\r\n大司祭：今天的黄昏格外惨烈。我看见巨大的、浑圆的、燃烧的落日把巴比仑河水染得血红。大海的海鸥开始了尖厉凄惨的叫唤。在大地王国的边缘。更为尖厉凄惨的叫声是夜晚之枭不祥的啼鸣。在大地王国的中央，在痛苦的山上，我觉得那不祥的啼鸣发自王座和王冠。\r\n\r\n巴比仑王在这个日子中要择定一个接班人。在这一大群年轻人，在这一大群热血沸腾的诗人中，择定一位巴比仑王自己王位的继承人。还有那顶戴上国王颅骨的王冠——她曾骑在多少国王的颅骨上，又目睹这些颅骨愤怒或幸福、残暴或英明地生活过，并一一在一个不能预知的时刻死于非命。于是那些颅骨似乎是兴高采烈地被兵器——被另一只手碰一下，颅骨自己兴高采烈地跳到地上，再也回不到原来的地方，再也回不到原来的脖子上\r\n\r\n我这年高德劭的大司祭曾经几次目睹这条河流上这些王国的兴衰。早在十三反王起事之前的几个朝代，我就经常着着王位的更替，继承王位时的激烈行动。血腥的日子一到来，那巴比仑河水就会被落日映照得血红。似乎一个断头台放在了巴比仑河上——那血流成这条巴比仑河，又像是一个伟大女人的生产。这个日子的河水血红，把这个日子和千万个别的日子分开。变故已经来临。事变已经来到。我甚至还记得以前的朝代几个先王的名字和事迹。先王举办祭典、选择牺牲。有的王用处女，有的王用纯洁青年，更有的残暴的王用一对童男童女作为献祭，作为牺牲，有时王也用海豚、牦\r\n\r\n牛或骆驼作为牺牲。但当今伟大的巴比仑王一改往日。他要实现一个梦想，他要在年轻的热血沸腾的诗人中，选择牺牲品同时选择接班人。成功的被立为王子，失败的就要人头落地。牺牲者的头颅头盖骨也将供奉在太阳神庙中，作为人民朝拜的永久神器。\r\n\r\n（以下叙述时将以转换的太阳神庙的布景配合。）\r\n\r\n太阳神庙是在朝东的一块圣地上建造起来的。整个神庙是由平坦而巨大的石板砌成。当初，巴比仑王为了修建这座神庙，花费了全国一半的劳力。他们费尽血汗，用巨大的石板砌成庙宇的围墙和正门。有多少举世闻名惊天地泣鬼神的天才巨匠和建筑师的尸骨就砌在这些巨大石头的墙和门中。建造神庙过程中，他们用精心修凿的直角石块彼此衔接，结合得相当紧密而不用任何粘合物质，以至它们之间的缝隙连一把巴比仑最薄最锋利的刀都插不进去。\r\n\r\n太阳神庙还有一个根优美的祭台。大殿的四周墙壁上下全部是金子。所以这座神庙又名叫“黄金宫殿”。在正墙上绘有太阳神偶像。他全身黄金，周围环绕火焰。他面朝东方，接受着初升的太阳光芒的直接照射，就放出万丈金光。大殿中央放着一个华丽的御椅，远远地放在中心。举行典礼时，巴比仑王就坐在这上面。巴比仑王知道自己年纪已老，尚无接班人。那位唯一的王子自小就失踪。这些年少有消息。有的说他去了沙漠死在沙漠上了。近日有所传闻。民间的小道消息很多。山坡上种了许多消息树。风吹草动，但又有所平息。所以巴比仑王横下一条心，决定在青年诗人中选定王子，让他来继承王位。以诗歌大竞赛来选择王子和接班人，这是历史上少有的行动。这是少有的慷慨也是少有的残酷。像这位巴比仑王其他的行动一样，充满了着魔的东西。充满了火焰和灰烬的品质。充满了力量与魅惑。这就是大地的魔法。\r\n\r\n这就是大地的魔法。地母的咒语。大地母亲啊，等会儿我用最纯洁的年轻人的血——那年轻的诗人之血，献给你。\r\n\r\n在这个日子里只剩下两个年轻人，诗人。\r\n\r\n在全巴比仑境内，各部族各地方最优秀的诗人举行全巴比仑诗歌大竞赛后，只剩下两个年轻的诗人。\r\n\r\n一个是青草。一个是吉卜赛。这两人名字很好。他们的诗歌更好。诗中也都有王者之声。他们的面貌英俊，彼此酷似，简直像一对孪生兄弟。\r\n\r\n但是，伟大的巴比仑王让他俩今日在此王官大厅里举行他们最后的诗歌竞赛。其他的诗人，像那些诗人，已上场的无名人、小瞎子、稻草人、流浪儿、纵火犯、酒鬼等等早已退场，或赴刑死去了。\r\n\r\n伟大的巴比仑王让他俩今日在此王宫大厅里举行他们最后的诗歌竞赛，也就是要进行巴比仑王自己的选择。因为他在旁边要静静观看这一竞赛，让长老们秘密投票，然后由他决定，那被决定为王子的必须充当一次刽子手！杀死那被充当今日祭典中牺牲的一人！这个时刻令人不寒而栗，因为被选择作为牺牲的，总是头生子、最美丽的处女、最优秀的青年和最纯洁的儿童。我既然曾经献身于大地之母的魔法，我就必须进行到底。我现在是神魔附体。我是这儿的大司祭。我这条命已完全着了魔。甚至渴望那恐怖的事情早一点发生，好让我早一点目睹，早一点体会到恐怖。巴比仑王干了好多恐怖的事情，但从没有今日干的事倩这样恐怖。\r\n\r\n用牺牲供奉一个日子\r\n\r\n坐在这大神庙的台阶上\r\n\r\n多少人头铺垫而成\r\n\r\n我坐在大沙漠上一个断头台\r\n\r\n是多少人血流了干净\r\n\r\n我是苍老而空虚的剑。这就是\r\n\r\n寂寞的剑，在绝望孤独的日子\r\n\r\n时刻说的话：我要宰人\r\n\r\n我要让鲜血从大沙漠上经过而流过、流光\r\n\r\n太阳大神你知道\r\n\r\n让兄弟俩在我面前互相残杀\r\n\r\n让一个人踏着另一个的头颅走向王座\r\n\r\n用理想和诗这心中之剑互相屠杀\r\n\r\n老巴比仑王啊，你这一招是想绝了。真是空前绝后。算得上巴比仑王国史上一大笔。也就是这土地上的一大笔。是给血腥的太阳大神的丰厚的牺牲之礼。我要抖擞精神，举行这次献祭。\r\n\r\n看！他们上来了！\r\n\r\n（青草、吉卜赛、巴比仑王上\r\n\r\n巴比仑王是公主红装扮的，头戴王冠巨大，面戴面具。大家\r\n\r\n沉默的、严肃的走上，没有谁说一句话）\r\n\r\n（另外有五位长老白发苍苍排列一旁）\r\n\r\n（众人仍然被红色布条蒙上眼睛）\r\n\r\n——————————\r\n\r\n　此处原书为“耗”，今改之。——骨注\r\n\r\n第十七场\r\n\r\n（一群台下红色盔甲的兵涌上舞台。一兵押青草穿过人群上舞台中央\r\n\r\n（荒芜的山上。断头台）\r\n\r\n青草：\r\n\r\n青草被秋天和冬天处死在荒芜的山上。\r\n\r\n那时，我仿佛躺在一辆残破的骷髅上。\r\n\r\n骷髅是一辆车子和四只轮子。\r\n\r\n车子叫生命也叫死亡。车夫叫思想也叫灭亡。\r\n\r\n四只轮子是手是脚是内脏是营养是草根是土壤。\r\n\r\n身上盖着一堆杂乱的黄草杆。\r\n\r\n青草变黄。人成白骨。\r\n\r\n吉星闪耀。黎明就要来到\r\n\r\n在荒芜的山上处死青草\r\n\r\n秋天的刑法！秋天的刑罚1\r\n\r\n降临无辜的和灭不绝的青草\r\n\r\n我告诉你。我知道自己是谁。我的命是什么。我的女人是谁。我的事物是什么，但是在我的诗歌中不能告诉你这些。\r\n\r\n在我的诗歌中，我的名字叫青草。山冈上牧羊人和羊群叫我青草。太阳叫我青草。月亮叫我青草。风叫我青草。黎明和黄昏叫我\r\n\r\n青草。\r\n\r\n在我的诗歌中，春天流血，夏季繁衍，大雪中的火在狂舞，还有无穷无尽地翻滚而来的，从天上飞来的秋天。白云，死亡和问候。还有寂寞的尸体上的星光、草原，草原上死去的新娘，以及牧羊人在山峰上的问候。\r\n\r\n在我的诗歌中，你知道我叫青草，但不知道我是谁。你知道我的诞辰、我的一生、我的死亡，但不知道我的命。你知道我的爱情，但不知道我的女人。你知道我歌颂的自我和景色，但不知道我的天空和太阳以及太阳中的事物。\r\n\r\n但是在我的诗歌中我不能告诉你我的事物。这不是蔑视你们。我的皇帝。我的司仪。我的对手我的兄弟。我们一母所生，但你死我活。诗歌是我们的内容，是杀害我们的内容。\r\n\r\n一个灵魂迎面而来\r\n\r\n肉体长出青草，梦变成真实\r\n\r\n事实的法律和酒的法律——是两扇日夜的\r\n\r\n大门。青草借我肉体说话\r\n\r\n青草借我这暂时的肉体，和他的声音说\r\n\r\n青草他开口说\r\n\r\n我是青草的王，星系的王\r\n\r\n我投向人类之外，生死隔开\r\n\r\n人类和青草再不会是同胞兄弟\r\n\r\n我要投入种籽、河流或一只独放的花\r\n\r\n居住在花朵的蕊，我和她一起另外地开放\r\n\r\n另一次男女　受孕\r\n\r\n青草杀死了青草\r\n\r\n（女巫，在荒芜的山顶出观，旁白：）\r\n\r\n我为什么要让你们一个一个上路，一个一个的去干，去行动，而不能集体行动。这一下你该明白了吧。如果你们之中谁想两个人一起去干，他们一定会互相残杀。老家来人了。前后没有人。左右没有人。但老家来人了。\r\n\r\n劫难之中老家来人了。\r\n\r\n青草：让我们一道飞离这荒芜人烟的山梁\r\n\r\n（舞台黑暗。很长很长时间的鼓声）\r\n\r\n第十八场\r\n\r\n吉卜赛：（吉卜赛神思恍惚，已被摧毁，上）\r\n\r\n十个太阳同时出现在大海的天空上。\r\n\r\n大海中央有一棵树。\r\n\r\n根在太阳枝叶花朵盛开在大地上。\r\n\r\n那一日天地裂开无以为继。\r\n\r\n树上跳下一个遍体通红的女婴。\r\n\r\n一座血红的山在天上飞。\r\n\r\n村庄在天上飞。\r\n\r\n所有的人马和东西在天上飞。\r\n\r\n所有的水火中都长出了人形。\r\n\r\n似乎有一个红色燃烧的人在拔苗助长。\r\n\r\n（在舞台深处有一人着红衣拔苗助长）\r\n\r\n人类粮食喂养胃和眼睛。\r\n\r\n水火中长出了无毛的，在地上爬行、行走。\r\n\r\n固体的鲜血从天空深处飞来。\r\n\r\n小仙女歌队\r\n\r\n甲：谁爱过人类？\r\n\r\n乙：人类爱过人类？\r\n\r\n丙：美丽的女儿爱过人类？\r\n\r\n丁：人类真的爱过人类自己？\r\n\r\n歌队长：剑带着鲜血和霞——\r\n\r\n捧住渐渐溶化的女神\r\n\r\n女孩和少年，这都是\r\n\r\n你们自己铸造而用来灭亡的\r\n\r\n一柄剑如今捧在我手上。\r\n\r\n吉卜赛：青草已把他的头颅送给我做武器。我的同胞兄弟。让我抱着他的头颅做武器。我一定要坚持到最后。完成这个工作。我以诗歌为武器，杀死了我的同胞兄弟。我现在已成了王子。（疯狂大笑）这是暴君的王子。现在都是没头的王子。我一定要完成无头王子的使命。\r\n\r\n（红，扮成巴比仑王。上。巴比仑王，扮成大祭司。上。红在此场一直沉默。）\r\n\r\n大祭司：恭喜你，吉卜赛。巴比仑王今日通过诗歌竞赛，选了你作为王子。让你继承王位。你高兴吧，我看你都流泪了。\r\n\r\n现在你走近我们伟大的巴比仑王，吉卜赛。让他授予你一柄宝剑。把王子的身份和像征传授于你。你今后就是巴比仑王国的当然继承人。\r\n\r\n吉卜赛：对，就在今天。\r\n\r\n（接过红默默递过的宝剑。红的手臂在微微发抖。）对，就在今天！今天！\r\n\r\n（把剑刺入红）我终于成功了。巴比仑王，暴君，我终于让你的血染红了宝剑。两位哥哥，你们安息吧。\r\n\r\n红：（慢慢倒下）\r\n\r\n吉卜赛，哥哥，摘下我的面具，好好看看我是谁。早在草原和沙漠上，我就认识你，你也认识我。你爱我，可我只爱宝剑。我为什么没有爱上你呢。在这生命的最后时刻。我似乎清醒了。我的疯狂的理智又回来了。我是自己要求扮演巴比仑王的。想一想，不要悲哀，没有什么好悲哀的。人类的事只有很少几件。不就是在这彩色的布景——沙漠、草原、河流和王国宫殿——前面的一些谈话吗？我们大家不都是在这彩色布景前讲几句话，做几个动作？有时，我们的时间错了——就像私人的钟比公共的钟快了一点或慢了一点，地点错了，也许我们扮演的角色也错了，这不是你我的过错。你不要悲哀。就像在沙漠上我拒绝你的爱一样，你刺了我，这都没什么错。我们都是彩色布景前的角色。我就是红，我就是你在无数诗歌中歌唱或倾诉的红，我爱你的诗。\r\n\r\n（吉卜赛把剑插入胸膛）\r\n\r\n红：（转向大祭司）\r\n\r\n我知道你是谁。我不怪你。我只想让你把宝剑在我死前找来。我想看一看他，最后。（鼓，沉闷激烈）\r\n\r\n第十九场\r\n\r\n（红，宝剑）\r\n\r\n剑：我一定要替你报仇。\r\n\r\n红：天上的白云多么美丽。每当季节转换的时候，我多么爱这一切，爱被新的季节换下的旧季节。我爱一切旧日子，爱一切过去的幸福。爱那消逝了的白云。天上的白云多么美丽。每当天上的白云飘过，当你仰望万里晴空，那朵朵白云使你觉得已到初秋——却还只是初夏的时候，每当你暴雨的黑夜里孤灯守剑的时候，每当青草麦儿变黄而穗儿垂得更低，青青豆角盛在篮筐里的时候……每当找出去年的花裙、去年的凉鞋和扇子的时候，我多想留住这即将逝去的春天和花朵的
