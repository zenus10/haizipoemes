红色……你不要忘了天上的白云。忘掉我吧，不要忘了季节转换的那一瞬，不要忘了眼泪一样的雨滴抹在窗子上，不要忘了一棵灯和北方的九棵树，也不要忘了大河上涨，更不要忘了雪山、草原和我们流浪的日子。忘了我吧。如果有可能，也不要忘了我。不要勉强你自己。不该忘记的就不要忘记。\r\n\r\n剑：我一定要为你报仇。\r\n\r\n红：不要用我的眼泪和言语去擦亮你的宝剑。不要把你的宝剑磨得格外锋利。它刺入的每一人都会是我，你最爱的人。磨亮它的每一滴鲜血都是我的鲜血。不要在午夜时分把你的宝剑磨得格外锋利。它会在它锋利时突然要走我。我就要走了。来，抬起我的头，让我枕你的双膝休息片刻。一片白光的天空把我背在它的背上，又空又轻，无边无际。会带到一个你我从来都不知道的地方。那儿比天空更高、比大地和远方更远、比子夜更黑、比北方的冬天更冷、比南方的沙漠更热、这宝剑会把我带走，也会把一切人入带走\r\n\r\n（死去）\r\n\r\n剑：我一定要报仇！\r\n\r\n宝剑 （独白）；\r\n\r\n在你们找到归宿的时候，我却要上路了。不要忘记这一点。闭紧你们的眼睛吧。你们放心地睡去吧。我就要背着一只很破很旧的袋子上路了。\r\n\r\n这只破旧的袋子就是我。\r\n\r\n曾经在大沙漠上长大。\r\n\r\n多少人用手撕破了他。\r\n\r\n多少豹子用爪子撕了他。\r\n\r\n但这只破旧的袋子\r\n\r\n就是我和我的心啊。\r\n\r\n会感到什么\r\n\r\n有没有心情\r\n\r\n是什么样的心情\r\n\r\n我不知道前面等待我的\r\n\r\n是什么？\r\n\r\n我要独自前行\r\n\r\n幕间过场一场\r\n\r\n第二十场\r\n\r\n（此场为两幕之间过场）\r\n\r\n（舞台沉默三分针。黑暗，灯光大亮\r\n\r\n（宝剑他仍坐在那儿。又上来一位老头——由疯子头人扮演者扮演——和一位小女孩——由红的扮演者扮演）\r\n\r\n（幕间幕；演鲁迅的《过客》小剧）\r\n\r\n第三幕\r\n\r\n第二十一场\r\n\r\n（疯子老头，绿色小鸟）\r\n\r\n疯：你知道吗？\r\n\r\n鸟：我知道什么？\r\n\r\n疯：那位最小的反王逃走了。\r\n\r\n鸟．逃到哪儿去了？\r\n\r\n疯：逃到沙漠上去了。\r\n\r\n鸟：那么，被押上刑场的是谁？\r\n\r\n疯：是魔王的兄弟。\r\n\r\n鸟：他为什么替小反王去死\r\n\r\n疯：他自己愿意。这样，最小的反王，也就是天下经常传说的那位不死的无名的国王，可以逃脱了，逃走了，他当然有自己的使命。\r\n\r\n鸟：是不是天下传说他从来不会死？\r\n\r\n疯：对。从不死亡。像我一样。不过，我是超出死亡之外，而他是屡屡逃脱死亡的拥抱。我真想见见他，见见他，是一个什么样的人？！\r\n\r\n鸟：那位无名的国王总算从死亡和刽子手、断头台的手中逃脱了，他有什么使命？那位魔王的弟弟竟心甘情愿地为他去死。他有什么使命？\r\n\r\n疯：他要到沙漠上去建立一个新的王国。他还有一个次要的使命，就是要为兄弟——也就是为那些反王报仇，杀死巴比仑王，也就是要杀掉他的八哥。\r\n\r\n鸟：他完成自己的使命了吗？\r\n\r\n疯：十五年前，或者说世纪交替之时就完成了。他在沙漠上建立了一个十分强大十分完美的王国。他自己当上了国王。另外，为了完成较小的使命，这次，四个诗人杀巴比仑王，就是他的安排。\r\n\r\n鸟：但是，巴比仑王到现在还没死呵。\r\n\r\n疯：他离他自己的死亡不远了。你一定会看到的。绿色的小鸟，你一定会看到巴比仑王的死亡，绿色的生命的小鸟。\r\n\r\n鸟：这四个年轻的诗人和他又是什么关系？\r\n\r\n疯：他在逃亡沙漠的时候，其实并不是逃亡。因为实在的说来，他——这位最小的反王，这位人称无名的国王的人，并不是我们巴比仑的人。他也不是喝巴比仑河的河水长大的。他是沙漠上的人。他在沙漠上出生。他在沙漠上长大。连沙漠上的人都不知道他的父母是谁。\r\n\r\n鸟：他自己知道他的父母是谁吗？\r\n\r\n疯：这一点我也不清楚．但我见过他写下的一些杀父的诗。置下人传说，他认为他的父母是巴比仑人。所以他少年时代就回到巴比仑。他一身是胆，虽然年纪最轻，可仍然是反王中最勇敢的一个。他还是个诗人，他是世纪交替之际最伟大的诗人。这四个年轻的诗人——就是要杀巴比仑王的这四个年轻的诗人，猛兽，吉卜赛，青草，宝剑，甚至还有我们的公主，为什么都是诗人，就是受这位无名的国王的影响。他不光是无名的国王，不光是无名的伟大的国王；还是一位无名的伟大的诗人。据说——不，其实是返回他的沙漠故乡，之后，尤其是他当上沙漠上的王以后，那诗歌更是数代以来无人能望其后尘。\r\n\r\n鸟：有这么严重吗？\r\n\r\n疯：因为我读过他在沙漠上写的几首诗，还有几首是沙漠上的王者之诗，而且因为我好歹也算是个诗人。不是夸口，在几百年前的巴比仑，到处都流传着我的诗歌。再让我们继续回到谈话上来。他去沙漠时带走了魔王的儿子，猛兽，还偷走了巴比仑王的小婴儿，宝剑，远走高飞，在沙漠奋斗了多年，在他的故乡终于当上了国王。终于成了全世界唯一的沙漠之王，我还要说，他是全世界唯一的诗歌之王，诗歌皇帝。\r\n\r\n第二十二场\r\n\r\n（疯子头人，宝剑）\r\n\r\n疯：我知道你就会再来的。\r\n\r\n剑：我来了。\r\n\r\n疯：是谁让你来的？\r\n\r\n剜：青草和吉卜赛。\r\n\r\n疯：他们都已经死了。\r\n\r\n剑：是的。\r\n\r\n疯：你要找的人也死了。\r\n\r\n剑：是的。\r\n\r\n疯：你要找的是个女人。\r\n\r\n剑：对。\r\n\r\n疯：是个公主。\r\n\r\n剑：对。\r\n\r\n疯：她是你妻子。\r\n\r\n剑；对。\r\n\r\n疯；你来找我有什么事？\r\n\r\n剑。我有好多话要问你。\r\n\r\n疯：问吧。\r\n\r\n剑：吉卜赛和青草为什么在几年前突然离开了自己的父母和部落，来到巴比仑？\r\n\r\n疯：因为巴比仑不光是你的故乡，也是他们的故乡，还因为他们俩同时爱上了一个妇女，那个妇人又美丽又高贵，又是他们好朋友的妻子。那个好朋友就是你。\r\n\r\n（停顿片刻）\r\n\r\n剑：好。这我早就猜出一些。\r\n\r\n疯：所以他们抛弃父母，远走他方，寻找另外的生活。他们也知道你会把他们的父母当成自己的一样。\r\n\r\n剑：因为我从小就和他们一块长大。他们的妈妈也是我的妈妈。我是喝这个妈妈乳汁长大的。我后来才知道，我是一个孤儿，被人抛弃，是他们将我收养的。\r\n\r\n疯：后来你又离开这位母亲了。\r\n\r\n剑：我是万不得已。把她托付给部落里的人了。我们的族人都非常好。比巴比仑的人好千万倍。我的妻子有一天突然离开了我，那时她已经怀孕。我离开妈妈出来找她，千辛万苦来到巴比仑。\r\n\r\n疯：见到了吧。\r\n\r\n剑：见到了。\r\n\r\n已经死了。\r\n\r\n刚才说过了。\r\n\r\n第二十三场\r\n\r\n（巴比仑王在疯狂地奔跑——背景通红闪动不熄。巴比仑王在奔跑。众回声——几个与巴比仑王一样的人在后面紧追不舍。众回声的声音比巴比仑王的声音更响）\r\n\r\n王：我怎么啦\r\n\r\n回声：我怎么啦\r\n\r\n王：难道我疯啦\r\n\r\n回声：难道我疯啦\r\n\r\n王：我要干什么\r\n\r\n回声：我要干什么\r\n\r\n王：你们这些鬼魂要干什么\r\n\r\n回声：你们这些鬼魂要干什么\r\n\r\n王：为什么总纠缠着我\r\n\r\n回声：为什么总纠缠着我\r\n\r\n王：我受不了啦\r\n\r\n回声：我受不了啦\r\n\r\n王：你们是沙漠上的鬼\r\n\r\n回声：你们是沙漠上的鬼\r\n\r\n王：你们是海底的鬼\r\n\r\n回声：你们是海底的鬼\r\n\r\n王：你们是火焰中逃出的鬼\r\n\r\n回声：你们是火焰中逃出的鬼\r\n\r\n王：你们是屈死鬼\r\n\r\n回声：你们是屈死鬼\r\n\r\n王：我受不了啦\r\n\r\n回声：我受不了啦\r\n\r\n王：我真的受不了啦\r\n\r\n回声：我真的受不了啦\r\n\r\n王：我的头盖骨都碎了\r\n\r\n回声：我的头盖骨都碎了\r\n\r\n王：我崩溃了\r\n\r\n回声：我崩溃了\r\n\r\n王：我完蛋了\r\n\r\n回声：我完蛋了\r\n\r\n王：滚开\r\n\r\n回声：滚开\r\n\r\n王：饶了我吧\r\n\r\n回声：饶了我吧\r\n\r\n第二十四场\r\n\r\n廷臣甲：巴比仑一片混乱。\r\n\r\n廷臣乙：诗歌竞赛不了了之。\r\n\r\n廷臣酉：被立为王子的死了。\r\n\r\n廷臣丁：公主死了。\r\n\r\n廷臣甲：巴比仑一片混乱。\r\n\r\n廷臣乙：眼看大厦将倾。\r\n\r\n廷臣丙：王国后继无人。\r\n\r\n廷臣丁：一切人都死光。\r\n\r\n廷臣甲：巴比仑的末日就要来临\r\n\r\n（巴比仑王上）\r\n\r\n王：你们在巴比仑河畔找到了那个老疯子吗？\r\n\r\n你们在巴比仑河畔找到了那个自称活了几千岁，自称疯子头人的老疯子吗？\r\n\r\n廷臣甲：找到了，万岁。\r\n\r\n王：带他上来。每当巴比仑一片混乱，尤其是王位混乱的时候，百姓们就会在王宫前示威游行，绝食斗争，要求巴比仑的王去请疯子头人，听从疯子头人的劝告。这已是巴比仑几千年历史上不成文的法律。还没有人违犯过这条法律。这条法律是专为巴比仑世代诸王而立的。乱世的巴比仑的王都曾派人去巴比仑河畔请求疯子头人，以免王国的混乱和灾祸，也不知这几千年来，疯子头人是不是就这一个。\r\n\r\n廷臣：看，他来了，怎么还带着一个年轻人。\r\n\r\n（疯子头人和宝剑上。都带着面具。\r\n\r\n四个抬棺人抬着棺材同时上）\r\n\r\n疯：他们都在说\r\n\r\n那高高的山上\r\n\r\n就是我这一付\r\n\r\n怪模样。\r\n\r\n疯子头人我\r\n\r\n怒容满面\r\n\r\n把一切撕碎\r\n\r\n在国王面前。\r\n\r\n请听四个抬棺人\r\n\r\n唱的一支歌\r\n\r\n四个抬棺人。（合唱或朗诵）\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：法官的日子将过去。\r\n\r\n丁：犯人的日子将来到。\r\n\r\n甲．什么日子将过去？\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：你的日子将过去。\r\n\r\n丁：他的日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：男人的日子将过去。\r\n\r\n丁：女人的日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：在天的日子将过去。\r\n\r\n丁：在田的日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：穷人的日子将过去。\r\n\r\n丁：富人的日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：喝酒的日子将过去。\r\n\r\n丁：流鼻血的日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：绿色的日子将过去。\r\n\r\n丁：红色的日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：纽约的日子将过去。\r\n\r\n丁：巴比仑的日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将未到？\r\n\r\n丙：美元的日子将过去。\r\n\r\n丁：血液的日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：富人的日子将过去。\r\n\r\n丁：穷人的日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：巴比仑的日子将过去。\r\n\r\n丁：太阳的日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到。\r\n\r\n丙：美女的日子将过去。\r\n\r\n丁：坐牢的日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：庸俗的日子将过去。\r\n\r\n丁：自由的日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：美元的日子将过去。\r\n\r\n丁：斧子的日子将来到。\r\n\r\n甲：什么日子将过去。\r\n\r\n乙：什么日子将来到？\r\n\r\n丙：皇帝的厨子将过去。\r\n\r\n丁：断头台日子将来到。\r\n\r\n甲：什么日子将过去？\r\n\r\n乙：什么日子将来到。\r\n\r\n丙：在田的日子将过去。\r\n\r\n丁：在天的日子将来到。\r\n\r\n疯子头人（对宝剑，大声吆喝，如劳动号子）\r\n\r\n（和四个抬棺人一起吆喝）：（这些人在打夯）：\r\n\r\n孩子！\r\n\r\n儿童！\r\n\r\n为了数学！\r\n\r\n为了数学！\r\n\r\n大家前进！\r\n\r\n大家抬着棺材！\r\n\r\n棺材太沉太沉！\r\n\r\n棺材里不止一人！\r\n\r\n为了数学！\r\n\r\n大家前进！\r\n\r\n大家往一块儿走！\r\n\r\n大家住前走！\r\n\r\n排成一行！\r\n\r\n抬着棺材！\r\n\r\n鲜血染红！\r\n\r\n谁要问我！\r\n\r\n走火入魔！\r\n\r\n谁要问我！\r\n\r\n牵肠挂肚！\r\n\r\n为了数学！\r\n\r\n抬着棺材！前进！\r\n\r\n（众人抬着红色棺材下）\r\n\r\n第二十五场\r\n\r\n（山上，宝剑似乎抱剑坐在山顶\r\n\r\n老女奴，女巫）\r\n\r\n巫：就让他哭吧；就让他哭个够吧。\r\n\r\n奴：巴比仑河在巴比仑深夜的肉体上像血液静静地流。\r\n\r\n巫：就让它流吧，既然它愿意。几千年来不就是一直这样流着。\r\n\r\n奴：我的儿子又裹紧了身上黑色的斗篷，止住了哭泣。\r\n\r\n巫：但仍然在对着鬼魂讲话。\r\n\r\n奴：不，他是在独自歌唱。\r\n\r\n巫：宝剑闪着寒光，\r\n\r\n奴：今夜更加昏暗，\r\n\r\n巫：河水还在上涨，\r\n\r\n奴：月亮已经发红。\r\n\r\n巫：这不是河水上涨的季节。\r\n\r\n奴：宝剑闪着寒光。\r\n\r\n巫：下面是腐败的山河，\r\n\r\n奴：宝剑照着腐败的山河。\r\n\r\n巫：下面是无知无觉的粘土。\r\n\r\n奴：白花花的石头，\r\n\r\n巫：红惨惨的地火，\r\n\r\n奴：黑铁和青铜，\r\n\r\n巫：还有更少的黄金，\r\n\r\n奴：铸成他手中宝剑，\r\n\r\n巫：寒光闪闪，\r\n\r\n奴：似乎比黑夜本身更深；\r\n\r\n巫：剑叶上浸透鲜血。\r\n\r\n奴：恨不得跳起来，\r\n\r\n巫：刺穿谁的喉咙。\r\n\r\n奴：手不能发抖，\r\n\r\n巫：心不能脆弱，\r\n\r\n奴：当心……\r\n\r\n巫：当心……\r\n\r\n奴：不要独自一人呆在山上。\r\n\r\n巫：不要独自在夜深歌唱。\r\n\r\n奴：不要歌唱失去的一切。\r\n\r\n巫：更不要哭泣。\r\n\r\n奴：鼓起你勇气。\r\n\r\n巫：剑在人在。\r\n\r\n奴：剑亡人亡。\r\n\r\n（沉默）\r\n\r\n奴：我们走吧。\r\n\r\n巫：已讲过一切劝告。\r\n\r\n奴：我们走吧。\r\n\r\n巫：还要在今夜。\r\n\r\n奴：爬上山顶。\r\n\r\n巫：我把剩下的粮食堆在一块，\r\n\r\n奴：还要竖起一块高大的石头做为仓门。\r\n\r\n第二十六场\r\n\r\n（造剑的场所。造剑师与几柄剑的对活。\r\n\r\n都戴面具。几柄剑似乎在饮血吃饭）\r\n\r\n剑甲：食物放在这一切上面。\r\n\r\n剑乙：血放在食物上面。\r\n\r\n剑丙：剑放在血上面。\r\n\r\n剑丁：即使这样，我也不后悔。\r\n\r\n剑甲：魔，所不能达到的东西，我己经达到了。\r\n\r\n剑乙：他是皇帝还是戏子？！\r\n\r\n剑丙：什么叫脱胎换骨？！\r\n\r\n剑丁：一只碗放在一只碗中。\r\n\r\n剑甲：水\r\n\r\n剑乙：冲下来\r\n\r\n剑丙：是血\r\n\r\n剑丁：两只勺子，两马\r\n\r\n剑甲：还在我另一只碗中！\r\n\r\n（铸剑师，面向观众，大声）：\r\n\r\n我是铸剑人。\r\n\r\n我不说的事情。在这之后我不说\r\n\r\n我不说就是不说\r\n\r\n我要。水变成大水\r\n\r\n冲开了缺口。完成普通人早已完成的\r\n\r\n是多么难——还要和\r\n\r\n命运之诗连锁在一起\r\n\r\n这就是铸剑人的命。\r\n\r\n长过大火。\r\n\r\n长过他们。\r\n\r\n（这都是不太重要的）。\r\n\r\n（一柄红色宝剑的独白。演员着红色盔甲，其他人是白色盔甲）：\r\n\r\n三道门下\r\n\r\n我一身红色盔甲。\r\n\r\n我一定是一位年轻的皇帝。\r\n\r\n我是大革命的儿子。\r\n\r\n这是什么日子？\r\n\r\n我为什么俯伏在肮脏的酒柜上\r\n\r\n我是大革命中谁的宝剑\r\n\r\n——被扔在这肮脏的酒柜上。\r\n\r\n我在哪些日子中闪闪发亮。\r\n\r\n又在哪些日子里暗淡无光，蒙上了灰尘\r\n\r\n宝剑之母你在何方？\r\n\r\n众剑之母，我问你\r\n\r\n我为何一无所有的走在大街上。\r\n\r\n第二十七场\r\n\r\n（这一场是一次秘密谈话，给人的感觉要是一个人在自言自语。好像从山腹中传出了一些片言只语，给那些山上的人。这一场舞台的幕布紧合。或者，舞台一片黑暗，看不见任何东西。或者，舞台上空空荡荡，像挖空的山的肚子，只有两把空空的椅子，在舞台中央，面对面放着，像是两个人坐在山肚子里进行秘密的谈话。舞台上有时而清晰时而模糊混乱巨大嘈杂的声音。用省略号的地方表示混杂用一面巨大的鼓。）\r\n\r\n你亲手杀死了我的两个兄弟。他们几乎还是像儿童一样纯洁……她是我女儿，她自己愿意……互相残杀，因为他们要杀我……孩子，你一定要我说出真相吗？你是她的兄弟。她是我的女儿。你是我的儿子……我就把你的脖子拧断去喂每一条过路的巴比仑的狗……我只想让你一人继承王位，如果我不杀死他们……我干了一切可以干的事。我喝下毒药。我只有一个时辰可活。我活不到黎明了。我活不到下一个黎明了。我把手诏和王印留给你。……那么，让这铁打的江山黄金的土地变成这同一个黑夜……你被遗弃后，在沙漠部落中长大。而她长大后就出门寻找哥哥，没想到遇见了你，更没想到你就是她哥哥……有人告诉了她……思念家乡，，还发了疯……我把——手诏——和——王——印——留——给——你。（以下声音变得清晰）今夜是你我的日子。今夜是黑暗之夜，空虚之夜。今夜只适合死亡不适合出生。我们已没有明天。明天是别人的日子。巴比仑河上又涌起无边的朝霞的大浪。我的兄弟和爱人又会复苏在他们之间，在曙光中间。只有你我不会复活。你我的生存只有一次。你我的关系，你我一切仇恨和血决定了你我的这一次。那就是今夜。那就是这个子夜。那就是这个最后的日子，夜的语言和宝剑。你我都必须满身肮脏地死去，在这个纯洁得像空气和水的黑夜里，父王，让你和我一起肮脏地死去吧。你我都必须在这个子夜，夜深人静的时辰死去。子夜……这个回忆的粘土层……比王冠和王座还要漫长。巴比仑，这个几乎一直被魔法统治的国土，好几千年了，天空的数学，人类之梦大同之梦，你为全巴比仑制订的法律只是咒语。\r\n\r\n（鼓声）\r\n\r\n第二十八场\r\n\r\n（酒店。众人饮酒。幽灵重现的场景，\r\n\r\n两个人抬着红色棺木上）\r\n\r\n抬棺人甲：瞧，一个灵魂迎面走来。\r\n\r\n棺人乙：死人的事是经常发生的。\r\n\r\n你头发散乱，简直像一个鬼魂。\r\n\r\n甲：不管这次他是谁。反正他胜了。\r\n\r\n乙：一切听天由命，必须达到一个高度。\r\n\r\n甲：我们两个抬着的棺材就是这个高度。\r\n\r\n乙：我们在谈话。\r\n\r\n乙：我们要达到的难道不是同一个东西？！\r\n\r\n（疯王子宝剑上）\r\n\r\n剑：（指着红色棺木问二抬棺人）\r\n\r\n这难道是车子？！\r\n\r\n人车各行其道。\r\n\r\n人就是人，车就是车。\r\n\r\n是众神之车。本来是不同的道路。\r\n\r\n人车各行其道。\r\n\r\n这难道是车子？！\r\n\r\n车子把我和她抱在一起，\r\n\r\n车子把我和公主抱在一起，\r\n\r\n我们都是女儿所生。女儿是谁？\r\n\r\n车头是谁？鸟要叫，\r\n\r\n鸟在叫。鸟是谁？\r\n\r\n鸟说应该提醒你，\r\n\r\n疯狂中我是谁？\r\n\r\n（两个抬棺人面具和服装做鸟类）\r\n\r\n甲：这是一个让人生锈的夏天，\r\n\r\n乙：连夏天之鸟，连燕子，连空中飞过的鸟都生锈。\r\n\r\n甲：这是一个连松鼠和豌豆都生锈的夏天\r\n\r\n乙：连露珠都生锈，更何况沾满血迹的兵器？\r\n\r\n剑：在我的记忆里\r\n\r\n这是狮子和老鼠生下的六小时，子夜住在\r\n\r\n太阳子宫，生下的小野兽\r\n\r\n两只小鸟变作抬棺人\r\n\r\n拉着棺材和车子\r\n\r\n小鸟奔跑在路上\r\n\r\n又痛哭又是幸福\r\n\r\n感到了人类空虚\r\n\r\n每日抬棺磨剑不止\r\n\r\n激发了我的疯病。\r\n\r\n（两个抬棺人唱歌）：\r\n\r\n空白一段时间\r\n\r\n空出一段时间\r\n\r\n做一会儿石头\r\n\r\n做一会抬棺人\r\n\r\n小鸟，抬着红色的棺材，飞在天空\r\n\r\n用酒补好了棺材\r\n\r\n用酒做一个补丁\r\n\r\n用酒补好了石头\r\n\r\n用酒补好了傻子\r\n\r\n用酒补好了乞丐、白痴，贫穷\r\n\r\n和疾病。用酒补好了粮食\r\n\r\n用酒做一个补丁\r\n\r\n多好的大补丁\r\n\r\n棺材像一棵火红的巨大的枫木树\r\n\r\n内心发空，其实并没有死人\r\n\r\n用酒补好了乌鸦和喜鹊\r\n\r\n酒鬼像一棵小型枫木劈成的战车\r\n\r\n内心发空，两眼发直，这棵酒精之树无疆万寿。\r\n\r\n内心发空。收缩\r\n\r\n无一人端坐其中\r\n\r\n巨大的冠盖火红\r\n\r\n如血涌向头脑\r\n\r\n我不知道。\r\n\r\n我确实不知道\r\n\r\n我自己说了些什么\r\n\r\n我拼命想。可我再也想不起\r\n\r\n怎么办？皇帝在陵墓中哭泣？内心发空\r\n\r\n抬棺人啊抬棺人是我们\r\n\r\n我怎样消化一次皇帝的死亡？\r\n\r\n这是一个咒语。\r\n\r\n剑：大鸟又叫了。又叫了\r\n\r\n不祥的大鸟又叫了\r\n\r\n是南方还是北方的大鸟又叫了\r\n\r\n如果我的欢乐不在天堂\r\n\r\n大鸟又叫了。小鸟两只\r\n\r\n你不能口吐人言\r\n\r\n你难以说清\r\n\r\n你一时难以说清。你又叫一声\r\n\r\n……我也染上人类恶习\r\n\r\n倾听：占卜！鸟骨！飞翔呜呼！\r\n\r\n鸟类的公主，鸟类的抬棺人\r\n\r\n大鸟在叫什么？乌鸦，她怎样了？\r\n\r\n然后又怎样？\r\n\r\n甲乙：血越浓\r\n\r\n剑：剑越快\r\n\r\n甲乙：爬上的山越高\r\n\r\n剑：造成的错误越大\r\n\r\n甲乙：忘了更多。\r\n\r\n剑：死得更快。\r\n\r\n甲乙：活得也更多。\r\n\r\n剑：死得也更快。\r\n\r\n（三人抬棺而下，出酒店，穿过巴比仑城门）\r\n\r\n第二十九场\r\n\r\n廷臣：王子，你上哪儿去？\r\n\r\n宝剑：出去！\r\n\r\n出去！\r\n\r\n到王国之外去！\r\n\r\n出去！\r\n\r\n（以下舞台空空荡荡，只有一个演员朗诵）\r\n\r\n宝剑：不管这一次他是谁，他肯定胜利了。我承认他的胜利。我承认自己的失败。我像金黄脆弱的麦秸在同样颜色的火中化为灰烬。就好像火焰走出了灰烬，向天空伸出绝望的吐不出任何语言的红色舌头。我和生命就这样一次次走向空中，走向虚空。\r\n\r\n不管这一次他是谁，他肯定胜利了。还有一个时辰就要天亮！那儿有清凉的风，常年不断地吹，有一片光秃的山坡，周围还有野花缠绕我。叫了一遍。又叫了一遍。这是篇诗歌中的鸟，这是第二遍，她用叫声把我送上天空。遇上白风和红霞，送上南来北往的风。大雁在飞过时匆匆一掠，我的简陋的墓地像一只粘土的花篮。毒药，数学之神的绳索，我会在天亮时死去。那时黎明刚过，而北方冬天的朝霞散开、漫延。太阳也刚刚升起。还没有像火球一样，飞快升起，也许我和太阳一起飞到天上。我热爱这壮丽的景色，我坐在太阳火红的马车上，我热爱这坐在太阳上的另一个自我。在明天早上，我就要升起，我就要死去。可现在仍然是黑夜。一会儿就是白天。一个人，从流浪到部落，从大沙漠，回到故乡的大河，找到了妻儿和妹妹、女儿、父亲，自己却用身子做成了一只杯子，灌满了毒药。这肉体的杯子！我就是爬也要爬到她的坟头。快到冬天了吧，我还不曾栽丁过一棵山楂树。还有一场大雨。可现在什么也没有了。一场大雨过去了，在我身上留下了泥泞。\r\n\r\n（布景转换很快。幻觉中，宝剑在开满野花的道路上奔跑）\r\n\r\n剑：这一路上全是花朵\r\n\r\n我踏上了她们\r\n\r\n踏上了她们的眼睛和睫毛\r\n\r\n以及在夜间张开倾听风雨的耳朵\r\n\r\n我陪上了她们\r\n\r\n全是迫不得已。\r\n\r\n为什么这路上全是花朵\r\n\r\n（宝剑拔剑自刎。鼓声）\r\n\r\n（鼓手一边操鼓，一边朗诵\r\n\r\n（鼓手就是扮演公主红的）\r\n\r\n鼓手：等到那一天来到\r\n\r\n海水淹没了巴比仑\r\n\r\n巴比仑没有一个幸存的人\r\n\r\n海水淹没了巴比仑的每一寸土地\r\n\r\n除了九根红色的茅草，\r\n\r\n那是我们今日沾满鲜血的宝剑。\r\n\r\n大地呈现在你的面前——\r\n\r\n是茫茫无际的苦难的海水\r\n\r\n你是唯一的。\r\n\r\n公主活在九位公主之中\r\n\r\n你们是九根红色的草根承受阳光雨露\r\n\r\n繁衍了那海水灭绝的巴比仑。\r\n\r\n第三十场\r\n\r\n（巴比仑农奴合唱队，服装简朴而褴褛，裤管为了种田满不在乎地卷起，两个农奴，上来收尸）\r\n\r\n甲：庄稼熟了。\r\n\r\n乙：有人死在山上。\r\n\r\n甲：有人死在地里。\r\n\r\n乙：王子，你不是庄稼，你是酒瓶。\r\n\r\n甲：你不是粘土，你是宝剑。\r\n\r\n乙：你不是亲人，你自称为兄弟们。\r\n\r\n甲：庄稼熟了。\r\n\r\n乙：你不是庄稼，你是酒馆中的酒精。\r\n\r\n甲：你不是四季，你是四季中空荡荡的风。\r\n\r\n乙：你不是劳动，你是牺牲。\r\n\r\n甲：我们劳动，出一身臭汗。\r\n\r\n乙：替你们收尸。\r\n\r\n甲：我们要享受。\r\n\r\n乙：你们却要牺牲。\r\n\r\n甲：你们为谁牺牲？\r\n\r\n乙：我们是种田人，\r\n\r\n甲：我们是辛辛苦苦的种田人。\r\n\r\n乙：我们是要活命。\r\n\r\n甲：你们是要拼命。\r\n\r\n乙：你们是为谁拼命？\r\n\r\n甲：是为自己，还是为别人？\r\n\r\n乙：你们一定说——一定是为别人。\r\n\r\n甲：别人就是愚昧的我们。\r\n\r\n乙：可我们不需要拼命，\r\n\r\n甲：我们只要活命。\r\n\r\n乙：我们不要酒瓶，\r\n\r\n甲：我们要丰收。\r\n\r\n乙：庄稼熟了。\r\n\r\n甲：喝酒第二天。\r\n\r\n乙：顶好喝一碗稀粥。\r\n\r\n甲：几粒臭咸菜，\r\n\r\n乙：这烂萝卜烂白菜叶白菜根。\r\n\r\n甲：喝酒之后，顶好是粮食。\r\n\r\n乙：我们要丰收。\r\n\r\n甲：庄稼熟了。\r\n\r\n乙：庄稼是最好的。\r\n\r\n甲：我要告诉你们。\r\n\r\n乙：宝剑是其次的。\r\n\r\n甲：庄稼是最好的。\r\n\r\n乙：酒精是其次的。\r\n\r\n甲：四季是最好的。\r\n\r\n乙：风雨是其次的。\r\n\r\n甲：活命是最好的。\r\n\r\n乙：拼命是其次的。\r\n\r\n甲：庄稼熟了。\r\n\r\n乙：庄稼让石头从身上滚过去\r\n\r\n甲：然后脱落下来。\r\n\r\n乙：那是麦子和稻子。\r\n\r\n甲：稻子又要让铁把自己的皮扒下来。\r\n\r\n乙：那就是米。\r\n\r\n甲：那就是我们的庄稼。\r\n\r\n乙：那就是我们。\r\n\r\n甲：我们庄稼人。\r\n\r\n乙：庄稼合唱的声音。\r\n\r\n甲：庄稼熟了。\r\n\r\n乙：庄稼自己熟了。\r\n\r\n甲：庄稼自己叫嚣熟了。\r\n\r\n乙：也就是高粱红了。\r\n\r\n甲：也就是玉米黄了。\r\n\r\n乙：也就是黄瓜绿了。\r\n\r\n甲：也就是麦粒红了。\r\n\r\n乙：麦杆黄了。\r\n\r\n甲：马上就要被我们抱到石头或铁器下，\r\n\r\n乙：抱到打谷场，\r\n\r\n甲：或道路上，\r\n\r\n乙：打碎。打破头。打死。\r\n\r\n甲：道路从庄稼尸体上走过。\r\n\r\n1988.6.13-1988.9.22\r\n\r\n---\r\n\r\n 这是海子的仪式诗剧三部曲之一。海子原打算写作的另外两部仪式诗剧是《吃》和《打》。"},{"id":"short/1983/怅望祁连之一","title":"怅望祁连（之一）","type":"short","year":"1983","body":"那些是在过去死去的马匹\n在明天死去的马匹\n因为我的存在\n它们在今天不死\n它们在今天的湖泊里饮水食盐\n天空上的大鸟\n从一颗樱桃\n或马骷髅中\n射下雪来\n于是马匹无比安静\n这是我的马匹\n它们只在今天的湖泊里饮水食盐\n---\n● 1986"},{"id":"short/1985/活在珍贵的人间","title":"活在珍贵的人间","type":"short","year":"1985","body":"活在这珍贵的人间\n太阳强烈\n水波温柔\n一层层白云覆盖着\n我\n踩在青草上\n感到自己是彻底干净的黑土块\n活在这珍贵的人间\n泥土高溅\n扑打面颊\n活在这珍贵的人间\n人类和植物一样幸福\n爱情和雨水一样幸福\n---\n● 1985.1.12"},{"id":"short/1987/在大草原上预感到海的降临","title":"在大草原上预感到海的降临","type":"short","year":"1987","body":"我的双手触到草原，\n黑色孤独的夜的女儿。\n我为我自己铺下干草\n夜的女儿，我也为你。\n牧羊女打开自己——\n一只黑色的羊\n蹲伏在你的腹部。\n多么温暖的火红的岩石\n多么柔软地躺在马车上\n月亮形的马，进入了海底。\n一夜之间，草原是如此遥远，如此深厚，如此神秘。\n海也一样。\n一夜之间，\n草贴着地长，\n你我都是草中的羊。\n---\n● 1988（？）.11.20"},{"id":"short/1988/远方","title":"远方","type":"short","year":"1988","body":"远方除了遥远一无所有\n遥远的青稞地\n除了青稞　一无所有\n更远的地方　更加孤独\n远方啊　除了遥远　一无所有\n这时　石头\n飞到我身边\n石头　长出　血\n石头　长出　七姐妹\n站在一片荒芜的草原上\n那时我在远方\n那时我自由而贫穷\n这些不能触摸的　姐妹\n这些不能触摸的　血\n这些不能触摸的　远方的幸福\n远方的幸福　是多少痛苦\n---\n● 1988.8.19萨迦夜，21拉萨"},{"id":"short/1989/黎明之一","title":"黎明（之一）","type":"short","year":"1989","body":"（阿根廷请不要为我哭泣）\n我的混沌的头颅\n是从哪里来的\n是从哪里来的运货马车，摇摇晃晃\n不发一言，经过我的山冈\n马车夫像上帝一样，全身肮脏\n伏在自己的膝盖上\n抱着鞭子睡去的马车夫啊\n抬起你的头，马车夫\n山冈上天空望不到边\n山冈上天空这样明亮\n我永远是这样绝望\n永远是这样\n---\n● 1989.2.21"},{"id":"sun/太阳断头篇","title":"太阳·断头篇","type":"sun","year":"1986","body":"（太 阳·断头篇 ）\n序幕 天\n　　 （北方南方的大地，天空和别的一些星体）\n 　　 北冥有鱼，其名为鲲，鲲之大，不知其几千里也。化而为鸟，其名为鹏，鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。　 ——庄子 《逍遥游》\n　　（Ａ：鸟身人首；Ｂ：普通人类；Ｃ：鱼首人身）\n　　Ａ：猛地，一只巨鸟离你身体而去\n　　 一片寂静\n　　 破天\n　　 如斫木\n　　 海水怀抱破岩，金属乱钻火苗\n　　 一只巨鸟穿地而过，四方土层顺脊溜下\n　　 行动第一，行动第一\n　　 巨鸟轰然破灭，披群龙如草\n　　 沿途在天空上写下不可辨认的、不详的\n　　 匆匆逃离的星宿\n　　 炸　　　　　开\n　　 猛烈爆炸，碎片向四面八方散开\n　　 宇宙诞生的这一天\n　　 原　始　火　球　　炸开、炸开\n　　 猛烈爆炸，碎片向四面八方辉煌地散开\n　　 宇宙诞生在这一天\n　　 “大量的射电源和几百个类星体的谱线\n　　 一切方向上河外星系都在远离我们，远离”\n　　 原始火球炸开，宇宙在不断膨胀\n　　 “我要说，我就是那原始火球、炸开\n　　 宇宙诞生在我身上，我赞美我自己”\n　　 万物怀抱巨鸟而来，撞破四级、天雷地绝\n　　 所有辉煌腾跃的火焰汇集于一身，巨形火轮滚动\n　　 啊，谁人曾识南面\n　　 一片混沌\n　　 无物质的\n　　 一个我，混沌中大光滚来滚去、一团团极地之火\n　　 戳破我，从北冥到南冥，天空是一杆断木\n　　 攀附于激流泡沫之上，成熟于海水磨胃之中\n　　 一翅掀浊浪、一翅剪长天，我怀抱自己过了穹隆\n　　 我在宇宙中心睡过了千年万年一百亿年\n　　 我是○，是原始火球，是唤醒我的时刻了！\n　　 爆炸吧，爆炸吧，不仅在第一天\n　　 而且要在今后所有的日子中，爆炸吧\n　　 把一切炸成碎片，使人神往那极端的光亮\n　　 一代代恒星摇晃着痉挛着死去，一片火光巨响\n　　 “爆炸吧，通过剧烈的死亡，通过上一代的残骸\n　　 通过越来越重的元素，从氢到氦再到碳”\n　　 死去很久的恒星一代代住在我的肉中\n　　 “爆炸吧，白炽的星光道道\n　　 似泻在我肉上，放射着物质和电\n　　 爆炸吧、爆炸吧，把一切炸成碎片\n　　 爆炸吧，把我炸开”\n　　 “我要说，我是一颗原始火球、炸开\n　　 宇宙诞生在我肉上，我以爆炸的方式赞美自己”\n　　 猛地，一只巨鸟轰然离你身体而去\n　　 巨形火轮滚动，我的火光覆盖着你们：\n　　 一些熟睡的肉团，一些行动的天体\n　　 我巨形身子消灭了一些路程\n　　 宇宙拉扯着我的肉体和火光\n　　 在飞在天空上写下不可辨认的、不详的\n　　 匆匆逃离的星宿\n　　 有几具巨火安置在我身上\n　　 我逃到哪儿哪儿就是天空\n　　 我飞到哪儿哪儿就是天空\n　　 那永恒的时刻，我撞上原始火球\n　　 那万般仪态的火\n　　 那风撕晨云的火\n　　 那破鱼而出的火\n　　 垂天之翼痛灼，火光照亮\n　　 万条星系巨川莽莽滔滔\n　　Ｂ：天空死了\n　　 死亡的马，如大批鱼群斜过粗肿的星宫\n　　 滑进海洋。太阳之籽裂开\n　　 在万根爪子上痛苦跳跃\n　　 一粒粒洪水在颅骨深处送来\n　　 春天的死，秋天的死\n　　 植物用花果混杂它们\n　　 如果我们坐着，并且习惯于表白\n　　 时间死了\n　　 无数猿猴或者无尾之人涉过滔滔江水\n　　 一只大鱼脊背死在化鸟之梦和水土颜色中\n　　 太阳登高，萧萧落木，给你足够的时间\n　　 行动吧！或者鱼\n　　 或者鸟\n　　 时间死了\n　　 那些乱乱的时空就随便用手指葬在四周\n　　 如果我们坐着，并且习惯于表白\n　　Ｃ：而九泉之下、黄色泉水之下\n　　 那个人睡得像南风\n　　 睡得像南风中的银子\n　　 这个人睡得像一只木碗\n　　 剩下的人都像挖空的花石头\n　　 死了，在我民族的九泉之下\n　　 有八大天风吹过\n　　 薄薄的半片麦穗\n　　 黄如月亮\n　　 盖在木板上\n　　 一些不朽的嘴唇睡在九泉之下\n　　 叩动，一些诗歌不朽\n　　 一穗穗玉米\n　　 跳过月亮\n　　 你在双膝上\n　　 摆着木头和装满烟草的盒子\n　　 地下有火吗？\n　　Ｃ：而九泉之下，黄色泉水之下\n　　 一只破火罩在身上\n　　 鱼身上\n　　 火破了\n　　 九泉之下\n　　 鱼，脊背忧伤之王\n　　 蓝色麦片之王\n　　 月族衰老之王\n　　 护住双膝，鱼身上\n　　 火破了鸟飞了\n　　 风送来一勺勺水和木柄\n　　 鱼，九泉之下的王\n　　 用永恒的尾巴\n　　 封住自己之门\n　　 用水喂养百姓\n　　 质朴的人，手捧鱼卵\n　　 哺于古老乳房\n　　 九泉之下，王坐着\n　　 像一条浑黄的河\n　　Ｃ：而九道泉水之下\n　　 十二只鱼\n　　 引尾至水\n　　 长号不已\n　　 缠着\n　　 黄色手爪牵着太阳\n　　 平坦的断木上\n　　 水的手爪\n　　 从我们身上取走了火\n　　 黄色泉水之下\n　　 善良的妃子躺于木床\n　　 梦吞一日则生一日\n　　 那彻夜不眠的河王\n　　 脊背上爬满\n　　 断裂的陆地、麦子\n　　 簇簇火梦见爪子\n　　 十个太阳围着大鱼之妻\n　　 坐在河道下面\n　　Ｂ：如果我们坐着，并且习惯于表白\n　　 天空\n　　 默默地停着\n　　 你那笨而大的身躯\n　　 火如土糕已在窝中放好\n　　 土色的太阳以及天空，诸神——我的叔伯兄弟\n　　 在这海洋之上，让我们对面坐下\n　　 在一望无际的水面上，永恒地盘着腿\n　　 一张脸在大陆岩架上烤焦了野兽\n　　 火苗\n　　 在地面上默默\n　　 像线条缠在受伤的　窃之爪上，火苗\n　　 借我的爪子　开了一条血路\n　　 让我们对面坐下\n　　 收肚脐于水\n　　 收头颅于太阳\n　　 合爪子于火\n　　 收心脏于相思的水火之盆，月亮，白草堆成的\n　　 小乳房。如果我们坐着，并且习惯于表白\n　　Ｃ：鱼的九泉合入冰河，九泉之下平坦的空地\n　　 合上你的嘴唇写你的诗歌，有八大天风吹过\n　　 一片寂静就是一切土入河中\n　　 选择孤独　一枚种子裂开\n　　 在破鱼人眼中　九泉之下\n　　 有一条大鱼灌满了死者耳朵……忘不了\n　　 忘不了生前。即使被挖空的木碗和花石头\n　　 从世界之罐中取回这打不碎的整体——水\n　　 风从北冥吹来　水流弃我为鱼\n　　 风向南冥吹去　河床随龙而溢\n　　 九道泉水冻在人体外面\n　　 弃其琴瑟冰河之上、封门之鱼\n　　 一直是我的妃子在河道之下常常梦见吞日\n　　 她默念扶桑 她耳朵挂谁\n　　 她在木床上冻如冰河　梦吞一日则生一日\n　　 一条大鱼请我再造世界：冻伤的河就是一切\n　　Ｂ：地下之水溢出，河道远去\n　　 盐用死鱼骨骼的耳朵贴住\n　　 倾听我，在那山冈或棋盘的深处\n　　 天空是一匹死马，上帝是空空的马厩\n　　 而地面上横横默默粗粗细细\n　　 坐着罪恶的切火之人\n　　 如果我们坐着，并且习惯于表白\n　　 双蛇在耳朵上听着\n　　 人，这一只丑陋罐子，锈满一身碎鳞\n　　 如果我们坐着，并且习惯于表白\n　　 有一条大鱼请我再造天地\n　　 再造天地，选择那最近的手边的太阳\n　　 和一些零星的木头、被人揉搓的语言\n　　 破烂的语言、不完整的语言\n　　 以及时间之蛇在肉下流动、咬噬\n　　 以及黑白半边的老鼠守护日夜\n　　 以及黄土扑面、六张嘴埋在六个季节\n　　 以及十二条腿埋在十二条雨月，麦片之月\n　　Ｃ：九道泉水之下\n　　 一只破火罩在身体\n　　 火是冰河上下\n　　 第一只丑陋之罐\n　　 赤色小罐，火\n　　 装满了黑色麦片的月亮\n　　 鱼　鱼，九泉之下彻夜不眠的王\n　　 你的身上火破鸟肥，脊背湿湿\n　　 冥王之婆背着一只潮湿之钟来到长松之下\n　　 小鱼守在九泉之下\n　　 眼睛闪闪像寂静的银子\n　　 雕刻着尾巴\n　　 那是冥河那是冰封之河\n　　 九泉之下　冰河冰河　高高的\n　　 天空的白木头　一根断木\n　　 割了火　众人葬身火中\n　　 有一条大鱼请我再造天地\n　　 猛地，一只巨鸟轰然撕你肉体而去\n第一幕 地\n　　（天空和大地，叙述的地方靠近喜马拉雅）\n　　（湿婆，毁灭之神、苦行之神、舞蹈之神，消瘦，面黑，青颈，额上有能喷出火的第三只眼，一副苦行者的打扮。演出时或脸上戴着画成火焰的红色粗糙面具，或打扮成无头刑天。必须说明，诗中的事迹大多属于诗人自己，而不是湿婆的。只是他毁灭的天性赐予诗人以灵感和激情。另外，有一本《世界海陆演化》的书是这样写道：“最后，印度板块同亚欧板块碰撞之后，印度板块的前缘便俯冲插入到亚洲板块之下：一方面使得青藏高原逐渐抬升，一方面就在缝合线附近形成了宏伟的喜马拉雅山脉……”而喜马拉雅正是湿婆修苦行的地方。这本书还说：“根据古地磁学研究的结果，印度板块至今仍以大于5厘米／年的速度向北移动，而喜马拉雅山脉仍然不断上升中……”）\n第一场：天空的断头台\n　 合：断头台上，乱鹰穿肝为石\n　　　 断头台上，一簇火苗如花\n　　　 断头台上，大头如石，裂空而过\n　　　 断头台上，砸动肉体取骨头\n　　　 断头台本是琴台\n　　　 一根弦\n　　　 揉着你的断头、孵化大地\n　　　 扯着你的鹰鹫，出入心脏和长空\n　　　 扯着你的尸衣，海水退去，喜马拉雅隆起\n　　　 湿婆你拖火的身体倒栽而下\n湿 婆：火\n　　　 这幽花之蛇\n　　　 长夜难眠之蛇\n　　　 捧盏，天地之盏\n　　　 盛满一颗人头而来\n　　　 盛满我的人头而来\n　　　 肉体在牢中\n　　　 盛火的地穴\n　　　 一团火光\n　　　 环草而舞\n　　　 我在欲焚的爪上\n　　　 舞蹈、注水，守护大地之杯\n　　　 我在欲焚的爪上断死野兽，随意 n　　　 插你爪子于人类之手，骨骼水火之肢，万电临你为雷\n母 亲：而我的确没见到\n　　　 一只断手\n　　　 我只在河岸上烧火\n　　　 十只碗\n　　　 扣在是个太阳上\n　　　 这十把暖暖火苗\n　　　 的脑袋\n　　　 这使只植物身子\n　　　 那天的断石哟\n　　　 一个抽象人类的声音（远远传来）：\n　　　 只有你\n　　　 善良的母亲\n　　　 顺着卧室走向蚕叶的山冈\n　　　 取桑叶补衣\n　　　 只有你\n　　　 听得见河流逼近的一片寂静\n　　　 仿佛马儿未死、马厩的\n　　　 鲜花护住太阳耳朵\n　　　 是呵，只有你\n　　　 住在河岸粮仓中，\n　　　 渔网里、马厩里、户口中\n　　　 我们都是活生生的马\n　　　 从你身上牵出\n第二场：拖火的身体倒栽而下\n（独白）拖火的身体倒栽而下，笔直堕入地狱\n肉体之牢被闪电撕开\n血光之爪\n和嘴\n和脐\n火\n悲痛的杀死\n天\n我肿大的骨结\n我乱响的头\n我拔入骨灰的大鼓\n我的肉骨琵琶　拴在空空马厩\n无人腾出手来\n取我流血和闪电\n火光爪子\n你敢碰一碰\n爪子会把火与血腥\n传给你\n你敢碰一碰\n乱埋头颅的爪子\n在天石深处\n在这个时刻\n坐穿海底\n的巨兽\n在我的诗中\n喘出血来\n于是他拖火的身体倒栽而下，笔直堕入地狱\n钟\n打击在这个浅薄的时间\n除了死亡\n还能收获什么\n除了死得惨烈\n还能怎样辉煌\n于是他拖火的身体倒栽而下\n太阳之浪掀起他粗笨的身躯，颠倒了\n昏迷的天空\n于是他\n一直穿过断岩之片、断鹿之血\n笔直堕入地狱\n地狱在我的拥抱和填塞中\n轰轰肉体抖动如雷\n“大荒野上\n撕头作歌的\n是否记得我”\n拖火的身体倒栽而下，轰轰填塞地狱\n还是围着光芒乱刺的火\n背叛的群火\n你斟满了地狱的砖头\n而无头之舞一堆堆\n无人能夺下我那颤抖的\n爪中之火\n这一次火种哦在脊背上耕耘、打仗\n这一次骨骼哦在我肉上长成两大排\n　　　　 使我站立，动物前呼后拥\n这一次盐哦靠岸\n　　　围着我的嘴唇\n　　　中间杂以山林活血之羊。\n　　　　　　　　　　　　　都在诗歌中喘血\n因为我拖火的身体倒栽而下\n我天降洪水和一切灾害而下\n我乱割群鱼江河血肉水泊而下\n我驮负着光线胡乱杀戮而下\n我粗尾击天而下\n我断头为尸而下\n我十个太阳烧裂尸体而下\n　　　　　充满行动而下\n　　　　　叫裂肝脏而下。\n　　　　　　　　　　　　　都在诗歌中喘血\n堕入地狱\n笔直地堕入地狱。\n　　　　　　　都在海子的诗歌中喘血如注\n第三场：地狱炼火（有题无诗）\n第四场：地狱取火（有题无诗）\n第二幕 歌\n第一场：火歌（有题无诗）\n第二场：粮食歌（有题无诗）\n第三场：诗人\n1.楚 歌（有题无诗）\n2.沅湘之夜（有题无诗）\n3.羿歌之夜（有题无诗）\n4.天河畔之夜（有题无诗）\n5.诗人的最后之夜（独白）\n诗人对她说着\n我需要你\n我非常需要你\n就一句话\n就一句\n说完。我就沉入\n永恒的深渊\n死亡\n“在这个平静漆黑的世界上\n难道还会发生什么事”\n死亡是事实\n唯一的事实\n是我们天然的景色\n是大地天空\n只有痛苦和柔情\n使我们脱出轨道\n像从天上\n倒栽下来\n长出歪歪的血腥果实\n从头颅开始\n从血腥的透露开始\n倒插在地上\n用所有的土\n充塞脑壳\n喊叫而哑默的四肢\n从泥地上\n歪歪斜斜地长出\n诗人\n被死亡之水摇晃着\n心中只有一个人\n在他肉体里\n像火焰和歌\n痛着\n心中只有那个人\n除了爱你\n在这个平静漆黑的世界上\n难道还有别的奇迹\n我需要你\n你更需要我\n就一句话\n就一句\n诗人纯朴的嘴唇\n含着水晶、泥沙\n和星\n长在水里\n水面上我一直不肯献出\n东西。我孤独积蓄的\n一切优秀美好的\n全部倾注在你身上\n一连串陌生苦楚的呼喊\n布满了天下面的血泊\n广阔的血\n雄伟的血\n巨大的土色的血\n就一直\n流入脑壳\n我叫得星星碎裂\n一腔腥血喷喉而出\n永远、永远不要背弃我的爱情\n大地，海\n我的生日\n死亡之日\n你们都是证人\n爱情中，你们全在场\n全部倒在你身上\n天下面的血泊\n一切一切的喊叫\n岩浆和海底火山\n仍在那儿\n翻滚激荡\n你好好想想这一切\n你独自一人时\n好好想想这一切\n说完，我就沉入\n永恒的深渊\n死亡\n第一次也是最后一次\n来吧，死是一直\n存在的逼视\n死是一堆骨肉\n我像奇迹一样\n每天每天\n住在她身上\n生命就是奇迹！\n死，\n怕什么\n难道死亡会伤害生命\n难道死亡会使我胆怯\n惨烈的夜本来极乐\n太阳在我肉里\n疯狂撕咬\n爱情的土巫围坐月亮\n红色的土壤横遭惨祸\n被撕开一些长出一些\n是血\n流在肉体下 精的排泄我触摸子宫。天空的太阳。岩面断层上一只人类之肺，只有深深浅浅的血，粗糙的血、心，红色的花朵，在肉体堆积的沙漠之中，围着扶桑，形成十个，形成火光中一离一合的大腿之门，天空的太阳，美丽而平整的血污，照见陆地残缺的阴阳。通过一只猿猴之尾或鱼尾之藻，我可以与大海相互结合，甚至上升到星系，回到那场原始的大火。                                 　　                 \n而夜，狮子如片片大火，碰破正常的水波，到处都是大家的痛苦，土地解决不了什么，轮回之木肃肃直下，埋葬同样也解决不了。今天的日子是一片沙漠，物质凶相毕露，追杀南方器皿和脑盖，追杀民族底层的旭光、落日、蚀日，映照水内或运行中天之日。而夜，小心脏围着人们，在物质中死亡。                 　　                 \n转身投入大爆炸，十个太阳踢入人类肉体灵魂，里里外外，穿上脱下了天空，多少次梦想，尸衣上满是星宿们愁苦的眼睛，如同疾病，扶着主人，在地上和血而坐，让文字漂泊生长在五爪之中，在刺猬中在豪猪中，在充当食品的乌龟、野兔、在清水和根果中，你在我体内炸开，灵魂因为无处可挂，就形成肉体，那血液的光线多次刺伤我。脚下的死亡翻晒成土地，依靠土木净化骨肉，依靠经血净化妇人，于是转身投入大博爱扎，被故乡的占卜之声切割，四面八方的手掌埋你进去，而灵魂得自己出来。灵魂，只有你了，我坐在你身上就像坐在故乡的灵车上，被黑暗中无声的鸟骨带往四面八方。在占卜之中带往四面八方。脚，从血腥的土中拔出，就他妈什么也不是。                 　　                 \n而夜，我在东方咒语中一一隐秘的名姓，十五种太阳姿式，以身射月，正在怀抱着一些胚胎和火，向我走来，踏着众兽之皮撞碎海中大鱼，久久在河上孤寂一身，成了庙宇——那吐出的不眠的果核。行过黄道，行过掌纹，安排如奈的星宿命运，使我手中操弓，一五一十的收拾你，身段碎碎，沦为河泽，掌骨伸出桃花，而夜，月亮刺成一只鱼，那只鱼，把天空放过大地，葬身母先知的预言之中，物质要了人命。                 　　                 \n转身投入饥饿之火，嫉妒之火，情欲之火，乃至莫名之火烧起，大爆炸游遍我的肉体、角叉、粗尾和鳞甲，我在所有方向被人逼入死角。而同伴，另一只丑陋狮子，蒙上双眼，向我撞来，爆炸你身体后离你远去，因为大地又宽又广。土地东南倾注，因为田野上吹过层层野麦就像从我脸上吹过层层疾病后的黎明。转身投入野火烧身，在黄昏，挽留你的声音常常在四方响起，转身投入大爆炸。这东西围成火焰之鸟。这些鸟，太阳中的跛足之鸟、燕子、孔雀王。负着光线，在天空下营巢。你的女儿缘树而上，扑海而成碎石。无论是卵生胎生湿生化生，这十个太阳，升自中国人久病成医的身躯。而夜，花蛇正在翻动我舌头，诗经和楚辞，只有女人胎中的腹语，只有手掌上仅有的几粒稻米，只有火种，盐上的伤口，你的脸是最后一头绣花纹饮浊血的野兽，裹在烈火中滑向言语，言语如空鸽子，放飞于自己嘴唇。你的痛苦，也不能同时写满，孔雀五母的身体。于是物质考焦这神秘之水岁月的花蛇，它曾沿着女娲爪子上升。托石补天，于是人们在物质中颤抖，也不能回心转意，于是让我写字，写在萱草、芦苇、竹筒和树皮上，写在折断之桅、之骨和情人的老脊背上。于是文字漂泊成黑花，开满古原野和畜牧之河，渗合着红色虫血，我在木叶深处躺下，一行行文字，那只头颅被砍去的伤疤，夜夜愈合，玉兔负美妇逃离桂枝。而捣药文字敷于我右体，左体出血，渗遍我全身，而成月亮。于是花蛇正在翻动我舌头，诗经和楚辞同时吹过，电流、泥石流、血管送河于平原。于是古老歌巫扯动我肉，击打我头，反复叫出火来。于是周易数字丈量国土和我，女脚丫的尺寸。于是一堆烧过的骨头上万般文字如雪。于是你在河上就像血在河上，为我保存纯洁的姑娘。于是你葬身母先知的预言之中。于是只有诗歌，一个鲜血沉浸的村庄，只有你，月亮是你贞洁的小女人，被高高举起，撕裂，分离                 　　                \n于是你在鱼腹上静静坐下                  \nb．祭酒·药巫·歌王                                  \n祭酒：在火种的灰烬中捧起嘴唇和花朵  　　\n捧起黑色种子和鱼油  \n药巫：以火治病  \n歌王：从自己身上撕下月亮女，为找火历经劫难  　　\n在冰天雪地建起了教堂和酒馆  \n祭酒：每天早晨在携伤前来  \n药巫：别人总是在体内踩伤你的光线  \n歌王：你的诗篇如阳光遍地，被人践踏    祭酒：在土上打洞，在水中摸粮食                 \n药巫：你用来取水的鱼，像罐子一样碎了，沦为河流\n​     \ 　　　 围着海，十头集中的火\n　　　 围着扶桑，我的大头之树\n　　　 围着我抱头痛哭的兄弟\n　　　 那十个太阳压住你的上下之枝\n　　　 压住他的肚腹胸脐\n　　　 压得我的双手沉沉\n　　　 把那不变的夜交给我\n　　　 交给我，天空！\n　 Ａ：我的头颅是那战士的甲牌\n　　　 战士流血的甲牌\n　　　 滚在地上也在天上流血\n　　　 反抗者\n　　　 无非断颈而死\n　　　 红头发炎炎\n　　　 如一段太阳\n　　　 天空斜向一边\n　　　 在我碎裂的甲牌上\n　　　 杀伐之铁格格\n　　　 行动的头颅跳入太阳\n　　　 旋转我远远的亲人之身\n　　　 无首之身在地狱炼火\n　　　 做一个太阳\n　　　 一个血腥的反抗的太阳\n　　　 一个辉煌的跳跃的太阳\n　　　 无非是魂断九水之外\n　　　 无非是魂断九天之外\n　　　 但我的头颅在熊熊大火中\n　　　 在历史上\n　　　 我一直是战士。不管\n　　　 别人怎样过他的日子\n　　　 我一直是战士\n　　　 我一直是战士\n　　　 我浑身血腥\n　　　 我一直在历史上反抗\n　　　 我一直在行动\n　　　 头颅播入这四面开阔的黑土\n　　　 做一个太阳\n　　　 在土上我们愤怒\n　　　 在水中我们愤怒\n　　　 在自己的熊熊大火中\n　　　 我们更加愤怒\n　　　 因此大地是转动的\n　　　 围着我这十只断头\n　　　 和天空一样亢奋\n　　　 这两匹母马，在青铜之血上\n　　　 互相践踏、碎裂\n　　　 大地和天空一样退回到遥远的血光\n　　　 退回到最初创生的动作\n　　　 红头发炎炎推大地转动\n　　　 红头发炎炎如一段太阳\n　　　 星星也被血光照亮\n　　　 做一个大阳\n　　　 我们不屈的天性\n　　　 惯于解血为水\n　　　 惯于折劲断天\n　　　 惯于抖摇众岳盖上肚脐\n　　　 我们不屈的天性\n　　　 来自这大大的头\n　　　 这么大的头\n　　　 连我自己也吃惊\n　　　 就这样让它在血中跳吧\n　　　 让它一直在历史中动作，反抗！\n　 Ｂ：把那不变的夜交给我\n　　　 不，我不屈服\n　　　 面对八面茫茫天风\n　　　 面对宇宙，这黑色洞穴\n　　　 我怀抱十个太阳\n　　　 怀抱啄击心肝的\n　　　 一丛鹰鹫\n　　　 我早就这样一路走来\n　　　 把那不变的夜交给我\n　　　 宇宙黑色的洞中我的骨骼粗壮\n　　　 送太阳到体外，腥气淹没了你们\n　　　 手和爪子。这一些黑暗中\n　　　 传火的藤壶\n　　　 把那不变的夜交给我\n　　　 夜在我身上就像在一片高粱地里错动\n　　　 没有人知道我在火光深处\n　　　 没有人知道我在高粱地里\n　　　 生下十个太阳\n　　　 夜在我身上就像在一片高粱地里错动\n　　　 那进化之兽沿我肚脐上爬\n　　　 那捕捉语言称呼的星星落入我的眉骨\n　　　 那八方无水汇集在我身上流动着四个海洋\n　　　 双拳被水松开，如同羞涩的阵地\n　　　 宇宙之穴中我是洪荒之兽母亲之腹\n　　　 生下十个太阳\n　 Ｄ：战士噢，带着你的头颅，上路罢\n　　　 战士噢，你的头颅沿城滚动沿城侍牵\n　　　 蚩尤你的脑袋\n　　　 滚动在解血为水的地方\n　　　 滚动在一切青铜鼎上\n　　　 你的脑袋狰狞而美好\n　　　 他们由泥土沾连\n　　　 他们层层埋好青铜之鼎\n　　　 青铜之鼎，沸水火炭之鼎\n　　　 蚩尤你的脑袋哑着\n　　　 如同太阳就是太阳\n　　　 一个残暴战士之头\n　　　 坐在着铜之鼎如同坐在麦田中间\n　　　 其实他很温暖\n　　　 比我的心更温暖\n　　　 你是战士\n　　　 你要行动\n　　　 你的行动就是公平\n　　　 太阳不能无血\n　　　 太阳不能熄灭\n　　　 你是战士\n　　　 用万段火苗跳动断肢\n　　　 只有行动，只有行动意志\n　　　 有那岁月之腹岁月之鼎上不停鸣响\n　　　 血腥地伤害自己\n　　　 迎来光明。你是战士，你要行动！\n　　　 轰轰烈烈地生存\n　　　 轰轰烈烈地死去\n　　　 你们不再以心归天\n　　　 你们就是在这创痛和撕肉折劲之中\n　　　 头颅播入四面的黑暗，四面开阔的黑土\n　　　 把其他的残肢用泥巴糊好，幽幽吐花如梦\n　　　 你们的心脏蓄着地狱之火反抗之火\n　　　 喂着了人类和鸣啸巨兽\n　　　 头颅，一片腥红的时间\n　　　 在那个远的家乡门前\n　　　 蚩尤，你这最早的战士\n　　　 踏住自己的头颅，或在青铜鼎上\n　　　 以断头叩动。在流动。在行动\n　　　 你的武器一直在场场战争中窜动\n　　　 蚩尤。你这一直的战士\n　　　 你这一直反抗的战士\n　 Ｃ：把那不变的夜交给我\n　　　 反抗者在我这普通颅骨中\n　　　 盛放的火种\n　　　 也在照耀夜晚\n　　　 我真后悔，我竟然那么宁静过\n　　　 我竟然那么混同于一般的日子\n　　　 那么伤感，那么小心翼翼地侍奉\n　　　 我真后悔，我尊重过那么多\n　　　 我为着那些平庸的人们歌唱——\n　　　 只是为着他们的平庸，我真后悔！\n　　　 我竟然在平安的日子和爱情中\n　　　 活得那么自在。我真后悔\n　　　 当我用手臂摸到\n　　　 被八面天风冲开的肢体。鹰鹫吸肉在\n　　　 夜深人静，他们的心温暖的\n　　　 汩汩流血在夜深人静\n　　　 就让我加入反抗者的行列\n　　　 就让我，这一位普通的人\n　　　 这根宇宙深处寂静的原木\n　　　 加入反抗者的行动\n　　　 用生命的根子和我自己的头颅\n　　　 哪怕一切毁灭在我手上\n　　　 把这不变的夜交给我\n　 Ｂ：一个太阳\n　　　 是一位战士的头\n　　　 在血中滚动\n　　　 在血中滚动的\n　　　 还有我\n　　　 一位人类的女性\n　　　 宇宙之母\n　　　 腹中养育着\n　　　 十个太阳\n　　　 生或者死。死就是生\n　　　 夜在你头上\n　　　 夜在我身上\n　　　 就像在一片高粱地中错动\n　　　 把那不变的夜交给我，人类\n　　　 除了男人的头颅和女人的腹\n　　　 一切一切都不配审判黑暗\n　　　 生命，生命是我们与自己的反复冲突\n　　　 生命在火光深处\n　　　 把那不变的夜交给我\n　　　 今夜的人类是一条吞火的河流\n　　　 归我哺育，今夜的人类\n　　　 也是河道之猿\n　　　 也是一根打入耳环的原木\n　　　 也是我从小珍爱的女儿\n　　　 我在庙中用火喂养着她\n　　　 在天上地下用十个太阳\n　　　 扶着我的腹部而下\n　　　 打碎了天空如马厩\n　　　 十个太阳钻出我的肚腹\n　　　 钻出我的窍火之城\n　　　 十个太阳之城\n　　　 \n　　　 扶着白草的肉体\n　　　 一穗存火的肉体\n　　　 但是，人类中\n　　　 反抗的战士的\n　　　 头\n　　　 更是真实的太阳\n　 Ａ：如果毁灭迟迟不来\n　　　 我让我们带着自己的头颅去迎接\n　　　 多少次了\n　　　 大地\n　　　 为什么\n　　　 总是要用我的头颅供奉\n　　　 总是要用一腔热血来温暖你们？\n　　　 你们的火苗呢\n　　　 在你们的心上\n　　　 嘶嘶燃烧冒着黑烟的火苗呢？\n　　　 多少次了\n　　　 不，我不屈服\n　　　 就让我十个太阳钉着我的头\n　　　 我的肉　钉在水里　钉在岩石上\n　　　 在岩石钉一个心脏\n　　　 我的心脏\n　　　 让鹰鹫啄击\n　　　 多少年了\n　　　 不，我不屈服\n　　　 我要挑起战斗\n　　　 我的宿命就是我反抗的宿命\n　　　 血泊中，那穗火珍藏手底，交给人类\n　　　 拖火的尸体倒栽而下\n　　　 直往夜的中央黑暗的中央\n　　　 漂过故乡，让那芦花和水\n　　　 一样默默的对着火\n　　　 而我的肝脏枕着鹰鹫\n　　　 我的无首之躯在旷野上舞着\n　　　 我的白骨枕着白石头\n　　　 多少年了\n　　　 就是这样在我的河流之上\n　　　 几朵鹰鹫似铁\n　　　 钻过我的心脏\n　　　 钻过这柔软含血的星辰\n　　　 如今泥土和石块垒满了\n　　　 我身上的其他地方\n　　　 不要用一个固定地点来埋我\n　　　 动作之中\n　　　 让我的头颅自由滚动\n　　　 是血泊中的太阳\n　　　 让我的四肢和四方互相碎裂\n　　　 我那落地的头颅\n　　　 终日围着你\n　　　 黑粗粗的埋着种子的肉体\n　　　 或天地的母马\n　　　 旋转，那是太阳\n　　　 血锈水面，一片盾甲\n　　　 地狱之火那些岩浆沸腾\n　　　 在你最深处，在你心上\n　　　 以行动定生死\n　　　 让我溅血的头颅\n　　　 围着你旋转，燃烧你、温暖你\n　　　 以行动定生死\n　　　 （声音越来越响）\n　　　 十个太阳，贴着地面、旋转，燃烧\n　　　 大地呻吟着碎裂了，解体了，毁灭了\n　　　 抱着我血腥的头跳跃耸动穿行如兽吧！\n　　　 大地，跳吧；\n　　　 抱着我的头在那一片混沌中跳吧\n　　　 和我的头一起滚动\n　　　 大地\n　　　 抱住我的\n　　　 血腥的头\n　　　 跳吧，一切就这样毁了\n　　　 重来，跳吧，大地\n　　　 抱住我的血腥的头！\n第二场：最后的诗（有题无诗）\n第三场：浩风（有题无诗）\n---\n　海子生前曾认为，《太阳·断头篇》是一个失败的写作，因而本欲将其毁掉。但是考虑到骆一禾已将此篇列为《太阳·七部书》之一，而且为了让读者看到一个全面的海子，本书特将此篇保留。"},{"id":"short/1983/怅望祁连之二","title":"怅望祁连（之二）","type":"short","year":"1983","body":"怅望祁连（之二）\n星宿　刀　乳房\n这就是雪水上流下来的东西\n“亡我祁连山，使我牛羊不蕃息\n失我胭脂山，令我妇女无颜色”\n只有黑色牲畜的尾巴\n鸟的尾巴\n鱼的尾巴\n儿子们脱落的尾巴\n像七种蓝星下\n插在屁股上的麦芒\n风中拂动\n雪水中拂动\n---\n● 1986"},{"id":"short/1985/熟了麦子","title":"熟了麦子","type":"short","year":"1985","body":"那一年\n兰州一带的新麦\n熟了\n在水面上\n混了三十多年的父亲\n回家来\n坐着羊皮筏子\n回家来了\n有人背着粮食\n夜里推门进来\n油灯下\n认清是三叔\n老哥俩\n一宵无言\n只有水烟锅\n咕噜咕噜\n谁的心思也是\n半尺厚的黄土\n熟了麦子呀！\n---\n● 1985.1.20"},{"id":"short/1987/在家乡","title":"在家乡","type":"short","year":"1987","body":"鸟　在家乡如一只蓝色的手或者子宫\n手和子宫\n你从石头死寂中茫然无知地上升\n羊群……许多蹄子来了又去　反复灭绝\n大地发光……月亮的马　飞到雪山和村庄\n女人取了一个生蚕豆花的名字“月亮”\n“回想我们高高隆起的乳房\n总想砸烂船舱\n那船长是否独自一人常把我们回想……”\n阴暗的女王就是我永远青春的宝剑\n当狮子在教堂下舞蹈\n你应呼应！即使我没有声音！你应回答！你应发出声音！\n水罐摇摇晃晃走上山巅成长为洞窟和房屋\n大鸟食麦一株\n祖先们更在劳动中丧生\n头盖骨，孤独的星，忧伤的星，明亮的星，我的心，坐在头颅上大叫大嚷\n我打开龙的第一只骨头，第二只骨头，我将会在第三个耐寒的季节里爬\n爬进它的身体，我将躲避我自己的追击\n在危险的原野上\n落下尸体的地方\n那就是家乡\n我的自由的尸体在山上将我遮盖　放出花朵的\n羞涩香味\n---\n● 1987（？）"},{"id":"short/1988/远方_1","title":"远方","type":"short","year":"1988","body":"——献给草原英雄小姐妹\n草原英雄小姐妹\n龙梅和玉荣\n我多想和你们一西\n在暴风雪中\n在大草原\n看守公社的羊群\n---\n● 1988.8.19\n萨迦夜时藏族青年男女歌舞嬉戏"},{"id":"short/1989/黎明之三","title":"黎明（之三）","type":"short","year":"1989","body":"黎明手捧亲生儿子的鲜血的杯子\n捧着我，光明的孪生兄弟\n走在古波斯的高原地带\n神圣经典的原野\n太阳的光明像洪水一样漫上两岸的平原\n抽出剑刃般光芒的麦子\n走遍印度和西藏\n从那儿我长途跋涉　走遍印度和西藏\n在雪山，乱石和狮子之间寻求\n天空的女儿和诗\n波斯高原也是我流放前故乡的山巅\n采纳我光明言辞的高原之地\n田野全是粮食和谷仓\n覆盖着深深的怀着怨恨\n和祝福的黑暗母亲\n地母啊，你的夜晚全归你\n你的黑暗全归你，黎明就给我吧\n让少女佩带花朵般鲜嫩的嘴唇\n让少女为我佩带火焰般的嘴唇\n让原始黑夜的头盖骨掀开\n让神从我头盖骨中站立\n一片战场上血红的光明冲上了天空\n火中之火，\n他有一个粗糙的名字：　太阳\n和革命，她有一个赤裸的身体\n在行走和幻灭\n1987.9.26夜草稿\n---\n● 1989.3.1夜改"},{"id":"sun/太阳诗剧","title":"太阳·诗剧","type":"sun","year":"1986","body":"---\n1988.6\n（选自其中的一幕）\n地点：赤道：太阳神之车在地上的道\n时间：今天。或五千年前或五千年后一个痛苦、灭绝的日子。\n人物：太阳、猿、鸣。\n司仪（盲诗人）\n“多少年之后　我梦见自己在地狱作王”\n我走到了人类的尽头\n也有人类的气味——\n在幽暗的日子中闪现\n也染上了这只猿的气味\n和嘴脸。我走到了人类的尽头\n不像但丁。这时候没有闪耀的\n星星。更谈不上光明\n前面没有人身后也没有人\n我孤独一人\n没有先行者没有后来人\n在这空无一人的太阳上\n我忍受着烈火\n也忍受着灰烬。\n我走到了人类的尽头\n我还爱着。虽然我爱的是火\n而不是人类这一堆灰烬。\n我爱的是魔鬼的火　太阳的火\n对于无辜的人类　少女或王子\n我全部蔑视或全部憎恨\n我走到了人类的尽头\n也有人类的气味——\n我还爱着。在人类尽头的悬崖上那第一句话是：\n一切都源于爱情。\n一见这美好的诗句\n我的潮湿的火焰涌出了我的眼眶\n诗歌的金弦踩瞎了我的双眼\n我走进比爱情更黑的地方\n我必须向你们讲述　在那最黑的地方\n我所经历和我看到的\n我必须向你们讲述\n在空无一人的太阳上\n我怎样忍受着烈火\n也忍受着人类灰烬\n我走到了人类的尽头\n也有人类的气味——\n我还爱着：一切都源于爱情。\n在人类尽头的悬崖上\n我又匆匆地镌刻第二行诗：\n爱情使生活死亡。真理使生活死亡\n这样，我就听到了光辉的第三句：\n于其死去！不如活着！\n我是在我自己的时刻说出这句话\n我是在我的头盖上镌刻这句话\n这是我的声音　这是我的生命\n上帝你双手捧着我像捧着灰烬\n我要在我自己的诗中把灰烬歌唱\n变成火种。与其死去！不如活着！\n在我的歌声中，真正的黑夜来到\n一只猿在赤道中央遇见了太阳。\n那时候我已被时间锯开\n那神。经过了小镇　处死父亲\n留下了人类　留下母亲\n故事说：就是我\n我将一路而来\n解破人类的谜底\n杀父娶母。生下儿女\n——那一串神秘的鲜血般花环\n脱落于黑夜女人身下。\n一切都不曾看见\n一切都不曾经历\n一切都不曾有过\n一切都不存在\n人类母亲啊——这为何\n为何偏偏是你的肉体\n我披镣带铐。有一连串盲目\n荷马啊，我们都手扶诗琴坐在大地上\n我们都是被生存的真实刺瞎了双眼。\n人，给我血迹　给我空虚\n我是擦亮灯火的第一位诗歌皇帝\n至今仍悲惨地活在世上\n在这无边的黑夜里——\n我的盲目和琴安慰了你们\n而他，他是谁？\n仿佛一根骷髅在我内心发出的微笑\n我们　活到今日总有一定的缘故　兄弟们\n我们在落日之下化为灰烬总有一定的缘故\n我们在我们辗碎的车轮上镌刻了多少易朽的诗？\n又有谁能记清　每个人都有一条命\n——活到今日，我要问，是谁活在我的命上\n是谁活在我的星辰上，我的故乡？\n是谁活在我的周围、附近和我的身上？\n这是些什么人　或什么样的东西？！\n等我追到这里\n荒漠空无一人\n我在河边坐下\n等你等了半天\n河水一波又一波\n斧子已被打湿\n斧子沾满水滴\n喑哑的地铺上\n忽明忽暗火把\n照着满弓一样的乳房\n那是什么岁月\n我血气方刚\n斧子劈在头盖骨\n破碎头盖骨\n从这一头飘到那一头\n孕育了天地和太阳\n那是什么岁月\n青草带籽纷纷飘下\n那时候我已经\n走到了人类的尽头那时候我已经来到赤道\n那时候我已经来到赤道\n那时候我已经被时间锯开\n两端流着血　锯成了碎片\n翅膀踩碎了我的尾巴和爪鳞\n四肢踩碎了我的翅膀和天空\n这时候也是我上升的时候\n我像火焰一样升腾　进入太阳\n这时候也是我进入黑暗的时候\n这时候我看见了众猿或其中的一只\n回忆女神尖叫——\n这时候我看见了众猿或其中的一只\n合　唱\n告别了那美丽的爱琴海。\n诗人抱着鬼魂在上帝的山上和上帝的家中舞蹈。\n上帝本人开始流浪。\n众神死去。上帝浪迹天涯\n告别了那美丽的爱琴海\n何日俯伏在赤道上\n水滴也在燃烧\n血液起了大火\n船只长成大树\n儿子生下父亲\n太阳王\n我夺取了你们所有的一切。\n我答应了王者们的请求。赦免了他们的死。\n我把你们全部降为子民。\n我决定独自度过一生。\n赤道。\n全身披满了大火\n流淌于太阳的内部。\n太阳，被千万只饥饿的头颅　抬向更高的地方\n你们或者尽快地成长，成为我\n或者隶属于我。\n隶属于我的光明\n隶属于我的力量\n这时候我走向赤道\n那悲伤与幻象的热带　从南方来到我的怀中。\n我决定独自度过一生\n我像一只地幔的首领　缓慢地走向赤道\n赤道，全身披满了大火，流淌于我的内部\n我是地幔的首领\n一群女儿是固体在高温下缓慢流动的。\n她们在命运之城里计算并耗尽你生命的时辰。\n暴露在高原的外表\n那些身处危险\n那些漆黑的人们\n那些斧子形的人\n三只胃像三颗星来到我的轨道\n你们听着\n让我告诉你们。\n你是腐败的山河。\n我是大火熊熊的赤道。\n你是人类女儿的伴侣。\n我是她们死亡的见证。\n你是惆怅的故乡　温情的故乡\n你是爱情　你是人民\n你是人类部落的三颗辰星\n我只是，只是太阳\n只是太阳。你们或者长成我\n或者隶属于我\n让我离开你们　独自走上我的赤道　我的道\n我在地上的道\n让三只悲伤的胃　燃烧起来\n（耶稣　佛陀　穆罕默德）\n三只人类身体中的粮食\n面朝悲伤的热带吟诗不止。\n让我独自度过一生　让我独自走向赤道\n我在地上的道　面南而王是一个痛苦的过程\n我为什么突然厌弃这全部北方　全部文明的生存？！\n我为什么要　娶赤道作为妻子\n放弃了人类女儿……分裂了部族语言。\n人们啊，我夺取了你们所有的一切。夺取了道。\n我虽然答应了王者们的请求，赦免了他们的死。\n让我独自走向赤道。\n让我独自度过一生。\n其它诗歌的杯子纷纷在我的头颅里啜饮鲜血。\n我一如往昔。\n是天上血红色的轴展开\n火红的轮子展开\n巨型火轮　扇面飞翔　滚动\n赤红色光带摇晃　使道燃烧\n——你在地上也感到了天空的晕眩。\n我一如往昔。\n我的太阳之轮从头颅从躯体从肝脏轰轰辗过。\n接着。我总是作为中心\n一根光明的轴。出现在悲伤的热带\n高温多雨的高原和大海\n我是赤道和赤道的主人\n在热带的海底　海的表面\n斩断了高原的五脏。\n于是我在刚果出现\n我的刚果河！两次横过赤道\n狂怒的泼开……赤道的水……如万弓齐放\n像我太阳滔滔不绝的语言\n在四月和十月　我经过天顶　深深的火红的　犁\n犁头划过　刻划得更深\n仿佛我将一只火把投进了他的头骨嘶嘶作响\n那时候赤道雨啊\n赤道的雨可以养活一切生灵！\n仿佛我将一只火把投进了他的头骨嘶嘶作响\n这是我儿子的头骨。这是我和赤道生下的儿子\n我俯伏在太阳上　把赤道紧紧拥抱\n我双膝跪在赤道上　我骑在赤道上\n像十个太阳骑在一匹马上\n十个太阳携带着他们的武器\n生存的枪膛发红灼热\n那是我的生殖　那是我的武器　那是我的火焰\n我俯伏在太阳上　把赤道紧紧拥抱\n我的儿子　我的儿子　你在何方？\n那时候我走向赤道\n雷在你们头顶不断炸响\n我在这瞬间成为雨林的国王、赤道的丈夫\n我在这一瞬成为我自己　我自己的国王。\n这就是正午时分\n这就是从子夜飞驰而来的正午时分。\n（地平线在我这太阳的刀刃下　向上卷曲\n千万颗头颅抱在一起。咬紧牙关\n千万颗头颅抱在一起仿佛头颅只有一只\n地平线抱在一起仿佛一只孤独的头颅\n又纠结一团仿佛扭打在一起）\n我的儿子　我的儿子　你在何方？\n你的头骨——那血染的枷铐\n头颅旋转\n空虚　和黑暗\n我看见了众猿或其中的一只"},{"id":"short/1983/思念前生","title":"思念前生","type":"short","year":"1983","body":"庄子在水中洗手\n洗完了手，手掌上一片寂静\n庄子在水中洗身\n身子是一匹布\n那布上粘满了\n水面上漂来漂去的声音\n庄子想混入\n凝望月亮的野兽\n骨头一寸一寸\n在肚脐上下\n像树枝一样长着\n也许庄子就是我\n摸一摸树皮\n开始对自己的身子\n亲切\n亲切又苦恼\n月亮触到我\n仿佛我是光着身子\n光着身子\n进出\n母亲如门，对我轻轻开着"},{"id":"short/1985/船尾之梦","title":"船尾之梦","type":"short","year":"1985","body":"上游祖先吹灯后死去\n只留下\n河水\n有一根桨\n像黄狗守在我的船尾\n船尾\n月亮升了，升过婴儿头顶\n做梦人\n脚趾一动不动\n踩出没人看见的足迹\n做梦人脊背冒汗\n而婴儿睡在母亲怀里\n睡在一只大鞋里\n我的鞋子更大\n我睡在船尾\n月亮升了\n月亮打树，无风自动\n生物潜入河流或身体\n梦见人类，无风自动\n---\n● 1985.7.12"},{"id":"short/1987/夜晚-亲爱的朋友","title":"夜晚　亲爱的朋友","type":"short","year":"1987","body":"在什么树林，你酒瓶倒倾\n你和泪饮酒，在什么树林，把亲人埋葬\n在什么河岸，你最寂寞\n搬进了空荡的房屋，你最寂寞，点亮灯火\n什么季节，你最惆怅\n放下了忙乱的箩筐\n大地茫茫，河水流淌\n是什么人掌灯，把你照亮\n哪辆马车，载你而去，奔向远方\n奔向远方，你去而不返，是哪辆马车\n---\n● 1987.5.20黄昏"},{"id":"short/1988/野鸽子","title":"野鸽子","type":"short","year":"1988","body":"当我面朝火光\n野鸽子　在我家门前的细树上\n吐粗黑色的阴影的火焰\n野鸽子\n——这黑色的诗歌标题　我的懊悔\n和一位隐身女诗人的姓名\n这究竟是山喜鹊之巢还是野鸽子之巢\n在夜色和奥秘中\n野鸽子　打开你的翅膀\n飞往何方？　在永久之中\n你将飞往何方？！\n野鸽子是我的姓名\n黑夜颜色的奥秘之鸟\n我们相逢于一场大火\n---\n● 1988.2"},{"id":"short/1989/黎明之二","title":"黎明（之二）","type":"short","year":"1989","body":"（二月的雪，二月的雨）\n我把天空和大地打扫干干净净\n归还一个陌不相识的人\n我寂寞地等，我阴沉地等\n二月的雪，二月的雨\n泉水白白流淌\n花朵为谁开放\n永远是这样美丽负伤的麦子\n吐着芳香，站在山岗上\n荒凉大地承受着荒凉天空的雷霆\n圣书上卷是我的翅膀，无比明亮\n有时像一个阴沉沉的今天\n圣书下卷肮脏而欢乐\n当然也是我受伤的翅膀\n荒凉大地承受着更加荒凉的天空\n我空空荡荡的大地和天空\n是上卷和下卷合成一本\n的圣书，是我重又劈开的肢体\n流着雨雪、泪水在二月\n---\n● 1989.2.22"},{"id":"sun/太阳你是父亲的好女儿","title":"太阳，你是父亲的好女儿","type":"sun","year":"1986","body":"（《大草原》三部曲之一） \n西海还非常遥远。我一人站在这空无一人的大草原上，喃喃自语。大草原上一棵树也设有。草全贴着地长。西海还非常遥远。是的。非常遥远。\n远方的那些雪山也深得像海一样。\n1\n　　 流浪的人有预感吗？\n　　 两个俘虏都有一双斜视的大而漆黑的眼睛。黑得像夜晚。\n　　 大俘虏和小俘虏，他们有预感吗？\n　　 为什么？\n　　 也那，五鸟，这两个我曾与他们共在大草原上漂泊的流浪艺人，和我亲得像兄弟一样。还有札多，提着一米长的大刀，月光在刀刃上闪闪发光，走在这草深的地方，五鸟背着一面大鼓，和他的体重差不多。也那披散着他的长发，上面编织着红色的穗子，始终像僧侣一样缄默。他的服装被笔直斩为三段：绝无任何杂色。白色俯伏在红色的上方，映衬着他那黑得像铁犁一样的头颅，像一只饥饿的大鸟，飞过了腰带宽宽的红色，一直扑向身体上那大部分的黑色。那黑色除了黑色还是黑色。黑色，就像一个贫穷的铁匠在打铁。一个贫穷的铁匠，除了打铁，还是打铁。他写出的谣曲也时而是生铁，时而是熟铁。而他的嗓子则像火中的金子，那样流淌，那样灿烂，闪着夺人的光芒。一到这时，牛皮鼓呼呼作响，而札多连大刀都握不住了，那大刀像被解放的奴隶躺在地上铺好的干草上，也许那大刀会娶妻生子吧。十把小刀有男有女。我被自已的突发奇想所震掇，而这时，无边的草原正在我背后，以四季特有的时而温暧时而寒冷的气流吹在我的背上。透过我，风神呼吸着我，像无穷的泪水滚动的故乡。脚下的这些野花，很碎很小，碎小得令人不能置信。每一朵和每一朵小得就像夜间的星星，比星星更密。密切的，关怀的，秘密的，无名的小花。不应该叫一朵一朵，应该叫一滴一滴，因为她们的确像这一滴或那一滴露珠或泪水。在这稍微有些暧红的土地上。小得仿佛已经进入了秘密深处。小得就是秘密自己。另外有些野花，是紫红色的，黄色的，长得比较高，一丛一丛的，凭借它们你可以预感到这附近一定有一个大湖。可以预感到就隐藏在这周围的秘密的泉水，她们就是一片大水在草原上走向自己故乡时留下的隐秘的足迹。她们既想隐去，又不想隐去。我采下一抱，放在膝头上。有一股子味，是一种不太好的味，酷似酸性的土地本身，是那种混合着粪香的艾味。艾，是一种奇怪的草，总是使我联想到那个汉族的母亲，在过月子时，所用来沐浴和蒸熏的大木桶的滚沸的水中的艾。在家乡的荒坡上总有这些高高的草。有时又叫黄金。我给这些较大的花取了个名字，一概称之为“足迹”。无非是因为颜色的不同，我就分别称之为“紫红色的足迹”或“黄色的足迹”。由此，我想，风神和大水之神是在遥远的草原尽头微笑了。心安了。宁静地笑了。像远方本身的笑容，而这些花，我取个名字，都是为了说给那个又黑又小的俘虏听的。那个雪山的女儿。有一次，在干草棚中，靠近微微隆起的山坡。山坡上散着些牛羊。那是在一条干涸的河的底部用干草搭起的干草棚。在那里，她说她是雪山女神的最小的女儿。我对这小小的俘虏说，这些花我全都抱来了。我把这些足迹全都抱来了。我管这些花叫“大水的足迹”。另外的，草原上铺满的，小得像泪滴一样的花，白色的，我就管她们叫“泪”或“妹妹”。一个有着名字的无名的野花。一个又聋又哑的妹妹，全部的妹妹，在雪山之下的草原上开放着。而我则没有名字，在一个茫茫无际的大草原上漂泊。我多想有一个名字。叫也那，也雨，五鸟或札多这样的名字。哪怕人们叫我铁匠也好。甚至只叫我歌手也使我心安。可是不。熟悉的人们管我叫“大俘虏”或干脆就叫俘虏。不熟悉的只能叫我，召唤我用“喂”或“你好”。难道我真叫“你好”吗？\n　　 看见也那，五鸟，札多这些兄弟坐在下面的缓缓的山坡上，没有大刀之舞，没有鼓声，没有歌声，连那些编织着红穗的头发也没有飘动，也被两边无穷的草原染成一个颜色。我们沉默地坐在那里。我头枕着烈日下的大草原，没有遮蔽，没有树。\n　　 青色的烟从草原那一头升起。\n　　 为何总是火的呼吸先到达我们？在这无风的正午，火，平稳地呼吸着。\n　　 青色的烟，美妙地，平稳地升向天空。\n　　 一定有人。\n　　 牧人或者是流浪的弟兄。\n　　 一想到有人喊我，呼唤我，哪怕是没有名字的一声召唤，哪怕仅仅是这袅袅升起的青色的曼妙的烟……\n　　 她不也曾用那鼻音呼唤过我吗？\n　　 那个小小的黑色的俘虏。\n　　 我有一个名字。他是秘密的。流动的。有时像火。有时开花。总有一天，我要抓往他，把他砌在圣殿的岩石中，陪那些安静的大神过一辈子。等到神庙倒塌。我又变成一遒火山口。然后就是涌出泉水，遍是森林和开花的山坡。\n2\n　　 那年夏天雨下得很多。大雨使流浪的艺人们吃尽了苦头。那辆又旧又破的马车总是陷在泥泞里，微微泛着红色的粘有苦草根和揉入泥浆的分辨不清的花瓣，打了马一身。这是匹母马。而血儿骑在那匹母马生下的小马脊背上，小小的身躯像远处的山梁一样挺得笔直。她是在内心感到骄傲。也许是在为这大雨滂沱而骄傲。童年的痛苦和少女的烦恼在这大雨中一扫而光。大雨焕发了她潜在的青春和灵性。这种时侯，血儿尤其美丽，使人不能逼视。我们几个男人吃力地从泥中推着马车，身上己完全湿透，分不清是雨水还是汗水。我又累又饿，真想把身子往这雨地里一放，再也别起来了。但我仍然把自己绷得像弓弦一样紧。这时侯，有家有屋顶的人该是多么幸福。\n　　 大雨点打得人眼睛都睁不开，全身和脸儿都开放着雨水的花朵，那是血儿，骑在小马上，黄色的头发在雨中披散着，像是正在沐浴的小神，小小胸脯在雨水中微微隆起，雨水使她的脸更显得光洁。这个草原上雨神的女儿，似乎全部雨水降落西部大草原都是因为她的召唤。她拧干了自己黄色头发上的雨水，用谁也不懂的言语轻声唱着一只歌子。我知道那内容。血儿告诉过我。猎人在高山上追捕一只母鹿，不幸跌下了山洞。就在他跌下去的一刹那，大风刮去了他那红色的有猎物气息的猎人帽。他是死是活，没有人知遁。\n　　 我干脆在这雨地里停了下来。把我们像一些沾满了红泥浆和青草的又脏又湿又笨重的行李一样一下子散落在这雨中的大草原上。那个“红之舟”的下面，被整座寺庙整个宫殿全部的城堡压在他头顶上的，那个地牢中的建筑师呢？那个年轻的发疯的小僧侣呢？还有那位秘密的陪伴者呢？在这场大雨中，我是不是该向你们，向你们和也那、五鸟、札多和血儿讲一个故事，讲一讲这个秘密的陪伴者，这个传教者的故事了？我是不是该讲一个崭新的，只属于曙光和朝霞，只属于明天早晨，只属于下一个世纪的发疯者的故事呢？\n　　 但在雨中大草原，鼓声咚咚地响起来了，似乎天地间一团大火在跳舞，他已临近这雨中空旷的大草原，他己降临大草原，还有谁能怀疑呢？虽然我正考虑是否重新开始一个曙光的故事，虽然也那披散着长发，愤怒地吼叫，但鼓声在大雨中响起来了。再也不用犹豫，再也不用怀疑，是的，就这样，就应该这样，保持整个流浪者那火红的青春的鼓，那流浪精神，那流浪道路上染遍冬日黄昏和黎明的血。保持这呼喊之血，大笑之血，未受污染之血，保持我和狮子一同享有旷野的夜和血。流浪吧流浪高举我们破烂的彩色的衣裤就像举起了战争和瘟疫的旗帜，骑着我们的老马和小马，我怎能放弃我这流浪的天性，我怎能抑制我这夺喉而出的歌声？\n　　 这不是你又是谁？！这不是那大雨赠给儿女间的女儿又是谁？这不是自主地舞蹈的闪电不是你又是谁？快跳下马来吧，快跳下来！你看五鸟把鼓都擂破了，而也那披散着长发，和札多正把一种吼叫变化成了一种图腾。他们像一些奇怪的栅栏在火中跳着舞，又似那些驱散鬼神的黎明之前的金刚勇士，他们的自身已和大雨和鼓撕扯成一团。啊，谢谢你，五鸟！你为我们破译了这雨的心脏，雨不正是在呼喊你吗？！跳吧，快跳下马来吧，开始你那闪电的舞蹈。血儿！对！对！这不正是你吗？！高高举起你的双臂向群山举起丫闪电，跳到你的胸脯上的雨水像一千只小鹿在歌唱！那悲惨的童年已经死亡，那痛苦的暖昧的少女也已死亡，只有闪电之女，大雨之女，在旷野上！在大草原上疯狂地挥舞着身体，对血儿，就这祥，昂起你那宝贵的只有天堂才享有的头颅，把你那鲜花般的嘴唇张开，唱些我们不懂的歌，即使那是逃亡之歌，野蛮之歌，即使那是杀人之歌抢掠之歌，即使歌声使你想起了悲惨的人世和过去的生活，还是唱吧！对！更激烈些！把闪电召唤并安顿在其中，你应该在这支强盗的旧歌中加入你的内容，结尾和结局都应该是你的，对！高声唱起来吧！跳起来吧，你的腰肢上有一千条闪电在颤抖着照亮雨中的草原。泪水夺眶而出，我应该做一副铁的眼睛才是啊，我应该到我兄弟那铁匠铺里打一副铁的眼晴才是啊，或者在村里与老石匠雕出的那两只换一下。看着你，我的血儿，石头也会长出自己的眼晴，也会看到你，也会认出你，我的血儿，令天不是又开始了吗？不是又用一对铁眼在流泪吗？我的弓箭呢？我该疯了才是啊？怎样才对得起你的舞蹈？\n　　 大雨稍歇，我们继续赶路，终于来到我们向往已久的一个伟大古代城市的废墟。在大草原上，城市本来就极少，留下的废墟就更少。在西部大草原的边缘，靠近东方的民族，只有这样一个石头垒起的废墟。五百年前也曾是王城，这从那高高的好战的城墙可以看出。我们把马车停在一家客店里，留下札西来照料马和车子，并安排一切，我们其他几个人马上就要去登攀五百年前这万里大草原上最伟大的都城。\n　　 这天夜里，我和血儿参加了神秘的兄弟会的仪式。在这广大无边的夜草原的北方，在大草原的北方的尽头，始终有一个神秘的兄弟会。\n3\n　　 他跑到山上。这是第二次。头一次的时候还没有走火入魔。头一次时也未遇见疯子头人。但那时疯僧与三位腥红装束的刽子手的恐怖形像己深入他的心中。解脱了一套数学，又陷入另一套。这是一系列完整的数学建筑体系。本来是他自己创造与构筑的。他的数学体系是有关与天空对应的高原之地的。有关最高极顶的宗教宫殿。其中很少的一部分是关于地牢的。这些地牢是建构在阴暗潮湿的果园之下。那些果树像一些幽魂在深夜里吐放着香气。在八月初的日子里。经常有一位疯僧来这里打坐。达数月之久。在八月初的日子里。每当高原云彩的影子滑过山坡或刀刃一样的山峰。羊儿咩咩悲哀交换的时候。牧羊人昏昏沉沉无以打发时光的时刻。那果园里苹果树上挂满了饱含处女酸汁的刚刚长成的青青苹果。那可是八月的好日子啊。牧人们的帐篷已有些沉浸在黄昏中。袅袅牛粪烟上升。果园。果子的香气。和宗教的香气混杂一片。翻滚过河面。这是大地上一条最高的河流。有两句诗：\n　　　我愿你不再流向海底\n　　　你应回首倒流\n　　　流回那最高的山顶\n　　　充满悲痛与平静\n　　 他跑到山上。这是第二次。他根据牧草和河水的颜色判断这是雨季。这是八月最初的日子。疯僧依然在那些头顶果树下打坐。也许他打坐的头顶是一棵槐树。榆树在那个果园里倒没见过。只是按照我的数学体系，那果园一定座落在地牢的头顶。在被囚的日子里，我常常梦见苹果打我。把我砸醒的是狱卒不是苹果。深深的噩梦。满身冷汗。两手空空握成一个拳头。这时疯僧肯定又逃离寺院长老的眼目。独自来到这空寂无人的园子。打坐。并偷偷的食着禁果。每年只吃一只。那是八月的好日子啊。我想起了处女般的苹果。我梦见一个叫血儿的小女孩。我犯下的罪不是数学也不是天空所能解脱的。只有在八月的荒芜的寸草不生的山梁和无人的风雪之夜灭绝人畜的风雪之夜才能得到解决。谷物和家乡的仓门不知是否也已遭受同样的风雪。还有那些豆子地。种青稞和油菜和裸麦的边疆地带。我第一次从地牢逃跑到山上也是在八月。也许还要在稍微早些时候。我第一次来到这荒芜之地。我遍体鳞伤。上面有刀疤。枪眼。还有一些疯狗、饿狼的牙齿印迹。我几乎可以说是衣不遮体。只披着一些破破烂烂的布条。就这样。他一下一下用打断了的腿骨爬到了山上。那歌手唱着这个故事。在一个喑哑之夜的歌中这样唱到黎明。可我当时是怎样用自己的山上的泥土搓揉好了自己的腿骨和肋骨，虽然在以后的冰山雪水和风雪之夜，闪电瞬间明灭轨道划过长天之时，仍有些隐隐作痛。但毕竟是有些像健康人了。在八月的山上。我为了嚼下泥土和山脚一点点苔鳞和别的小虫子，为了治好断裂的骨头，我爬遍了这几条荒芜的山梁。几乎走火入魔。三位腥红装束的刽子手重重地用膝盖顶断我两根肋骨的时候。我眼前有无数火把舞动．我在呓语中发誓一定要练功，哪怕走火入魔。我于是在山腰头脚倒立，一次次使疼痛和最后的疯狂抽搐传遍全身。我感到疯狂和晕眩的天空之火已传遍我的每一骨每一穴。我感到我已变成了那疯狂的腥红的天空上的刽子手。我在山上多少日子缺少食物盐。我只能靠用一条麻木的舌头不停的舔着那唯一的生锈的铁钉子来维持我的生命。那是我在这座荒芜之山发现的唯一的生命。唯一的与我一样孤独的生命。先是舌头恢复了知觉。然后是身体感到了极度的痛楚和疲倦。我感到了呕吐对我上半身内脏的猛烈袭击。呕吐像一只饿狼。而胃则像一盏微弱的孤灯照着一群疯狗。我的手肮脏和歪曲得就像鸟的爪子。她们用采攫泥和细树枝用以营巢繁殖。我在没有盐的疯狂状态下甚至想怄下自己的眼珠子以饱尝盐味。因为有一次在沙漠中我曾从一对猛兽的眼珠中尝到这天地间最珍贵的咪道。当这一只铁钉使我意识到被折断的腿骨和肋骨时，我感到火从我身上一点一点流走。耳鸣如鼓。血液变得像雪水一样冰凉。我闻到了自己内部那股腐败的叶子花枝的气味。我也闻到并听到了我嘴里死人的气味和死人的叫喊。鬼魂彻夜不眠的叫喊。我的浑浊的眼珠已映着死亡的村庄排着队打着火把。在营地欢迎我。这种盐味使我又恢复了对牢和地的意识。那地牢，那牢像一块钢轶，又像一股牲畜的臭味——裹住了我的骨骼，这种臭味腐烂味和生命个体的排泄味一起在我的骨骼外围，形成了我的肉体。我的肉体充满了家乡肮脏臭猪圈的臭味。哪怕是一只豹子雄狮和大熊也只能在囚笼里发出牲畜的臭味。伟大的兽王在地牢里也会觉得自己变成了只臭猪。因为他闻见自己是一团臭味在肉中间。他第二次爬到山上。爬到八月荒芜的山上。日子，远远把那肉体的臭味抛弃在身后。他这时舔着唯一的生锈的铁钉。感到了身体折断后巨大的痛楚和无休止的对于天空降下盐的渴望。但这些比起肉体的臭味来，已是生命最大的幸福。这却是一座八月的幸福之山。呼啸，高大，赤裸，彻底，荒芜，暴力，灭绝，占有一切。但今日我预感到我又会被抓回那阴暗的散发着臭味的地牢。一些刑具和刽子手在等着我。更大的痛楚。更大的肮脏。更大的肉体臭味。我的更大疯狂在等着我。我的静静地挂在肉体上的腐烂在等着我。我从此再无八月。再无天空。再无风。也无空荡荡的大山。因此，像青稞一样，我要在我的腐烂和臭味中抱紧我自己的岩石。地牢就在果园下面。这地牢是一间一间隔开的。到底关押了多少人，我心底大概有个数。因为我毕竟是他的数学设计人。但关的是些什么人，我却很少知道。从我的躺下睡觉的石板到放食具再到牢门刚好成一个等腰三角形。这种设计也应归功于我当时的才分与疯狂，完全归功于我年轻时代的天才构思。我囚在我自已的天才数学里。此外，疯魔意识也主宰了我当时的整个构思。极为完整。又富于强大的创造活力与激情。我提着灯。彻夜不眠。确认我伟大的牢。牢中大概……我是这样回忆的，大概还有一位疯狂的头人。我数次遇见他。叫他是“疯狂头颅”。这位疯狂的头人胡须雪白一副疯疯癫癫的目中无人的架式。他真实的名字叫亚·顿。他就是高原上无人不知的领袖、首领、酋长、总头目“疯子头人”。此外我还知道在这地牢中还关押着几个弱　小的强盗头子。我怒火万丈。我怒火万丈。今夜疯子头人又在牢底喃喃自语。他总是说。他总是说个不休，有时还手舞足蹈地唱上一阵。他总是这样说——我原谅天空给我带来的一切。包括飞行和暴雨。我原谅天空给我带来的一切失重。包括飞鸟和雨雪。我所有的一切都来自天空。包括闪电雷霆。我忍受了天空也原谅了天空。他总是这样说。今夜又在牢底喃喃自语。我怒火万丈。\n4\n　　 从这边望去，对面的山上只剩下些折断的石头柱子，像一些惨遭天空刑罚的断肢残体。石头已经停止生长，永远地就这样残缺下去了。\n　　 但是大石门仍在修建。\n　　 这里的建筑分成三部分。\n　　 石门。偶像堂。废墟。\n　　 真不敢相信这个猎人和这位老石匠都是盲人。第一次遇见这个老石匠时，他就已经盲目。但他像任何明眼人一样正常地干活，不论刮风下雪，打雷闪电，也不问冬夏春秋。他始终很坚定。\n　　 他始终在修建一扇这世界上独一无二的石门。用他自己的意思，翻译成我们的语言，就是这样：如果世界上少了这一扇石门，世界就不完整。而且世界简直就没有了支撑。\n　　 这一扇石门高约十丈多。\n　　 石门中有无数辩认不清的小石门。\n　　 从这个盲石匠的爷爷的爷爷就己经开始修建这座石门。远远看去，这扇扛着高原上全部蓝天的石门简直像盲人的一只艰睛。边缘粗糙割断而又笨又直，像一把割开日月的石刀。这只眼睛里垒满了石头，用耳朵贴在这石门上仍能听得见海浪的澎湃声。呼啸。这些石头无一例外都是从西海那一个死亡的海域由这位老石匠的十代以前的祖宗，也是一位老国王，用十多万人命换来的。有多少船死在海上。那些船里有人、石头、火和粮食。那些船里还有海图和酒。这些船又是从遥远的北方大森林里伐倒之后顺着老国王境内唯一的大河漂流而下的。\n　　 简直不能谈论这扇石门的历史和血腥。有多少头颅在森林里，在采石场，在海底，在旷野，在未被驯服的大河内部呼喊着，滚动着，要向他报仇。这双复仇的手如今就长在这位盲目的老石匠的手上和手的内部。那双手有一种天生适合复仇的素质、他分割。他垒砌。最后他衰老，疲倦，被葬往周围是开花的山坡的山洞里。里面也许有几大桶腐烂了的粮食。如今他年轻，活着，吃着石头，喝着石头，与石头唾觉，生下石头的孩子。\n　　 石门竖立在那里。看见我的这些流浪的兄弟坐在下面更深的凿入岩石的阶梯上。连那些编织着红穗的头发也没有飘动。他们沉默地坐在阶梯上。我心有些慌。两边的岩石压过来。巨大岩石看见我自己惊慌失措的脸。岩石压过来，我的心脏马上就要涨破了。我感到没有呼吸了。岩石窒息着我，似乎一点就着。\n　　 偶像堂布置在一间广大的容器般的石窟里。似乎听得见远处神秘的滴水声。石头的偶像，粘土的偶像，木头的偶像，这一切偶像在你神智错乱时会为你带路。在飞行时她们不会留下蹄印和鸣叫。但你醒来觉得自己像一个散着香气的稻草人。后来他把自己的地牢布置成一个偶像堂。鸟儿从她的喙上吐出了她自己新月形的潮湿的血污的内脏。喂养我。在地牢里。我几次梦见我在那高高的荒芜的不能感知不可触摸的荒凉之地砸碎了自己的锁链。在远方的草原领着一个叫做血儿的小女孩和一群流浪艺人在流浪。在夜里，这些不安全不安分的偶像，时时在夜里飞来飞去。像巨大的卵形在舞蹈。已改变了地的模样。我只好重新回忆。揉捏，打上金子封条。地牢里经常在夜里吐出金子。我就用那只阴暗霉烂的地牢吐出的金子，制作了一个巨大的金偶像。还把剩下的金粉涂抹在其他泥土青铜石头偶像的脸上。那金偶像是巨大的，占了地牢的四分之三。所以每当她舞蹈时，整个地牢仿佛只是她的腹部。偶像堂只是对地牢的一次模仿。偶像堂有一股牲口棚的气味。牲口棚有一股近乎无限的气味。偶像们在夜里缩小了，飞出了石头栅栏。石窟又恢复了平静。石窟又恢复了天空的本质。一万页羊皮在干净岩石上叠码得整整齐齐。石窟里曾经飞来的几位神已把我的石窟里所有的火与火种吃光。石窟又恢复了平静。\n　　 在偶像堂建造之前，必须冶炼金子。先必须建一座小高炉。这炉子的耐火砖还必须先烧出来。好在小坩埚还在。那还是从平原上带来的。在这靠近平原的肮脏的小村庄，小村庄根拥挤，彼此用牛粪饼拍成，像一个小小的暴露在草原边缘的，干牛粪色的小小内脏。为什么设有被群鸟当成食物吃光和叼走，我在小高炉建成的时候也还是没弄明白。这个小村庄叫“草原之滚”。是一个混杂着草原、渔猎和农业耕作的地方。你可以认为她是一个渔村，靠近这高原上最伟大的圣湖，也有一两户经常上雪山狩猎的猎户。你也可以认为她是一个农村，有许多半大不小的孩子和他们的父母种植着油菜、青稞。这是一个危险的所在危险的季节。农业，这是一个危险的年龄。人们翻山越岭而来，在危险期制订法典，建设了这个新衣村。当然，在大草原危险的年龄期，最主要的人们都在从事放牧。奶牛和耗牛。奶牛谩步在草原尽头圣湖之水浸润的草地上，那景色美丽极了．无人能逃脱她。我日夜神思恍惚，因为那达到金子熔点的小高炉还是没有建成，那一日，我去铁匠铺里用烧红的铜针开始纹身。草原把反对。那近乎黑夜深处野兽的图案由铁匠印到我身上。一只铁匠的手，把草原印在我背上。这是全部草原的黑暗。那时我是如此怀念家乡丰收时期的打谷场。金黄的稻草黄中有青。稻谷不断流泄到今天重新整修的打谷场上。人们感到了成年时期收获的愉快。而这是草原全部的黑暗，由铁匠的烧红的钢针也把收狡的图案印到我的背上。这是与草原危险的主题不相适合的。铁匠询问我无言以对。草原的年龄比野兽夏危险。\n　　 还必须进一步描绘一下地理．\n　　 铁匠铺和棺材店紧挨着。就像恐龙和猛犸紧挨着。这种两极在建筑上的拥抱有一种原始的大庆典的味道。凶狠，霸道，轮轴状的铁匠铺。彻底丧失了任何水源。棺材店提供营养。她是一种氛围，渗透，类似于关节病一样的东西。棺材店的一半是石头洞窟。反正一半是石头一半是粘土茅草与木材。它的气势深深潜藏于地下，可埋千军万马，外面看去，好像只埋在一个不显山不露水的地气十足的地方，正对着一个平坦的长满乌草的小山坡。没有牛羊。没有青稞。你在晴朗宽阔的北方大平原不会感到这股地气，仿佛是阴沉沉的火的一种变体。传说中退向山坡的走火入魔的陷入无限平方陷入相互混淆的根须陷入纠纷使人摸不着头脑不着边际的缺水的雷同的沉闷的粘土堵塞了我的耳朵。我涂抹了这两孔窑洞，相交于三角形的脊背和底边上。\n　　 白花花的石头。\n　　 巨大石门越来越不接近完成。\n　　 巨大石门有一种近乎愚蠢的表情。\n　　 他迟钝，粗暴，又是那样的。\n　　 固定不易破碎。巨大石门像一道障碍竖立在这天边。石门仍然愚蠢地屹立着。石门的第三阶梯，有一些裸体的猎人、怒汉、金刚、匪徒、马帮头子、武士和铁汉状的人形裸体雕像，肩扛着这上面的石门部分。那些雕像比真人大而硬，线条时时出现错误，没有明确的现实主义基础，有些简直是草草而成的。巨大石门的这一部分，据说是老石匠的爷爷，那个建造圣地的巨大神殿“红之舟”的建筑师，又发疯被囚禁，但在他的晚年，他把他的一生总结在这个第三阶梯上。那个盲目猎人在雨季就在这儿实践瑜咖。他的幻觉中经常出现自己是一些生锈的铁条组成和弯曲的大铁轮子。有时是一个实心的大铁滚子。有时又会梦见自己是火把。而那废墟的主要部分是一个唐朝的洞窟。\n5\n　　 老族长独自把酒搬到船上。\n　　 一刀捅下去。\n　　 马倒在地上。\n　　 血喷出来。\n　　 喷到老族长的手上、脸上和身上。\n　　 染红了老族长雪白的胡子。\n　　 那血在大雪和冰河上，异常的稠密，粘粘的，还冒着热气。冰河时代降临了，没有预兆，没有歌声。漫长的冰河时代。漫长的船舱中的时代。漫长的黑夜来临了。那时母亲还是一个小女孩，篷乱着头发，这个像哑子一样的女孩，跟在众人的后面，手里打着一只众人为她扎好的小小的火把，进了船舱。她看见那匹驮着老族长走过大草原的老马惨死庄老族长的刀下。她那幼小、稚嫩的心猛烈地抖动。好一阵也没平息。猛地一哆嗦。冰河时代来临了。世界上到处都在下雪。所有的道路都被冰雪覆盖。冰河时代提前到来了。事先没有任何预兆。老族长的话应验了，在这短暂的日子，人们只来得及为自己和自己的孩子在黑暗中扎一个火把在圣地，许多人和许多牲畜冻死在雪地里。世界恢复了史前的寂静。修石门的老石匠扔下了手中的凿子、钻子和大锤，加入了逃难的行列。\n　　 老石匠连夜用石头和仅剩的笨重的金属制做了几只破冰斧。他提着一只锅就来了。紧跟在老族长的后面。几乎所有的家长都提着锅。许多窝棚，草棚和石屋里那下面积满草灰的灶上只剩下一个大坑。只剩下烟熏火燎的痕迹。锅已被拐走了。许多人提着锅走在一家的前面。都没有来得及背上那用兽皮缝成的装粮食的袋子。在这张还有着你的少女香气和温暖的床铺上，在这张还有着野兽通过食物，抢劫掠夺和你的漫游而获得的血和肉外围温暧的皮毛上，我做了一个恐怖的梦。但是，血儿，我可不敢完全对你讲清楚这些史前的梦。我先是梦见史前那喧嚣而又寂静的景色。混沌初开，天空和大地一片血红。像一个凄惨的没有形状的自我。这个自我手持火把在向我走来。火把是悲惨的，劈开的，向内燃烧的。总之，就是火把，我梦见我是一只恐龙，和其他的恐龙一直在天上飞。我甚至感到了我嘴中的火焰和气泡。我感到了我的内脏和消耗食物和器官在我的内部也紧跟着我在空中飞。我感到了我身上鳞甲的噗噗作响。我从这一条冰河纵横的大陆飞向另一块大陆。那里只有海浪和森林。在这恐龙时代，只是吃，吃，吃，吃，吃。还有冰河，冰河，冰河。我感到天空先是在天空上变得寒冷。后来天空又在我的内部变得寒冷。在这之前，我还必须再一次结束史前的寂静。我必须使我自己的混沌获得一种虚假的秩序，比如说，历史，真理，丰收等等，我必须首先声明，我放弃了这一切，只是于少数人，比如我，来说，就是意外的。是致命的。丰收是最后一次打击。丰收像一把镰刀割断了我的脖子。我感到了喉咙上那种近乎鸟鸣的断气。我感到空气从我头颅被割下的脖子流进了我的食道、我的内脏。我看到丰收。我看到滚动在沼泽上的那一颗头颅，那是我的头颅，我看到它的滚动，我看到我的头颅的滚动，是通过我自己的，也就是恐龙的眼睛。是通过丰收。我看到了，就那么一次，对于诗歌和真理来说，这就足够了。在巨大的面对丰收的近似于天空的平台上，坐着村里的长老，那是一些年迈的老瞎子。身体还丰常健康。他们唱着歌。在下面。在村子里。获得了丰收。我必须，必须这样。只能应该这样。可有谁能用斧子劈开我那混沌的梦？！我抱着我的血儿，裸露着我们的身体。我把精液射进她的刚刚成熟的子宫里。那里是黑暗的。我觉得我就要断气了。血儿每个毛孔都是张开的。我不应该这样写我的血儿。但那混沌就是这样的。谁是我手头嘹亮的斧子？血儿和我躺在丰收的大地上。那里是七月更深的丰收。是青青的就要变黄的茂盛的深深的青稞。就像我的血儿。是茂盛的。深深的。我该怎样为我自己写下这些庄稼。这些眼看就要丰收的庄稼到底是怎么回事？这些庄稼是这些庄稼？这些庄稼难道不应该在天堂？这些青稞，这些从史前的混沌和恐龙的遗骨中生长的一粒粒的小小的头颅，这些用茎，杆，用竖起来的，随风吹拂——那风起自天堂，在原野上承受雨雪的，用闪电照亮的，听见雷神嘶吼的，我的青稞，我的青稞我的青稞，能够酿戍节日和懒散之酒的青稞，啊，青稞，你说说你究竟是怎么回事？！我还抱着血儿睡在这青稞地中。人类的紧张已从我俩的身上逃离。那些紧张的，人类的，纪律的东西，已随风吹走，过了山冈，到村子里，获得了丰收和酗酒了。那个逃亡者，那个死刑囚，那个石匠，还有那些恐龙和族长，那些浪流艺人，所有存在人类紧张中的东西。已在青稞地里消失。但是在梦和一片混沌中，我还抱着血儿睡在这青稞地中。混沌中，我用镰刀割下了血儿的头颅，然后又割下自己的头颅，把这两颗头颅献给丰收和丰收之神。两条天堂的大狗飞过来。用嘴咬住了这两颗头颅。又飞回去了。飞回了天空的深处．难道这些秩序，这些车辆。这些散乱的书页真能说明我的混沌，真能咬住我俩的头颅，飞回天空吗？难道在我的语言的深处真的包含着意义？难道我已经把诗歌写进了散文？难道这就是我带来的？难道这竟然是一部关于灵魂的大草原和哲学的小说？难道你竟然真的存在，在人间走着，活着，呼吸着，叫喊着，我的血儿，我的女儿，我的肋骨，我的姐妹，我的妻子，我的神秘的母亲，我的肉中之肉，梦中之梦，所有的你不都是从我的肋间苏醒长成女儿经过姐妹爱人最后到达神秘的母亲中。所有的女人都是你。那片无限的即将获得丰收使村里人摆脱春天的贫困和饥饿的青稞地，像时间的河水流过我和血儿。我该怎样写这些青稞地。我在我的深处再一次遇见了但丁的天堂篇。我在我的深处再次遇见了人类的诞生和世纪的更替。我把她镌刻在神秘的巨大石门上，我将她放在中国西部直至广大的中亚细亚草原上。甚至还有整个蒙古和西伯利亚。尤其是我，这些年甚至可以说是生活在荒野里。我的伙件是季节、诗歌、火与遥远的声音。我终生不渝的朋友是西藏和大海。我的爱情是印度。我总是在想，为什么我不生活在雪山，为什么我不生活在僧侣和石头之间？为什么我不生活在沙漠上？我们像是两个失散多年的亲人在一个海浪震荡的狭窄的船舱中相逢。我从你身上看到我们之间在母亲那个大家族中的遗传。我的一切叙述上的错误和混乱都来自世界和自我的合一。在这里，在这个故事中，因为一切都是梦中之梦，一片混沌，所以我不可能把一切都介绍给你，也不可能把一切都说清楚，那样的话，我就不是我，草原也就不再是大草原。我告诉你阅读的方法，我告诉你有几条线索，和一场大雪，自然界的景色，以及不确定的，没有年代和时间的晃来晃去的黑暗中的几个人形，还有一些似是而非的梦境。我要贯彻到底。我必须这样说，世界和我，在这本书里，是一个人。\n　　 因此，就这祥，就这样干。\n　　 尼采说，现在是时侯了。\n　　 现在简直是时候了。\n　　 因此，诗歌来源于他的头一句。\n6\n　　 流浪的人，你不是对草原尽头有一种说不清的预感吗？\n　　 说出来你就心安了。\n　　 那就是大海。\n　　 你有所预料的，但又是突然的海。\n　　 西海，西方的海，在我的梦中，美得像一匹被天神点燃的马，燃烧着。\n　　 燃烧着。\n　　 那海上的霞光没有感到焚烧的痛苦。\n　　 西方的海，像是草原尽头远方的笑容。\n　　 此刻仍然是干渴的烈日下的大草原。\n　　 转眼即是寂静的星星满天的夜晚。\n　　 草原之夜。在草原的边缘。\n　　 秋矮子用几条柔韧的青藤枝条编成一个花环，戴在他那粗笨的头上。他身高不到二尺。又很粗壮。他嘴里满是锯屑（木匠拉锯锯木段，木条，锯下的木屑，比尘土还细），喷吐着火，又似乎是手忙脚乱地从嘴里拉出了红色的又长又粗的带子。在笨拙的外表下掩盖不了他的敏捷。村民们终于没能看出那红色带子是从他的什么地方弄出来的。草原边缘村庄里的许多树被砍成桩子，立在四周。有一圈白色的已被雨泥弄脏的大帐蓬。木条头举着火，或挂着用碗做成的灯。碗里烧着野兽的油脂。秋矮子得意非凡地绕着人群中间的空场，用他那笨拙，滑稽的动作，走了好几圈。有几次是头顶着碗。一次是一只，慢慢添加。前面的师哥师姐用美丽而忧伤的流浪艺人的步伐和天赋走了过去。是秋矮子冲淡了人们观看这些色彩鲜艳而又陈旧褴楼的艺人带来的忧伤和旅愁。这些黝黑的细瘦的四肢灵巧的人儿来自何方？据说那走在前面的最美丽的人儿就是秋矮子的老婆。秋矮子是这些浪子和艺人的首领。他们有没有血缘关系？他们唯一的幸福就是那路途上的泉水。周围有鲜花和蜂鸟的山谷里的泉水。或者是在一片草原上突然自己涌出的泉水。他们没有任何道具。除了一身旧衣服。红色的、带有过去的节日和过去的爱惰的痕迹。带有雨水泥水。有些痕迹也已没有了。还有汗水从他们黝黑而细巧的四肢渗出来，是如此漫长的路途，洗净他们那瘦小食肉兽的身体。他们有的人只有一把破伞。不知是哪个朝代遗传下来的破纸伞。有的人有一只瞎了双眼的鸟。这只鸟还只有一只翅膀。有的人会耍枪弄棒，一身好功夫。有的人不停用刀雕刻着木头，或无目的地把一根木头削尽。那只瞎鸟的另外一支翅膀已进入某个村庄某只黑猫的肚子。他们迎来朝霞，送走晚霞。是享受黄昏最多的亲人和陌生人。在冬天寒冷明亮灿烂的月亮的夜里，在寒星下，在野火的身边，度过了多少夜晚。他们没有家乡，没有村庄，没有大理石，没有铁匠铺。也没有杂货店。他们的睑原来是被朝霞和月亮染黑。他们在看不见人的雨里，雾里，雪地上走过。给村里的人们带来了什么？他们翻筋斗。有时多达几千个。看的人头都看大了。他们打爻子。他们是最早用人类身体向人类自我说话的人。有时向村民们借来那些蓝边边瓷瓦碗。然后在高开村庄时又一个不少地还给他们。美丽的秋矮子的妻子一边在地上翻滚，一边总是在做出最危睑的姿势时，接住了那些眼看就要摔碎的碗。因为那么多路被他们走过，唯一的预示幸福的泉水肯定被他们所饮。只不过她们饮下的痛苦之泉更多。他们比我们还仍然是痛苦多于幸福。秋矮子的弟弟秋妹，是一个娘娘腔的男人，但却是一个无可救药的酒鬼。他从来都是醉熏熏的，没有过一天清醒的日子。甚至有人说他和秋矮子是双胞胎呢。我不敢肯定。一个奶油的高大瘦削的水做成的男人和这个身高不到两尺的又黑又粗的小矮子怎么会在同一只子宫里睡过。是不是他把他的哥哥挤成了这个样子，谁也说不好。在清晨，在山梁上寂静无人夜雨已停，而鸟鸣正此起被伏的时候，他俩一前一后来到了我们这个世界。费了不少劲。他们的母亲使出了最后一把力，终于歪着脖子。嘶地吐了一口长气死去了。在大槐树下，他们被送到两户人家抚养，直到前年，这个酒鬼弟弟才找到这个流浪集团，一块和他们流浪，砸烂了多少酒坛子，多少酒店的女老极都喜欢这个混蛋，留下了他的种子，日后将要做酒店主，或者酒店的店小二，给人切牛肉，提烈酒，打扫呕吐过的地面，再把酷似他生身之父豪饮烂醉的另外的酒徒轰出或拖出酒店。而他自己滴酒不沾，以一本翻得稀烂的画有兽头、僧侣和王冠的羊皮古本自娱。这个小小的秋妹的儿子，也许现在还拖着鼻涕，两只肮脏的从出生下来就没有洗过的小手紧捏着什么。\n　　 “离开他们，离开这里”，戴着你们的麦草编成的旧帽子离开这里，离开他们。也那，五鸟和札多，离开他们，离开这里。大俘虏说：“无论血儿怎样，无论她是跌下了雪山，还是被骆驼商队拐走了劫持了，都离开这里。”离开他们。离开这里。离开他们。离开秋矮子，离开秋妹，离开大熊，离开抱窝的母鸡，离开跳蚤，离开蛙，离开火孩儿，离开他们。只有马羊，你回来，马羊，你回来，回到我身边。把我周围最后的青色树枝对着月亮烧完。你是我家乡的姑娘，你始终像妹妹，像妻子，像未婚妻，像你自己的泪水一样爱着我。小马羊，只有你和我懂得田野和树，只有你始终留在流浪和朝圣的路上，只有你始终没有背叛我。你要去朝圣，你要跟我走，你要去流浪，你或者和我守在这个肮脏的村庄。为我在地窖中生取温暖的火，为我点起这蓝色的火。你要用你劈柴的声音打断那些遥远的像在天边的不真实的女人对我的折磨。你要用北方的大风剥夺我，侵略我，使我的秋天只有落叶，没有回忆，没有遗失。一些领导秋冬的光光的树杆轰散他的鸟兽，让山上孤零零的，没有和尚没有庙。光光的树杆孤独地伸向天空。马羊，可是，你不能赶走我心中的血儿。她没有给我带来回忆，她活在我的血液深处。一切的秋天和冬天生起的火对她没有用。她就像那乡间小路上村民担麦用的扁担上的铁尖包头扎在我的眼睛里。那时满天空只有红色的僧侣，那时在我眼里母亲也成了陌生的妇女。\n　　 又宽又长的血红色的带子，是雪山那头的一个少女用全部青春织成的。她说着我们不懂的话。她一生都在纺织。在合适的季节，她则登上悬崖，去采摘奇花异草，用来医治人们的疾病。是的，这带子，就是她织成的。如今扎在也那的腰上，划分开那眼泪和生铁的颜色。我发誓，总有一夭，我要把这故事讲给你们听。也那在那一天把弓箭，把犁在岩石上摔得粉碎，他在心里骂道，去你妈的！那时也那自由的日子就来到了。那时也那自由了。也那，你对身边的一切怒吼一声，滚开吧。然后你就摇摇晃晃地上路了。然后你就一点预感也没有地上路了。你就在风中像风一样，也那。你觉得自己像一片大沙漠。也那，你向内心深处一看，确实，一滴水也没有了。把弓箭、猎枪和犁在岩石，在那蓝的像水一样的岩石上摔碎。等着吧，也那，不会有人给你送葬的。等着吧，也那，不会有人理解你的。从三尺深的大沙漠下挖出了你的尸骸。一具完整的尸骸躲在晒得稀烂的弓箭中间，也那，你就像是某一次从大树顶端摔到地面的鸟巢中的鸟蛋，而且已经被太阳晒干，也许还被野地的动物舔过。我的自由！我的弓箭！也那这样在心底呐喊着，咒骂着，嚼着满嘴的烟叶，就这样上路了。也那就这样把故乡远远推开。也那就这样上路了。我的弓箭，箭壶里还有十三只箭。十二只赠给了欧亚大陆的十二个大帝国的国王的心脏。还有一只和箭壶和弯弓一起和我的尸骸一起稀烂地躺在这灿烂的自由里。也那这样在心底诅咒着。应该说，也那并没有听见什么召唤。也那就这样茫然而愤怒地上路了。也那上路了。\n　　 也那说“这里有人”\n　　 也那说“从远方来看我”\n　　 也那说“从不同的地方走来”\n　　 也那说“往山谷碰头又散开”\n　　 也那说“互相告诉一些秘密”\n　　 也那说“轰走岩石上的群鸟”\n　　 也那说“用力捆紧麦捆”\n　　 也那说“这是一束麦子”\n　　 也那说“在扛到谷仓前千万不要让她散开”\n　　 也那说“赶羊去吃草”\n　　 也那说“然后再回来”\n　　 也那说“在风吹起时我将指给你方向”\n　　 也那说“无风时有满天星斗”\n　　 也那说“给世界一个名字”\n　　 也那说“从远方来看我”\n　　 这就是也那的语录。这就是也那说的。这的确是也那说的。我还曾将这些语录谱成歌谣，那是一些多么美丽的歌，让我们起誓，我们誓守秘密。让我们对火起誓，誓守火的秘密，誓守歌曲的秘密，誓守语录的秘密。往昔的日子里我的肩膀所扛起的一切如今都在岩石中哭泣。\n　　 哭泣，哭泣着为我保密。\n　　 大风。月亮。月光。仓央嘉措的四行诗。迦丹波利。大雪小雪，回忆着一个陌生的南方少女踏着积雪和月光向我走来。\n　　 红色的山峦起伏，伸向远方。\n　　 伸展她的两翼。\n　　 寂寞无边而来。\n　　 血儿，你看，那山坡的颜色，远远看去，和北方冬天晚霞的颜色一样。血儿是无辜的，就像枝条上不经意碰落的花瓣。“血儿，你在哪儿，你在寻找七叶一枝花，还是十字花，那紫红色十字花？”额头很高，头发剪得短短的你，血儿，你在哪儿？你回到自己的故乡了吗？那个带你漫游的北方人是谁？在空寂的山谷，你是独自哭泣，还是在流浪的火堆旁，谁抹去你的泪水？那把用刀子割下的篷乱的头发，还埋在雪山以下，能看得见雪山，听得见大风和寂静的地方。据说头发是很难腐烂的。这些还编织着红色和绿色花绳的头发，就这样像一只寂寞的鸟的受伤的翅膀埋在地下。那颈上挂着铃儿的血儿呢，那像鸟儿一样的血儿呢？\n　　 血儿不注意别人，也不注意自己。她就像一朵云或一缕烟一样漫不经心，充满遗忘，就是这样的。她总是这样的，就是这样的。她也就坦然了。她高兴的是那些消逝在空中的鸟。她不喜欢大象和骆驼。她爱的是那些没有内容马上就要消失的东西。她喜欢风，云和烟。一缕青色的烟对她来说比什么都重要。在遥远的秋天尽头生起的那些青色的烟。有烟的地方才充满了生气。她甚至没有看到烟下面的火。她喜欢的是那些变幻不定的，不可捉摸，不可辩认的类似风吹过来的那种呼吸。她只在这种呼吸拂动的时候存在。她就像一个精灵，而且是这个精灵在大雪封山的火堆旁躲躲闪闪的影子，在遥远的山上，她就像任何远方，遥远得没有内容。但没有人不爱她。就像没有人不热爱远方，尤其是这些流浪艺人。人们可以不热爱父母，不热爱自己，不关心哲学，算术和天文，也可以不管风向，水土和地理。一个人不管是热爱还是鄙视风景，就算是一个被处斩头的人押上了断头台，或者在草原上沙漠上突然发现自已的水全漏光，或者一个人烧掉了自己所有的诗歌把脖子伸进了绳索，但没法不让他想起远方。“远方”这个字会使他一哆嗦。人可以背叛父母，祖宗和自己，可以背叛子孙和爱情，但你不能让他对“远方”有哪怕一丁点像样的反抗，边种事难道还少吗？\n　　 流浪艺人的生活是艰苦的。经常没有水喝。我常常流鼻血。收集的每一首歌都有我的痛苦掺杂其中。有一次我已走到了疯狂的边缘。骑着那匹马的马头撞碎在悬崖上。我遇见了小俘虏。这是也那和五鸟那位朋友诶她取的名宇。后来她照顾着我。往一口生铁的大锅内扔进各种野菜。有时用草和花来喂养着我的胃。小俘虏，就在这漫长的草原漂泊的路上我为你写了多少歌啊。直到黎明来临。头顶的星星只剩下几颗在夭光里，像是被打尽果实的远远的树，还有最后几个。透明的，发光的。小俘虏。\n　　 哭泣。哭泣着为我保密．\n　　 血儿那些日子，属于她的头巾的她那微微有些卷曲和发黄的小辫子，那多么好！有多少好日子！那一小根一小根小辫是在春天和秋天的道路上一朝一夕长成的。那明亮的眼睛，只看守过青烟，云朵和我。小狗和鼓属于她的手。道路和雨雪属于她的脚。辫子属于她的头巾。井水和泉水属于她的嘴唇。嘴唇属于她的歌声。云朵和我属于她的眼睛，除了过眼烟云，还有谁能守在她心中。小小的血儿，披着那从南方雪山深处带来的唯一的头巾和鼓，一路把花戴在头上，从故乡（也可能不是故乡）一直向北方走未，向我走来，颈脖上铃儿叮当作响，那不是风儿吹响的。那不是风儿吹响的。我亲眼看见过，小马羊也看见过。如果你们在路上见到了小马羊，就说血儿和我在一起，说我们在等她，就缺她一个。如果你们在湖边淹过的浅草上见到了血儿，就说小马羊已经离开了我，已经住在我的附近，像过去一样，我又孤独一个。有谁，又有谁，在赂上会见到这个把头巾披得低低，遮住了眉毛的小姑娘，如果她没有了十七根小辫子，一定又剪短了头发，穿上了男装。这时，我一定是无可挽回了。我一定在什么地方组织了一个秘密的兄弟会。我们在山洞里储存了不少诗篇和粮食。我们没有后代。我说过我会这样的。\n　　 我会这样的。坐在地牢里梦想着你，血儿。\n7\n　　 远处是一望无际的山峰。近处延亘到山麓的是一些时而旺盛时而贫瘠的青稞田。那个肮脏的破烂小镇子此刻还未望见。那南坡北坡依稀有一些牛羊。像画书上的东方之国的蚕在一片青叶上食。我饿极了。但嚼铁钉的锈滋味再也不能使我免于饥饿。世界上的粮食都存放，霉烂并生长在什么地方？在我饿得五脏六腑都搅动的时候，那一瞬间，我感到天空上写满了文字，写满了饥饿的文字，像只剩下骨头的鸟群在天上飞。我恨不得把石头用手揉软，放在嘴里，舌头上，并放在仿佛长了几百排森森死气逼人的白色獠牙的我的空荡荡的胄中咀嚼。我的肠子像水磨坊主的水磨一样不停地扭转不熄。我的肚子像一个空荡荡又破又烂的山间乡村教室发出小学生背书或僧侣念经一样不绝于耳的“咕咕”。我踉跄着走下山。这已是秋天的末尾了。我靠在岩石上。我告别了神秘老人。在这之前有几天我从昏迷中醒来。我醒来，躺在一个神秘老人的帐篷里。老人说，在离这儿很远的地方，他还有一幢石头房子。那是冬天的住所。我佛在出家前也是在不同的季节有不同的房子。雨季有雨季的房子。还有露台和美女。这个王子，然后就剃一个光头，穿上漫游行乞的衣服，出家，正式加入漫游者的队伍了。他没有音乐，只有思想。我在逃亡的过程中，陪伴我的是景色。他的那幢石头房子，是石门建筑的一个附加部分。那个盲目的老猎人在雨季祈祷，裸体睡在石门的第三个阶梯上。而在整个雪季他则狩猎。再凶猛的野兽也要毙命在这双手上。雪季是为了胃。这老人那简陋的帐篷外有一条凶猛的牧羊狗。屋里挂着弓箭。而整个天空就像是帐篷，挂满了闪电这些箭支。还有太阳的光线。在太阳和风雪都隐去的日子里，在大草原上，我简直被钉在这里，钉在这个不说一句话的神秘老人的帐篷里，一动不动，任群鸟在天上飞，任朝圣的人们含辛茹苦，背着沉重的大锅，盐和酥油，晒干的生肉，把他们的牙齿擦得洁白如雪。锋利的刀子插在怀里，或兽皮靴筒里。这些踏在积雪亘古不化的雪山上的朝圣者，脚上缠着兽皮，磨亮了用鲜肉和骨肉滋养的刀子。从靴筒里一经拨出，立即刺入你的心脏，不差半分，你都没看见那白光一闪。后来我就在祖辈营建的石门边上住下来了。住在一间黑暗低矮的石头房子里。我和祖宗一样，开始了对巨大石门一个重要部分的营建和雕刻。举起了我的锤。但现在我还是满身创伤。逃亡在八月以后的荒芜的山上。我踉跄着走下山，这已是秋天的末尾了。我的伤口有所好转，但仍是紫红，嫩红．黑红相间。我用一把马骨做了些日用的器皿，就踉跄着走下山。黄昏的火烧云的形状兆始着我今夜一定会有酒和粮食。果然，在靠近黄昏落日的地方，一面旗子迎风招展，抖抖索索不停。这是一个十分荒凉的所在。一切都被染成黑夜的色彩。今夜必定黑暗。我把头颅放在那山脚的石头间摩擦了一下。我让全身的骨架松动一下，舒服一下。让骨骼在这种自由中不至于错位。我用那山腰的雪水抹了抹腰部、生殖器和额头。我感到我的肚脐一阵抽搐，一阵一阵抽缩。我仿佛又听见了母亲在竹林间生产我的呻吟。那时漆黑一片，隐隐有血腥味和痛苦的呻吟。母亲咀嚼着什么食物和花果，我已记不清。我的脑子里纠缠一团，团团地打转。肚子里一阵凉气，直压向小腿肚和脚后跟。那时酒店的灯笼已经亮了。我感到全身的真气流向那盏灯火。我再也走不动了。噗的就倒在离酒店不远的一堆石头上。可能又流出血了。毕竟，酒店里的男人对血腥气味是那样敏感。我多少次在昏迷中这样推理。终于我醒过来，已在酒店角落一张十分肮脏的羊毛垫子上。那与其说是垫子，不如说是一堆被扯乱的十分鲜明的温暖的野兽。我感到羊毛的温暖渐渐变成了羊肉味，十分刺激，像柔软的刀尖又压向胃部。胃部就像着了火的幻象中的天鹅。口吐白沫的我又幻成了疯子头人，口中滔滔不绝。我接过一位有刀子一样眼光的人递过来的液体一饮而尽。酒，啊那是酒。是酒。因为是多么多么空的一只胃，我马上就呕出来了。来一碗玉米糊，帐算在我身上。我看见那个刀子眼的家伙不仅是刀子眼，而且脸上横七竖八的刻上了刀疤。我看见他的嘴唇在蠕动。那混浊低沉如寺院佛号的声音一定是从这张脸和这只嘴里吐出。脸和脚不一样。脚是人的真正主人，而脸只是人的傀儡，是脚丫子的影子。我不止一次地这样想，脸，脸这东西，就像丧家犬一样，是长给别人看的。除了自己，谁都是他的主人。笑也是笑给别人着的，哭也是哭给别人看的。除了那些先知和疯子，早就有部落头人打着火把准备好了这家肮脏的小镇。我又踉跄着爬起，像一个真正的光棍，连呕吐的残迹都来不及抹去，就一屁股坐到正中央酒桌的唯一主席的位置上。这本是那位刀子眼的坐位。他是这里的酒王、司令和主席。可我就根本不管这些。我必须用一坛子一坛子酒把我这条在地牢在荒芜的山上丢失的命捡回来。我知道。这是我的命定之星，酒，每当我大醉或十分饥饿后，呕吐了一地，我又能在这呕吐的滋味中十分地痛饮一次，大醉一次。我的呕吐，恢复和再生功能之胃十分完善，哪怕我全身已十分瘫了。我仍是酒神，大风和火速运行的雨阵雷鸣之神，我更是酗神。我的火红的心又“啪”地断成两截。我连人带椅子飞到地上。我的脑袋中又有火把又有美女。原来是一个满脸卷毛和肉团的家伙将我摔倒在地上。这可是那人的兄弟。我不顾伤口的破裂一下子就火了，好好抄往那家伙的一双铁铸的小脚一把拖将起来。可能我模模糊糊的脑子想着另外一个家伙的脑子该飞出他的颅腔之骨了。我的心里乐开了花。他倒在地上，也出了血。有人馒慢地扶他起来。可能是老板也可能是刀子眼。我十分舒服十分偷快，伤口于是就更加十分痛起来。我从酒店的地下抠了一些带酒味的泥涂抹并狠狠的按在那儿，止住了伤口的叫唤。伤口就像一群善良的羊一样，在这一皮鞭的抽打下，再也不发出“咩咩”的叫唤了。我借力扶起椅子，又端坐在上面，像一位发须全白的长老，僧官，像一位我曾在沙漠梦游的马背上一教之主，在部落称王称霸的另一头颅。我环顾四周，似乎都是我的族人或山洞中的金刚手。心中心更在。铁中铁亦在。我抱起地上的大坛子，咕噜了多少口。\n　　 我唱起了山洞中我自己的歌：\n　　　　紫杀王\n　　　　铁金王\n　　　　铃铛响\n　　　　杀人忙！\n杀人忙！杀人忙！一举锁链吭呛呛！锁鬼忙！杀人忙！我大笑三声，连饮三口。这只中等坛子在我手中十分技巧地转了数圈。又大笑三声，连饮三口。这样转来转去，喉咙咕噜了数次。终于我的酒精的数学完成了。我一甩手，那坛子像我刚才一样飞起来落地，一直洞穿窗户，在墙外呼然一声，应声而碎。我又高唱拿酒来。我也不顾我身上只有伤口却无分文金银。但我是见酒如命也是见酒不要命！他在我下面坐下，对店主说：“再给我端十几坛子最好的来。”几个人又围桌子坐下了。那个仰面摔在地下头颅喷出血的汉子已被抬进隔壁。那是老二，后来刀眼人跟我说。刀眼人让人倒满了酒，并给我倒了一碗酒，溢了些，并向我端起了碗。我仰着脖一饮而尽。他也一饮而尽。其他人也都纷纷倒酒喝洒叱喝着吃着唱着。山头也在微微抖动。众人后来便是狂饮。应该说在此之前我是否大脑出了问题，产生了错误，并丧失了对部分时间的记忆。我模糊记得有人给我端来了一种黑白相间的粮食，和水拌搓，我抓起就吃。一口气吃下了三大碗那种类似玉米糊和炒面的东西。因此肚子就像一团大火和屋底地窖粮仓有了一些垫底的。有了地容底喝起酒来我当然是很烈的。在众人狂饮中我最狂。全身抖颤像沙漠上披头散发的呓语的神，坐在一面古老又大的鼓上。全身是火药硫磺味，羊骚马尿味，和化为青草野花的阵阵香气。在我的数学体系中，我听到天空终于参加了进来，带着他的金黄星星绿发的星星，或火焰般狂舞的宇宙边缘穗带的星星。我的建筑终于像一艘至高无尚的“渡舟”建在世界最高的山头。我给它起名为“绝无仅有的红”，“红之舟”，“红色的渡”等等，还有附加的民房，马厩，囚牢，羊圈，猪团，牛栏，厨房，军队营房，外交驻扎地等等，还有所有飞鸟的灵魂安葬之所。我似乎又回到了深深的地牢。但在地牢中我怎么又突然有了这么多酒肉朋友，把酒盏内的绿色的火向我举起，并吞到自己的肚子里。我极力在我的身上和身旁扶住我的火焰。其实这火焰就和空气一样虚弱。水和种子已流尽，已从我的头颅中飞走了，落在远方的草原上开花结果。我感到在远方的大草原上我的蹄子变成泡沫飞溅的头骨和酒杯。\n　　 铁匠！\n　　 铁匠！轶匠！\n铁匠！铁匠！金刚手在空中变幻了几圈，变幻了数种人兽形象，幻成一个铁匠在我的酒桌旁站起来。先是把几个牛头颅和羊头颅（还没有啃光）和几大盘树枝带青叶都踢到地上。好像抽打了他。一种羊癫痫犯了。向我敬酒。那金刚手变成的铁匠就像一个小型铁匠铺。丁当乱响。又黝黑又结实。一座小铁塔浑身是煤烟和铁屑的味道。原来这铁匠是个聋哑人。越是聋哑就越想诉说什么。咿哑咿咿咕。说个不停。像个未成婚的快乐的异族猎人。因为呕吐浑身是兽粪味。这个金刚手又变成我，滚到了兽圈和地窖里。我设计的“红之舟”里有时充斥着一种史前异兽的臭味和香气。\n8\n　　 巨大石门的一部分与“红之舟”有明显的继承关系。\n　　 巨大石门面对着可爱的羊群般的石头。\n　　 俯伏了，地。\n　　 那些白花花的整齐如弓如轮轴如星象，布满方向，紧紧钳紧无言天空的白花花的石头。\n　　 我用灵魂之手指引它们。不能说这些羊群在我的思想和建筑中十分听话。\n　　 它们在夜里变成不能驯服也不可驯服的石头，尖叫着，像一些尖锐的武器。\n　　 在废墟的内部，那些石器时代的猎人手中紧握，临死双目紧闭也下松开的，不知哪一种野兽的角。\n　　 石头。\n　　 石头。石头。\n　　 悬空的崖。大弓和栅栏。角，矛，斗，轮轴。血红的轮轴。白骨一样的轮轴。堆到一块的石头超过了球体的重量。\n　　 我们来到了那个唐朝的洞窟。\n　　 冰河时代之后，在东方建立了一个唐朝。在那个天气晴朗的日子里，我和血儿骑着马，其他几个儿女坐着马车来到那个唐朝的洞窟。那洞窟里的彩塑似乎被温暖的火光映红。刚从冰河时代逃离了洪水和冰河的中国人有了第一个像样的家。在家中，中国汉族人民生起了火。火光映红了四壁。出现了温暖的壁画和景象。冰河和战乱以前基本上是荒草和墓地。巨大石头遮住了小村。先秦是墓地和孤零零的对奴隶施加酷刑的首都。然后是战乱。在战乱和称王之前只是一些孤零零的半山坡上涉河而居的用石斧挖出的洞穴，上面盖了些刚刚伐来的松树，还流着芳香的松脂。还盖了些用石刀石斧从壕沟，从那些用来防御虎豹的大沟之外割来的长草，铺做屋顶。这种半似山洞半似房屋的内部是以粘土烧制的陶器，用来打水和盛水。不知有无牲畜。陶器上画满了大地上水和空气和几何的花纹。但这些村子里的人死得很早。终于淹没在草丛中。后来就是多年称王称霸的战争。和平没有了。陶器打碎了。扯下了屋顶上的干草，用青铜埋葬了这些半山坡上周围是红色火焰般粘土的村落。后来是战争。有一人当了全国的帝王，那就是秦始皇。他要把以前的各种思想和思想的学生投进火里和坑里。修了一条城墙，用来防御北方。后来又是战争和饥荒。汉朝建了一个简陋的村庄，有粮食，有石头，在墓地，有马，有人，有枪，还有不少分封到各地的小王。后来又是战争。那是三个人的战争。终于到了唐朝这个家里生起了火，雕刻了巨大的石门上的石像。四周画上了城廓和丰衣足食的景象。没有村庄，到处竖起了城墙和宫殿，制订了刑法。在汉朝出现的地主，大地主和小地主越来越多了。到了宋，就出现了不少商人，小贩，和倒爷，还有纸币。不少地主也兼做买卖，开了米行。然后就是一大批强盗好汉在临江的酒楼上饮酒，写反诗，抢生辰纲。这些武士，和尚，浪人，小官僚，刑事犯，这些打渔的，无业游民，云游道士，开黑店的和军官。这些精通武艺的，脾气暴躁的，性子刚烈的，眼里揉不得沙子的，一点就着的粗鲁汉子，以好汉自居，凭力气吃饭，在酒楼上在江湖上厮混，杀几个贪官污吏，然后抢一些银子，来到酒桌旁坐下，对店小二吩咐：先切五斤好牛肉来，酒只管上，然后踉跄着上山，拳打脚踢，弄死了老虎，把字刺在脸上，烧掉了草料场，上山入伙去了。他们聚在一起大闹了好一阵，直到明朝一些穷困的，辞去小官的不得志的读书人从老百姓中点滴搜集，写成了几部千古奇书。这时，在山顶上，在废墟内部，有谁最先想到要修建第一座钟楼呢？谁又是那第一个铸钟人呢？不断地撞击着，不断地群山四起，不断地刺杀着景色和生灵。可有谁聆听过那一阵阵高悬于平静而结冻的北方之海，那像石头一样滚动的海浪之上北方的钟。那北方的钟声在海浪中，与海浪翻滚的节奏有同一种命令。可有谁聆听北方那半夜的海面上阵阵钟声。面朝北方的钟楼，座落在巨大废墟的内部，你的建造人是谁呢？那走过海浪踏着海水却来领取的海水。那阴郁的铸钟人。那北方巨大的钟。那不断地回响，不断地聆听自身，不断地撞开世界，不断地召唤过去，回来吧，不断地打击着你的那钟声。铸钟人仍住在石门和废墟之间的一个小石屋。扔下了手中即将媳灭的火把，投入一大堆干燥的渴望点燃的劈柴，白痴只活在这山顶的阵阵钟声里。成了白痴之后，在山顶上，他看着脚下的大雪和羊群，脑子里空空如也。像阳光一样空荡荡温暖，在意识深处自我召唤呼喊自己回答自己进行一场秘密谈话。那大雪中逐渐明亮的羊群和海。那一下子就到达中心的钟。\n　　 但是，还是必须从头开始。\n　　 我在这个故事里，必须频繁地朝圣，必须不断地起飞，但是，空气总是围绕着我。如果有一只鸟，是北方的，黑色的，天空上的，也吃粮食的，上空的，身体。就不断地起飞。故事必须不断地开始。又一次重新开始。都没有结尾。诗歌来源于它的头一句。\n　　 我有一首长诗，是写世界怎样化身为人的。这是我们这个世界的意义的真理。世界和这个内在的我都统一于这个有着外在和内在的人身上。这第一个人，他要说的时候，他总是说，总是说。是的，我要从头开始。那年，那一年我在夏尔巴人的篝火旁，我在攀登喜马拉雅珠穆朗玛的世界登山运动员之中。第二天就要正式从大本营出发了。我第一次听到了这个我和血儿的故事。她穿了件洗得变淡的红色套头衫，就像运动员们在秋天早上跑步时经常穿的那件。她滔滔不绝地说着。我第一次听到了这个我和血儿的故事。\n　　 她讲的故事发生在这广大无边的夜草原的北方。在大草原的北方的尽头。我燃起一只火把。我把这只火把交给你。你沉默地近乎残酷地接受了这只火把。你把它高高举起。血儿，你把它高高举起，用来照亮我，用来照亮这个高大的天地之间的手足无措的白痴。你把火把高高举起，照亮我的睑。整个草原像一面黑色旗帜，在风中翻滚。南方的武士翻山越岭，抬着那巨大的华盖和宝座，要接你回家去了。这一夜我连夜扎了多少火把。这天夜里，草原上神秘的兄弟会举行这些年来最大的一次仪式。他们举起火把，一个一个，孤零零地，翻到那巨大的石门上，翻上了那狭窄的天梯的那一段，是那个曾经囚在地牢的发疯的建筑巨匠后来营建和雕刻的。他们一小一个爬上了天梯。天梯上方是一个石头的牢笼。里面笼罩着一个从大草原的北方捉来的一只巨大的狮子。一只双眼已瞎的巨大的狮子。这只母狮子是在为子女捕猎时被捕的。如今囚禁在这个刚能容得下她的石头的牢笼里。她三天三夜吼叫着。今夜是结束的时候了。时候到了。披着黑色斗篷的大草原上神秘的兑弟会会员们举着火把，爬上天梯，把火把投进他头顶上方那石头牢笼。一共扔进了十几只火把。把石门和兄弟会会员的斗篷照映得通红。那巨大的像一位神秘母亲的母狮子没有发出任何声音，伏在烈火中。烈火化成了跳舞的人形。草原尽头神圣母狮一声不响，任烈火笼罩，她像黑夜的女王又像黑夜自身，伏在烈火中，轻盈。天梯上大火熊熊。我在地牢里，感觉到头顶的果园、宫殿和我建造的一系列高耸入云的神秘的“红之舟”。石门带有它们的痕迹。我在地窖中，把一张张羊皮和一块块牛粪饼或一根根劈柴扔向火中。我站在血儿面前，任火把高举到我的头颅前方，热烈的泪水在脸上变得寒冷。那些草原神秘的兄弟们把火把投进石头牢笼里母狮子的身体上。我在地牢，地窖，山顶洞，海边或大气吹拂的草原睁大我的双眼看着这个黑夜中唯一的狮子被那些火把烧成灰烬。被兄弟们的火把烧成灰烬。\n9\n　　 这压迫大草原的流浪艺人的鼓声！\n　　 从这边望去，对面的山上只剩下了些折断的石头柱子，像一些惨遭天空刑罚的断肢残体。石头已经停止生长，永远地就这样残缺下去了。雨终于停了。血儿所喜爱的烟，青色的炊烟，或者是白色的烟，从那些已经定居下来的，在大草原边缘进行收割的人们，那些原先是游荡牧人的后代们所生的烟，用火烧在干牛粪上，这些烟升起来了。这些烟毕竟生起来了。有一些牛群已从山谷涌上山脊。不用眼晴我也能感到一道巨大的彩虹横跨天空。不用说，血儿又让泪水挂在她的脸上了。又想起山坡上那些羊群，在哪儿躲避雨雪呢？晚上，我让老板烧了些热水，用干牛粪生火在屋子里。房子里黑乎乎的。没有点灯。只有火光，照亮了我的裸体。我，将衣服扔在地上，坐在大木桶里。我像是脱下了因为某位藏在山间魔法师的诅咒法术而变成的某种动物的躯壳。鳞甲变成了光滑的皮肤。蹄子变成了脚。爪子回到了手。我只感到一颗人类的心在人类的肉体中跳动，那么新鲜那么雅嫩。血儿在隔壁。作为隔墙的木板只有半人高，也在用水沐浴．过了一会儿，血儿穿了一身又宽又大的男装，头发上插了一把用兽骨制成的梳子，那梳子为什么用了那么久还是那么白，我不明白。她的头发还滴着水。\n　　 她默默走过未，从堆在地上的干牛粪堆中拿起两个圆圆的牛粪饼加入火中，又用铁勾子拨弄几下，火一下子旺起来。我坐在大桶中，尽量不弄出水响。我像是坐在海底，看着一个人类女儿的影子从海面上向我移来。血儿还是像天空上飘过来的云彩一样不说话。这是一朵远方的云，飘过了家乡火光的上方。我刚从海底归来，分不清家乡和远方。我没有回忆没有思想。过了一会儿，血儿又开始唱歌。那是歌唱泉水和一根用来担柴和盐和茶叶的扁担，和那被砍下的水边的桑树。我在这歌声里听到在故乡的水畔，一棵桑树和一排桑树像一位女儿苏醒了。她问，是谁把我叫醒了？血儿一定是在海中降生的，这我完全相信。血儿应该是在一只独木舟或一只木船船舱里降生的，或者是在海边柔和沙丘中降生人世的。一出母腹，就闻到了苦涩的大海的气味。海边的鸟仍然在空中飞行。但血儿降生了，像一位遥远的客人，云和闪电，钻进了海浪，这次从海浪中露出小脑袋。海浪把她推到人间。她降生时只听见海浪翻滚和鸥鸟长鸣。那里没有历史。没有渔村。一个男人和两姐妹。她是姐妹当中哪一个生下的呢？这故事又是谁讲给我听的呢？\n　　 血儿跳起种种名为“闪电”“雨”等等这些没有开始没有结束只有高潮贯穿的舞蹈。不用任何乐器伴奏，只要是大风，大雨，大雪就能召唤这种舞蹈，配合这种舞蹈。五鸟的鼓能给“雨之舞”“闪电之舞”戴上一种类似高山的顶子上石头滚动的节奏。我用内心看到和听见的我完全无法复述。\n　　 这舞蹈是带来献给谁的呢？沙漠部落和草原上的强盗把她养到十年以前。难道真是那些强壮的凶狠的用力量和残忍生活的人，把这种近乎抢掠和流浪的节奏，给了她的童年？她跳起闪电和雨水之舞，但为什么又叫“闪电”？为什么她在分别时要跳一种我从未见过的，她也从未跳过的“海浪”之舞？这已是多久以前的事？在高大的废墟内部，有一间秘密的用舞蹈来祈祷的场所。必须由一对双胞胎姐妹俩来跳。一为光明之舞，一为黑暗之舞。孪生姐妹的整个舞蹈都是由这种秘密教义规定的。在这个秘密场所的周围，四面都是宽广的大厅，这就是神秘合唱队所在地。现在也己残破。但石头柱子即使折断了也仍然很神秘地立着。上面雕着陷入狂乱的声音之神，歌唱之神。这些人头或兽头一个接一个地铺在这断残的石头上。他们只是头颅铺在一起，都没有身子。而且这些人头或兽头的眼睛是紧紧闭着的。像一些虚假的门扇，外面雕满了门扇的形状，里面垒满了石头。其实是此路不通。神秘合唱队的外在眼睛总是视而不见，仅仅是一种符号，像一种生硬的形式。他们这些人兽的眼睛都是没有内容的。内容向上，向一种更秘密的场所汇集。从那里歌声传来。歌唱之神和声音之神秘密地俯向下方，向着胸部，喉部，嘴部，发出了类似雷霆，大风，雨雪的声音。其中还有雨雪谩天飘落，海浪推动陆地。\n　　 这些合唱队的后裔们肯定还遗留在这又破烂又肮脏的小镇上。他们在山上放牧或在山谷间收割庄稼时会发出一种神秘的和声。人们说，翻过山梁在草原上都能听到。他们家中陈旧的柜子里有一些古代的羊皮，上面抄满了神秘的文字和歌声。但是，这一切，和血儿又有什么关系！和血儿用舞蹈召唤和安慰的精灵和大风大雨又有什么关系！和血儿用她的歌声来复仇又有什么关系！血儿第一次爆发出了她自己的歌声。两山退向后方，已成为废墟的城市像一把大斧没了斧柄，锈迹斑斑，躺倒在大草原边缘这个山谷和半山上。山坡上又有闪电又有牛羊又有雨雪。我几乎已经感到了幸福的来临。我感到了幸福的来临。在这个小镇上我们几乎安顿下来。\n　　 马车辗过我的夜色和曙光。和血儿在一起的日子是多么幸福而短暂。那映过草原两旁早霞和晚霞的车辕，老马和小马。我们简陋的行李和几张兽皮，还有我继承我那死去多年的父亲，那游牧部落唯一首领，他留给我的一个十分美丽的灯台，上面镶满了宝石，像一棵乐园的树，甚至就像乐园自身。它映照过多少次血儿那美丽的脸。它比血儿自己更知道血儿的美丽。我在我的歌声中流逝的那些夜晚都同血儿一起流逝。血儿曾经骑过的那匹小马也许己葬骨在某个青翠的山谷中，那里也许有一个叫卓玛的小姑娘在放羊，挥动着她黝黑的胳膊和小小的羊鞭，不去抽羊，而抽打着小路两旁的青草和野花。她也许会在雨雪中唱歌，在大风中跳舞，而当闪电来临时，会躲到草棚里一声不响。她是多么不像我的血儿，虽然她的面容，她的姿态，舞蹈和隐约从远方传来的歌声，和血儿的依稀相似。但她太不是血儿了。这个燃烧着我心窝的血儿。还在雪山的部落间流浪，跳舞，歌唱吗？流浪的马车又上路了。我们又看见了两边飘忽的云影。我的心脏收缩。我的耳朵轰呜。这个世界又开始漂泊。天地又被绑在马车的轮轴上。夜，像黑色的鸟，黑色深渊，填满了我的头颅。\n　　 夜已来临。\n　　 泉水周围的山坡隐藏了他和她的飞鸟。\n　　 夜来临。\n　　 天空收起了自己的舞蹈。\n　　 飞马也飞回了天堂的马厩。\n　　 我们的车轴和轮辐在夜色中显得十分孤单。\n　　 我们的马在夜色中更像它自己的影子。\n　　 夜，迅速来临。\n　　 在冬日的浪游的山上，思想，和一场大雪竟然会如此相似。在那个末日之前，在那次灾难之前，当我对你讲起大草原的时候。大草原和北方的海，冰河组成兄弟姐妹。大草原深不见底。大草原漫无边际。以前，在山上，在那个大雪封山的日子里，在札多逃出了山口以后，我和你，我的血儿，我，觉得我已经得了雪盲症。我的眼瞎了。黑暗把光明和火焰囚禁在这两块岩石似的地方，那就是我的眼晴。\n　　 大雪封山。\n　　 我们又一次在那里遇见了那位猎人。\n　　 西北风刺入骨髓。\n　　 我们又一次在大本营遇见了：“德尔干达西风旺”这位猎人。\n　　 和他的猎狗“堆火上天”。\n　　 大雪封山。\n　　 大本营成了冰雪世界。\n　　 早上起来，狼的足迹一直通往更深的山里。\n　　 后来连野兽的足迹也没有了。\n　　 血儿在这石头房子里像个精灵含着指头。身披着卖艺的衣服。还在裸露的脖子上挂着少年女巫时留下的几种骨制品。这个少女精灵衣服肮脏不堪。我们简直像是生括在一个地窖里。我常常怀疑自己已经盲目了。有那么一会儿我竟然视而不见一切。一瞬间我什么也看不见了。我不知道这是不是幻觉。在一个百年未遇的暴风雪中，在大雪封山的时候，是很容易盲目的。雪盲。我会像一个卖唱的老瞎子拉着琴唱着歌翻着白眼。世界对于我来说时时在悬崖上，在悬崖上更高的悬崖和下面更深的谷底。有时，世界是一个没有深度的二维世界。甚至整个世界只剩下一条直线。只有在最后，只剩下一个点，倾听的点，在深渊和悬崖上空飘荡。\n　　 如今我终于来到这里。\n　　 雪盲像一道光明照亮了高山的顶部。\n　　 如今我终于来到这里，伴着血儿，在大雪封山的日子里。如今，在这地窖一样的石头建筑内部，我们点着兽油，讲着死亡与恐怖的故事，为血儿编成一段舞蹈。取名为“石头内部的夜”或“石头内部的舞神”。石门，固定，坚强，像我们的骨骼和中心。但舞蹈是不能表达这巨大的石门，用流浪也不能表达这石门的坚定，永恒，它那超出人性的废墟般的品质。\n　　 血儿，你后来为我唱歌，你从此弃绝了舞蹈。全都怪我这双瞎眼睛。我们走过山口了吗？我们走到春天的村头了吗？有人递给人们粮食和奶茶吗？灾难之后，这世界还有别的什么吗？血儿，告诉我，告诉我已经忘了的一切。我再也想不起来的一切化成歌声。一个披着斗篷的人正在他的诗歌中用仇恨歌唱着你与我。血儿，在那个冬天，破冰船开来了。好几把冰斧在前面挥舞。那些人穿着野兽的皮在前面破冰开河。或许你已经早就觉得一个完全新鲜的陌生的类似女人的东西在你身上在你的内部长成了。一个稻草人在田野上跳舞，戴着农夫戴了好几代的破草帽。稻草在身上已由黑变黄。\n　　 在我的面前冰河蔓延着，像一个古老的誓言守着她自己的秘密。你的故乡在喜马拉雅的南面，在那个半岛上，靠近蓝色的海洋，印度洋上的风迎面吹来。血儿，在这个告别的时刻，我愿它给你再讲两个故事。我要给你讲一个在地窖中披斗篷的逃亡者的故事。我要给你讲一个草原母亲的故事。你初次感受到自己在内部成长为一个女人。血儿，是分手的时候了，我从那温暖的无风带漂流的没有淡水的船上，我从僧侣，武士和火刑堆上，我从印度，从那面临印度洋的盛着麦子和棉花，思想深刻而混乱复杂的热带花园和隐修树林，我从喜马拉雅山的南方把你带过了喜马拉雅。我在你身上倾注了我所爱的一切，倾注了我所有的爱情与灵感，我把你当成南方和南方大海的一声召唤，我把你当成理想的女伴。小小的女孩，如今你已长成人，要离我而去了，去吧，我的印度洋的少女，雪山的女儿，你几番在我梦中出现，变成了不同的模样。在我的这个故事，这本寂寞而痛苦的书中，你是唯一值得活下去的。你乘着这第一阵大雪，或第一阵春风，或第一片落叶，去吧，从我的呓语和文字中走出，在印度洋的和风下，长成一个真正女儿的身体。你具有一种异国他乡的容貌。你的美丽不是那种家乡的美丽而是那种远方的美丽，带着某种秘密，又隐藏了某种秘密。我流浪和歌唱中的女孩如今己经长成了一个女郎。她带着我的愿望，我赠予的名字和我的思想，带着对北方的荒凉的回忆，回到了印度洋的大船上。\n　　 我第一次见到血儿也是在一座山上。血儿当时正要被人们当成小女巫来处死。我与也那，五鸟，还有札多是在前一天寒夜来到那座山间小镇的。正是听说那里要处死一个小女巫，我们便匆匆赶往那里，多少也带着些看热闹的心理。我们赶着我们的马车就出发了。是在深夜到的。这一点我在今天还历历在目。这个披着头发的小巫女第一眼就给我留下了很深的印象。她就像闪电那样明亮，那样美丽。这种美丽带着一种突然的命定的色彩。人们的心理对这美丽没有得到任何事前的提示，没有任何开始的期待，正因为如此，人们对闪电和血儿的美丽感到致命和绝望。就连饱经患难，心理上面临死亡的我也免不了有一种巨大的震撼和波澜。一群僧侣蒙着面，只露出两只眼睛。如果距离不近，你会无法分辨那些眼睛是年老还是年轻。还有几个武士打扮的人，骑在马上，身披铠甲，头戴金属的头盔。我当时就知道。血儿必定是属于我的。她不会属于死神。她不会死亡。就像我必定活不多久一样。血儿非常平静地骑在马上，手被反绑在身后，眼睛明亮而闪烁着光辉。我一阵热血上涌。那些披着黑袍的僧侣像一群山梁上的老鸟簇拥着她。她全身雪白，头发披散着，但被两个僧侣剪短了，像一个英俊的男孩。那是两棵非常高大的树。在草原地带非常罕见。这两棵高大的枫树给游戏的儿童提供枫球。还有枫叶，红色的。映在雪地里。那是一个非常寒冷的冬天。风从大草原或者大草原的北方吹来。我们披着大斗篷。像四个来自神秘王国的使者。我们的名字，我，也那，五鸟和札多。我们站在路口。看着冬天明亮的月光照亮雪地。一群僧侣簇拥着美丽的小女巫，无比沉默地，走向她的死亡。她被剪短的头发也感到北风吹拂。她轻轻的，优自语般地说：“我想喝一口水。”围观的人群中有一人端着一只盛有热水的木碗递上来，还冒着热气，但她拒绝了。她这样说：“给我泉水。”再也没有人理她。僧侣和死神仍簇拥她前进。我跨上马，飞奔向远处的树林，马飞快的踢着冰雪，我到了，在这儿，我昨夜就已知道，有一道不冻的泉水。我灌满了一羊皮袋子，又飞身上马，飞奔回来。已经有奇怪的音乐响了，死亡临近了。我看见她跌下马来，用嘴唇吮着用嘴唇吃着地上的雪，我一把冲上前去，把羊皮口袋递给她。僧侣们满怀敌意的看着我这个陌生人。她抬起头来，用鼻子闻着那羊皮口袋中的水，轻声说：“对，这正是那不冻泉的泉水。”泪水滴落在羊皮口袋上，一滴一滴，打湿了本来就被冰雪、泉水和汗水浸湿的羊皮袋子。你对一个没落的世界还有什么要求呢？除了救出其中应该救出的部分。我感到在我灵魂的黑夜里出现了一线曙光。这就是我和血儿的第一次见面，后来血儿就跟着我们走了。这是一个冬天的夜晚。血儿后来就断断续续地告诉我她这十几年来的经历，可能是海边两姐妹所生，又在强盗窝中度过了艰难的童年时代；十年以后又在女巫家中和老巫女及其他几个同样被老巫女收养的几个巫女姐妹一块练习那种舞踏，咒语和唱歌。然后又跟着我们几个流浪艺人踏上了没有故乡没有归宿的流浪漂泊的生涯。她在痛苦，闪电和流浪中学习到的东西是那些在幸福家庭和故乡长大的女孩子们无法体会到的。她如此类丽，就像树林把自己举到山冈和自己的头顶上，把自己从树根和岩石举到树梢和云。一切少女都会被生活和生活中的民族举上自己的头顶，成为自己的生活和民族的象征。世界历史的最后结局是一位少女。海伦和玛利亚。这就是人类生活的象征，血儿，她就像闪电那样把自己照亮，转瞬即逝，又像烟一佯变幻、弥漫。那白色的从山梁上升起的烟和歌声，那遥远的路程，一样属于流浪的人群和流落道路两旁暂时安顿和居住的部落和村镇。我必须说，十六岁的时候，那时候，父亲这个老部落首领还在人世，有一段时间，我天天看着那些抄着各种字母的羊皮子，那个石垒的冬天才居住的屋子里就是这股子羊皮子味。我连续看了两三年，十六岁的有一天，大概是黄昏，也许是夜晚，我突然发现了一种关于“超越”的真理。那一天我获得了极大的喜悦。以后，在我人生的旅程中，有那么几次类似这次的狂喜袭击了我。我那时竟会处于神魂颠倒的状态，口中念念有词，逢人便要述说我的思想。那思想就像道路两旁红色的鲜血般的花朵。烈火就要冲出地面。我是多么珍惜那些羊皮子和字母给我带来的狂喜和高烧。如今，在部落高大教堂的后面，在高大教堂的石头废墟和书卷废墟的后面，在那些高山的山巅，在暮色中，在埋葬尸骨的山上，山顶之上，在用“光明之火”的名义垒起来的露天尸骨的上下四方左右的石头围子上，仍然保持着那些狂喜。我们把马车停了下来，观看这些栖息或飞起的雪白的鸟，这些高飞的精神，它们竟然也有自己的繁殖习惯和繁殖地，多愿这些飞起来的飞走了就一去不再回头。它们的确不是这样的。它们以这绿宝石颜色的湖水中游动的另外的肉体为食物，一个猛子扎到水里，用喙叼起它们。在这里，很快，连这马车也成了飞鸟暂时的栖息之地。血儿张开双臂，两只小胳膊微微向上升起。然后模仿飞鸟的姿势旋转起来。她怎能从地上飞起？血儿在地上跳跃，扑打着双臂，终于惊散了四周雪白的鸟儿。\n---\n　海子原计划写一部长篇小说，名为《大草原》三部曲，但他仅写出这篇《你是父亲的好女儿》。"},{"id":"short/1983/感动","title":"感动","type":"short","year":"1983","body":"早晨是一只花鹿\n踩到我额上\n世界多么好\n山洞里的野花\n顺着我的身子\n一直烧到天亮\n一直烧到洞外\n世界多么好\n而夜晚，那只花鹿\n的主人，早已走入\n土地深处，背靠树根\n在转移一些\n你根本无法看见的幸福\n野花从地下\n一直烧到地面\n野花烧到你脸上\n把你烧伤\n世界多么好\n早晨是山洞中\n一只踩人的花鹿\n---\n● 1986"},{"id":"short/1985/莲界慈航","title":"莲界慈航","type":"short","year":"1985","body":"七叶树下\n九根香\n照见菩萨的\n第一次失恋\n你盘坐莲花\n女友像鱼\n游过钟的身边\n我警告你\n要假设一个情人\n莲花轻轻摇动\n你不需要香火\n你知道合掌无用\n没有一位好心肠的男青年\n偷偷送来鞋子\n你盘坐莲花\n对面墙壁上\n爱情是两只老虎\n如果你愿意\n爱情确实是老虎\n莲花轻轻摇动\n---\n● 1985.5"},{"id":"short/1987/太平洋上的贾宝玉","title":"太平洋上的贾宝玉","type":"short","year":"1987","body":"贾宝玉　太平洋上的贾宝玉\n太平洋上：粮食用绳子捆好\n贾宝玉坐在粮食上\n美好而破碎的世界\n坐在粮食和酒上\n美好而破碎的世界，你口含宝石\n只有这些美好的少女，美好而破碎的世界，旧世界\n只有茫茫太平洋上这些美好的少女\n太平洋上粮食用绳子捆好\n从山顶洞到贾宝玉用尽了多少火和雨\n---\n● 1989"},{"id":"short/1988/雪","title":"雪","type":"short","year":"1988","body":"千辛万苦回到故乡\n我的骨骼雪白　也长不出青稞\n雪山，我的草原因你的乳房而明亮\n冰冷而灿烂\n我的病已好\n雪的日子　我只想到雪中去死\n我的头顶放出光芒\n有时我背靠草原\n马头作琴　马尾为弦\n戴上喜马拉雅　这烈火的王冠\n有时我退回盆地，背靠成都\n人们无所事事，我也无所事事，\n只有爱情　剑　马的四蹄\n割下嘴唇放在火上\n大雪飘飘\n不见昔日肮脏的山头\n都被雪白的乳房拥抱\n深夜中　火王子　独自吃着石头　独自饮酒\n---\n● 1988.8"},{"id":"short/1989/黑夜的献诗","title":"黑夜的献诗","type":"short","year":"1989","body":"献给黑夜的女儿\n黑夜从大地上升起\n遮住了光明的天空\n丰收后荒凉的大地\n黑夜从你内部上升\n你从远方来，我到远方去\n遥远的路程经过这里\n天空一无所有\n为何给我安慰\n丰收之后荒凉的大地\n人们取走了一年的收成\n取走了粮食骑走了马\n留在地里的人，埋得很深\n草杈闪闪发亮，稻草堆在火上\n稻谷堆在黑暗的谷仓\n谷仓中太黑暗，太寂静，太丰收\n也太荒凉，我在丰收中看到了阎王的眼睛\n黑雨滴一样的鸟群\n从黄昏飞入黑夜\n黑夜一无所有\n为何给我安慰\n走在路上\n放声歌唱\n大风刮过山岗\n上面是无边的天空\n---\n● 1989.2.2"},{"id":"short/1983/我们坐在一棵木头中","title":"我们坐在一棵木头中","type":"short","year":"1983","body":"我坐在一棵木头中，如同多年没有走路的瞎子\n忘却了走路的声音\n我的耳朵是被春天晒红的花朵和虫豸"},{"id":"short/1985/蓝姬的巢","title":"蓝姬的巢","type":"short","year":"1985","body":"木塔那儿\n一共有两个人\n蓝姬她是一张小圆脸\n蓝姬的丈夫是一位卖高粱的皇帝\n卖高粱的人民币\n买来了一面小鼓\n围着小巢敲击\n鼓点声大\n雨点声小\n蓝姬如一只雪雁\n今夜又栖\n爱人的嘴唇\n巢\n如果我公开\n我自己秘密的小巢\n一定会有许多耳朵凑上来\n散布消息\n水中一对鱼夫妻\n手捉手\n走过桥洞去\n挂巢之树\n结梨三只……\n蓝姬指着前后左右\n十字星是自己的丈夫\n---\n● 1985.5"},{"id":"short/1987/尼采你使我想起悲伤的热带","title":"尼采，你使我想起悲伤的热带","type":"short","year":"1987","body":"别人的诗：金黄的秋收俯伏在希腊的大理石上\n一只陶罐上\n镌刻一尾鱼\n我住在鱼头\n你住在鱼尾\n我在冰天雪地的酒馆忙于宗教\n冻得全身发红\n你头发松开，充满情欲和狂暴\n悲伤的热带\n南方的岛屿\n我的梦之蛇\n你踏上雇佣军向南进军的大道\n走出战俘营代价昂贵\n辉煌的十年疯狂之门\n一眼望见天堂里诗人歌唱的梨花朵朵\n像原始人交换新娘后\n堆积在梦中岛屿上的盐\n水滴中千万颗乳房\n歌唱我的一生\n热带是\n我的心情\n是　国王的女儿\n蜥蜴和袋鼠跳跃峡谷的女儿\n和我\n另一位呢喃而疯狂的诗人\n同住在一只壶里\n我的心情逼迫群蛇起舞　拥抱死亡的鹰\n热带的悲伤少女\n季节和岁月的火焰\n你们都在十五岁就一命归天\n水滴中千万颗乳房\n归于虚无的热带\n古老猎手萌生困惑\n在山顶自缢\n---\n● 1987.11.6夜"},{"id":"short/1988/青海湖","title":"青海湖","type":"short","year":"1988","body":"这骄傲的酒杯\n为谁举起\n荒凉的高原\n天空上的鸟和盐　为谁举起\n波涛从孤独的十指退去\n白鸟的岛屿，儿子们围住\n在相距遥远的肮脏镇上。\n一只骄傲的酒杯，\n青海的公主　请把我抱在怀中\n我多么贫穷，多么荒芜，我多么肮脏\n一双雪白的翅膀也只能给我片刻的幸福\n我看见你从太阳中飞来\n蓝色的公主　青海湖\n我孤独的十指化为天空上雪白的鸟。\n---\n● 1988.7.25"},{"id":"short/1983/我的窗户里埋着一只为你祝福的杯子","title":"我的窗户里埋着一只为你祝福的杯子","type":"short","year":"1983","body":"那是我最后一次想起的中午\n那是我沉下海水的尸体\n回忆起一个普通的中午\n记得那个美丽的\n穿着花布的人\n抱着一扇木门\n夜里被雪漂走\n梦中的双手\n死死捏住火种\n八条大水中\n高喊着爱人\n小林神，小林神\n你在哪里"},{"id":"short/1985/麦地","title":"麦地","type":"short","year":"1985","body":"吃麦子长大的\n在月亮下端着大碗\n碗内的月亮\n和麦子\n一直没有声响\n和你俩不一样\n在歌颂麦地时\n我要歌颂月亮\n月亮下\n连夜种麦的父亲\n身上像流动金子\n月亮下\n有十二只鸟\n飞过麦田\n有的衔起一颗麦粒\n有的则迎风起舞，矢口否认\n看麦子时我睡在地里\n月亮照我如照一口井\n家乡的风\n家乡的云\n收聚翅膀\n睡在我的双肩\n麦浪——\n天堂的桌子\n摆在田野上\n一块麦地\n收割季节\n麦浪和月光\n洗着快镰刀\n月亮知道我\n有时比泥土还要累\n而羞涩的情人\n眼前晃动着\n麦秸\n我们是麦地的心上人\n收麦这天我和仇人\n握手言和\n我们一起干完活\n合上眼睛，命中注定的一切\n此刻我们心满意足地接受\n妻子们兴奋地\n不停用白围裙\n擦手\n这时正当月光普照大地。\n我们各自领着\n尼罗河，巴比伦或黄河\n的孩子　在河流两岸\n在群蜂飞舞的岛屿或平原\n洗了手\n准备吃饭\n就让我这样把你们包括进来吧\n让我这样说\n月亮并不忧伤\n月亮下\n一共有两个人\n穷人和富人\n纽约和耶路撒冷\n还有我\n我们三个人\n一同梦到了城市外面的麦地\n白杨树围住的\n健康的麦地\n健康的麦子\n养我性命的妻子！\n---\n● 1985.6"},{"id":"short/1987/幸福的一日","title":"幸福的一日","type":"short","year":"1987","body":"致秋天的花楸树\n我无限的热爱着新的一日\n今天的太阳　今天的马　今天的花楸树\n使我健康　富足　拥有一生\n从黎明到黄昏\n阳光充足\n胜过一切过去的诗\n幸福找到我\n幸福说：“瞧　这个诗人\n他比我本人还要幸福”\n在劈开了我的秋天\n在劈开了我的骨头的秋天\n我爱你，花楸树\n---\n● 1987"},{"id":"short/1988/黑翅膀","title":"黑翅膀","type":"short","year":"1988","body":"今夜在日喀则，上半夜下起了小雨\n只有一串北方的星，七位姐妹\n紧咬雪白的牙齿，看见了我这一对黑翅膀\n北方的七星　照不亮世界\n牧羊女头枕青稞独眠一天的地方今夜满是泥泞\n今夜在日喀则，下半夜天空满是星辰\n但夜更深就更黑，但毕竟黑不过我的翅膀\n今夜在日喀则，借床休息，听见婴儿的哭声\n为了什么这个小人儿感到委屈？是不是因为她感到了黑夜中的幸福\n愿你低声啜泣　但不要彻夜不眠\n我今夜难以入睡是因为我这双黑过黑夜的翅膀\n我不哭泣　也不歌唱　我要用我的翅膀飞回北方\n飞回北方　北方的七星还在北方\n只不过在路途上指示了方向，就像一种思念\n她长满了我的全身　在烛光下酷似黑色的翅膀\n---\n● 1988.7（？）"},{"id":"sun/太阳弥赛亚","title":"太阳·弥赛亚","type":"sun","year":"1988","body":"————————————————\r\n\r\n1988\r\n\r\n（《太阳》中天堂大合唱）\r\n\r\n但是这并不意味着它是一首“诗”——它不是。\r\n\r\n——斯宾格勒\r\n\r\n献　诗\r\n\r\n谨用此太阳献给新的纪元！献给真理！\r\n\r\n谨用这首长诗献给他的即将诞生的新的诗神\r\n\r\n献给新时代的曙光\r\n\r\n献给青春\r\n\r\n献　诗\r\n\r\n天空在海水上\r\n\r\n奉献出自己真理的面容\r\n\r\n这是曙光和黎明\r\n\r\n这是新的一日\r\n\r\n阳光从天而降穿透了海水。太阳！\r\n\r\n\r\n在我的诗中，暂时停住你的脚步\r\n\r\n让我用回忆和歌声撒上你金光闪闪的车轮\r\n\r\n让我用生命铺在你的脚下，为一切阳光开路\r\n\r\n献给你，我的这首用尽了天空和海水的长诗\r\n\r\n让我再回到昨天\r\n\r\n诗神降临的夜晚\r\n\r\n雨雪下在大海上\r\n\r\n从天而降，1982\r\n\r\n我年刚十八，胸怀憧憬\r\n\r\n背着一个受伤的陌生人\r\n\r\n去寻找天堂，去寻找生命\r\n\r\n却来到这里，来到这个夜晚\r\n\r\n1988年11月21日诗神降临\r\n\r\n这个陌生人是我们的世界\r\n\r\n是我们的父兄，停在我们的血肉中\r\n\r\n这个陌生人是个老人\r\n\r\n奄奄一息，双目失明\r\n\r\n几乎没有任何体温\r\n\r\n他身上空无一人\r\n\r\n我只能用血喂养\r\n\r\n他这神奇的老骨头\r\n\r\n世界的鲜血变成了马和琴\r\n\r\n雨雪下在大海上\r\n\r\n1988年11月21日\r\n\r\n我背着这个年老盲目的陌生人\r\n\r\n来到这里，来到这个\r\n\r\n世界的夜晚和中心，空无一人\r\n\r\n一座山上通天堂，下抵地府\r\n\r\n座落在大沙漠的一片废墟\r\n\r\n1985年，我和他和太阳\r\n\r\n三人遇见并参加了宇宙的诞生。\r\n\r\n\r\n\r\n宇宙的诞生也就是我的诞生\r\n\r\n雨雪下在黑夜的大海上\r\n\r\n\r\n\r\n在路上，他变成许多人，与我相识，擦肩而过\r\n\r\n甚至变成了我，但他还是他。\r\n\r\n\r\n\r\n他一边唱着，我同时也在经历\r\n\r\n这全是我们三人的经历\r\n\r\n\r\n\r\n在世界和我的身上，已分不清\r\n\r\n哪儿是言语哪儿是经历\r\n\r\n我现在还仍然置身其中。\r\n\r\n\r\n\r\n在岩石的腹中\r\n\r\n岩石的内脏\r\n\r\n忽然空了，忽然不翼而飞\r\n\r\n加重了四周岩石的质量\r\n\r\n碎石纷飞，我的手稿\r\n\r\n更深地埋葬，火的内心充满回忆\r\n\r\n把语言更深地埋葬\r\n\r\n没有意义的声音\r\n\r\n传自岩石的内脏。\r\n\r\n\r\n\r\n天空\r\n\r\n巨石围成\r\n\r\n中间的空虚\r\n\r\n中间飞走的部分\r\n\r\n不可追回的\r\n\r\n也不能后悔的部分\r\n\r\n似乎我们刚从那里\r\n\r\n逃离，安顿在\r\n\r\n附近的岩石\r\n\r\n1985，有一天，是在秋冬交替\r\n\r\n岩石的内脏忽然没有了\r\n\r\n那就是天空　天空　天空\r\n\r\n突然的　不期而来的\r\n\r\n不能明了的，交给你的\r\n\r\n砍断你自己的\r\n\r\n用尽你一生的海水上的天空\r\n\r\n天空，没有获得\r\n\r\n他自己的内容\r\n\r\n我召唤\r\n\r\n中间的沉默　和逃走的大神\r\n\r\n我这满怀悲痛的世界\r\n\r\n中间空虚的逃走的是天空\r\n\r\n巨石围在了四周\r\n\r\n我尽情地召唤：1988，抛下了弓箭\r\n\r\n拾起了那颗头颅\r\n\r\n放在天空上滚动\r\n\r\n太阳！你可听见天空上秘密的灭绝人类的对话\r\n\r\n我召唤：1985！巨石自动前来\r\n\r\n堆砌一片，围住了天空上\r\n\r\n千万道爆炸的火流　火狂舞着飞向天空\r\n\r\n死去的　死去的　死去的\r\n\r\n是那些阻止他的人。1988\r\n\r\n突然像一颗头颅升出地面\r\n\r\n大地裂开了一个口子\r\n\r\n天空突然（？）了岩石　化身为人\r\n\r\n血液说话，烈火说话：1988，1988\r\n\r\n升出大海\r\n\r\n\r\n\r\n在一片大水\r\n\r\n高声叫喊“我自己”！\r\n\r\n\r\n“世界和我自己”！\r\n\r\n他就醒来了。\r\n\r\n喊　喊着“我自己”\r\n\r\n召唤那秘密的\r\n\r\n沉寂的，内在的\r\n\r\n世界和我！召唤，召唤\r\n\r\n半岛和岛屿上的十七位国王，听着\r\n\r\n从回声长出了原先主人的声音\r\n\r\n主人在召唤，开始只是一片混乱的回声\r\n\r\n一只号角内部漆黑，是全部世界\r\n\r\n号角的主人召唤世界和自己\r\n\r\n大海苍茫，群山四起，地狱幽暗，天堂遥远\r\n\r\n阳光从天而降，一片混乱的回声\r\n\r\n所有的人类似乎只有一个人\r\n\r\n那就是主人，坐在太阳孤独的公社里。\r\n\r\n\r\n\r\n黎明时分\r\n\r\n“我自己”\r\n\r\n新的“我自己”\r\n\r\n石头也不能分享\r\n\r\n\r\n\r\n在可说的这一切\r\n\r\n\r\n\r\n在说话的内部\r\n\r\n石头也不能分享\r\n\r\n这是新的一日。\r\n\r\n\r\n\r\n这是曙光降临时的歌声\r\n\r\n“我原是一个喝醉了酒的农奴\r\n\r\n被接上了天空，我原是混沌的父亲”\r\n\r\n是原始的天空上第一滴宰杀的血液\r\n\r\n自我逃避，自我沉醉，自我辩护\r\n\r\n我不应该背上这个流泪的老盲人\r\n\r\n补锅，磨刀，卖马，偷马，卖马\r\n\r\n我不应该抱着整夜抱着枪和竖琴\r\n\r\n成为诗人和首领。阳光从天而降穿透了海水\r\n\r\n献给你，我的这首用尽了生命和世界的长诗\r\n\r\n回忆女神尖叫着\r\n\r\n生下了什么\r\n\r\n生下了我\r\n\r\n相遇在上帝的群山\r\n\r\n相遇在曙光中\r\n\r\n太阳出来之前\r\n\r\n这么多\r\n\r\n这么多\r\n\r\n晨曦从天而降\r\n\r\n我接受我自己\r\n\r\n这天空\r\n\r\n这世界的金火\r\n\r\n破碎　凌乱　金光已尽\r\n\r\n接受这本肮脏之书\r\n\r\n杀人之书世界之书\r\n\r\n接受这世界最后的金光\r\n\r\n我虚心接受我自己\r\n\r\n任太阳驱散黎明\r\n\r\n太阳驱散黎明\r\n\r\n移动我的诗\r\n\r\n号角召唤\r\n\r\n无头的人\r\n\r\n从铁匠铺\r\n\r\n抱走了头颅\r\n\r\n无头的人怀抱他粗笨的头颅\r\n\r\n几乎不能掩盖\r\n\r\n\r\n\r\n在曙光中一切显示出来。\r\n\r\n\r\n\r\n世界和我\r\n\r\n快歌唱吧！\r\n\r\n\r\n\r\n“在曙光中\r\n\r\n抱头上天\r\n\r\n太阳砍下自己的刀剑\r\n\r\n太阳听见自己的歌声”\r\n\r\n昔日大火照耀\r\n\r\n火光中心　雨雪纷纷\r\n\r\n曙光中心　曙光抱头上天\r\n\r\n肮脏的书中杀人的书中\r\n\r\n此刻剩下的只有奉献和歌声\r\n\r\n移动我的诗　登上天梯\r\n\r\n那无头的黎明　怀抱十日一齐上天\r\n\r\n登上艰难的　这个世纪\r\n\r\n这新的天空\r\n\r\n这新的天空回首望去：\r\n\r\n旧世界雨雪下在大海上。\r\n\r\n\r\n\r\n此刻曙光中，岩石抬起头来一起向上看去。\r\n\r\n\r\n\r\n火光中心雨雪纷纷我无头来其中\r\n\r\n人们叫我黎明：我只带来了奉献和歌声\r\n\r\n火光中心雨雪纷纷我无头来其中\r\n\r\n通向天空的火光中心雨雪纷纷。\r\n\r\n肮脏的书杀人的书戴上了我的头骨\r\n\r\n因为血液稠密而看不清别的\r\n\r\n这是新的世界和我，此刻也只有奉献和歌声\r\n\r\n\r\n在此之前我写下了这几十个世纪最后的一首诗\r\n\r\n并从此出发将它抛弃，就是太阳抛下了黎明\r\n\r\n曙光会知道我和太阳的目的地，太阳和我！\r\n\r\n献给你，我的这首用尽了天空和海水的长诗\r\n\r\n太　阳\r\n\r\n（第一合唱部分：秘密谈话）             \r\n\r\n第四手稿 \r\n\r\n——（“世界起源于一场秘密谈话”）\r\n\r\n放置在　献诗　前面的　一次秘密谈话\r\n\r\n人物：铁匠、石匠、打柴人、猎人、火         \r\n\r\n打柴人这一天\r\n\r\n从人类的树林\r\n\r\n砍来树木，找到天梯\r\n\r\n然后从天梯走回天堂\r\n\r\n他坐下，把他们\r\n\r\n投入火中，使火幸福\r\n\r\n在天堂，打柴人和火\r\n\r\n开始了我记在下面的\r\n\r\n一次秘密谈话\r\n\r\n\r\n正在这时有铁匠、石匠、猎人、卖酒人\r\n\r\n和一个叫“二十一”的，经常在天梯上下\r\n\r\n他们来去匆匆，谈话时而长时而简短\r\n\r\n无论是谁与谁在天梯上相遇\r\n\r\n都会谈上他们心中的幻象。\r\n\r\n正是这些天梯上的谈话声遮住了\r\n\r\n天堂中打柴人与火的谈话声。\r\n\r\n\r\n\r\n因此我没有听见什么\r\n\r\n或者说听见不多。\r\n\r\n\r\n\r\n\r\n\r\n天堂里打柴人与火的秘密谈话\r\n\r\n\r\n\r\n  　　　　打柴人\r\n\r\n​              \r\n\r\n记得在黑暗混沌\r\n\r\n一个空虚的大城\r\n\r\n分不清我与你\r\n\r\n都融合在我之中\r\n\r\n我还没有醒来\r\n\r\n睡得象空虚。\r\n\r\n\r\n\r\n　　　　火\r\n\r\n\r\n\r\n在我内部\r\n\r\n有另一个\r\n\r\n微弱的我\r\n\r\n在呼喊\r\n\r\n在召唤\r\n\r\n召唤他自己\r\n\r\n\r\n\r\n　　　　打柴人\r\n\r\n\r\n\r\n第一日开辟了我与你\r\n\r\n我从你身上走下\r\n\r\n我从你内部走到外部\r\n\r\n看到了我自己的眼睛\r\n\r\n\r\n\r\n　　　　火\r\n\r\n\r\n\r\n打柴人和火，彼此照亮\r\n\r\n旋即认清了对方的面容\r\n\r\n并在你的眼睛里\r\n\r\n长出了我的身体\r\n\r\n\r\n\r\n　　　　打柴人\r\n\r\n\r\n\r\n我与你彼此为证\r\n\r\n互为食物和夫妻\r\n\r\n我与你相依为命\r\n\r\n内脏有着第一日\r\n\r\n一劈为二的痕迹\r\n\r\n\r\n\r\n（天梯上传来老石匠的呼喊：）\r\n\r\n\r\n\r\n天空运送的　是一片废墟\r\n\r\n我和太阳　在天空上运送\r\n\r\n这壮观的　毁灭的　无人的废墟\r\n\r\n\r\n\r\n　　我高声询问：\r\n\r\n  　　又有谁在？\r\n\r\n  \r\n\r\n  难道全在大火中死光了\r\n\r\n  　　　　又有谁在？\r\n\r\n  \r\n\r\n  我背负一片不可测量的废墟\r\n\r\n  　　四周是深渊　看不见底\r\n\r\n我多么期望　我的内部有人呼应\r\n\r\n　　　　又有谁在？\r\n\r\n\r\n\r\n我在天空深处\r\n\r\n  　　高声询问\r\n\r\n　　　　谁在？\r\n\r\n我背负天空\r\n\r\n我内部\r\n\r\n背负天空\r\n\r\n我内部着火的废墟\r\n\r\n越来越沉\r\n\r\n我只有沉沦\r\n\r\n更深地陷落\r\n\r\n\r\n\r\n灭绝的大地\r\n\r\n四季生长\r\n\r\n无人回答\r\n\r\n我是父母，但没有子孙\r\n\r\n一片空虚\r\n\r\n　　　　又有谁在？\r\n\r\n\r\n\r\n天空的门\r\n\r\n紧紧地关着\r\n\r\n没有人进来也没有人出去\r\n\r\n没有人上来也没有人下去\r\n\r\n海水和天空\r\n\r\n我内心着火的废墟　广阔地涌动\r\n\r\n这全部的大火在我的背脊上就要凝固\r\n\r\n这全部的天空\r\n\r\n在我内部\r\n\r\n就要关闭\r\n\r\n\r\n\r\n一万种暴力\r\n\r\n没有头颅\r\n\r\n坐在海底\r\n\r\n站在天空上呼喊\r\n\r\n\r\n\r\n这全部的天空今天\r\n\r\n在我内部就要关闭\r\n\r\n\r\n\r\n减轻人类的痛苦\r\n\r\n降低人类的声音\r\n\r\n痛苦如此寂静\r\n\r\n就要关闭\r\n\r\n　　　　又有谁在？\r\n\r\n\r\n\r\n闪电大雷\r\n\r\n这燃烧的\r\n\r\n从天而降的\r\n\r\n　　亮得像狰狞的白骨\r\n\r\n　　红得像雨中的大血\r\n\r\n　　响的就是夺命的鼓！\r\n\r\n又有谁在？\r\n\r\n\r\n\r\n寂静的天空你\r\n\r\n封闭的内部\r\n\r\n是吼叫的废墟\r\n\r\n\r\n\r\n大海　突然停顿在上空\r\n\r\n突然停顿在我的头顶\r\n\r\n关闭了所有的天空\r\n\r\n天地马上就要\r\n\r\n不复存在\r\n\r\n\r\n\r\n天空\r\n\r\n轰轰倒下\r\n\r\n葬在　没有头颅的大海\r\n\r\n这哪是天空\r\n\r\n只是天空的碎片\r\n\r\n五脏缠绕着\r\n\r\n　　这天空的碎片\r\n\r\n　　这没有头颅的大海\r\n\r\n　　这三位大地的导师\r\n\r\n五脏缠绕着你们\r\n\r\n　　召唤你们\r\n\r\n　　轰炸你们\r\n\r\n这一种爆炸中\r\n\r\n又有谁在？\r\n\r\n\r\n\r\n八面天空\r\n\r\n有七面封闭\r\n\r\n剩下那\r\n\r\n最后的\r\n\r\n末日的\r\n\r\n火光照亮的\r\n\r\n一面废墟\r\n\r\n也要关闭\r\n\r\n孩子　那些孩子们呢\r\n\r\n我用全部世界换来的\r\n\r\n那些孩子呢\r\n\r\n最后的天空就要关上\r\n\r\n孩子呢　又有谁在？\r\n\r\n\r\n\r\n我站在天梯上\r\n\r\n看见我半开半合的天空\r\n\r\n这八面天空的最后一面\r\n\r\n我看见这天空即将合上\r\n\r\n我看见这天空已经合上\r\n\r\n\r\n\r\n从天空迈出一步\r\n\r\n三千儿童\r\n\r\n三千孩子\r\n\r\n三千赤子\r\n\r\n被一位无头英雄\r\n\r\n领着杀下天空\r\n\r\n从天空迈出一步\r\n\r\n那位无头英雄\r\n\r\n领着孩子们降临大地\r\n\r\n正是黄昏时分\r\n\r\n无头英雄手指落日\r\n\r\n手指落日和天空\r\n\r\n眼含尘土和热血\r\n\r\n扶着马头倒下\r\n\r\n\r\n\r\n我在天空深处高声询问　谁在？\r\n\r\n\r\n\r\n我\r\n\r\n从天空中站起来呼喊\r\n\r\n又有谁在？\r\n\r\n\r\n\r\n最后一个灵魂\r\n\r\n这一天黄昏\r\n\r\n天空即将封闭\r\n\r\n身背弓箭的最后一个灵魂\r\n\r\n这位领着三千儿童杀下天空的无头英雄\r\n\r\n眼含热泪指着我背负的这片燃烧的废墟\r\n\r\n这标志天堂关闭的大火\r\n\r\n对他的儿子们说，那是太阳\r\n\r\n\r\n\r\n孩子们，三千孩子活下了多少\r\n\r\n三千孩子记住了多少\r\n\r\n孩子们，听见了吗\r\n\r\n这降临到大地上后\r\n\r\n你们听到的第一个\r\n\r\n属于大地也属于天空\r\n\r\n的声音：孩子们，听见了吗，那是太阳\r\n\r\n\r\n\r\n太阳\r\n\r\n\r\n\r\n无头的灵魂\r\n\r\n英雄的灵魂\r\n\r\n灵魂啊，不要躲开大地\r\n\r\n不要躲开这大地的尘土\r\n\r\n大地的气息大地的生命\r\n\r\n灵魂啊，不要躲开你自己\r\n\r\n不要躲开已降到大地的你自己\r\n\r\n你为何要匆匆而来又匆匆而去\r\n\r\n扶着你骑过万年的天空飞马的头颅\r\n\r\n你为什么要倒下　你为什么这么快地离去\r\n\r\n你再也不能离去\r\n\r\n\r\n\r\n莫非你不能适应大地\r\n\r\n你这无头的英雄\r\n\r\n天空已对你关闭\r\n\r\n你将要埋在大地\r\n\r\n你不能适应的大地\r\n\r\n将第一个埋葬你\r\n\r\n\r\n\r\n灵魂啊，不要躲开\r\n\r\n我问你，你的儿子们\r\n\r\n活下去了吗？\r\n\r\n\r\n\r\n我站在天梯\r\n\r\n目睹这一切\r\n\r\n我在天空深处\r\n\r\n\r\n高声询问\r\n\r\n谁在？\r\n\r\n\r\n\r\n从天空中站起来呼喊\r\n\r\n又有谁在？\r\n\r\n\r\n\r\n　　　　打柴人\r\n\r\n\r\n\r\n我是火父亲，火儿子，和火母亲\r\n\r\n让我首先来回答你的呼喊。\r\n\r\n我在太阳上所感受到的虚无和饥饿\r\n\r\n从笨重的天空跌落。撞在大地和海水\r\n\r\n撞掉了头颅撞烂了四肢\r\n\r\n\r\n\r\n他也是一位复仇的年轻人\r\n\r\n即也是人们常常提到的\r\n\r\n狮子之上　轩辕两旁\r\n\r\n那名字叫青春和曙光的。\r\n\r\n\r\n\r\n大地上充满了孩子的欢乐，也传到天堂\r\n\r\n（这时刻天堂中打柴人和火\r\n\r\n抛开了秘密谈话，高声歌唱\r\n\r\n歌唱青春——那位无头英雄）\r\n\r\n\r\n\r\n大合唱：献给曙光女神　献给青春的诗\r\n\r\n\r\n\r\n青春迎面走来\r\n\r\n成为我和大地\r\n\r\n开天辟地\r\n\r\n世界必然破碎\r\n\r\n\r\n青春迎面走来\r\n\r\n世界必然破碎\r\n\r\n天堂欢聚一堂又骤然分开\r\n\r\n齐声欢呼　青春　青春\r\n\r\n青春迎面走来\r\n\r\n\r\n\r\n成为我和世界\r\n\r\n\r\n\r\n天地突然获得青春\r\n\r\n这秘密传遍世界，获得世界\r\n\r\n也将世界锰地劈开\r\n\r\n天堂的烈火，长出了人形\r\n\r\n这是青春　依然坐在大火中\r\n\r\n\r\n\r\n一轮巨斧劈开\r\n\r\n世界碎成千万\r\n\r\n手中突然获得\r\n\r\n曙光是谁的天才\r\n\r\n\r\n\r\n先是幻象千万\r\n\r\n后是真理唯一\r\n\r\n青春就是真理\r\n\r\n青春就是刀锋\r\n\r\n石头围住天空\r\n\r\n青春降临大地\r\n\r\n　　如此单纯\r\n\r\n\r\n\r\n　　　　打柴人\r\n\r\n\r\n\r\n抛开了刑法……\r\n\r\n我们住过的地方\r\n\r\n我们修建过的遗址\r\n\r\n都被抛在一旁\r\n\r\n而今只有一行军的金帐\r\n\r\n\r\n\r\n我开天辟地\r\n\r\n我和铁匠和赤子\r\n\r\n我抛开了刑法……\r\n\r\n此刻我在太阳上\r\n\r\n我站在太阳的青春\r\n\r\n\r\n\r\n我站在太阳上\r\n\r\n我发出一种声音\r\n\r\n我召唤天地\r\n\r\n围着火与青春\r\n\r\n我的声音与火俱在\r\n\r\n我要召唤天堂的青春\r\n\r\n我要召唤火与夜的青春\r\n\r\n我使它们获得了青春\r\n\r\n\r\n\r\n在太阳上所感受到的虚无和饥饿\r\n\r\n从笨重的天空跌落\r\n\r\n热血沸腾的青春！\r\n\r\n领着三千儿童\r\n\r\n撞在大地和海\r\n\r\n撞掉了头颅撞烂了四肢\r\n\r\n\r\n\r\n火父亲，火儿子，火母亲\r\n\r\n一家烈火，九口人三千人\r\n\r\n百亿人口一家烈火\r\n\r\n内脏本来是空洞的　岩石的内脏\r\n\r\n忽然燃烧起来\r\n\r\n内脏起火　内脏已被太阳的饥饿借走\r\n\r\n内脏燃烧　被太阳使用　是火的\r\n\r\n使万物生长\r\n\r\n火红内脏嘎嘎叫\r\n\r\n内脏嘎嘎叫\r\n\r\n叫着冲开天门\r\n\r\n\r\n\r\n　　　　火\r\n\r\n\r\n\r\n我的双脚在火中变成了一只\r\n\r\n我自己的火使我自己失明。\r\n\r\n我的言语也已失明\r\n\r\n只可以看见自己的内心\r\n\r\n我的双脚在火中变成了一只舌\r\n\r\n我的失明的言语只看见自己的\r\n\r\n\r\n\r\n　　　　打柴人\r\n\r\n　　　　在火光中\r\n\r\n\r\n\r\n在火光中　我跟不上那孤独的\r\n\r\n独自前进的、主要的思想\r\n\r\n在火光中，我跟不上自己那孤独的\r\n\r\n没有受到关怀的、主要的思想\r\n\r\n我手中的都已抛弃\r\n\r\n但没有到达他们自己所在的地方\r\n\r\n剩下的我紧握手中\r\n\r\n他们都不在这里\r\n\r\n而紧紧跟上了被抛向远方的伙伴。\r\n\r\n\r\n\r\n在长长的，孤独的光线中\r\n\r\n只有主要的在前进\r\n\r\n只有主要的仍然在前进\r\n\r\n没有伙伴\r\n\r\n没有他自己的伙伴\r\n\r\n也没有受到天地的关怀\r\n\r\n\r\n\r\n在长长的、孤独的光线中\r\n\r\n只有荒凉纯洁的沙漠火光\r\n\r\n紧跟他的思想\r\n\r\n只有荒凉的沙漠之火\r\n\r\n热爱他，紧跟他的脚步\r\n\r\n\r\n\r\n在火光中　我跟不上自己那孤独的\r\n\r\n独自前进的，主要的思想\r\n\r\n我跟不上自己快如闪电的思想\r\n\r\n在火光中，我跟不上自己的景象\r\n\r\n我的生命已经盲目\r\n\r\n在火光中，我的生命跟不上自己的景象\r\n\r\n\r\n\r\n在长长的、孤独的光线中\r\n\r\n两块野蛮的石头\r\n\r\n永远地放走了他自己的飞鸟\r\n\r\n在火光中\r\n\r\n我跟不上自己的景象\r\n\r\n\r\n\r\n　　　　打柴人\r\n\r\n在火中我的双脚变成了一只舌头\r\n\r\n举起心脏，摔碎在太阳的鼓面\r\n\r\n鼓手终于在火中象火一样笑了\r\n\r\n象火一样寂寞，象火一样热闹\r\n\r\n天堂之火的腹部携带着我和你\r\n\r\n在火中我的舌头变成了两只大脚\r\n\r\n我在吐火\r\n\r\n我长出一万个头颅\r\n\r\n每只头颅伸出一只手\r\n\r\n牵着一个兽头\r\n\r\n那也是一万头之兽\r\n\r\n他也在吐火\r\n\r\n\r\n\r\n我们一齐吐火\r\n\r\n\r\n\r\n这火一直从天堂\r\n\r\n挂到大地和海水\r\n\r\n火\r\n\r\n青春\r\n\r\n贯穿了\r\n\r\n我\r\n\r\n\r\n\r\n青春！蒙古！青春！\r\n\r\n上帝坐在冬天无限的太空\r\n\r\n面朝地穴三万六千　年岁十二　人口亿万\r\n\r\n六百车轴旋转　不避疯狂　天空万有\r\n\r\n天空以万有高喊万有\r\n\r\n面朝地穴在旷野大火之上呼喊：蒙古！蒙古！\r\n\r\n马骨十万八千为船，人头十万八千为帆\r\n\r\n一阵长风吹过\r\n\r\n上书“灭绝人类和世界”\r\n\r\n\r\n\r\n\r\n\r\n　　　　              （北方的猎人\r\n\r\n　　　　在天梯上呼喊\r\n\r\n　　　　北方，北方）\r\n\r\n\r\n\r\n北方\r\n\r\n冬天的天空\r\n\r\n蒙古人种的天空\r\n\r\n拨出了武器，互相砍杀\r\n\r\n拨出了内心生锈的层层栅栏\r\n\r\n作为武器，互相砍杀\r\n\r\n\r\n\r\n天空\r\n\r\n你为什么曾经禁欲和传教\r\n\r\n你为什么不充满仇恨\r\n\r\n\r\n\r\n　　　我难以理解\r\n\r\n  　　　我多么难以理解\r\n\r\n　　　这从太平洋开始倾斜的　蒙古人种的天空\r\n\r\n你曾经说过什么\r\n\r\n你还要说　说吧　说\r\n\r\n\r\n蒙古人种的天空　从太平洋开始倾斜\r\n\r\n蒙古人种抱着高大的马\r\n\r\n从太平洋上空飞过\r\n\r\n胸腔里是多少苦难的海水\r\n\r\n蒙古型　扁圆头颅　多么饱和\r\n\r\n多少适合飞行\r\n\r\n　　接近夭空\r\n\r\n盛满海水和铁\r\n\r\n　　多么接近\r\n\r\n疯狂的太阳　把他的马　他的辕马\r\n\r\n他的车轭　他的车轮　他的牲口棚\r\n\r\n疯狂的太阳　把他的职业　他的战争\r\n\r\n和他的侵略的本性　赐予了蒙古人种\r\n\r\n　　我不是要求和平\r\n\r\n　　我不能在这时要求和平\r\n\r\n\r\n\r\n成吉思汗　我们\r\n\r\n成吉思汗　我与你\r\n\r\n锁在同一条火链子上\r\n\r\n　　绕着空荡荡的\r\n\r\n　　北方的　和平的天空\r\n\r\n疯狂地旋转\r\n\r\n\r\n\r\n我的马　飞出了马厩\r\n\r\n把它的自由交给了我\r\n\r\n我不能辜负蒙古人种\r\n\r\n我们锁在同一块岩石中\r\n\r\n什么魔法把我们囚禁\r\n\r\n\r\n\r\n我看见　一个牧羊人\r\n\r\n囚禁在岩石中\r\n\r\n囚禁在亚洲荒芜之地的一块岩石中\r\n\r\n渐渐地他飞起来了\r\n\r\n他渐渐地飞起来\r\n\r\n带着那块亚洲的岩石飞起来\r\n\r\n\r\n\r\n远　远　远　远　远　远　远　远　远\r\n\r\n亚洲是我的锁链\r\n\r\n　　　一块岩石囚禁了人和马\r\n\r\n　　　人和马拖着这块岩石飞遍天空\r\n\r\n　　　即使人和马还有一部分是石头\r\n\r\n\r\n\r\n而他们只看见石头在天空上乱飞\r\n\r\n  　　 报仇雪恨的石头\r\n\r\n　　 抱着人和马　越飞越快\r\n\r\n\r\n\r\n金帐汗国　九排弓箭手　十七排弓箭手\r\n\r\n坐在太平洋的底部\r\n\r\n低垂着眉毛　都已苍白\r\n\r\n篷乱的头发　满脸胡子　遮住了\r\n\r\n　　这些平静的　蒙古人的脸庞\r\n\r\n皇帝坐在金帐中\r\n\r\n用火和灰　用酒　用战争\r\n\r\n皇帝永远看不见他们的表情\r\n\r\n皇帝　我们的皇帝开口说话\r\n\r\n\r\n\r\n“我不是你们的皇帝又是谁的皇帝\r\n\r\n火　或被残暴的豹手双爪棒上山巅\r\n\r\n献给另一个比豹子更孤独的皇帝”\r\n\r\n射穿天空的大弩\r\n\r\n为什么握在这些人手中\r\n\r\n　　这些在岩石中\r\n\r\n　　睡了千万年的人\r\n\r\n　　这些人，抱住了祖宗和子孙\r\n\r\n这些洞穴中的吞火者，颇斜\r\n\r\n的羊骨遮住了山洞\r\n\r\n暖意黄铜的日子　黄铜的战车\r\n\r\n　　鲜血淋漓　多少日子　多么喜悦\r\n\r\n我多么渴望在火中　调和血与酒\r\n\r\n骨灰和不能熔化的几瓣心脏\r\n\r\n落入酒中，打开地窖的大门\r\n\r\n　　　　　打开天空的大门\r\n\r\n　　 神鬼助我宝剑！\r\n\r\n成吉思汗，我们四个人在同一条链子上渡过天室\r\n\r\n这世上最大的草原　太平洋　太阳和铁\r\n\r\n链子锁住的石头结合着　壮大着\r\n\r\n　　不能沉没的大陆\r\n\r\n蒙古人种抱着马\r\n\r\n一次次冲向大海\r\n\r\n一万次布满太平洋\r\n\r\n　　沿着太平洋　倾斜地立起　直刺天空\r\n\r\n　　又冲向海底\r\n\r\n太平洋底部\r\n\r\n一个永生的马头\r\n\r\n安装在地穴　吐火之处\r\n\r\n马头长在我的脖子上　为什么？为什么？\r\n\r\n这是……。\r\n\r\n这是。\r\n\r\n过是冬天的海岸　多少海兽抱船沉没\r\n\r\n在一种死而复活的气氛中\r\n\r\n我发现我的马头在吐火。\r\n\r\n　　　　太平洋\r\n\r\n　　　太　阳\r\n\r\n　　　　太平洋\r\n\r\n太阳在太平洋上\r\n\r\n太阳照着太平洋\r\n\r\n是天空。是不能置放种子，儿马和精液\r\n\r\n的东方空荡荡的中心。\r\n\r\n\r\n\r\n　　　　猎　人\r\n\r\n我是宇宙中的猎人\r\n\r\n\r\n我是宇宙的现状：\r\n\r\n我叫“第一入称现在时”\r\n\r\n\r\n闪电和雷中的猎人\r\n\r\n杀死了石头外表的猎人\r\n\r\n用天空的火把　用云中狩猎\r\n\r\n杀死了石头外表的猎人\r\n\r\n却点燃了石头内部的猎人\r\n\r\n\r\n点亮了　石头内部的猎人\r\n\r\n我醒来，吃着，喝着，节奏着\r\n\r\n我吃喝日夜，四季和十二月轮\r\n\r\n\r\n\r\n反过来说\r\n\r\n石头不是\r\n\r\n世界的开始\r\n\r\n是虚无。虚无中\r\n\r\n原始只有\r\n\r\n一种形式\r\n\r\n它就是吃\r\n\r\n\r\n\r\n吃还没有开始\r\n\r\n世界全是天空\r\n\r\n吃。一经开始\r\n\r\n就是吃着的嘴\r\n\r\n\r\n\r\n他秘密地说着\r\n\r\n秘密地吃\r\n\r\n虚无中出现了空气\r\n\r\n空气突然化成了石头和水\r\n\r\n石头围住了　他的说和吃\r\n\r\n石头围住了天空\r\n\r\n他秘密地说着，他秘密地吃\r\n\r\n秘密一经走动，就是世界和我\r\n\r\n他最亲密的伙伴是食物和言语\r\n\r\n\r\n\r\n\r\n\r\n（附，类于天空中的猎人\r\n\r\n关于云中猎人和他的狩猎过程\r\n\r\n\r\n和他的吃，他的属性\r\n\r\n他的众多名字，家族渊源\r\n\r\n关于原始天空中一名原始猎人\r\n\r\n有一个残存的史诗片断\r\n\r\n抄在下面：）          \r\n\r\n\r\n\r\n原始史诗片断\r\n\r\n（作为此《太阳》这段经文的补充部分）\r\n\r\n02             \r\n\r\n那时那刻那是猎人产生了这样的泪水\r\n\r\n这样的景象。牛羊中一个人看见家乡\r\n\r\n一个人看见　白雪走在血液上\r\n\r\n马飞在路上\r\n\r\n路很长……              \r\n\r\n开口说话的不是我也没有内容\r\n\r\n天空上的狩猎进展顺利而迅速\r\n\r\n在山谷　牲口之中\r\n\r\n人类发出牲口的声音\r\n\r\n具有人类放牧的\r\n\r\n牲口的悲哀\r\n\r\n铁匠说　铁也说\r\n\r\n你不应悲哀\r\n\r\n而应该悲痛\r\n\r\n在那岩石破裂的火山口\r\n\r\n天空走出火山口\r\n\r\n灰烬落在你周围\r\n\r\n这里在说活\r\n\r\n边里在……              \r\n\r\n那个吐火的山口\r\n\r\n天空化身为人\r\n\r\n一个红色的猎手\r\n\r\n火光中心的雨雪\r\n\r\n山洞是他的头发\r\n\r\n火是他的舌头和马\r\n\r\n黑色和暴力的儿子\r\n\r\n骑着狮子　抱着虎熊　与母豹成婚\r\n\r\n在深不见底的岩穴内\r\n\r\n土地向上涌\r\n\r\n用火光照亮\r\n\r\n黄金走出山顶洞\r\n\r\n白骨变成人\r\n\r\n阴暗的神的女人　一抱抱住他\r\n\r\n放下了手中的野兽\r\n\r\n03：铁砧上跳跃的火              \r\n\r\n他和母亲\r\n\r\n和她们\r\n\r\n逐一交配\r\n\r\n他生铁铸造的吐火的铁头\r\n\r\n横躺在嘴里\r\n\r\n像马槽里的马\r\n\r\n用嘴收走\r\n\r\n他肉体已经熟透\r\n\r\n就要在火中下雪\r\n\r\n他剖开山腹\r\n\r\n取出山腹中秘密谈话的人\r\n\r\n取出他空空的内脏\r\n\r\n取出那天空　那听不见\r\n\r\n秘密的内容\r\n\r\n从头顶扔出地心\r\n\r\n把内脏从头顶\r\n\r\n扔出地心\r\n\r\n火光中心有雨雪\r\n\r\n我的泪水\r\n\r\n漫天漂落\r\n\r\n猎人\r\n\r\n在高山上\r\n\r\n在天堂的\r\n\r\n高山上\r\n\r\n在高山中最高的山上\r\n\r\n在高山中最高的山的顶子上\r\n\r\n就是我们这个世界\r\n\r\n就是我们这个世界最后一夭\r\n\r\n我们被一张火嘴收起\r\n\r\n用黑暗蒙住我们的眼睛\r\n\r\n用牛皮缝住\r\n\r\n不让眼泪流出\r\n\r\n这是世界的最后一天\r\n\r\n所有的人都要相见\r\n\r\n相见在一张铁砧上\r\n\r\n周围是火焰簇拥\r\n\r\n05\r\n\r\n吃和\r\n\r\n吃的嘴\r\n\r\n包围母亲\r\n\r\n也包围了\r\n\r\n我的头骨\r\n\r\n神与母马的头骨              \r\n\r\n吃火　吃鬼　吃粮食\r\n\r\n追着太阳和黑暗空虚\r\n\r\n吃草草结籽\r\n\r\n吃水水长流\r\n\r\n吃果
