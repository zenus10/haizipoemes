ssive:!0});o();const e=document.querySelector(".menu-toggle"),i=document.querySelector(".mobile-menu"),s=document.body;e?.addEventListener("click",()=>{const t=e.classList.toggle("active");i?.classList.toggle("active"),e.setAttribute("aria-expanded",t.toString()),e.setAttribute("aria-label",t?"关闭菜单":"打开菜单"),t?s.style.overflow="hidden":s.style.overflow=""});const a=document.querySelectorAll(".mobile-nav-link");a.forEach(t=>{t.addEventListener("click",()=>{e?.classList.remove("active"),i?.classList.remove("active"),e?.setAttribute("aria-expanded","false"),e?.setAttribute("aria-label","打开菜单"),s.style.overflow=""})});window.addEventListener("resize",()=>{window.innerWidth>640&&(e?.classList.remove("active"),i?.classList.remove("active"),e?.setAttribute("aria-expanded","false"),s.style.overflow="")});</script> <div class="h-dvh flex justify-center pt-[--navHeight] overflow-hidden"> <div class="relative  w-full"> <div class="h-full flex flex-col overflow-y-auto ">   <script>(function(){const poems = [{"id":"essay/动作太阳断头篇代后记","title":"动作（《太阳·断头篇》代后记）","type":"essay","year":"unknown","body":"如果说戏以前写的是“她”，人类之母，诗经中的“伊人”，一种北方的土地和水，寂静的劳作，那么，观在，我要写“他”，一个大男人，人类之父，我要写楚辞中的“东皇太一”，甚至奥义书中的“大梵”，但归根到底，他只是一个失败的英雄，和我一样。\n这是一幅人类个体完整的图像，也是他的生长史。我从爪子下开始，那是一对曾经舞在空中斫天取火的爪子，但这仅仅是人类精神苏醒的序幕，于是我破鱼而出，但似乎又回到鱼，回到我所能感觉到的脐，那个与大地母亲与地下冥府与永恒死亡紧紧缠在一起的脐。这是关于轮回的大地之歌，是劳作与舞蹈的颂歌，也是破坏和毁灭的颂歌。然后我们一起上升到心，那是质朴的静止的人类生存状态。人们用火用粮食用歌曲用诗人的生命来长久地活下去，在心上活下去。心，就是静止的人民，是一朵不灭的火焰，纯洁的源泉。然后我们就通过诗人找到了老歌巫的嘴唇，它代表着祭礼、婚礼和葬礼。踏破这轮回的歌曲的则是头颅，这位大男人的头颅，但这头颅是用来作一种绝对失败的反抗的，这只头颅将被砍离整个躯体，成长为一个血红的太阳。整个人类，无头之躯的地面，永远绕着这太阳旋转。好比说是舞。\n这首诗，是血淋淋的，但同样是温情脉脉的，是黑暗无过的，但同样是光芒四射的，是无头战士的是英雄主义的但同样是人民的是诗人心上人的，是夜晚和地狱的，是破碎天空和血腥大地的，但归根到底是太阳的。\n所以他就叫太阳\n太阳就是我，一个好动宇宙的劳作者，一个诗人和注定失败的战士。总而言之，我反抗过生命以外的一切，甚至反抗过死亡，因此就在这上天入地的路途上，听见了这样一句话：地狱之火烧伤他的面颊，就像烧伤但丁一样。\n但这一次是在中国，伟大诗篇的阵痛中！\n而太阳一直轰轰烈烈地活在葬礼上！\n之一：自然实体和集体仪式的死\n这一次，我的诗．出自死亡的本源，和死里求生的本能，并且拒绝了一切救命之术和别的精神与诗艺的诱惑。这是唯一的一次轰轰烈烈的死亡。断头的时候正是日出。这是唯一一场使我们血泉如注并且成为英雄的战争。在一个衰竭实利的时代，我要为英雄主义作证。这是我的本分。我当然不是讲一次几千年前的战争。我还要写下去，写正午的太阳。天地双方的撕杀，英雄世纪，王，写日落，众神的黄昏，唯一的王的劫难。我的心，情感的心，已被历史行动的血泊浸润。我的史诗形体正在血腥的荒野上向我走来。只是那两位主人公迟迟没有出现。奇怪，为什么我总是觉得是两位主人公呢？而太阳，这一次是死里求生的集体仪式。是人，都必须在太阳面前找到自己存在的依据。\n之二：是天空．还是大地？\n归根到底，我是倾心于阴沉，寒冷艰涩，深不到底。但催人生长，保存四季、仪式、诞生与死亡的大地艺术。是它给了我结实的心。我不会被打垮是因为它。如果说海是希腊的，那么天空是中国的。任何人都不像中国人对于天空有那么深的感知。当然，一切伟大的作品都是在通向天空的道路上消失，但我说的是另一个天空。那个天空是中国人固有的，是中国文人的人格所保存的，虽然现在只能从形式的趣味上才能隐隐看去。这当然不是形成宇宙和血缘时那一团团血腥预言的天空。中国人用漫长的正史把核心包起来了，所以文人最终由山林、酒杯和月亮导向反射灵魂的天空。它是深知时间秘密的，因而是淡泊的，最终是和解的。唐诗中有许多精粹的时刻，中国是伟大抒情诗篇的国度。那么，我的天空就与此不同，它不仅是抒情诗篇的天空，苦难艺术家的天空，也是歌巫和武人，老祖母和死婴的天空，更是民族集体行动的天空。因此，我的天空住住是血腥的大地。我要说，千万年来，不仅仅是先知们在各自的散文中沉睡……\n之三：几种诗\n诗有两种：纯诗（小诗）和唯一的真诗（大诗），还有一些诗意状态。\n诗人必须有力量把自己从大众中救出来，从散文中救出来，因为写诗并不是简单的喝水，望月亮，谈情说爱，寻死觅活。重要的是意识到地层的断裂和移动，人的一致和隔离。诗人必须有孤军奋战的力量和勇气。\n诗人必须有力量把自己从自我中救出来，因为人民的生存和天、地是歌唱的源泉，是唯一的真诗。“人民的心”是唯一的诗人。\n在写大诗时，这是同一个死里求生的过程。"},{"id":"essay/我热爱的诗人荷尔德林","title":"我热爱的诗人——荷尔德林","type":"essay","year":"1988","body":"1.\n在《黑格尔通信百封》这本书里，提到了荷尔德林不幸的命运。他两岁失去了生父，九岁失去了继父，1788年进入图宾根神学院，与黑格尔、谢林是同学和好友。1798年秋天因不幸的爱情离开法兰克福。1801年离开德国去法国的波尔多城做家庭教师。次年夏天，他得到了在他作品中被理想化为狄奥蒂玛的情人的死讯，突然离开波尔多。波尔多在法国西部，靠近大西洋海岸。他徒步横穿法国回到家乡，神经有些错乱，后又经亲人照料，大为好转，写出不少著名的诗篇，还翻译了索福克勒斯的《安提戈涅》和《俄狄浦斯王》。精神病后又经刺激复发，1806年进图宾根精神病院医治。后来住在一个叫齐默尔的木匠家里。有几位诗人于1826年出版了他的诗集。他于1843谢世，在神智混乱的“黑夜”中活了36个年头，是尼采“黑夜时间”的好几倍。荷尔德林一生不幸，死后仍默默无闻，直到20世纪人们才发现他诗歌中的灿烂和光辉。和歌德一样，他是德国贡献出的世界诗人。哲学家海德格尔曾专门解说荷尔德林的诗歌。\n2． \n荷尔德林的诗，歌唱生命的痛苦，令人灵魂颤抖。他写道：\n待到英雄们在铁铸的摇篮中长成，\n勇敢的心灵像从前一样，\n去造访万能的神祗。\n而在这之前，我却常感到，\n与其孤身独涉，不如安然沉睡。\n何苦如此等待，沉默无言，茫然失措。\n在这贫困的时代，诗人何为?\n可是，你却说，诗人是酒神的神圣祭司\n在神圣的黑夜中，他走遍大地。\n正是这种在神圣的黑夜中走遍大地的孤独，使他自觉为神的儿子：\n “命运并不理解／莱茵河的愿望。／但最为盲目的／还算是神的儿子。／人类知道自己的住所，／鸟兽也懂得在哪里建窝，／而他们却不知去何方。”\n他写莱茵河，从源头，从阿尔卑斯冰雪山巅，众神宫殿，如一架沉重的大弓，歌声和河流，这长长的箭，一去不回头。一支长长的歌，河水中半神，撕开了两岸。看着荷尔德林的诗，我内心的一片茫茫无际的大沙漠，开始有清泉涌出，在沙漠上在孤独中在神圣的黑夜里涌出了一条养育万物的大河，一个半神在河上漫游，唱歌，漂泊，一个神子在唱歌，像人间的儿童，赤子，唱歌，这个活着的，抖动的，心脏的，人形的，流血的，琴。\n3．\n痛苦和漫游加重了弓箭和琴，使草原开花。这种漫游是双重的，既是大自然的，也是心灵的。在神圣的黑夜走遍大地“……保留到记忆的最后／只是各有各的限制／因为灾难不好担当／幸福更难承受。／而有个哲人却能够／从正午到夜半／又从夜半到天明／在宴席上酒兴依旧”(《莱茵河》)。也就是说，要感谢生命，即使这生命是痛苦的，是盲目的。要热爱生命，要感谢生命。这生命既是无常的，也是神圣的。要虔诚。\n有两类抒情诗人，第一种诗人，他热爱生命，但他热爱的是生命中的自我，他认为生命可能只是自我的官能的抽搐和内分泌。而另一类诗人，虽然只热爱风景，热爱景色，热爱冬天的朝霞和晚霞，但他所热爱的是景色中的灵魂，是风景中大生命的呼吸。凡·高和荷尔德林就是后一类诗人。他们流着泪迎接朝霞。他们光着脑袋画天空和石头，让太阳做洗礼。这是一些把宇宙当庙堂的诗人。从“热爱自我”进入“热爱景色”，把景色当成“大宇宙神秘”的一部分来热爱，就超出了第一类狭窄的抒情诗人的队伍。\n景色也是不够的。好像一条河，你热爱河流两岸的丰收或荒芜，你热爱河流两岸的居民，你也可能喜欢像半神一样在河流上漂泊、流浪航行，做一个大自然的儿子，甚至你或者是一个喜欢渡河的人，你热爱两岸的酒楼、马车店、河流上空的飞鸟、渡口、麦地、乡村等等。但这些都是景色。这些都是不够的。你应该体会到河流是元素，像火一样，他在流逝，他有生死，有他的诞生和死亡。必须从景色进入元素，在景色中热爱元素的呼吸和言语，要尊重元素和他的秘密。你不仅要热爱河流两岸，还要热爱正在流逝的河流自身，热爱河水的生和死。有时热爱他的养育，有时还要带着爱意忍受洪水的破坏。忍受他的秘密。忍受你的痛苦。把宇宙当做一个神殿和一种秩序来爱。忍受你的痛苦直到产生欢乐。这就是荷尔德林的诗歌。这诗歌的全部意思是什么?要热爱生命不要热爱自我，要热爱风景而不要仅仅热爱自己的眼睛。这诗歌的全部意思是什么?做一个热爱“人类秘密”的诗人。这秘密既包括人兽之间的秘密，也包括人神、天地之间的秘密。你必须答应热爱时间的秘密。做一个诗人，你必须热爱人类的秘密，在神圣的黑夜中走遍大地，热爱人类的痛苦和幸福，忍受那些必须忍受的，歌唱那些应该歌唱的。\n4．\n从荷尔德林我懂得，必须克服诗歌的世纪病——对于表象和修辞的热爱。必须克服诗歌中对于修辞的追求、对于视觉和官能感觉的刺激，对于细节的琐碎的描绘——这样一些疾病的爱好。\n从荷尔德林我懂得，诗歌是一场烈火，而不是修辞练习。\n诗歌不是视觉。甚至不是语言。她是精神的安静而神秘的中心。她不在修辞中做窝。她只是一个安静的本质，不需要那些俗人来扰乱她。她是单纯的，有自己的领土和王座。她是安静的。有她自己的呼吸。\n5．\n荷尔德林，忠告青年诗人：“假如大师使你们恐惧，向伟大的自然请求忠告”。痛苦和漫游加重了弓箭和琴，使草原开花，荷尔德林这样写他的归乡和痛苦：\n航海者愉快地归来，到那静静河畔\n他来自远方岛屿，要是满载而归\n我也要这样回到生长我的土地\n倘使怀中的财货多得和痛苦一样\n荷尔德林的诗，是真实的，自然的，正在生长的，像一棵树在四月的山上开满了杜鹃，诗，和，开花，风吹过来，火向上升起，一样。诗，和，远方一样。诗和远方一样。我写过一句诗：\n远方除了遥远一无所有。\n荷尔德林，早期的诗，是沉醉的，没有尽头的，因为后来生命经历的痛苦——痛苦一刀砍下来——，诗就短了，甚至有些枯燥，像大沙漠中废墟和断头台的火砖，整齐，坚硬，结实，干脆，排着，码着。\n“安静地”“神圣地”“本质地”走来。热爱风景的抒情诗人走进了宇宙的神殿。风景进入了大自然。自我进入了生命。没有谁能像荷尔德林那样把风景和元素完美地结合成大自然，并将自然和生命融入诗歌——转瞬即逝的歌声和一场大火，从此永生。\n在1800年后，荷尔德林创作的自由节奏颂歌体诗，有着无人企及的令人神往的光辉和美，虽然我读到的只是其中几首，我就永远地爱上了荷尔德林的诗和荷尔德林。\n+ 1988.11.16"},{"id":"essay/源头和鸟河流原代后记","title":"源头和鸟（《河流》原代后记）","type":"essay","year":"1983","body":"河流的上游，通往山顶的小径上开满了鲜血一样红灼的花朵。树叶腐烂得像漫上了一层水，渴望着火光与抚爱。树洞和石窟里爬出粗大的人形。湖泊淹去了一半山地和丛林。愿望和祝福来到人间。枣红色马群像流体一样在周围飞逝。一队说不清来向和去处的流浪民族在迁徙。隐约的雪峰和草坡衬托着人群的丑陋。男性用粗硬的睫毛挡住眼睛后面的雨季。他们鼓乐齐天的生活背后透过一种巨大的隐隐作痛的回忆。贫瘠的山梁。我们从哪儿来？我们住何处去？我们是谁？一只红色的月亮和一两件被手掌嘴唇磨得油亮的乐器，伴随着我们横过夜晚。那只红月亮就像一块巨大的抹不掉的胎记。在一个七月的夜里我不再沉默，痛苦地给每一堆篝火送来了故事。关于母亲深夜被肚里孩子的双脚踢醒，关于脐带。关于情人的头发被我灼热的呼吸烧得卷曲，披下来盖住柔嫩的胸脯。关于雪里的种子和北方的忧伤。关于友谊和血腥的盾牌。关于落下来又飞上去的流星。关于铃兰和佩兰，关于新娘的哭泣。关于含有敌意的一双血污的手掌，关于公正、祷告和复仇，关于正义的太阳之光像鞭子一样抽在罪人的光脊梁上。关于牧歌和月亮神女。许多人醒来又睡去、许多人睡去又醒来。火堆边人影构成一块巨大的实体。最后我讲了鸟。充满了灵性。飞是不可超越的。飞行不是体力和智力所能解决的。它是一次奇迹。如果跨入鸟的行列，你会感到寂寞的。你的心脏在温乎乎的羽毛下伸缩着。你的心脏不是为防范而是为飞行所生。地上的枪口很容易对准你。在那蓝得伤心的天幕上，你飞着，胸脯里装着吞下去的种籽，飞着，寂寞，酸楚，甚至带着对凡俗的仇恨。\n+ 1983.3.13生辰"},{"id":"essay/诗学-一份提纲","title":"诗学：一份提纲","type":"essay","year":"1987","body":"一、辩　解\n我写长诗总是迫不得已。出于某种巨大的元素对我的召唤，也是因为我有太多的话要说，这些元素和伟大材料的东西总会涨破我的诗歌外壳。为了诗歌本身——和现代世界艺术对精神的垄断和优势——我得舍弃我大部分的精神材料，直到它们成为诗歌。\n在一首诗（《土地》）里，我要说的是，由于丧失了土地，这些现代的漂泊无依的灵魂必须寻找一种代替品——那就是欲望，肤浅的欲望。大地本身恢宏的生命力只能用欲望来代替和指称，可见我们已丧失了多少东西。\n在这一首诗里，与危机的意识并存，我写下了四季循环。对于我来说，四季循环不仅是一种外界景色，土地景色和故乡景色。更主要的是一种内心冲突、对话与和解。在我看来，四季就是火在土中生存、呼吸和血液循环、生殖化为灰烬和再生的节奏。我用了许多自然界的生命来描绘（模仿和象征）他们的冲突，对话与和解。这些生命之兽构成四季循环，土火争斗的血液字母和词汇——一句话，语言是诗中的元素。它们带着各自粗糙的感情生命和表情出现在这首诗中。豹子的粗糙的感情生命是一种原生的欲望和蜕化的欲望杂陈。狮子是诗。骆驼是穿越内心地狱和沙漠的负重的天才现象。公牛是虚假和饥饿的外壳。马是人类、女人和大地的基本表情。玫瑰与羔羊是赤子、赤子之心和天堂的选民——是救赎和感情的导师。鹰是一种原始生动的诗——诗人与鹰合一时代的诗。王就是王。石就是石。酒就是酒。家园依然是家园。这些全是原始粗糙的感性生命和表情。\n还有一层是古典理性主义给我的诗歌带来的语言。他们代表了作为形式文明和思辨对生命的指称，围绕着“道”出现了飞速旋转的先知、实体的车子、法官和他的车子、囚禁、乘客与盲目的宿命的诗人。古典理性主义携带一把盲目的斧子，在失明状态下斫砍生命之树。天堂和地狱会越来越远。我们被排斥在天堂和地狱之外。我们作为形式的文明是建立在这些砍伐生命者的语言之上的——从老子、孔子和苏格拉底开始。从那时开始，原始的海退去大地裸露——我们从生命之海的底部一跃，占据大地：这生命深渊之上脆弱的外壳和桥；我们睁开眼睛——其实是险入失明状态。原生的生命涌动蜕化为文明形式和文明类型。我们开始抱住外壳。拼命的镌刻诗歌——而内心明亮外壳盲目的荷马只好抱琴远去。荷马——你何日能归？！\n二、上帝的七日\n在上帝的七日里一定有原始力量的焦虑、和解、对话，他对我的命令、指责和期望。\n伟大的立法者……\n“我从原始的王中涌现　涌现。”\n在上帝的七日里一定有幻想、伟大诗歌、流放与囚禁。\n让我们先来看看上帝的第六日。\n创造亚当实际上是亚当从大地和上帝手中挣脱出来。主体从实体中挣脱出来。男人从女人中挣脱出来。父从母、生从死挣脱出来，使亚当沉睡于实体和万物中的绳索有两条：大地束缚力（死亡意识）与上帝束缚力（奴隶的因素）。好像一个王子，母与父（王与后）是一个先他存在的势力。让我们从米开朗琪罗来看看上帝或王子的束缚力（也就是父亲势力）。\n米开朗琪罗塑造了一系列奴隶——从天顶画到塑像，伴随主体（亚当、摩西、统治者）的总是奴隶——除裸体外身无一物的人——这裸体用以象征艺术家和人类自身。主体与奴隶实际上是合二为一的：这就是创造亚当的进程（所以巨匠=上帝+奴隶）。\n另外，母亲势力：实际上也就是亚当和夏娃的关系。指的是亚当从夏娃中挣脱出来（母亲就是夏娃），从母体的挣脱（这“母亲”就是《浮士德》中使人恐怖的万物之母），从大地和“无”中的挣脱。意识从生命的本原的幽暗中苏醒——从虚无的生命气息中苏醒（古典理性主义哲学苏格拉底和老子探讨的起点——当然他们还是以直观的逻辑为起点），这也是上升时期的精神，在但丁、米开朗琪罗中明确显示。\n而相反，创造夏娃是从亚当的挣脱，这是变乱世纪和世纪末的精神：以母为本，彻底意味着人追求母体、追求爱与死的宗教气质。母性原则体现在本世纪造型艺术上十分充分。追求精神、生命与抽象永恒，把形式、装饰和心情作为目标。不是塑造，无视主体形象的完满，而追求沉睡的生命自由。追求瓦解与元素的冥冥心情。这也是敦煌石窟壁画的精神——对于伟大的精神与死的心情的渴望。\n本世纪艺术带有母体的一切特点：缺乏完整性、缺乏纪念碑的力量，但并不缺乏复杂和深刻，并不缺乏可能性，并不缺乏死亡和深渊。从卢梭和歌德开始了这场“伟大的自由的片段”——伟大的母体深渊的苏醒（很奇怪，歌德本人却是一个例外：后面会简单谈到）：夏娃苏醒在亚当肋骨的自白。\n从希腊文化和艺术复兴那些巨匠的理想和力量中成长起来的却是心情、情感、瓦解、碎片和一次性行动意志的根本缺乏。\n浪漫主义王子型诗人们是夏娃涌出亚当，跃出亚当的瞬间（人或是亚当的再次沉睡和疼痛？）卢梭是夏娃最早的咿呀之声……她的自恋与诉说……自然的母体在周围轰响，伸展的立方主义，抽象表现，超现实主义……本世纪这些现代倾向的抽象、矫饰或者元素的造型艺术更是初生女儿和人母夏娃眼神中初次映象：精神本原和心情零乱现象零乱元素的合冶。\n……而巨匠和行动创造性的、人格性的、奴隶和上帝的复合体亚当开始沉睡。\n父亲迷恋于创造和纪念碑、行动雕刻和教堂神殿造型的壮丽人格。王子是旷野无边的孩子。母亲和母体迷恋于战争舞蹈、性爱舞蹈与抽象舞蹈的深渊和心情，环绕人母和深渊之母（在泰西文明是圣母）。先是浪漫主义王子（详见“太阳神之子”），后来又出现了一系列环绕母亲的圣徒：卡夫卡，陀斯妥耶夫斯基、凡·高、梭罗、尼采等，近乎一个歌唱母亲和深渊的合唱队，神秘合唱队。\n现代主义精神（世纪精神）的合唱队中圣徒有两类：一类用抽象理智、用理智对自我的流放，来造建理智的沙漠之城，这些深渊或小国寡民之极的土地测量员（卡夫卡、梭罗、乔伊斯）；这些抽象和脆弱的语言或视觉的桥的建筑师（维特根施坦、塞尚）；这些近视的数据科学家或临床大夫（达尔文、卡尔、弗洛伊德），他们合在一起，对“抽象之道”和“深层阴影”的向往，对大同和深渊的摸索，象征“主体与壮丽人格建筑”的完全贫乏，应该承认，我们是一个贫乏的时代——主体贫乏的时代。他们逆天而行，是一群奇特的众神，他们活在我们近旁，困惑着我们。\n另一类深渊圣徒和一些早夭的浪漫主义王子一起，他们符合“大地的支配”这些人像是我们的血肉兄弟，甚至就是我的血。\n“我来说说我的血”。\n人　活在原始力量的周围。\n凡·高、陀斯妥耶夫斯基、雪莱、韩波、爱伦·坡、荷尔德林、叶塞宁、克兰和马洛（甚至在另一种意义上还有阴郁的叔伯兄弟卡夫卡、理想的悲剧诗人席勒、疯狂的预言家尼采）都活在这种原始力量的中心，或靠近中心的地方，他们的诗歌即是和这个原始力量的战斗、和解、不间断的对话与同一。他们的对话、指责和辩白。这种对话主要是一种抒发、抒发的舞，我们大多数的人类民众们都活在原始力量的表层和周围。\n在亚当型巨匠那里（米开朗基罗、但丁、莎士比亚、歌德）又是另外一种情况，原始力量成为主体力量，他们与原始力量之间的关系是正常的、造型的和史诗的，他们可以利用由自身潜伏的巨大的原发性的原始力量（悲剧性的生涯和生存、天才和魔鬼、地狱深渊、疯狂的创造与毁灭、欲望与死亡、血、性与宿命，整个代表性民族的潜伏性）来为主体（雕塑和建筑）服务。歌德是一个代表，他在这种原始力量的洪水猛兽面前感到无限的恐惧（如他听贝多芬的某些音乐感到释放了身上的妖魔），歌德通过秩序和拘束使这些凶猛的元素、地狱深渊和魔法的大地分担在多重自我形象中（他分别隐身于浮士德、梅非斯特——恶魔、瓦格纳——机械理性，荷蒙库阿斯——人造人、海伦、欧福里翁、福尔库阿斯、守塔人林叩斯和女巫的厨房中），这些人对于歌德来说都是他原始力量的分担者，同时又借他们完成了悲剧主体的造型。歌德通过秩序和训练，米开朗琪罗通过巨匠的手艺，莎士比亚通过力量和天然接受力以及表演天才，但丁通过中世纪神学大全的全部体系和罗马复兴的一缕晨曦（所有人都利用了文明中基本的粗暴感性、粗鄙和忧患——这些伟大的诗歌力量和材料），这“父亲势力”可与“母亲势力”（原始力量）平衡。产生了人格，产生了一次性行动的诗歌，产生了秩序的教堂、文明类型的万神殿和代表性诗歌——造型性的史诗、悲剧和建筑“这就是父亲主体”。\n但凡·高他们活在原始力量中心或附近，他们无法像那些伟大的诗人有幸也有力量活在文明和诗歌类型的边缘，他们诗歌中的天堂或地狱的力量无限伸展，因而不能容纳他们自身。也不会产生伟大的诗歌和诗歌人格——任何诗歌体系或类型。他们只能不懈而近乎单调地抒发。他们无力成为父亲，无力把女儿、母亲变成妻子——无力战胜这种母亲，只留下父本与母本的战争、和解、短暂的和平与对话的诗歌。诗歌终于被原始力量压跨，并席卷而去。\n当然，后面我们将要谈到的人类集体创造的更高一层超越父与母的人类形象记录。他们代表一种人类庄严存在，是人类形象与天地并生。\n关于地狱……我将会在以后的岁月里向你们一一叙述……底层的神的灵感和灵魂的深层涌泉，代表着被覆盖的秘密的泉源。\n在上帝的第七日中，我看出第六日已是如此复杂与循环，所以历史始终在这两种互为材料（原始的养料）的主体中滑动：守教与行动；母本与父本；大地与教堂。在这种滑动中我们可以找到多种艺术的根源，如现代艺术根源中对元素的追挖和“变形”倾向即是父本瓦解的必然结果。\n创造亚当是人本的——具体的，造型的，是一种劳作，是一次性诗歌行动。创造夏娃是神本的、母本的、抽象的、元素的和多种可能性同时存在的——这是一种疯狂与疲倦至极的泥土呻吟和抒情。是文明末端必然的流放和耻辱，是一种受难。集体受难导致宗教。神。从亚当到夏娃也就是从众神向一神的进程。\n而从母走向父：亚当的创造，不仅回荡滚动着大地的花香，欲情和感性，作为挣脱母体（实体和材料）的一种劳作，极富有战斗、挣扎和艰苦色彩——雕像的未完成倾向。希腊悲剧和意大利文艺复兴是两个典型的创造亚当的过程。带有鲜明的三点精神：主体明朗、奴隶色彩（命运）和挣扎的悲剧性姿态。而且在希腊悲剧和意大利文艺复兴各有巨匠辈出。\n从夏娃到亚当的转变和挣扎——在我们祖国的当代尤其应值得重视——是从心情和感性到意志，从抒发情感到力量的显示，无尽混沌中人类和神浑厚质朴、气魄巨大的姿势、飞腾和舞蹈。亚当：之一，荷马的行动力和质朴未凿、他的黎明；之二，但丁的深刻与光辉；之三，莎士比亚的丰厚的人性和力量；之四，歌德，他的从不间断的人生学习和努力造型；之五，米开朗琪罗的上帝般的创造力和巨人——奴隶的体力；之六，埃斯库罗斯的人类对命运的巨大挣扎和努力——当然，这仅仅是一些典型。\n三、王子·太阳神之子\n我要写下这样一篇序言，或者说是寓言。我更珍惜的是那些没有成为王的王子。代表了人类的悲剧命运。命运是有的。它不管你承认不承认。自从人类摆脱了集体回忆的创作（如印度史诗、旧约、荷马史诗）之后，就一直由自由的个体为诗的王位而进行血的角逐。可惜的是，这场场角逐并不仅仅以才华为尺度。命运它加手其中。正如悲剧言中，最优秀最高贵最有才华的王子往往最先身亡。我所敬佩的王子行列可以列出长长的一串：雪莱、叶塞宁、荷尔德林、坡、马洛、韩波、克兰、狄兰……席勒甚至普希金。马洛、韩波从才华上，雪莱从纯洁的气质上堪称他们的代表。他们的疯狂才华、力气、纯洁气质和悲剧性的命运完全是一致的。他们是同一个王子的不同化身、不同肉体、不同文字的呈现、不同的面目而已。他们是同一个王子，诗歌王子，太阳王子。对于这一点，我深信不疑。他们悲剧性的抗争和抒情，本身就是人类存在最为壮丽的诗篇。他们悲剧性的存在是诗中之诗。他们美好的毁灭就是人类的象征。我想了好久，这个诗歌王子的存在，是继人类集体宗教创作时代之后，更为辉煌的天才存在，我坚信，这就是人类的命运，是个体生命和才华的命运，它不同于人类早期的第一种命运，集体祭司的命运。\n从祭司到王子，是人的意识的一次苏醒，也是命运的一次胜利，在这里，人类个体的脆弱性暴露无疑。他们来临，诞生，经历悲剧性生命充盈才华焕发的一生，就匆匆退场，都没有等到谢幕，我常常为此产生痛不欲生的感觉。但片刻悲痛过去，即显世界本来辉煌的面目，这个诗歌王子，命定般地站立于我面前，安详微笑，饱含了天才辛酸。人类啊，此刻我是多么爱你。\n当然，还有一些终于为王的少数。但丁、莎士比亚、歌德就是。命运为他们安排了流放，勤奋或别的命运，他们是幸运的。我敬佩他们。他们是伟大的峰顶，是我们这些诗歌王子角逐的王座。对，是王座，可望而不可及。在雪莱这些诗歌王子的诗篇中，我们都会感到亲近。因为他们悲壮而抒情，带着人性中纯洁而又才华的微笑，这微笑的火焰，已经被命运之手熄灭，有时，我甚至在一刹那间，觉得雪莱和叶塞宁的某些诗是我写的。我与这些抒情主体的王子们已经融为一体，而在我读《神曲》时，中间矗立着伟大的但丁，用的是但丁的眼。他一直在我和他的作品之间。他的目光注视着你。他领着你在他王座周围盘桓。但丁啊，总有一天，我要像你抛开维吉尔那样抛开你的陪伴，由我心中的诗神或女神陪伴升上诗歌的天堂，但现在你仍然是王和我的老师。\n这一次全然涉于西方的诗歌王国。因为我恨东方诗人的文人气质。他们苍白孱弱，自以为是。他们隐藏和陶醉于自己的趣味之中。他们把一切都变成趣味，这是最令我难以忍受的。比如说，陶渊明和梭罗同时归隐山水，但陶重趣味，梭罗却要对自己的生命和存在本身表示极大的珍惜和关注。这就是我的诗歌的理想，应抛弃文人趣味，直接关注生命存在本身。这是中国诗歌的自新之路。我坚信这一点，所以我要写他们。泰西的王或王子，在《太阳》第一篇中我用祭司的集体黑暗中创作来爆炸太阳。这一篇我用泰西王子的才华和生命来进行爆炸太阳。我不敢说我已成功。我只想呈现生命。我珍惜王子一样青春的悲剧和生命。我通过太阳王子来进入生命。因为天才是生命的最辉煌的现象之一。我写下了这些冗长琐屑的诗行（参见《土地》），愿你们能理解我，朋友们。\n+ 1987.5.30 8点半多\n四、 伟大的诗歌\n伟大的诗歌，不是感性的诗歌，也不是抒情的诗歌，不是原始材料的片断流动，而是主体人类在某一瞬间突入自身的宏伟——是主体人类在原始力量中的一次性诗歌行动。这里涉及到原始力量的材料（母力、天才）与诗歌本身的关系，涉及到创造力化为诗歌的问题。但丁将中世纪经院体系和民间信仰、传说和文献、祖国与个人的忧患以及新时代的曙光——将这些原始材料化为诗歌；歌德将个人自传类型上升到一种文明类型，与神话宏观背景的原始材料化为诗歌，都在于有一种伟大的创造性人格和伟大的一次性诗歌行动。\n这一世纪和下一世纪的交替，在中国，必有一次伟大的诗歌行动和一首伟大的诗篇。这是我，一个中国当代诗人的梦想和愿望。因此必须清算、扫清一下。对从浪漫主义以来丧失诗歌意志力与诗歌一次性行动的清算，尤其要对现代主义酷爱“元素与变形”这些一大堆原始材料的清算。\n我们首先必须认清在人类诗歌史上创造伟大诗歌的两次失败。\n第一次失败是一些民族诗人的失败。他们没有将自己和民族的材料和诗歌上升到整个人类的形象。虽然他们的天才是有力的，也是均衡的（材料和诗歌均衡），他们在民族语言范围内创造出了优秀诗篇。但都没有完成全人类的伟大诗篇。他们的成功是个别的和较小的。他们的代表人物有普希金、雨果、惠特曼、叶芝、维加，还有易卜生等。我们试着比较一下歌德与普希金、雨果。他们可以说处在同一时代。歌德的《浮士德》就是我们前面提到的创造性人格的一次性诗歌行动——《浮士德》的第一部与第二部终于结合起来，浪漫世界的抒情主体与古典世界的宏观背景终于结合在一个形象中。原始形象的阴影（即青春的阴暗和抒情诗人的被动性阴影感知）终于转变并壮大成为创造行动。伟大的材料成为诗歌，而且完整。而在普希金和雨果那里则表现为一种分离：诗歌与散文材料的分离；主体世界和宏观背景（小宇宙与大宇宙）的分离；抒情与创造的分离。这些分离实际上都是一个分离。表现在作品上，普希金的《奥涅金》与《上尉的女儿》，体现了分离和一次性诗歌行动的失败；雨果则是《历代传说》与《悲惨世界》，体现了同样的分离和失败。这是第一次失败，一些非常伟大的民族诗人创造人类伟大的诗歌的失败。\n第二次失败离我们的距离更近，我们可以把它分为两种倾向的失败：碎片与盲目。\n碎片：如本世纪英语诗中庞德和艾略特就没能将原始材料（片断）化为伟大的诗歌：只有材料、信仰与生涯、智性和悟性创造的碎片。本世纪的多数艺术家（创造性的艺术家）都属于这种元素性的诗人（碎片和材料的诗人：如卡夫卡的寓言性元素和启示录幻景的未完成性；乔伊斯的极端语言实验倾向与内容文体的卑微；美国文人庞德与艾略特的断片；音乐家瓦格拉的神话翻版），还有一大批“元素与变形”一格的造型艺术家（塞尚、毕加索、康定斯基、克利、马蒂斯、蒙德里安、波洛克与摩尔）。还有哲学诗人和哲学戏剧家加谬和萨特。这些人与现代主义精神的第一圣徒（奇特的众神）是同等和十分接近的。\n第二种失败里还有一种是通过散文表达那些发自变乱时期本能与血的呼声的人。从材料和深度来说，他们更接近史诗这一伟大的诗歌本身，可惜他们自身根本就不是诗歌。我们可以将这些史诗性散文称之为盲目的诗或独眼巨人——这盲目的诗体现了某些文明的深刻变乱，尤其是早些时候的俄罗斯和今日的拉美。斯拉夫的俄罗斯、变乱中的农民创造出了这样一批独眼巨人：《卡拉玛佐夫兄弟》（陀斯妥耶夫斯基）、《战争与和平》（托尔斯泰）与《静静的顿河》（肖洛霍夫）等。他们没有也不可能把这些伟大的原始材料化成伟大诗歌。他们凭着盲目的史诗和悲剧的本能，暗中摸索与血的呼声进行巨型散文的创造。另外就是今日的拉美文坛。他们也是处在某种边缘和动乱混血的交结点上，再加上优秀的西班牙语言之血《唐吉诃德》。但是他们的成就似乎是复杂多于深厚，（或因为疯狂的西班牙语言，他们喜剧色彩较重，缺乏隆重严肃的史诗和悲剧），而且确实有待深化。另外还有一些别的民族的诗人，如美国的麦尔维尔（《白鲸》）和福克纳，英语的悲剧诗人哈代（但染上了那个时代的感伤）和康德拉（不知为什么他的成就没有更大）。这都源于文明之下生命深处血的兆始和变乱。本质上，他们是盲目的大地诗人，接近于那些活在原始力量中心的第二类众神。\n在伟大的诗歌方面，只有但丁和歌德是成功的，还有莎士比亚。这就是作为当代中国诗歌目标的成功的伟大诗歌。\n当然，还有更高一级的创造性诗歌——这是一种诗歌总集性质的东西——与其称之为伟大的诗歌，不如称之为伟大的人类精神——这是人类形象中迄今为止的最高成就。他们作为一些精神的内容（而不是材料）甚至高出于他们的艺术成就之上，这是人类的集体回忆或造型。我们可以大概列举一下：\n（1）前2800——2300金字塔（埃及）；\n（2）纪元四世纪——十四世纪，敦煌佛教艺术（中国）；\n（3）前17——前1世纪（《圣经·旧约》）；\n（4） 更古老的无法考索不断恢宏的两大印度史诗和奥义书；\n（5） 前11世纪——前6世纪的荷马两大史诗（希腊）还有《古兰经》和一些波斯的长诗汇集。\n这是人类之心和人类之手的最高成就，是人类的集体回忆或造型。他们超于母本和父本之上，甚至超出审美与创造之上。是伟大诗歌的宇宙性背景。\n与此同时，我还在想我的诗学中表达一种隐约的欣喜和预感：当代诗学中的元素倾向与艺术家集团行动集体创造的倾向和人类早期的集体回忆或造型相吻合——人类经历了个人巨匠的创造之手以后，是否又会在二十世纪以后重回集体创造？！\n+ 1987年6月——8月\n五、 朝　霞\n（今夜，我仿佛感到天堂也是黑暗而空虚）\n所有的人和所有书都指引我以幻象，没有人没有书给我以真理和真实。模仿的诗歌、象征的诗歌。《处罚东方、处罚诗歌问题言论集》——这是我一本诗集的名字。\n印度幻象和犹太幻想，以此为始原，根底和材料，为富有，长出有关“彻底”的直观：宗教、艺术——以及他们的建筑和经典。\n幻象——他，并不提高生活中的真理和真实（甚至也不启示），而只是提高生存的深度与生存的深刻，生存深渊的可能。\n从深渊里浮起一根黄昏的柱子，虚无之柱。根底之主子“虚无”闪烁生存之岸，包括涌流灌溉的欲望果园，填充以果实以马和花。这就是可能与幻象的诗。\n《在我的黄昏之国里果实与马基本平静下来了虽然仍有风暴滚动但这些都不会奉献真理和真实的光辉》，要不然干脆就从光辉退回一种经验，但在这里仍无真实可言。\n我要说，伟大而彻底的直观，关于“彻底”（或从无生有）的直观（宗教和艺术）也并不启示真理与真实。这种“彻底”的诗歌是叙说他自己行进在道上的唯一之神——却不是我们的真理和真实。\n提高人类生存的真理性和真实性——在人类生活中从来就没有提出过，也从来就不是可能的。人类生存和人类生活中的几项基本目标相距遥远，不能相互言说和交谈，更谈不上互相战斗和包含。甚至，应该说，恐怖也没有直接而真实地到达人生。仍然只是幻想之一种：诗歌之一种。\n人生的真理和真实性何在无人言说无人敢问。一切归于无言和缄默。\n当然，幻象的根基或底气是将人类生存与自然循环的元素轮回联结起来加以创造幻想。如基督复活与四季景色。可能爱琴海西风诸岛——希腊世界——或者说，盲人荷马，他仅仅停留在经验世界仅仅停留在经验的生存上，没有到达幻象的生存（这应归功于地中海水的清澈和岛屿岩石的坚硬），更没有到达真理与真实。那么，歌德，他的古典理想，也就是追求这种经验的生存（此时此刻）——此时此刻最为美好的经验生存。诗歌生存之“极”为自然或母亲，或黑夜。所以《浮士德》第一卷写了三场“夜”。浮士德哥哥之死、恶魔携带你的飞翔。在《浮士德》第二卷写了空虚中的母亲之国：\n我真不愿泄露崇高的秘密——\n女神庄严地君临寂静之间，\n周围没有空间，也没有时间，\n谈论她们，也会惹起麻烦，\n她们叫母亲！\n……\n无路！无人去过\n无法可去；这条路无人求过，\n无法可求。你准备去走一遭？\n无锁可开，也无门闩可移开，\n你将被一片寂寥四面包围。\n你可了解什么是荒芜和空虚？\n……\n而永远空虚的远处却渺渺茫茫\n你听不到自己的足音，\n你要坐下，却并无实物可寻。\n……\n凭你们的名义，母亲们，你们君临\n无涯之境，永远寂寥凄清，\n而又合群。活动的生命的形象，\n但并无生命，在你们四周彷徨。\n在光与假象中存在过的一切，\n在那里蠢动，他们想永远不灭。\n万能的女神，你们将他们派遣，\n派往白昼和黑夜的苍穹下面。\n而这仍旧是“真正的空虚”的边缘。因为还有母亲们。实际上，这“母亲”也是幻象，也是应诗人的召唤而来，就像但丁在流放中召唤一些曾经活过而今日死去的伟大幽灵。把这些“母亲和幽灵”扫去，把这些诗歌幻象扫去，我们便来到了真正的空虚。\n再如，陀斯妥耶夫斯基就贯穿着基督教的幻象，他是幻象诗人——幻象，正是歌德早就言中，“不是罪犯，就是善人，不是凶手就是白痴”，而尼采可能是沙漠和先知的幻象家——其实他们在伟大的幻象沙漠的边缘，基督世界的边缘。他赞同旧约中上帝的复仇。他仅仅更改了上帝名姓。并没有杀死上帝。而只杀死了一些懦弱的人类。他以攻为守、以刃为床，夺取幻象诗歌的地方。\n幻象是人生为我们的死亡惨灭的秋天保留的最后一个果实，除了失败，谁也不能触动它。人类经验与人类幻象的斗争，就是土地与沙漠与死亡逼近的斗争。幻象则真实地意味着虚无、自由与失败（——就像诗人的事业和王者的事业：诗歌）：但决不是死亡。死亡仍然是一种人类经验。死亡仍然是一种经验。我一直想写这么一首大型叙事诗：两大民族的代表诗人（也是王）代表各自民族以生命为代价进行诗歌竞赛，得胜的民族在歌上失败了，他的王（诗人）在竞赛中头颅落地。失败的民族的王（诗人）胜利了——整个民族惨灭了、灭绝了，只剩他一人，或者说仅仅剩下他的诗。这就是幻象，这仍然只是幻象。\n这就是像一根火柱立于黄昏之国，立于死亡灭绝的秋天，那火柱除了滚滚火光和火光的景象之外空无所有——这就是落日的景色，这就是众神的黄昏。这就是幻象。\n但是我……我为什么看见了朝霞\n为什么看见了真实的朝霞？！\n幻象它燃烧，落日它燃烧，燃烧吞噬的是它自身，就像沙漠只是包围沙漠自身——沙漠从未涉及到欲望的田园，欲望之国：土地。\n如果幻象等于死亡，每一次落日等于死亡（换句话说，沙漠等于死亡）。——那么一切人类生存的历史和生活的地平线将会自然中止、永远中止。这就是诗人们保存到最后的权利的最后的盾牌、阵地和举手投降的姿式（犹如耶稣）这就是为诗一辩的理由和道理。幻象的沙漠上诗人犹如短暂的雨季的景色语言，急促，绝望而其实空虚。拼命反击却不堪一击，不断胜利却在最后失败，倒在地上五窍流着血污而被收入黄昏之国，收入死亡的灭绝的秋天。沙漠缄默的王担着他的棺木行于道上。\n沙漠缄默的王担着他的棺木行于道上，看见了美丽无比的朝霞。\n应该说，生存犹如黄昏犹如沙漠的雨季一样短促、冲动而感性，滋养了幻象的诗歌，如果从伟大的幻象或伟大的集体回忆回到个体——就会退回到经验的诗歌：文艺复兴造型艺术和歌德一生。希腊在这颗星球上永远如岛屿一样在茫茫海水中代表个体与经验的诗歌。他与幻象世界（印度、犹太）的区别——犹如火焰与黄昏落日之火（光）的区别，如营寨之火与落日辉煌的区别。希腊代表了个体与经验的最高范例与最初结合。总有人从黄昏趋向于火焰，或曰：落日脚下到火焰顶端是他们的道路和旅程，是文艺复兴和歌德一生，他们这些巨匠和人类孤单的个体意识之手，经典之手，在茫茫黑夜来临之前，已经预兆般提前感受到夜晚的黑暗和空虚，于是逃遁于火焰，逃向火焰，飞向火焰的中心（经验与个体成就的外壳燃烧）以期自保。这也是人类抵抗死亡的本能之一。歌德是永远值得人们尊敬的，他目标明确，不屈不饶，坚持从黄昏逃向火焰。\n今夜，我仿佛感到天堂也是黑暗而空虚的。那些坐在天堂的人必然感到并向大地承认，我是一个沙漠里的指路人，我在沙漠里指引着大家，天堂是众人的事业，是众人没有意识到的事业。而大地是王者的事业。走过全部天堂和沙漠的人必是一个黑暗而空虚的王。存在和时间是我的头骨（我的头骨为仇敌持有的兵器）。而沙漠是那锻炼的万年之火。王者说：一万年太久。是这样黑暗而空虚的一万年。天堂的寒流滚滚而来。\n我，只能上升到幻象的天堂的寒冷，冬夜天空犹如优美凛冽而无上的王冠一顶，照亮了我们黑暗而污浊的血液，因此，在这种时刻尼采赞成歌德。“做地上的王者——这也是我和一切诗人的事业”。\n但我瞻望幻象和天堂那些坐在寒冷的天空华堂和大殿中漠然的人们。天堂是华美无上和寒冷的。而我们万物与众生存在的地方是不是藏有欢乐？\n“欢乐——即，我的血中也有天堂之血\n魂魄之血也有大地绿色的相互屠杀之血”\n血。他的意义超出了存在。天空上只有高寒的一万年却无火无蜜、无个体，只有集体抱在一起——那是已经死去但在幻象中化为永恒的集体。\n大地却是为了缺乏和遗憾而发现的一只神圣的杯子，血，事业和腥味之血，罪行之血，烈火焚烧而又猝然熄灭之血。\n国度，滚动在天空，掉下枪枝和蜜——\n却围着美丽夫人和少女燃烧\n仿佛是营火中心　漂泊的路\n+ 1987.10.17\n六、 沙　漠\n1．\n她假借一切的名义报复我——和我自己相遇在我自己的心中。犹若尘埃。女性那紫色恍惚若火焰的混乱——本世纪世纪病。对自然、文化和语言三“极”的报复、施虐，她同时充当了刽子手和受害人和刑具和惨绿的渗出的血。唯一的怪胎是艺术家（这是“人造人”式的艺术家计算机语言式的艺术家）背离了旷原和无边的黑暗。我们时代产生了艺术崇拜的幻象：自恋型人格。\n我们缺少成斗的盐、盛放盐的金斗或头颅、角、鹰。而肉一经自恋之路软化。甚至“伟大”也法通过“自然”或“文化”、“语言”化身为人，缺乏“伟大”化身为人的苍茫时刻——无边黑暗的时刻——盲目的时刻——因为大家都忙于“自恋和自虐”中。\n而现在，到处挥舞的不是火焰，大家远离了痛苦的石和痛苦的山，大家互相模仿、攻击，但并非真正地深入肺腑的诉说与对话，而是在闹市上，在节目里，大家随身携带着语言的狩猎人、狙击手和游牧民的面具。\n唯有阴森森的植物和性爱发自内心\n她们是“原始的母亲”之桶中逃出的部分。\n我则成长孕育于荒野的粗糙与黑暗。\n大野的寂静与黑暗。\n神话是时间的形式。生活是时间的肉体和内容。我坐在谷仓门前，我要探讨的是，在时间和生活中对神的掠夺是不是可能的？！\n大自然是不是像黄昏、殷红的晚霞一样突然冲进人类的生活——这就是诗歌（抒情诗）。那么，在什么时候，什么地方，人的浑浊和悲痛的生活冲进大自然，那就产生了悲剧和史诗（宏伟壮丽的火与雪）（景色和村落）；什么时刻，一个浑浊而悲痛创伤的生活携带着他的英雄冲入自然和景色，并应和着全部壮观而悲剧起伏的自然生活在一起——时间就会在“此世”出现并照亮周围和他世。\n时间有两种。有迷宫式的形式的时间：玄学的时间。也有生活着的悲剧时间。我们摇摆着生活在这两者之间并不能摆脱。也并不存在对话和携手的可能。前者时间是虚幻的、笼罩一切的形式。是自身、是上帝。后者时间是肉身的浑浊的悲剧创痛的、人们沉溺其中的、在世的、首先的是人，是上帝之子的悲剧时间，是化身和丑闻的时刻。是我们涉及存在之间的唯一世间时间——“在世”的时间。我们沉溺其中，并不指望自拔。\n2．猛犸的庆典（大纲）\na． 粘土\n黑色的　猛烈的　狂乱的　挑衅的　肉体\n——他与十万人马同归于尽\nb． 猛禽、野骆驼\n我从一本简易的自然教科书一字不改地抄录于下：\n鸟类的迁徙，通常一年两次，一次在春季一次在秋季。春季的迁徙大都是从南向北，由越冬地区飞向繁殖地区；秋季的迁徙，大都是从北向南，由繁殖地区飞向越冬地区。各种鸟类每年的迁徙是都是很少变动的。\n鸟类迁徙的方向，多半是南北纵行的。但是几乎没有一种鸟是从它的繁殖地区笔直飞往越冬地区的。候鸟迁飞的途径都是常年固定不变的，而且往往沿着一定的地势，如河流、海洋线或山脉等飞行。许多种鸟类，南迁和北徙，是经过同一条途径。\n鸟类迁飞的时候，常常集结成群。\n个体大的鸟类，如鹤和雁，经常排成“一”或“人”；\n个体小的鸟类，如家燕，组成稀疏的鸟群；\n猛禽类常常是一个一个的单独飞行，彼此保持一定的距离。\n绝大多数鸟类在夜间迁飞，猛禽大多在白天迁飞\n我加几句注解：哲学家和艺术家的区别。哲学家是抽象的个体、人本的逻辑自恋。而艺术家的“自恋”和人本泛及世界，泛及一切周围的景色和生灵。他们隐退为“奥秘”。——人性的可疑之处则引退为“秘密”——秘密引退为众神——真正的艺术家在“人类生活”之外展示了另一种“宇宙的生活”（生存）。人类生活不是“生存”的全部。“生存”还包括与人类生活相平行、相契合、相暗合、相暗示的别的生灵别的灵性的生活——甚至没有灵性但是物理有实体有法律的生活。所以说，生存是全部的生活：现实的生活和秘密的生活（如死者、灵魂、景色、大自然实体、风、元素、植物、动物、皿器）。这种“秘密的生活”是诗歌和诗学的主要暗道和隐晦的烛光。\nc．种族的阴影\n时间——化身为我——称之为人，语言，丑闻，有人说这个时辰，已经离开海平线几个时辰了。\nd. 秘密\n黑暗王国的秘密谈话\ne．“内在的空虚”\n——你是我的猎人\n形　　散开\n在猎人之家　物理　散开　　　　在天空飞舞\n黄金散开\nf．陌生人\n——斧子或刀条形村落停尸房（我无魂而驻此为肉）死亡弓箭手手握生活的箭杆。而死亡被体验到时才成为毁灭，大地荒芜。命运为生活命名。\ng. 北方的缄默者\n3.\n作为土地的贵族何日交出他们晦暗无光的酒柜？\n酒柜又被哪些暴徒劈开点成火把？\n从贵族移交给平民的时刻何日到来？是否已经到来？\n贵族是血、躁动、杰作、宗教、预感、罪恶感、沉闷、忏悔、诉说不休、乞求被钉上刑柱；\n平民是革命、现在、行动、号角、金光闪闪的分粮的斗、暴徒、火把、旗帜。\n贵族会被这个革命[革命是平民的现代式——意大利——伦敦（经济）——巴黎（政治）——德意志（思想）——彼得堡（社会）——汉（文化）]席卷和碾压\n贵族只有求助于过去，求助于阴暗沉重的一“极”：土地。\n而平民将使一切简单：用革命。\n（毛泽东哪一半是哪一半？！）\n4．老女奴被囚禁在语言的监牢中\n活下去——老女奴——即使在语言残酷的监牢中你也要活下去。因为包括牢房在内的你的大地必将因你而得救。\n诸界之王皆归顺于囚禁于语言的老母——老女奴。老女奴虽已被诸界之王的隐匿的暴力折磨得遍体鳞伤\n羊角长在一张纯洁的羊皮子上\n老女奴同时又像一个女婴　无形　而暗哑\n老女奴，囚禁在日常语言中\n囚禁在一首被遗忘的诗中\n+ 1987.12.10\n七、 曙光之一\n下面是87.11.15夜录的太阳地狱篇草稿的标题。上帝的枪。血色月亮的银色号角。诗歌始皇帝。蓝种子——生命。在沙漠上只能养活语言。热带、沙漠和西藏像三只悲伤的人类之胃在飞翔。赤道。作用。固体在高温下是缓慢流动的。高原。我坐在该岛上，向你们谈论诗歌。穹隆。地幔的头。从南方来到我怀中。性命。我独自一人穿越四大元素。终于被剥夺了。回忆之女的缠绳。伟大的魂和他的儿子之间的战斗与屠杀。诉说。受尽凌辱之后能够存在再生。秋天的火之车。烈。自恋型患者。上帝的家园。枪案。极。完全的责任或血中生长的石头。真理带在路上弃在路上。自由本身。沙漠刀口处。\n与仇恨相遇在上帝的山上。光明的在场。大和爱：伟大抱在一起，爱就是原始的线索抱在一起。给万物一个名字。刀和斧。遭遇。当火对我说，当家对我说。镣铐的颂歌。道路。太阳的末日。低纬度的天空。近代革命。奔波。灰烬在起舞。“通过语言是绝对不可能的”。神自身。波斯。光明和黑暗各自的君王。美。火兽之外……之外……之外。河畔的妇女。家兮。黄昏变形为夜。\n你并非黑夜之子。断送。革命札记。火把节皇后。毛泽东。飞行。沙漠，失败者的天堂。奴隶。燎。王国内血腥的土质。大火。蒙古！蒙古！极端的诗歌。我要问一问，谁在没落的土中作王。主。明。诗歌与毒药。早早结束生活。现在无一幸免于难。夜色。红卫兵组诗。皈依存在。阴郁的战斗史。唯一鸣响的钟啊！。一切都在诉说中相互混同。孤寂的红色僧侣。黑暗的门槛。真理之神和黄昏之神殊死的战争。沙漠和革命卫队。作为身在其中的证人。王者以黑夜为本。真实和真理。兵。\n处罚东方诗歌言论集。欲望果园。今夜，我仿佛感到天堂也是黑暗和空虚的。全部照片（蜜）蜜的脸。食、七月、鸣（自然界基本常数的变化问题）。自在。歌唱和羊毛——对法官和刑场的逃遁。全归他。七大贤。古老的黑夜。光。五世纪。为地狱之王奏响琴声。炎炎。诸神裸舞。内在音乐的陪伴：劳动。地狱的女儿不断自我产生。四种地狱的草稿与片断。只是因为我还没有陷入更大的混乱。毒药与地下人。内心。骇人听闻的果园。从断头台到地狱之门，漫长饿回忆的粘土层：表象与幻觉的回声。太阳国——大东方的联邦。人类界线之外（自然和地狱）。圣火与命令。统治者啊。附魂状态。乌鸦与大雁。挽救和遭遇。电影上的驼子。世界和地狱的狩猎人。猎冰人——宇宙猎冰人。\n+ （以上草稿大部被毁。标题亦重删）\n八、 曙光之二：电影上的驼子\n这是我刚做完的一个梦。把它变成语言就已经有些失真。这是真正的梦幻和内在黑暗。一个老人背着驼子其实是瘫子——可做梦的心里老是念叨驼子、驼子——到一个镇上去看妹妹——但妹妹已在水里死去——驼子参加一场足球赛——可双腿不能动弹——只能在地上，尘土里、泥泞里坐着——用屁股往左右移动、痛苦或快乐叫着——老人流下屈辱的泪水——老人重又背起他（在梦中似乎是我背起这个瘫子他的肉紧缠在我身上）——回到镇上——一个打着黑伞的人遮住我——驼子似乎站立了瞬间，并被人牵着向前跑去——这是不可能的，我心里想——但驼子在前方已被那些仇恨或娱乐的人们高高抬起——摔成八瓣——脑浆迸流。\n+ 1987.11.4凌晨三点\n---\n 注：以上四段诗歌均引自钱春编译《浮士德》第二部第一幕第二场。前三段为梅非斯特所说，第四段为浮士德所说。第二段最后一行“荒芜和空虚”，原译文为“荒凉和寂寥”。"},{"id":"long/传说","title":"传说","type":"long","year":"1984","body":"——献给中国大地上为史诗而努力的人们\n一、老人们\n 白日落西海　——李白\n黄昏，盆地漏出的箫声\n在老人的衣袂上\n寻找一块岸\n向你告别\n我们是残剩下的\n是从白天挑选出的\n为了证明夜晚确实存在\n而聚集着\n白花和松叶纷纷搭在胳膊上\n再喝一口水\n脚下紫色的野草就要长起\n在我们的脖子间温驯地长起\n群山滑过我们的额头\n一条陈旧的山岗\n深不可测\n传说有一次传说我们很快就会回来\n脚趾死死抠住红泥\n头抵着树林\n为了在秋天和冬天让人回忆\n为了女儿的暗喜\n为了黎明寂寞而痛楚\n那么多夜晚被纳入我们的心\n我不需要暗绿的牙齿\n我不是月亮\n我不在草原上独吞狼群\n老人的叫声\n弥漫原野\n活着的时候\n我长着一头含蓄的头发\n烟叶是干旱\n月光是水\n轮流度过漫漫长夜\n村庄啊，我悲欢离合的小河\n现在我要睡了，睡了\n把你们的墓地和膝盖给我\n那些喂养我的粘土\n在我的脸上开满了花朵\n再一次向你告别\n发现那么多布满原野的小斑\n秦岭上的大风和茅草\n趴在老人的脊背上\n我终于没能弄清\n肉体是一个迷\n向你告别\n没有一只鸟划破坟村的波浪\n没有一场舞蹈能完成顿悟\n太阳总不肯原谅我们\n日子总不肯原谅我们\n墙壁赶在复活之前解释一切\n中国的负重的牛\n就这样留下记忆\n向你告别\n到一个背风的地方\n去和沉默者交谈\n请你把手伸进我的眼睛里\n摸出青铜和小麦\n兵马俑说出很久以前的密语\n悔恨的手指将逐渐停留\n在老人们死去之后\n在孩子们幸福之前\n仅仅剩下我一只头颅，劳动和流泪\n支撑着\n而阳光和雨水在西斜中象许多晾在田野上的衣裳\n被无数人穿过\n只有我依旧\n向你告别\n我在沙里\n为自己和未来的昆虫寻找文字\n寻找另一种可以飞翔的食物\n而黄土，黄土奋力埋尽了我们，长河落日\n把你们的手伸给我\n后来张开的嘴\n用你们乌黑的种子填入\n谷仓立在田野上\n不需要抬头\n手伸出就结了叶子\n甚至不需要告别\n不需要埋葬\n老人啊，你们依然活着\n要继续活下去\n一枝总要落下的花\n向下扎\n两枝就会延伸为根\n二、民间歌谣\n 行到水穷处，坐看云起时。 ——王维\n平原上的植物是三尺长的传说\n果实滚到\n大喜大悲\n那秦腔，那唢呐\n象谷地里乍起的风\n想起了从前……\n　　人间的道理\n　　父母的道理\n使我们无端地想哭\n月亮与我们空洞地神交\n太阳长久地熏黑额壁\n女人和孩子伸出的手\n都是歌谣，民间歌谣啊\n十支难忍的神箭\n在袖口下\n平静地长成\n没有一位牧人不在夜晚瘦成孤单的树\n没有一支解脱的歌\n聚集在木头上的人们\n突然撤向大平原\n象谷地里　　乍起的风\n茑和女萝\n平静地中断情爱\n马兰花没有在婚礼上实现\n歌手再次离开我们\n孤独的成为\n人间最深处\n秘密的饮者，幸福的饮者\n穷尽了一切\n聚集在笛孔上的人群\n突然撤向大平原\n稻米之炊\n忍住我的泪水\n秦腔啊，你是唯一一只哺育我的乳头\n秦腔啊是我的血缘　　哭\n哭从来都是直接的\n只只唢呐\n在雪地上久别未归\n被当成紫红的果实\n在牛车与亲人中\n悄悄传进城里\n我是千根火脉\n我是一堆陶工\n梦见黑杯、牧草、庙宇\n梦见红酋和精角的公牛\n　　千年万年\n是我为你们无休止地梦见\n　　黄水\n破门而入\n编钟，闪过密林的船桅\n又一次\n我把众人撞沉在永恒之河中\n我们倒向炕头\n老奶奶那只悠长的歌谣\n扯起来了\n昊天啊，黄鸟啊，谷乔啊\n扯起来了\n泡在古老的油里\n根是一盏最黑最明的灯\n我坐着\n坐在自己简朴的愿望里\n喝水的动作\n唱歌的动作\n在移动和传播中逐渐神圣\n成为永不叙说的业绩\n穷人轮流替我哺养儿女\n石匠们沿着河岸\n立起洞窟\n一尊尊幸福的真身哪\n我们同住在民间的天空下\n歌谣的天空下\n三、平常人诞生的故乡\n 天长地久 ——老子\n隐隐约约出现了平常人诞生的故乡\n北方的七座山上\n有我们的墓画和自尊心\n农业只有胜利\n战争只有失败\n为了认识\n为了和陌生人跳舞\n隐隐约约出现了平常人诞生的故乡\n啊，城\n南岸的那些城\n饥饿，日蚀，异人\n一次次把你的面孔照亮\n化石一次次把你掩埋\n你在自己的手掌上\n城门上\n刻满一对双生子的故事\n隐隐约约出现了平常人诞生的故乡\n小羊一只又一只\n在你巨大的覆盖下长眠\n夜晚无可挽回的清澈\n荆棘反复使我迷失方向\n乌鸦再没有飞去\n太阳再没有飞去\n一个静止的手势\n在古老的房子内搁浅\n啊，我们属于秋天，秋天\n只有走向一场严冬\n才能康复\n隐隐约约出现了平常人诞生的故乡\n我想起在乡下和母亲一起过着的日子\n野菜是第一阵春天的颤抖\n踏着碎瓷\n人们走向越来越坦然的谈话\n兄弟们在我来临的道路上成婚\n一麻布口袋种子\n抬到了墙脚\n望望西边\n森林是雨水的演奏者\n太阳是高大的民间老人\n隐隐约约出现了平常人的故乡\n空谷里\n一匹响鼻的白驹\n暂时还没有被群山承认\n有人骑鹤奔野山林而去\n只有小小的堤坝\n在门前拦住\n清澈的目光\n在头顶上变成浮云飘荡\n让人们含泪思念\n抚掌观看\n隐隐约约出现了平常人诞生的故乡\n那是叔叔和弟弟的故乡\n是妻子和妹妹的故乡\n土地折磨着一些黑头发的孤岛\n扑不起来\n大雁栖处\n草籽粘血\n高岸为谷，深谷为陵\n四匹骆驼\n在沙漠中\n苦苦支撑着四个方向\n他们死死不肯原谅我们\n上路去，上路去\n群峰葬着温暖的雨云\n隐隐约约出现了平常人诞生的故乡\n四、沉思的中国门\n 静而圣，动而王。——庄子\n青麒麟放出白光\n三个夜晚放出白光\n梧桐栖凤\n今天生出三只连体动物\n　　在天之翅\n　　在水之灵\n　　在地之根\n神思，沉思，神思\n因此我陷入更深的东方\n兄弟们依次狰狞或慈祥\n一只红鞋\n给菩萨穿上\n合掌\n有一道穿透石英的强光\n她安祥的虹彩\n自然之莲\n土地，句子，遍地的生命\n和苦难\n赶着我们\n走向云朵和南方的沉默\n井壁闪过寒光的宝塔\n软体的生命\n美丽的爬行\n盛夏中原就这么过了\n没有任何冒险\n庄稼比汉唐陷入更深的沉思\n不知是谁\n把我们命名为淡忘的人\n我们却把他永久地挂在心上\n在困苦中\n和困苦保持一段距离\n我们沉思\n我们始终用头发抓紧水分和泥\n一个想法就是一个肉胎\n没有更多的民间故事\n远方的城塌了\n我们就把儿子们送来\n然后沿着运河拉纤回去\n载舟覆舟\n他们说\n我们在心上铸造了铜鼎\n我们造成了一次永久的失误\n象是在微笑时分\n墙\n挡住无数的文字和昆虫\n灯和泥浆\n一直在渴望澄清\n他从印度背来经书\n九层天空下\n大佛泥胎的手\n突然穿过冬天\n在晨光登临的小径上漫步\n忏悔\n出其不意地惊醒众人\n也埋葬了众人\n中国人的沉思是另一扇门\n父亲身边走着做梦的小庄子\n窗口和野鹤\n是天空的两个守门人\n中国人不习惯灯火\n夜晚我用呼吸\n点燃星辰\n中国的山上没有矿苗\n只有诗僧和一泓又一泓的清泉\n北方的木屋外\n只有松树和梅\n人们在沙地上互相问好\n在种植时\n按响断碑流星\n和过去的人们打一个照面\n最后在河面上\n留下笔墨\n一只只太史公的黑色鱼游动着\n啊，记住，未来请记住\n排天的浊浪是我们唯一的根基\n啊，沉思，神思\n山川悠悠\n道长长\n云远远\n高原滑向边疆\n如我明澈的爱人\n在歌唱\n其实是沉默\n沉默打在嘴唇上\n明年长出更多的沉默\n你们抚摸自己头颅的手为什么要抬得那么高？\n你们的灶火为什么总是烧得那么热？\n粮食为什么会流泪？河流为什么是脚印？\n屋梁为什么没有架起？凝视为什么永恒？\n五、复活之一：河水初次带来的孩子\n 有客有客 ——《周颂》\n我们穿着种子的衣裳到处流浪\n我们没有找到可以依附的三角洲\n树和冥想的孩子\n分别固定在河流的两边\n他们没有拥抱\n没有产生带血的嘴唇\n他们不去碰道路\n夜行者\n走过遍地遗弃的爱情\n手抚碑文，愤怒，平静，脑袋里满是水的声音\n一条黑色的男性\n曾经做过许诺\n人是圣地的树\n充满最初的啁啾\n一些红色的肢体在暴雨中贫困地落下\n一盏灯在暗洞里掏出自己的内脏\n一头故乡神秘的白牛\n消失在原野的尽头\n我们将找到可以依附的三角洲\n踏在绿岸上的少女\n洗完了衣服，割完了麦子\n走进芦花丛\n今夜\n有三个老人\n同时观看北斗\n第六天是节日\n第六天是爱情之日\n母亲生我在乡下的沟地里\n黑惨惨的泥土\n一面瞅着我的来临\n一面忧伤地想起从前的人们\n那些生活在黑暗的岸上的人们\n而以后是一次又一次血孕\n水中之舞，红鳞和鳃，生命的神游\n水天鹅在湖沼上平静地注视\n口诀\n扯着暗淡的帆\n指引着这些河上的摇篮\n这些绛红的陌生而健康的婴儿\n达到柔曼的胸，吻响的额，接触的牙齿\n眼睛的风\n忧伤又一次到达\n陆地上的琴鸟，又一次到达\n我只能和他们一起\n又一次回到黄昏\n经受整个夜晚\n扑倒在猩红阴郁的泥地上\n这毕竟是唯一的结果\n第一次传说强大得使我们在早晨沉沉睡去\n第二次传说将迫使我们在夜晚早早醒来\n这是些闯进的宿鸟\n这是些永生的黑家伙\n老人们摆开双手\n想起\n自己原来是居住在时间和白云下\n淡忘的一笑\n更远处是母亲枯干的手\n和几千年的孕\n早晨在毫无准备时出现\n那就让我们来吧\n行道迟迟\n载渴载饥\n啸歌伤怀\n载飞载鸣\n六、复活之二：黑色的复活\n 大鸟何鸣 ——《天问》\n1.\n大黑光不是在白天诞生\n也不是一堆堆死去的蜡烛头\n他们哑笑着熄灭\n熄灭有什么不好\n2.\n我们收起\n照亮那相互面孔的\n那沉重的光\n呼呼行帆的光，关住心门的光\n绳索垂下来\n群山积淀着\n草原从远方的缺口涌入\n有一只嘶哑的喉咙\n在野地里狂歌\n在棉花惨白的笑容里\n我遍地爬起\n让我们来一个约定\n不要问\n永不要问\n我们的来历和我们的忧伤\n不要问那第二次复活\n加入我要烧毁一切呢\n原谅我，那歌声，那歌声\n让我们来一个约定\n3.\n春天带来无尽的睡眠\n胳膊上晒着潮湿的土地\n烧毁云朵\n烧毁\n我们在黑雨中静静长起\n一块巨大的面孔\n用雷做成果树\n我在莽林中奔跑\n撞死无数野兽\n失去了双腿\n昂头面对月亮\n男人躺在大地上\n也是一批暗暗的语言\n我们走了许多路\n才这样沉沉睡去\n在我们熟睡之后\n女人们\n拥到田地里\n捋着抽浆的粮食\n快活得浑身发抖\n　　东方之河\n是流泪的母马\n荒野冷漠的头颅\n不断被亲吻和打湿\n4.\n戳有金属的脊背\n扑倒在丛林中\n树\n筑地而起\n死亡，流浪，爱情\n我有三次受难的光辉\n月亮的脚印\n在湖面上\n呕吐出神秘的黑帆\n呕吐出大部分生命\n石块飞舞，石块飞舞\n时间终于落地\n山头的石墙上\n高高挂起三堆火\n钟声中，孩子们确实存在烙印\n北方仓库，墓上有\n几只默默的稻粒\n石鸟刻着歌曲\n墓门有棘\n我和斧头坐在今天夜里\n日子来了\n人的声音\n先由植物发出\n帆从耳畔擦过\n海跟踪而来\n大陆注视着自身的暗影\n注视着\n火\n5.\n熔岩的歌声到达果园\n淹没着\n众多的匠人\n用火堆做刀\n在夜晚的郊外割草\n其他的流浪者\n像眼睛一样跳开\n只有胆小的野花\n钻进自己的肚脐\n火啊，你是穷人的孩子\n穷是一种童贞\n大黑光啊，粗壮的少女\n为何不露出笑容\n代表死亡也代表新生\n有钟声阔笑如岸\n再不会在人群中平静地活着\n火\n我不是要苦苦诉说\n不是在青春的峡谷中\n做出叛徒的姿势\n我是心头难受的火啊\n是野马群最后的微笑声声\n取下面具\n我们都是红色线条\n兄弟们指着彼此：\n诞生\n诞生多么美好\n谁能说出\n火不比我们更快地到达圆周之岸\n谁能说出黑腥的血是我们又一次不祥的开放\n只有黑土承认\n承认他有唯一的名字，受难的名字\n秘密的名字\n黑土就是我们自己\n走完五千年的浅水\n空地上\n黑色的人正在燃烧\n火\n我继承黄土\n我咽下黑灰\n我吐出玉米\n有火\n屈原就能遮住月亮\n　　　　　　柴堆下叫嚣的\n　　　 火　火　火\n只有灰，只有火，只有灰\n一曾母亲\n一层灰\n一层火。\n---\n+ 1984.12"},{"id":"short/1986/云朵","title":"云朵","type":"short","year":"1986","body":"西藏村庄\n神秘的村庄\n忧伤的村庄\n你躺倒在路上\n你不姓李也不姓王\n你嫁给的男人\n脾气怎么样\n神秘的村庄\n忧伤的村庄\n你生了几个儿子\n有哪些闺女已嫁到远方\n神秘的村庄\n忧伤的村庄\n当经幡吹响\n你多像无人居住的村庄\n当经幡五颜六色如我受伤的头发迎风飘扬\n你多像无人居住的村庄\n当藏族老乡亲在屋顶下酣睡\n你多像无人居住的村庄\n像周围的土墙画满慈祥的佛像\n你多像无人居住的村庄\n---\n● 1986.12.15"},{"id":"short/1989/你和桃花","title":"你和桃花","type":"short","year":"1989","body":"旷野上头发在十分疲倦地飘动\n像太阳飞过花园时留下的阳光\n温暖而又有些冰凉的桃花\n红色堆积的叛乱的脑髓\n部落的桃花，水的桃花，美丽的女奴隶啊\n你的头发在十分疲倦地飘动\n你脱下像灯火一样的裙子，内部空空\n一年又一年，埋在落脚生根的地方\n刀在山顶上呼喊“波浪”\n你就是桃花，层层的波浪\n我就是波浪和灯光中的刀\n旷野上　一把刀的头发像灯光明亮\n刀的头发在十分疲倦地飘动\n那就是桃花，我们在愤怒的河谷滋生的欲望\n围着夕阳下建设简陋的家乡\n桃花，像石头从血中生长\n一个火红的烧毁天空的座位\n坐着一千个美丽的女奴，坐着一千个你\n1987草稿\n---\n● 1989.3.14改"},{"id":"essay/寂静但是水水原代后记","title":"寂静（《但是水、水》原代后记）","type":"essay","year":"unknown","body":"那个人她叫母亲，她疼痛地生下了我。她生下我是有目的的。可能她很早以前就梦见了我。我是她的第一个儿子。另一个人……她给我带来了更多的孤独。我以前在大河上旅行时梦见过她和她的美丽。我的痛苦也就是我的幸福。又深又长。比生命更深更长的是水。水的寂静。\n门前总是有水。开始我只是以为自己是追求一种素朴和一块实体。我可以在其中赤足歌唱。后来我觉得：大地如水，是包含的。全身充满大的感激和大的喜悦。土地是一种总体关系，魔力四溢，相互唤起，草木人兽并同苦难，无不深情，无不美丽。它像女人的身体，像水一样不可思议。因为它能包含，它能生产。而生产不像博尔赫斯。\n所认为的那样，是循环而污秽的。它是一种血洗的痛快，是一种慷慨和诗人的节日。生命与文明一样，一为延寿，一为传种。就像北方的玄武是龟蛇合体。古人真想得好，龟蛇都是水兽呀！\n但是，河流本身，和男人的本质一样，是孤独而寂寞的，需要上天入地、需要祈水、需要打井、需要诗人生命的抒发……水呀……水\n高原上，一位又黑又瘦的老女人坐在高高的梁上，望着下面黄昏中的村子。\n女性的全面覆盖……就是水。\n大地和生命并不仅仅是体积，而且是对自身无限的由一到多的包含。包含就是生命，洞的生命……云冈石窟中就通过重复、复调、对位、变调、反向流动和相互装饰形成了一种生命力的包含……摩尔为什么要在结实的体积上打洞呢……女人就是寂静又包含的洞呀……生命、水……人处于自身形象的不同源流不同版本之中，被它淹没。人的呼吸在自然中，也就在自己身上得到神秘的回声。东方佛的真理不是新鲜而痛苦的征服，而是一种对话，一种人与万物的永恒的包容与交流。人是自然的肢体。或许，或许菩提树下我偶有所得。但是水、水，整座山谷被它充满、洗涤。自然是巨大的。它母性的身体不会无声无息。但它寂静。寂静是因为它不愿诉说。有什么可以要诉说的，你抬头一看……天空……土地……如不动又不祥的水……有什么需要诉说呢？但我还是要说，写了这《水》，因为你的身体立在地上、坐于河畔，也是美丽的，浸透更多的苦难，虽不如自然巨大、寂静。我想唱唱反调。对男子精神的追求唱唱反调。男子精神只是寂静的大地的一部分。我只把它纳入本诗第二部分。我追求的是水……也是大地……母性的寂静和包含。东方属阴。\n这一次，我以水维系了鱼、女性和诗人的生命，把它们汇入自己生生灭灭的命运中，作出自己的抗争。\n这一次，我想借水之波，契入寂静而内含的东方精神，同时随河流曲折前行，寻找自己的形式：其中不同支流穿串其间不同种子互相谈话，女人们开放如花，使孤独的男人雄辩，奔跑进爱情。\n可能诗仍然是尘世。我依然要为善良的生活的灵魂唱歌，这些灵魂不需要地狱。太阳照亮了成家立业的人们。即使离去了，这一次生命和爱依然是我们温暖的时光。到善良的人们中用心去生活一次吧。那浸泡人体的水，即使是洪水也是温暖的，伴随着我们的水罐和脚。诗是情感的，不是智力的。我们当然不会拜倒在一只哑哑的太阳下，也不会乞求于自己严密无情的智力。我们在地上找水，建设家园，流浪，拖儿带女。我是说，我们不屑于在永恒面前停留。实体是有的，仍是这活命的土地与水！我们寻求互相庇护的灵魂。我仍然要在温暖的尘世建造自己就像建造一座房子。我是一个拖儿带女的东方人，手提水罐如诗稿，那么，永恒于我，又有什么价值。\n---\n+ 1985.8雨夜\n+ 豪·路·博尔赫斯（1899—1986），阿根廷诗人、小说家。"},{"id":"short/1983/七月不远","title":"七月不远","type":"short","year":"1983","body":"——给青海湖，请熄灭我的爱情\n七月不远\n性别的诞生不远\n爱情不远——马鼻子下\n湖泊含盐\n因此青海不远\n湖畔一捆捆蜂箱\n使我显得凄凄迷人：\n青草开满鲜花\n青海湖上\n我的狐独如天堂的马匹\n（因此，天堂的马匹不远）\n我就是那个情种：诗中吟唱的野花\n天堂的马肚子里唯一含毒的野花\n（青海湖，请熄灭我的爱情！）\n野花青梗不远，医箱内古老姓氏不远\n（其他的浪子，治好了疾病\n已回原籍，我这就想去见你们）\n因此跋水涉水死亡不远\n骨骼挂遍我身体\n如同蓝色水上的树枝\n啊，青海湖，暮色苍茫的水面\n一切如在眼前！\n只有五月生命的鸟群早已飞去\n只有饮我宝石的头一只鸟早已飞去\n只剩下青海湖，这宝石的尸体\n暮色苍茫的水面\n---\n● 1986"},{"id":"long/但是水水","title":"但是水、水","type":"long","year":"1984","body":"翻动诗经\n我手指如刀\n一下一下\n砍伤我自己\n卡内克这样对他说：\n“雨下得很大，还得下一场；因为这是贾亚雨。贾亚不是本地人，而是东方人。”\n （埃尔米罗·阿夫雷乌·戈麦斯）\n第一篇　遗址（三幕诗剧）\n第一幕\n（背景是完全干涸的大河，四位老人像树根一样坐着）\n　　　　　　诗　人\n汗水浸湿了我的手……我的手\n浸湿了他们的额\n他们瘦黑的脸、胳膊\n他们泥污的衣裳\n他们曾经繁殖的大腿\n等待他们的是一个夏季……没有风\n我的手仿佛握住了他们\n就像握住一截又一截木头\n　　　　　秦俑的声音\n但我早已到达，在悲惨的船歌中\n航行，我到达了。\n　　　　　　诗　人\n他们的汗水又更多地溢下来\n炎热的夜晚歌手如云……令人费解\n他们脱下布鞋，把脚浸进假想的河水\n他们受摩头顶，若有所思\n他们从早到晚就这样坐着\n他们黝黑的肋条骨在河岸的黄昏中一闪一闪地放着光\n他们撩着假想的河水互相擦洗着身子\n　　　　　秦俑的声音\n但我早已到达。月亮之中\n前后的事情一样。前后的声音一样\n　　　　　　诗　人\n不一样。声音\n不一样\n先是孤独的牧羊人的声音\n嘴唇干裂的声音\n接着是秦岭风雷声\n接着是祁连山的风雪声\n……沉闷的船的腔体的声音\n……盾牌上的雨水声流回声\n……流萤撞夜的声音接响的声音\n雨打人类的声音。玉米地和荆棘地的枪声\n雪花和乳房的声音。虫子的声音。玉米叶子的声音\n　　　　　秦俑的声音\n但我早已到达。干旱如土\n一直埋到脖颈……一直埋到头顶\n　　　　　　诗　人\n他们还在流汗……生命的痛苦\n还在继续。窑洞里仍有女人的呻吟\n月亮之中传出一只孤独的野兽的叫唤\n那是太阳的叫唤\n但是没有声音\n痛苦就在于没有声音……没有声音\n　　　　　秦俑的声音\n我就是没有声音地被埋下……多少年了\n母羊仍然没来。\n　　　　　　诗　人\n母羊？\n　　　　　秦俑的声音\n就是水呀。就是那些老人的眼神\n水是唯一的\n没有声音的痛苦都是一样的\n就像八月只有一种清风\n痛苦流向四面八方\n只不过又回到了早就居住过的地方。我到达了\n只只头颅土地之下如水相倾……不是泪水\n更不是解冻时的泪水\n……又绿了\n树的手\n我只好在骊山下越埋越深\n　　　　　诗　人（仍是疑惑）\n母羊？\n　　　　　秦俑的声音\n对，母羊。再也不会来了\n死亡如陶。完满的存放\n天空是我部分的肢体和梦\n天空穿上了死者的衣裳\n再也不会来了——母羊\n埋葬了河流的许多陌生人来来往往\n再也不会来了，母羊\n多么使人安心的埋葬呀，一切都由青草代表\n黄花前后爱情一样\n落入田野\n诚实的太阳猫腰走过许多野兽的脊背\n我们的姓氏像灰尘一样落入田野\n　　　　　　诗　人\n可是有了星辰。星和火星。北方虚星\n有了四个方向，脚就得让自己\n迈开呀……\n有了树林在我肉体周围\n肉体就得抖动呀\n而且还有血液……比骨头更古老的血液\n　　　　　秦俑的声音\n也许你是对的\n但是骨头，白色的花。纤弱的花\n花儿苍白而安详\n多么使人安心的埋葬呀！\n一种白色的动物沉睡在土层中，或许那是\n亘古不变\n惨白，那是因为我们生活过\n而且相爱，写过歌颂平原的诗篇又倒在平原上\n情人般缄默\n那是因为它就叫骨头\n不分昼夜\n听见死去的河流如鸟飞离\n头顶。母羊，再也不会来了\n　　　　　　诗　人\n但是会有青草\n有鸟粪……还有爱人的乳房……还有歌唱的木头\n——手指、大腿、嘴唇\n……还有亮如灿星的美人、有下山的太阳\n有野兽花朵，有诗人……有棺材板摇篮布\n有盲人有先知……有望海的女人\n还有第一天\n第二天和第三天\n第四天有人梦见了我的儿子……妻子果然怀孕\n……还有水井\n至于母羊，我会选一个日子\n牵它而来，望东而去\n高原两边分开……\n第二幕\n　　（背景很深很远。南方的大河边。采药的群巫在周围险峰上时隐时现。传来歌声的时候正是中午。）\n领：红色的渔舟子\n　　响起在中午\n　　响起在中午的是太阳\n合：太阳\n领：白色的鱼身子\n　　高悬在晚上\n　　高悬在晚上的是月亮\n合：月亮\n领：屈子呀\n　　汨罗汨罗的藻草缠身哪\n　　屈子呀\n合：一个男人。\n领：他轻轻走上岸去\n　　一身白衣裳呀\n合：一个男人！\n领：轻轻扣舷，他出现哪\n　　水上水下，他出现哪\n合：一个男人，一个男人！\n领：鱼哭于前哟鱼哭于后噢龙护于尾\n合：一个男人！（停顿，又猛烈爆发）\n　　一个男人！\n第三幕\n　　（灯光大亮。诗人像华表一样立着，侧身，独白。老人们似石匠在打井，仍如树根。诗人手牵母羊，背景中似有雨水声，时断时续）\n我从荒野里回来，从所有粗糙的手指上回来，从女人的腹中哭着回来，从我的遗址积灰中回来就像从心中回来，手牵母羊回来，眼睛合上如菩提之叶，我从荒野里回来。宝塔证明，城里的水管证明，我不想唱歌\n我没有带来种子，没有带来泥土、牛和犁，没有带来光和第一日之火。没有带来文字。我从荒野里回来，我只想着一件事：水，水……第三日之水\n我就是一潭高大的水，立在这里，立着这里。\n我的衣服如蛇凸起，人们说：莲花开了。\n是的，莲花开了。当然莲花还没开时我就被众人搂在怀里……从歌曲里\n从那些不动声色的石匠手上回来。我想了又想：\n一切都会平安。我从荒野里回来，我只在夜里重复东方的事情\n做这些简单的事。需要雨水\n不能多也不能少\n需要月亮和身体，需要理解，也需要孤独\n我在晚上想起妻子，想起在包谷地刨土的儿女\n想了又想。在东方，诞生、滋润和抚养是唯一的事情。\n石匠们的掌像嘴唇。\n土地上\n诗人\n　　喃喃自语\n抽打的雪花溢于河岸。河流改道复在。\n野花如何漂走了情人\n雨水和诗人送她回来。\n我也从荒野里回来，没有带来种子，没有带来阳光\n我在夜里想了又想\n期待倾盆大雨，期待女人生下儿子\n诞生了就不会消失，我从荒野里回来，血液比骨头更长久\n虽然不开花，我比时间\n还长久……我的身上有龙\n落入荒野肢体愈加丰满。我从雨年回来，或者\n从干旱的荒野里回来\n只记得歌中唱到：\n石匠们手像嘴唇。\n　　（诗人踉跄着走下。老人像儿童一样跃入夕光。远远传来婴儿的啼哭声。雨水声像神乐充满最后的台面和幕布上。观众的面孔像酒杯，微微摇晃。）\n第二篇　鱼生人\n水……洪水前后\n1.洪水\n大雨浇灭太阳\n外逃的船只\n如口禁闭\n两人默默守火\n没有风儿吹过脑袋\n黄钟一样向后仰着\n没有声音\n一枝长木\n横陈于河湾上\n亲人们三声两声\n死去之前\n远方的痛苦呼唤鸟喙\n啄痛肌肤\n黄土下沉\n人烟聚水而卧\n黄土水中望鱼\n下雨也是三年五载\n隔着水\n一生中脑袋摆鱼、摆鱼\n并不响\n传来逃亡的消息、远远\n又寂寞鱼儿如我\n仿佛人间离我而去\n仿佛人间距离我一生\n寄托我一生\n鱼……　……鱼\n人的叫唤从鱼口吐出\n大雨浇灭太阳\n众人散失四方，探进水中\n黑色并不幽暗\n白色并不贞洁\n红色并不燃烧\n树林\n假假地流过\n吃尽浊泥的人\n把一切\n挡在面孔外面\n沉了太阳，沉了灰烬\n默默的水一流万里\n转回故乡之前\n流走了一些东西\n我们怅然若失\n另一些洪水之夜\n我们似有所得\n女人和我\n寂寞地说着。\n种子搁在床头柜上\n……水骤然中止\n死去的人民如初醒的\n阳光满地，依然新鲜\n欢悦而痛苦\n遍地阳光哭着\n在水面上嘤嘤\n嘤嘤：\n地面上孤岛如人\n含水而寂寞\n惆怅的苦乔花开遍了\n惆怅的苦乔花开过了\n地深处\n我骨头难忍酸痛\n地面上人民就说：\n让阳光遍地、流动金子\n2.船棺\n这是木头。这是乳房\n这是月亮。这是祖先\n安排的洞窟\n血迹上\n胳膊像树枝折断\n胳膊\n一声脆响\n起航之前的山峦\n洞深人更深\n这是木头，母亲为它\n葬送了儿子\n父亲葬送了自己\n眼泪浅浅\n这是乳房。这是月亮\n携野兽逃出洪水\n 屋：梦见了爱情\n两只膝盖梦见四只膝盖\n婚姻梦见爱情，三位女神梦见爱情\n莲花——东方的铁莲梦见爱情\n……但是水、水……甚至男人们也梦见了真正的\n爱情。他们一直在喝水……喝水\n我便回到更加古老的河道……女人最初诞生……\n古老的星……忘记的业绩……五行……和苦难\n夜晚子时大地的子宫和古老的葬具\n我便揪住祖先的胡须。问一问他的爱情。\n我的双腿在北方的河岸上隐隐溢过，显于\n奔跑的巨大母羊之上群羊之上。\n木植土。金斫木。火熔金。水熄火。\n金生火。土生金。木生土。水生木。\n就是那块土地，那块包孕万物的灾难如歌的土地\n使我的头顶出现光芒，使我的掌心埋藏火花\n照亮了陶器。盛水的不再只是爱情之唇……鱼……\n……鼻音……乳名和隐语……以及长口瓶、鱼纹盆、尖底瓶\n也有干的河床……渗下去……就像母亲融入卑微的泥土\n我抚摸着每一张使我动心的面容。只有你\n慢慢从我心中长出。同时\n野花也带来了孤独。\n但是水、水他们一直埋头喝水\n太阳带来重复出现的命运。而你从我的心中\n慢慢长出，痛苦不堪地长出\n从诞生到现在\n　　只有一步之遥\n但是水、水\n相传他是东方诗人\n睡在木叶下\n梦见爱情就真地获得了爱情……喝水人倒地为水\n……估计人们会在春分之前先渡过一条小河，然后靠近\n大——河——靠——近——大——河\n而我一直如节气对人耳语。孤独的男人的耳语\n在水上渐渐地远去……就这样\n在水上团聚的日子近了，我在婚礼上站立不稳\n土地仍旧灼人……迎人入内，静静合上眼睛\n从诞生到现在仅一步之遥……秦岭兀立一片。\n旧河道，我仿佛就这样痛苦地\n升上天空……他们一直在埋头喝水\n一直喝到夕阳西下\n女人诞生的时辰。\n前面已有的痕迹，越拓越宽，不动声色，坦白而痛苦\n至今故乡仍在四个方向成长，同时艰难地死去\n而他们一直在喝水\n水\n因我而浑浊的\n母亲\n如鱼落在草上。他们仍在埋头喝水……该死的男人\n他们一直在掘水。又喝干了\n乳房\n挂在秦岭的两边，一切都成了女性，一切都可以再生\n水波翻动衣服就像翻动诗经。南方的节日里\n失去了一位诗人……瘦削的诗人……脑袋，下沉中的\n黑色太阳。我看见\n　　　水\n慢慢淹过我的身体\n我看见了不该看见的，我看见了永存的，月亮和河流之龟\n两条爬过的痕迹，在我身上醒来，痛裂成文字，伤疤和回忆\n又隐隐作痛。至今故乡仍在四个方向生长，向东生长，一路\n死去。他们一直在埋头喝水……掘水……毫无消息。\n当晚霞又一次升起\n临河的盆地麦子熟了……我便起身\n一路踏过水井……这个该死的男人\n爱情让我舍弃了生命和青春\n我是那灾难带来了水乃至鼻息带来了前后的六天\n众蚁在脚下咬紧阳光\n就是那灾难照我一如既往大地一如既往：赤裸渴望而动情\n发现我的肩头落满光芒，四放为辉煌的日兽所困\n只有女人的头发如麦粒如水草，给我夜里潮湿的安慰\n……抬起头来，女人\n抬起头来，看着我\n怎样射箭……\n洞穴之中探出许多　　作响的头颅\n……水，使我在婚礼上站立不稳\n因为旷野上口唇相占，你我的生辰互相证明\n旧河道，太阳与你同样辉煌。我早就驯服了它\n我早就是我，是人，是东方人，是我自己\n……但窑洞还是离水井甚远历史离水井更远\n就让我负鱼而来……人们晾晒旧网……盛水的不再只是\n嘴唇，还有河道，改造洪水……人们以我为禹……但我\n也曾射过太阳……是我自己……娶过新娘\n她本是水边的神，或许同时是水兽\n当然很美丽。\n击石拊石\n百兽率舞。\n根上，坐着太阳，新鲜如胎儿……但是水、水\n第四篇　三生万物\n1.女人的诞生\n女人诞生在桥下\n另一位女婴\n破网\n诞生在对面的船舱里\n祖先之血灌注\n声音如渴\n在体内行走……哇……哇\n便哭了\n带来了挖土声，雪花盖地声：女孩的叹息\n洪水中房屋倒塌声：婚礼的声音\n风翻树叶的声音：新娘的呼吸声\n诗朗诵的声音：半夜婴儿的哭声\n还有月亮的声音\n　　那是女人在男人的注视下\n　　梳头的声音\n民歌：\n母亲寂静\n女婴寂静\n美人寂静地老去\n滋养了河\n女人像白色的毛巾一样从天上落下\n落在高粱地里\n第三位女人\n本是一位男人\n那是星星出现，形如半月。\n他在制做陶器的同时制做了肉体\n他在制做肉体的同时制做了衣服\n遮住自己\n就像遮住月亮\n日久天长\n在男人羞涩而隐秘的\n愿望中\n我就成了女人\n……脊背像白色的花朵\n为了强调生命\n女人诞生在桥下。\n女人\n是的，女人\n首先诞生泥巴。\n镰刀的收割声中会有女人前来看你\n她双乳内含有雪花吃草的声音\n女人消失\n在伐木声中\n2.招魂那天无雨\nＡ：我是水\n流浪在\n楚国的树上\n多余的梦化成蓝色的电和一丛鸟骸\n也开始流浪\n让源头如尸，尽搁于树\n让树撩开头发给我带来乳房的暴雨。根脉相接\n让我们撕下皮肤，让我们更像\n孤独的人体，睡在木头中，让地深处向上生长的\n死亡\n故乡\n痛苦万分的\n经过湘水中的月亮\n骨头之中\n楚国的歌声四起\n我是楚国的歌王\n　　还记得我开口说话的日子吗？\nＢ：记得。痛苦的诗人\n是你陪着我——所有的灾难才成为节日\n到有水的地方为止\n到我俩为止\n没有一个人\n活下来。而我\n只记得你死去的日子……龙舟竞行\n只记得一组桃树，早上古老地醒来\n我双手摸到你\n太阳血染白衣，野花巢于足迹\n我只记得你\n睡在水流中\n那么长久\n注视\n我\n国家似水\n被摇醒时一动不动\n那么长久\nＡ：好吧。记住我死去的日子\n记住我\n并不曾向你们许下什么\n记住后来的事\n尤其要记住过去……打井时撕裂的手指\n记住本世纪初的一场大雪\n记住我在黎明中\n步伐踉跄。\n大地飞奔过来伸开双手\n并没有接住\n我零碎的脚印\n……我是水\n记住我的第一次死去……神秘的歌王\n在墓画上烧得云朵低回\n记住我已经死去\n芦苇中。\n我和第二个我\n已经死去\n死在故乡必经的道路上\n记住我并不曾许下什么\nＢ：剩下些身体如木柴\nＡ：记住死亡如门……自由的\n堆积尸体\n　　像堆积大地\n记住木柴只堆在我身上，画满了干涸的家乡河火，尤其使我疼痛，在我身体上\n有第一日\n第二日和第三日\n有三十六弦的乐器。有土鼓如风。有赤乌夹日\n也有三寸六分的乐器\n和众人不愿诉说的事情，难堪的事情\n土地……一米……两米……跟着我\n走过了最痛苦的时辰\n故声锵锵，在我身体上\n画满了波浪\n鼓成船，槌成橹\n我径直走了\n记住这一根最大的木柴，苦难和流放的男人\n囚于身体和孤独的男人，记住这一身白衣服\n包裹的木头\n于我的身躯一节一节焦黑\n而静默\n一节一节惊飞\n如黑色燕子\n来临河面。记住我的身体是你是妻子\n也是儿子。更是门外门内的燕子\n尤其是河流\n是那么长久的\n停止了生长的\n骨头：\n之后是\n断断续续的火焰\n只要你们记住了\n　　“那么就取走我的身体吧”\nＢ：是的。我记住了。\n诗人，你是一根造水的绳索。\n诗人，\n你是语言中断的水草。\n诗人，你是母羊居留的二十个世纪。\n诗人，\n你是提水的女人，是红陶黑陶。\n我记住了你盛水的器皿\n我记住了你嘴唇的位置\n我记住了\n　　　　心的需要\n记住要慢慢地放下绳索\n一寸一寸，一种向下生长的\n生\n渴望已久的水、诗歌和恋人的身躯\n就在下面\n平静的躺着\n她的乳房温热流动成波浪\n是的，我记住了\n在你的面前\n先要记住故乡……让两边的耳朵伸向海洋\n让月亮如寂静的时间\n从面孔中间穿过\n打开两口深井\nＡ：众人会又一次寂静地苏醒在井边\n……少年人肩头薄如刀片，在大河中浸洗\n说不清太阳是升起还是永久落下……霞光如血\n　　招魂的这天无雨。\n3.八　月（或：金铜仙人辞汉歌）\n八月是忧患的日子\n夜晚如马把我埋没。流水的声音，钟鼓的\n声音。又坐在空空的早晨，除了潮湿的苔藓\n我一无所有\n八月是痛苦的日子\n画栏如树把我生长。流水的香气，宫殿的\n香气。又坐在空空的早晨，除了八月的土地\n我一无所有\n陌生的官牵我走向千里以外\n函谷吹来的凄风一直射向我青铜仙人的眸子\n八月是忧患的日子\n汉月与我一道\n寂寞地离开古老地方\n一路没有言语\n思念旧君的清泪如铅水一样滴落\n一路没有言语\n咸阳道上为我送行的只有败兰一枝。\n八月是痛苦的日子\n我\n金铜仙人\n独自携带\n自己和承露盘\n在月儿照着的荒凉的野地上行走\n渐渐\n离渭城远了听到的渭水的波声也就渐渐的小了\n（这首诗是李贺的。我把它抄下作为本诗的结尾。李贺还有一序，我把它抄在最后：魏明帝青龙元年八月，诏宫官牵车，西取汉孝武捧露盘仙人，欲立置前殿。宫官既拆盘，仙人临载，乃潸然泪下。唐诸王孙李长吉遂作《青铜仙人辞汉歌》。）\n---\n+ 1985.8中旬雨夜\n+ 　李贺原诗：“茂陵刘郎秋风客，夜闻马嘶晓无迹。画栏桂树悬秋香，三十六宫土花碧。魏官牵车指千里，东关酸风射眸子。空将汉月出宫门，忆君清泪如铅水。衰兰送客咸阳道，天若有情天亦老。携盘独出月荒凉，渭城已远波声小。”（另：《青铜仙人辞汉歌》当为《金铜仙人辞汉歌》，疑是印刷错误；而注中“画栏桂树悬秋香”原书缺“树”字，今补上"},{"id":"short/1986/从六月到十月","title":"从六月到十月","type":"short","year":"1986","body":"六月积水的妇人，囤积月光的妇人\n七月的妇人，贩卖棉花的妇人\n八月的树下\n洗耳朵的妇人\n我听见对面窗户里\n九月订婚的妇人\n订婚的戒指\n像口袋里潮湿的小鸡\n十月的妇人则在婚礼上\n吹熄盘中的火光，一扇扇漆黑的木门\n飘落在草原上\n---\n● 1986.6.19"},{"id":"short/1987/不幸_1","title":"不幸","type":"short","year":"1987","body":"——给荷尔德林\n1.病中的酒\n拾起了一张病床\n我的荷尔德林　他就躺在这张床上\n马　疯狂地奔驰一阵\n横穿整个法兰西\n成为纯洁诗人、疾病诗人的象征\n不幸的诗人啊\n人们把你像系马一样\n系在木匠家一张病床上\n我不知道\n在八月逝去的黄昏\n二哥索福克勒斯\n是否用悲剧减轻了你的苦痛\n当那些姐妹和长老\n举起了不幸的羊毛\n燃烧的羊毛\n像白雪一样地燃烧\n他说——不要着急，焦躁的诸神\n等一首故乡的颂歌唱完\n我斤微　会钻进你们那\n黑暗和迟钝的羊角\n丰足的羊角　呜呜作响的羊角\n王冠和疯狂的羊角：我躺下\n——“一万年太久”\n只有此羊角　诗歌黑暗　诗人盲目\n2.怀念　或没有收获\n等你手拿钝镰刀\n割下白雪和羊毛\n不幸的荷尔德林已经发疯\n修道院总管的儿子\n银行家夫人的情人\n不幸的荷尔德林已经发疯\n等你建好医院\n安放好一张又一张病床\n荷尔德林就躺在第一张床上\n经历没有收获的日子\n那是幸福的\n——“收获即苦难。”\n只好怀念大雁——\n那哭泣和笑容的篮子\n当你追随我\n来到人类的生活\n只好怀念大雁——\n那被黄昏染红的肉体的新娘。\n3.牧羊人的舞蹈——对称\n——黑暗沉寂之国\n（有题无诗）\n4.血以后是黑暗——比血更红的\n是黑暗\n荷尔德林——告诉我那黑暗是什么\n他又怎样把你淹没\n把你拥进他的怀抱\n像大河淹没了一匹骏马\n存在着　嘶叫着　和黑暗之桶的主人啊\n你——现在又怎样在深渊上飞翔——阴郁地起舞——将我抛弃\n并将我嘲笑——荷尔德林\n你可是也已成为黑暗的大神的一部分\n故乡\n……我们仍抱着这光中飞散的桶的碎片营造土地和村庄\n他们终究要被黑暗淹没\n告诉我，荷尔德林——我的诗歌为谁而写\n掘地深藏的地洞中毒药般诗歌和粮食\n房屋和果树——这些碎片——在黑暗中又会呈现怎样的景象，荷尔德林？\n延续六年的阴郁的旅行之路啊\n兄弟们是否理解？狄奥提马是否同情——她虽已早死？\n哪一位神曾经用手牵引你度过这光明和黑暗交织的道路？\n你在那些渡口又遇见什么样的老母和木匠的亲人？\n他们是幻象？还是真理？\n是美丽还是谎言？是阴郁还是狂喜？\n还是这两者的合一：统治。\n血以后还是黑暗——比血更红的是黑暗\n我永久永久怀念着你\n不幸的兄弟　荷尔德林！\n5.致命运女神\n怀抱心上人摔坏的一盏旧灯\n怀抱悬崖上幸福的花草纵身而下\n红色的大雁\n隔河相望美丽村镇\n致命运女神的几行诗句\n痛苦在山上但说无妨\n红色的大雁\n在南风中微微吹动\n少女食羊　羊食少年死后长出的青青草杆\n一团白云卷走了你\n随风来去的羊\n——命运女神！\n---\n● 1987.11.7夜录"},{"id":"short/1988/七百年前","title":"七百年前","type":"short","year":"1988","body":"七百年前辉煌的王城今天是一座肮脏的小镇\n当年我打马进城　手提一袋青稞\n当年我用一袋青稞换取十八颗人头\n还有九颗，葬在城中，下落不明\n在山洞里十二只野兽梦想变成老鹰，齐声哀鸣\n这是山顶上最后的山洞梦想着天空\n突然有一种感觉，好象还是在又饥又饿地走在路上\n在幽暗中我写下我的教义，世界又变得明亮\n---\n● 1988.8.18"},{"id":"short/1989/叙事诗","title":"叙事诗","type":"short","year":"1989","body":"——一个民间故事\n有一个人深夜来投宿\n这个旅店死气沉沉\n形状十分吓人\n远离了闹市中心\n这里是唯一的声音\n是教堂的钟声\n还有流经城市的河流\n河流流水汩汩\n河水的声音时而喧哗\n时而寂静，听得见水上人家的声音\n那是一个穷苦的渔民家庭\n每日捕些半死的鱼虾，很难度日\n这人来到旅店门前\n拉了一下旅店的门铃\n但门铃是坏的\n没有发出声音，一片寂静\n这时他放下了背上的东西\n高声叫喊了三声\n店里走出店主人\n一身黑衣服活像一个幽灵\n这幽灵手持烛火\n话也说不太清\n他说：“客人，你要住宿\n我这里可好久没有住人”\n客人说：“为什么\n这里好久没有住人”\n主人说：“也许是太偏僻\n况且这里还不太平”\n“没关系”，那人血气方刚\n嗓门宏亮，一听就是个年轻人\n说：“主人，快烧水做饭\n今夜我要早早安顿”\n店主人眨着双眼\n把客人引入门厅\n房子又黑又破\n听得见大河的涛声\n河面上吹来的风\n吹熄了主人手上的蜡烛\n他走进里面\n把客人留在黑暗中\n伸手不见五指\n客人等了又等\n还是不见主人\n他高声叫喊：“主人！主人！”\n没人答应\n他摸黑走向里屋\n一路跌跌撞撞\n这屋里乱七八糟，黑咕隆咚\n屋子里发出声音\n他在窗台上摸到一盏灯\n举起来晃了晃，灯里没有油\n他又将灯放回原处\n他推开窗户\n河水的气味迎面而来\n他稍微停顿一下\n站在那里发愣\n他还是心神不宁\n借河面上渔船的灯光点点\n微光反入这黑屋子\n看清了这个房间的大致\n屋子里只有一张床\n什么也没有\n那么他刚刚跌跌撞撞\n弄碎和弄响的究竟是些什么东西\n是不是鬼怪和幻影？\n他的心开始有些发毛\n刚刚平息下来的心跳\n又似一面绷紧的鼓手狠狠锤击的鼓\n他在床上坐下\n恐怖的故事涌入头脑\n他连衣服都没脱\n就钻进了那潮湿的被窝\n行李扑通一声\n跌在地上\n在寂静中\n这声音显得格外的响\n他怎么也睡不着\n到半夜，河水声小了\n没有一点声音\n他更加睡不着觉\n翻来覆去，全都是\n使他内心恐惧\n的幻影和声响\n这时一个尖利的儿童声响起\n在深夜，这儿童的声音\n多像是孤独的墓穴中\n一片凄惨的鸟鸣\n他听清了，这儿童在喊\n“舅舅，舅舅，放我进来”\n“舅舅，舅舅，放我进来”\n“开门，舅舅”\n“开门，开门”\n同时有声音捶打着这个房门\n这客人连忙起身\n下床开门\n门外没有一个人影\n他又重新躺下\n更加不能入眠\n这时童声重新响起：\n“舅舅，舅舅，开门”\n一声比一声凄厉\n这个陌生人\n一身冷汗\n把头也钻到被窝里\n但是声音更响\n仿佛刀刺在他耳朵上\n仿佛这儿童\n就在他耳朵里尖叫\n他猛地拉开门\n但是没有人\n他怀疑自己的耳朵\n只好把门关上\n叫声又响起\n还是和刚才一样\n他起来，抖嗦着\n再重新打量房间\n他看见河面上的灯火少了\n那微光更弱\n但能辨清轮廓\n他看清这屋里只有一张床\n他的心抽紧了一下\n会不会床底下有什么\n他伸手向床下摸去\n并没有什么\n可这时声音又响起\n更加激烈，他把手\n向回抽时，感到\n床底下有人\n他的血液凝固\n心脏几乎停止了跳动\n于是他摸向那儿\n原来那床板底下绑着一个人\n他吓得没有声音\n把手抖嗦着收回\n摸出刀子，割断了\n那捆绑的绳索\n他把那人拖出来\n放到房间中央\n发现那人口袋里有一只蜡烛\n还有一根火柴\n他点亮这短短一寸的蜡烛\n火烛下看清那人是店主人\n已经死了，看样子\n已经死了好几天\n这死尸躺在他的房间里\n这死了好几天的死尸\n刚才还引他进门\n又被绑在他的身下\n这个陌生人额头冒出冷汗\n全身都被浸湿\n他马上就要昏过去\n这时蜡烛也已熄灭\n---\n● 1989.1.17"},{"id":"essay/寻找对实体的接触河流原序","title":"寻找对实体的接触（《河流》原序）","type":"essay","year":"unknown","body":"——直接面对实体\n我喜欢塞尚的画。他的画是一种实体的画。他给这个世界带来了质量和体积。这就足够了。\n诗，说到底，就是寻找对实体的接触。这种对实体的意识和感觉，是史诗的最基本特质。当前，有一小批年轻的诗人开始走向我们民族的心灵深处，揭开黄色的皮肤，看一看古老的沉积着流水和暗红色血块的心脏，看一看河流的含沙量和冲击力。他们提出了警告，也提出了希望。虽然他们的诗带有比较文化的痕迹，但我们这个民族毕竟站起来歌唱自身了。我决心用自己的诗的方式加入这支队伍。我希望能找到对土地和河流——这些巨大物质实体的触摸方式。我开始时写过神话诗，《诗经》和《楚辞》像两条大河哺育了我。但神话的把握缺乏一种强烈的穿透性。\n诗应是一种主体和实体间面对面的解体和重新诞生。诗应是实体强烈的呼唤和一种微微的颤抖。我写了北方，土地的冷酷和繁殖力，种籽穿透一切在民族宽厚的手掌上生长。我写了河流。我想触到真正的粗糙的土地。\n其实，实体就是主体，是谓语诞生前的主体状态，是主体沉默的核心。我们应该沉默地接近这个核心。实体永远只是被表达，不能被创造。它是真正的诗的基石。才能是次要的，诗人的任务仅仅是用自己的敏感力和生命之光把这黑乎乎的实体照亮，使它裸露于此。这是一个辉煌的瞬间。诗提醒你，这是实体——你在实体中生活——你应回到自身。\n诗不是诗人的陈述。更多时候诗是实体在倾诉。你也许会在自己的诗里听到另外一种声音，这就是“他”的声音。这是一种突然的、处于高度亢奋之中的状态，是一种使人目瞪口呆的自发性。诗的超现实平面上的暗示力和穿透力能够传递表达这种状态。这时，生命力的原初面孔显现了。它是无节制的、扭曲的（不如说是正常的），像黑夜里月亮、水、情欲和丧歌的沉痛的声音。这个时候，诗就是在不停地走动着和歌唱的语言。生命的火舌和舞蹈俯身于每一个躯体之上。火，呼的一下烧了起来。"},{"id":"long/河流","title":"河流","type":"sun","year":"1984","body":"梦想你是一条河，而且睡得像一条河\n ——洛尔迦给惠特曼\n（一）春秋\n1.诞　生\n你诞生\n风雪替你凿开窗户\n重复的一排\n走出善良的母羊\n走出月亮\n走出流水美丽的眼睛\n远远望去\n早晨是依稀可辨的几个人影\n越来越直接的逼视你\n情人的头发尚未挽起\n你细小的水流尚未挽起\n没有网和风同时撒开\n没有洁白的鱼群在水面上\n使我想起生殖\n想起在滴血的晚风中分娩\n黄金一样的日子\n我造饭，洗浴，赶着水波犁开森林\n你把微笑搁在秋分之后\n搁在瀑布睡醒之前\n我取出\n取出\n姐妹们头顶着盛水的瓦盆\n那些心\n那些湿润中款款的百合\n那些滋生过恋情和欢欢爱爱的鸳鸯水草\n甚至城外那只刻满誓言的铜鼎\n都在挽留\n你还是要乘着夜晚离开这里\n在窄小的路上\n我遇见历史和你\n我是太阳，你就是白天\n我是星星，你就是夜晚\n2.让我离开这里\n抱着琴\n有一种细长尖锐的穿透\n有一腔浓稠苦涩的黄水\n在沙地上\n至今还隐隐约约被人提起\n在一片做梦的铃兰地上\n被人提起\n或者能流出点什么\n你是水\n是每天以朝霞洗脸的当家人\n喘息着\n抚养匆匆来去的生灵\n第一个想法是春天\n春天却随花朵落去\n因此第二个想法属于那些枝干\n枝干刨成的小船像劳累的手指\n拨动长眠不醒的地方\n像门扇\n偷偷开启\n我毫不回头地走出\n于是我想起紫罗兰和我都年轻的那一年\n人们听说泉水要从这儿路过\n匆匆走出每只箱子似的山涧\n在一片空地之上\n诞生了语言和红润的花草，溪水流连\n也有第一对有情有意的人儿\n长饮之后\n去远方\n人间的种子就这样散开\n牛角呜呜的响着\n天地狭小，日子紧凑\n你遮遮盖盖\n你第一次暗示的身孕过于突然\n你又掩饰\n以遍地的村镇掩饰越来越响的水声\n你感到\n空旷是对种植的承诺\n让孩子们\n用花草鞭醒岸上沉睡的泥团\n接着你远去\n你为什么要远去\n前面的日子空寂无声\n3.水哟.\n你这带着泥沙的飞不起来的蓝色火舌\n是谁\n领我走进这片无边的土地\n让黑夜和白天的大脚\n轮流踩上我的额头\n颅骨里总有沉重的东西\n在流动\n流动\n人和水\n相遇在尘土中\n吸收着太阳和盐\n我是一条紫色的土地的鞭痕\n在日子深处隐现\n我的眉心拧结着许多紫色的梦\n世界像成群的水禽\n踩上我的弓箭\n大地在倾斜\n晨光中生物们把影子纷纷摇落\n一天又一天\n落满我的双肩\n就像越来越多的声音充满平原和山地\n躲也躲不开\n正在成熟的婴儿掉进我的血管\n河岸的刀尖逼向一切\n雷声呼唤着滚过草甸，黄帝轩辕\n我凝视\n凝视每个人的眼睛\n直到看清\n彼此的深浊和苦痛\n我知道我是河流\n我知道我身上一半是血浆一半是沉沙\n在滴血的晚风中分娩\n谷底走出一批湿漉漉的灵魂\n向你索取通道\n这些纤夫\n纤夫的面孔\n是一朵朵黑色粗壮悲哀的花\n凶狠地围住\n诗人纷乱的心灵\n我，预先替世界做出呼吸\n4.母亲的梦\n城堞一方\n低矮的装饰着流水谷地\n玉米红色的缨儿在我潮湿的嘴唇燃烧\n几只瓮子盛着仅有的一切\n在你离去的时候\n别的种子还在泥浆中沉睡\n连同那些擦身而过的草原\n我迷失了方向\n坐在这里\n其他的迷路人却把我当成了山口\n出出进进\n后来我睡在果园的根里\n我就居住在\n冬天和春天之间\n那几层黑土里\n不必叫醒我\n随便摘些新鲜的叶子\n盖上我痛苦中深深的眼窝\n我的手指枯瘦地伸向河流\n直到水流消失在\n另一只混浊的眼睛里\n天空太深\n月亮无声无息地落进\n孩子们\n从正在成长的青春背后\n突然伸出一支又一支手臂\n我摇着小船\n离开这里\n河岸上许多高高的立着的是梦\n铺满芦花和少女\n面对沃野千里，你转过身去\n双肩卸下沉重的土地\n梦想安息\n动物舔干脊柱上的盐粒\n重又流出木围\n有一次深刻的边缘，节日\n让许多人平常地踩过去\n梦想海岸\n你刚合上眼皮\n渔人就用海螺做成眼睛互相寻找\n女性的亲人\n温情如蓝色的水\n梦想草原来的是一匹小红马\n像一把红色的勺子\n伸向水面\n岸上\n主人信步走去\n5.回　声\n鼓瑟\n天地欲倾一方\n群蛇在我身后探出头来\n鸟儿是河流耳朵\n也是回声\n在鼓钹碎裂声中\n抖落层层掩埋的叶片和毛羽\n飞去\n森林成为弃壳\n我呼吸，我八面威风，我是回声\n开窟为自己塑像\n你要说出什么\n说吧\n一切回声\n冰冷的回声\n变成卵实质上动物的胸房\n公鹿犄角美丽的闪光\n他们的草原营营有声\n翅膀和根须间\n村庄沉沉睡去\n回声中雨雪霏霏\n那最后告别的一眼\n传说中的春秋\n那些我大口大口吐出的鲜红的日子\n也成为回声\n当母马有孕时\n它实际上还可以重活一次\n你的背上月明星稀\n你是我一切的心思\n你是最靠近故乡的地方最靠近荣光的地方\n最靠近胎房的地方\n（二）长路当歌\n1.父亲\n黄昏时分，一群父亲的影子走向树\n绳索像是他们坐过的姿势，在远方则是留恋，回忆起往事\n在土地上有一只黄乎乎的手在打捞，在延伸，人们散坐着\n以为你是远远的花在走着，水啊\n我渴望与父亲你的那一次谈话还要等多久呢\n虽然你流动，但你的一切还在结构中沉睡\n你在果园下经营着涩暗的小窑洞、木家具\n砖儿垒得很结实\n大雪下巨大的黑褐色体积在沉睡，那些木栅敲开了鸟儿的梦\n花儿就在这些黑色的尸体上繁茂\n其实，路上爬满了长眼睛的生物\n你也该重新认识一下周围，花里盛着盏盏明亮的灯，叶里藏着刀\n小水罐和那一部分渔具都是临时停在沙滩上，船板曝裂\n送水的人呢\n我渴得抓住一部分青草，我要把你嵌在这个时刻，一切开始形成\n你抚摸着自己，望着森森的阴影，在你浑黄成清澈的肢体上，一切开始形成\n你就是自己的父母，甚至死亡都仅仅是背景\n你有高大的散着头发的伙伴，绿色的行路人，把果实藏在爱人的怀里\n大批大批的风像孩子在沙土后面找机会出来\n那时一切都在歪斜中变得年轻，折断根，我从记在心上的时刻游出\n不只是因为家庭，弟兄们才拉起手来\n我在夜里变得如此焦躁，渴望星星划破皮肤，手指截成河流\n我的风串在你脖子周围\n那些鸽子是一些浪中战抖的小裸体，在月光下做梦\n一群又一群骆驼止不住泪水，不是因为黄沙，不是因为月亮\n而是因为你是一群缓缓移动的沉重的影子\n我游着，那些叶片或迟或早在尖锐中冒出头来\n像锐痛中的果实，像被撕裂的晚年\n但现在又是一个劳动后的寂寞，太阳藏在每个人的心里，鸟儿寻找着\n父亲的脸被老泪糊住，许许多多的影子都在火堆旁不安分地融化着\n牛开始脱毛，露出弱瘦的骨茬之伤，冬天啊，多么想牵它到阳光里去\n我只能趴在冬天的地上打听故乡的消息，屋后的坟场和那一年的大雪\n有一行我的脚印\n在永永远远的堆积、厚重、荣辱、脱皮、起飞的鸟和云，概括着一切的颤抖中\n你是河流\n我也是河流\n2.树根之河\n树根，我聚集于你的沉没，树根，谷种撒在我周围\n我走在阴森的春天下，你的手指伸进我膨胀的下肢\n你是愿望，一串小小的光芒\n在悄悄栖息，被鸟儿用羽毛遮掩，走不完的上空\n那些树根被早晨拎走了头颅，我摘下自己的头颅跟着他们走去\n水流在岩石下像母亲挤在一起的五官，想看见，想听见，想伸出手去\n裂开，断开，草原在我的指向中四面开花，永远在包围\n走向何方，树根，我不是没有遗失，我遗失的是空旷，你的一个月份\n用一些鱼骨，用一些锚架，把春天砸开一个缺口\n把剩下的碎片都扫进我的心\n一只手说出另一只手，树根，我啜饮\n鱼鳞，那些闪闪烁烁逐渐走向浓厚的腥味，使我一眼望见人类之始\n我在树根中用手挡，随便摸起一件物质作太阳，狼群微笑不止，布满四周\n我在树根里把一条路当作另一条路来走，我在树根里碰翻了土地，甚至河流\n我的头发在风中开成一排排被击倒的人影，雨是我夏天的眼皮\n是液体，我的眼睛永远流向低矮的地方\n我在抚摸中隆起它们，甚至隆起我自己\n把脸当作翅膀，把脸挡住一切，一片长满黑漆漆树根的地方解决一切\n我在枫木中伸直手掌\n和送葬的人一同醒来，我的思绪烂在春花时刻，我坐在那里，一动不动\n一些疙瘩永远停在翅膀上，树根，我用犄角对抗你\n我在黑夜中提到那暖烘烘的一切，土地上成团的人抱着胳膊晒太阳\n我于是成了一些传递中的嘴唇，酒精幽舌，成了一些人的母亲\n我不得不再一次穿过人群走向自己，我的根须重插于荷花清水之中，月亮照着我\n我为你穿过一切，河流，大量流入原野的人群，我的根须往深里去\n腐土睡在我的怀中，就那么坐成一个鼓凸的姿式，我在腰上系着盛水的红容器，人们称为果实\n当你把春风排到体外你就会与一切汇合，你会在众人的呼息中呼息，甚至安眠\n你把自己静静地放入人群，你在耳朵里把太阳听了个够，树根\n你的厚厚的骨架在积雪的川地上，踏成季节，和以后的一切，爱或者恨\n都重新开始，即使在麦地里永远有哭泣的声音传得很远，甚至在另一块麦地里都\n能听到，树根，你身边或许就是河流\n或许就是四季，或许就是你饲养的岁月一群，或许就是爱人，或许就是你自己的眼睛\n连同化成香气的昆虫，水流\n一切都想得那么深\n把水当成挖掘的时刻，把火当成倾诉的红树干\n甚至把母亲当成踏向远处的一串泪迹，母亲河\n一串泪迹\n3.来到南方的海边\n在森林中静静航行，在传说的黑翅膀下静静航行，我看见了黄昏的河湾\n母亲捧着水走过黄昏的风圈，爱人越缩越小，只能放进心里\n一群牧羊人在羊群山苍凉的掩映下想起了南方和雨\n山峦像清秀的渔夫撒满江面，岛屿像鸟的手指在夜里啜饮大海\n南方，许多声音，许多声音\n九个巨大的金属坐在海岸上，你的城市沉下一块又一块紫丁香\n我追过桥去，一批石人石马等我静静退出\n牛角号伴着我度过阵阵抽搐的夜晚，关起木栅，把黄昏和牛放满一地\n舞的人群消融得像一幅疲惫的脸，在樱花树下拣起你的月亮，你的风风雨雨\n用一只腿跳着离开干涸的河床\n揭开一层层泥沙，骨骼迎风而立\n在必要的时刻，南方的河流，你的头发流泄那么多不可缺少的爱\n男人累了，你让怀中孩子快快长大吧，日子长着呢\n火堆闪烁，仿佛原野用膝盖走路，云朵闪烁，仿佛天空用眼睛飞翔\n在旱季到来之前快把孩子养大成人，即使他离我而去\n我也能筑起图案：笔直的鱼，一丛丛手指让海弯曲地折断\n甚至牛望着星星坠进海里，爱人飞上天\n在粗砂的碗上，在冬天的脚下，让村庄抱着我睡去\n我拉扯着太阳和你们\n来到海边\n4.舞\n这股细小而寒冷的水流源于森林，森林起源于空地上的舞蹈\n沿途你不断拣起什么又不断扔下什么，你踩在人们最想念你的时刻\n但笑容渐渐远离河岸，你是一股奇特的睡意喷向我的面孔\n在你流过的地方，牛的犄角转着光圈，连小屋也在月光下摆上了桌子和食品\n你制造的器皿和梦的线条无一例外地泄露于大地上\n你在土地上抱着一块石头就像抱着你自己，再也离不开\n那些离去的渐渐变成仇恨\n一天又一天，太阳不足以充实你也不足以破坏你\n当另一种敲门声越来越重，你把岁月这支蜡烛吹灭，又点上了另一支岁月之光\n你的真情在旋涡和叹息中被我一一识破，河流呵\n春天战胜了法则，你踩着村庄走向比树和鸟还高的地方，走向比天还高的地方\n我想起天地夹缝间大把大把撒开的花，年老的树木，刨土者和爬过门坎的孩子\n一棵树结满我们的头颅，果实在秋天被妇人摘下或者烂在地里，树就要生长\n我突然被自己的声音激动\n因为提到明天，人们扯下母胎中孕着的自己，河流的剧痛和黎明\n一边无边的起伏，舞的火堆挤满陶罐，许多粗黑的胳膊拥在一起\n河岸下太阳在泥沙中越来越肿大，被秋天接受，酒和铁互相递进喉咙\n骨骼如林地长起，河流和翅膀变得黑褐无边\n鸟儿成堆成堆地投入冬天的营地，让早晨被所有平静的湖水、岛屿拥有\n被年轻的新娘们拥有，我摘下自己的帽子，头颅里响起婚礼的钟声\n不再孤单，一切都能代表我和种子\n我们的母亲，高粱和芦苇在北方拼命的挥动着头巾\n白桦林在湖岸上寂静的长起，没有人知道浑浊的水繁殖了这么一大片林木\n没有人知道故乡的土地在道路和河流之下还有什么\n春天就在这时被我带来\n三两个人拖着浓重的影子，举箭刺穿燃烧在荆丛中的一个声音\n小兽们睁着眼睛，善良的星星和风暴预言的粗沙堆在离心很近的地方\n垒住，泉涌如注，我扶膝而坐，倾听着花朵迁往苦难的远方\n倾听着远方墙壁成长的声响，我粗大的手掌摸过城，在夜晚人们隔门相望\n你是河流，你知道这一切\n线条被撕开，凌乱的掉在路上他们头也不回地走了\n+ 1984.6-9\n（三）北方\n1.圣地\n我爬上岸\n黑压压鸟群惊起，无处藏身\n飞遍了\n我的影子移动着，压住冰川\n划过一道深深的水流\n微弱的呼吸是音乐\n割开溶洞，让我孤单地住在里面\n我爬上岸\n砸碎第一块石头\n草原、狼、累累白果树\n和我的双膝\n磨穿寂静的森林\n莽野如梭\n峡谷洞穿眼眶\n取一丛火\n我披发横行于兽骨溶溶\n年轻的排着种子和钟的手掌\n在雾中除了农具\n谁也不认识\n磨烂了\n分出十指\n峡谷和火堆洞穿你们发黑的眼眶\n断岩层留下雷击的光芒\n不断向以后开放\n土陶吞下大鸟\n吞下无边弧形的河床\n地震把我的骨头唱断\n唱断一节又一节\n一层水使我沉默多年\n阡陌上\n人们如歌如泣\n人们撒下泥土\n人们凿井而饮\n狠狠地在我身上抠了几只眼\n让你痛苦的醒来\n号子如涌\n九歌如兽\n悚悚行走在战栗的地层上\n村庄围住月亮\n和我陷得太深的瞳孔\n枝杈哑笑了\n日子像残红的果实撒了一地\n未来沉下去只有文字痴长\n太阳痴长\n于是更多了背叛和遗忘\n为什么一个人总有一条通往地下再不回头的路\n为什么一支旧歌总守望故土落日捆住的地方\n2.过去\n在我醒来之前\n一块巨大的石碑盖住喉咙\n鲜血和最后一口空气\n只好在心房里自己烂掉\n脸颊\n垒满石头\n河流和月光溶解了头颅\n我再也没有醒来\n只有牙齿\n种子\n有节奏的摩擦、仇恨\n含泪大雁\n背后是埋剑的山岭\n山岭背后是三月\n畦地的孩子们\n要求自自然然地生长\n每颗种子都是一座东方建筑\n我要砸开他们的门\n我要埋出清澈如梦的河流，黑松林和麦垅\n山岭，三月五月的燕麦\n倚剑而立\n祭酒\n指天饮日\n几十棵树长出了人形\n是我在水的源头守护着你们\n3.想起你的时候\n想起你的时候\n4.种　子\n我痉挛\n犁是我一张渴血的触觉\n痉挛\n子孙们肩膀痛苦的撕裂\n我被肢解、刀击\n铁和血肉\n横飞于四面八方\n种子爆然而去\n粗暴地刺破我的头盖\n血流如注的眼睛更加明亮\n土地紧张地繁殖土地\n让血乎乎的盾\n被大把大把的盐粒擦亮\n挡住北方\n挡住兽皮的风暴\n让种子装灌头颅\n捆在肩膀上\n让赤铁矿流过粗宽毛糙的颜面\n让红种兄弟离开我们\n离开一根永恒的石柱\n一根生锈的石柱\n让渐渐远去的亚细亚埋在芨芨草里\n萎缩\n让我就在这时醒来\n一手握着刀子\n一手握着玉米\n亚细亚的玉米啊\n5.爱\n一把树叶文字贴在石头洞里\n贴在我们泄情的脸上\n一头野鹿填平湖湾\n一把弓\n一把粗草绳拦住一条边疆\n你\n就是我的妻子\n耳环\n洞箫10孔\n套住血水泡硬的心\n粗麻绳拦住另一条边疆\n我捧着种子\n走在自己的根脉上\n延长——延长——延长——\n延长——延长——延长——延长——\n隔着蒺藜的妇人　情爱如炽\n于是人类委身于种子\n于是先知委身于大地\n于是渔夫委身于海岸\n更多的人仅仅是在谈论\n隔夜的歌曲\n手臂静止地垂下\n摘果子的时辰尚早\n想起你的时候\n就想起夜半的野百合\n一支晃摇着节奏的野百合\n西那个起远方嫁给岩石的海鸟\n想起河神有几只鞋跑丢在太长的大陆\n跑丢在人群\n想起丝绸仅仅成为东方母亲的蒙面\n我便是诗人\n行吟\n马蹄踏踏，青草掩面\n牧羊老人击栅栏而泣\n枫叶垂望墓地\n只有火光在鼓面越烧\n越寂寞\n不该死的就不会死去\n平原\n爬满了花朵和青蛙化石\n6.歌手\n编钟如砾\n编钟\n如砾\n仿佛儿子拖回一捆捆粗硕的鱼骨和岸\n仿佛女儿含海的螺号　在夜里神秘地发芽\n陆地上伸出了碧清的河汊\n歌声\n就是你们身上刚刚抽出的枝条\n歌手红布袍\n如火\n几名兄弟含泪相托\n编钟如砾\n编钟如砾\n在黄河畔我们坐下\n伐木丁丁，大漠明驼，想起了长安月亮\n人们说\n哪儿浸湿了歌声\n---\n+ 1984.5"},{"id":"long/神秘故事","title":"神秘故事","type":"long","year":"1985","body":"1.诞生\r\n\r\n这个脸上有一条刀疤的人，在叫嚷的人群中显得那么忧心忡忡。他一副孤立无援的样子，紫红的脸膛上眼睛被两个青圈画住。他老婆就要在这个酷热的月份内临盆了。\r\n\r\n人们一路大叫着，举着割麦季节担麦用的铁尖扁担，向那条本来就不深的河流奔去。河水已经完全干涸了，露出细纱、巨大的裂口和难看的河床。今年大旱，异常缺水，已经传来好几起为水械斗的事情了。老人们说，夜间的星星和树上的鸟儿都现实出凶兆。事实上，有世仇的两个村子之间早就酝酿着一场恶斗了。在河那边，两村田地相接的地方，有一个小小的蓄水的深池。在最近的三年中，那深池曾连续淹死了好几个人。那几座新坟就埋在深池与庙的中间，呈一个“品”字形。\r\n\r\n两村人聚头时，男人妇人叫成一团。远远望去，像是有一群人正在田野上舞蹈。铁尖扁担插在田埂上：人们知道这是一件致命的凶器。不到急眼时，人们是不会用它的。仿佛她们立在四周，只是一群观战的精灵，只是这场恶斗的主人和默默的依靠。池边几只鸟扑打着身躯飞起。远去中并没能听见它们的哀鸣，地面的声响太宏大了。这个脸上有刀疤的人，接连打倒了好几位汉子，其中一条汉子的口里还冒着酒气。泥浆糊住了人们的面孔。人们的五官都被紧张地拉开。动作急促，断续，转瞬即逝，充满了遥远的暗示。有几个男人被打出血来了。有好几个妇人则躺在地上哼哼，另外一些则退出恶战。剩下的精壮的劳力，穿着裤衩抢着撕打在一起。还有一名观看助战少年，失足落入池中，好在水浅，一会儿就满身泥浆的被捞上来。\r\n\r\n这时，刀疤脸被几条汉子围住了。他昏天昏地的扭动着脖子。不知是谁碰了一下，一根铁尖扁担自然的倾斜着，向他们倒来。那几条汉子本能的跳开了。在他瘫坐下去时，铁尖迟钝、的戳入他的脖子。有几个妇人闭上了眼睛。就在这一瞬间，他痛苦地意识到妻子分娩了。他如此逼真地看到了扭曲的妻子的发辫和那降生到这世上的小小的沾血的肉团。这是他留下的骨血，他的有眼睛的财宝。他咧着嘴咽下最后一口气，想笑又没有笑出来。\r\n\r\n……人们把这具尸体抬到他家院子里时，屋子里果真传出了婴儿的啼哭声。不知为什么，牛栏里那头沾满泥巴的老黄牛的眼眶内也正滑动着泪珠。\r\n\r\n+ 1985.5.22\r\n\r\n2.公鸡\r\n\r\n这里生活的人们有一个习惯，在盖新房砌地基时要以公鸡头和公鸡血作为献祭。这个村子里老黑头今年要盖房。\r\n\r\n老黑头今年快六十了，膝下无儿无女，老夫妻和和睦睦地过着日子。不久前，他外出进山贩运木材，历经千辛万苦，靠着这条河流和自己的血汁，一把老筋骨，攒下了一些钱。他要在今年春上盖四间房子。事情就这么定了。\r\n\r\n他家有一只羽毛似血的漂亮公鸡。\r\n\r\n老黑头挑好了地基，背后是一望无际的洼地。只有一些杂树林，那是自然生长出来的。还有一些摸不清年代的古老乱坟，那是人们与这片洼地最早结下的契约，现在这契约早被人们遗忘。人们只守着门前的几母薄土过日子，淡漠了身后无边的洼地。风水先生说这片洼地属卧龙之相，如果老黑头命根子深，他家就会添子成龙。老黑头心里半信半疑。每到黄昏时分，他就在洼地里乱转。他和洼地逐渐由陌生而熟悉，最终结成了一种密不可分的关系。尤其在黄昏，他们能互相体会，体会得很深很深。西边的落日突然在树丛间垂直落下，被微微腾起的积尘和炊烟掩埋。老黑头的心像这一片洼地为黑夜的降临而轻轻抖动。他觉得老天有负于他，这么一个老实巴交的人，居然不能享有一个儿子。老黑头走出洼地的时候，吐了一口唾沫。天黑得很快。老伴又守着小灯等他回去吃晚饭了。在盖房之前的那天夜里，没有人知道，老黑头对着他的老朋友——那片洼地磕了几个响头。\r\n\r\n盖房那天上午，砖瓦匠们摸摸嘴巴上的油，提着瓦刀，立在四周。一位方头脑的家伙拎着那只漂亮的红公鸡走到中央。他对着鸡脖子砍了一刀。殷红的血涌了出来，急促的扑打到褐色的地面上，像一朵烈艳的异花不断在积尘上绽开。鞭炮声响起来了。老黑头递一支纸烟给那方头大汉。就在他伸出一支手接烟的当口，那只大红公鸡拖着脖子从他手里挣脱出来，径直飞越目瞪口呆的人群，流着血，直扑洼地而去，不一会儿，就消失在乱树丛后面。老黑头这才回过味来和大伙一起，拥向洼地。但那只公鸡像是地遁了似的，连血迹和羽毛也没见到。大伙跟着老黑头踏入这片陌生的洼地，暗暗地纳闷着，继续向深处走去。突然，前面传来了婴儿的啼哭声，人们放大了步子，加快了速度，向前搜索着，不时地互相传递着惊异的表情。杂树枝上一些叶片刚从乌黑的笨重的躯壳里挣扎出来，惊喜的瞧着这渴望奇迹的人们，甚至用柔韧的躯体去接触他们，摸摸他们头顶的黑发。洼地满怀信心地迎接并容纳着人们。大伙终于发现了一位用红布小褂包裹的男婴。他躺在两座古老坟包之间，哇哇直哭。说也奇怪，在婴儿的额上居然发现了两滴潮红的血和一片羽毛。那羽毛很像那只的红公鸡的。不过也没准是鸟儿追逐时啄落下来的。就是血迹不太好解释。公鸡终于没有找到。\r\n\r\n自然是老黑头把那男婴抱回家去了。\r\n\r\n剩下的人们整个春季都沉浸在洼地的神秘威力和恩泽中。人们变得沉默寡言。人们的眼睛变得比以前明亮。\r\n\r\n又用了一只公鸡头，老黑头的房子盖好了。第二年春天老黑头的妻子居然开怀了，生了一个女儿，但更多的乳汁是被男婴吮吸了。奇迹没有出现。日子照样一直平常地过下去。日落日出，四季循环，只是洼地变得温情脉脉，只是老黑头不会绝后了。\r\n\r\n+ 1985.5.24\r\n\r\n3.龟王\r\n\r\n从前，在东边的平原深处，住着一位很老很老的石匠。石匠是在自己年轻的时候从一条幽深的山谷里走到这块平原上来的。他来了。他来的那一年战争刚结束。那时他就艺高胆大，为平原上一些著名的宫殿和陵园凿制各色动物。他的名声传遍了整个大平原。很多人都想把闺女嫁给他，但他一个也没娶，只把钱散给众人，孤独地过着清苦的生活。只是谁也不知道他在暗地里琢磨着一件由来已久的念头。这念头牵扯到天、地、人、神和动物。这念头从动物开始，也到动物结束。为此，他到处寻找石头。平原上石头本来不多，只是河滩那儿有一些鹅卵石，而这又不是他所需要的。因此他把那件事儿一直放在心里，从来没向任何一个人提起。他的脾气变得越来越古怪。他的动物作品无论是飞翔的、走动的，还是浮游的，都带着在地层上艰难爬行的姿势与神态，带着一种知天命而又奋力抗争的气氛。他的动物越来越线条矛盾、骨骼拥挤，带着一股要从体内冲出的逼人腥气。这些奇形怪状的棱角似乎要领着这些石头动物弃人间而去。石匠本人越来越瘦，只剩下一把筋骨。那整个夏天他就一把蒲扇遮面，孤独地，死气沉沉地守着这堆无人问津的石头动物，一动也不动，像是已经在阳光下僵化了。似乎他也要挤身于这堆石头动物之间。后来的那个季节里，他坐在门前的两棵枫树下，凝神注视树叶间鸟巢和那些来去匆忙、喂养子息的鸟儿。他的双手似乎触摸到了那些高空翔舞的生灵。但这似乎还不够。于是在后来迟到的冰封时光里，他守着那条河道，在萧瑟的北风中久久伫立。他的眼窝深陷。他的额头像悬崖一样充满暗示，并且饱满自足地面向深谷。他感到河流就像一条很细很长、又明亮又寒冷、带着阳光气味和鳞甲的一条蛇从手心上游过。他的手似乎穿过这些鳞甲在河道下一一抚摸那些人们无法看到的洞穴。泥层和鱼群激烈地繁殖。但这似乎也还不够。于是他在接着而来的春天里，完全放弃了石匠手艺，跟一位农夫去耕田。他笨拙而诚心诚意地紧跟在那条黄色耕牛后面，扶着犁。他的鞭子高举，他的双眼眯起，想起了他这一生痛楚而短促的时光。后来他把那些种子撒出。他似乎听到了种子姐妹们吃吃窃笑的声音。他的衣服破烂地迎风招展。然后他在那田垄里用沾着牛粪和泥巴的巴掌贴着额头睡去。第二天清早，他一跃而起，像一位青年人那样利落。他向那农夫告别，话语变得清爽、结实。他在大地上行走如风。也许他正感到胸中有五匹烈马同时奔踏跃进。他一口气跑回家中，关上了院门，关上了大门和二门，关上了窗户。从此这个平原上石匠销声匿迹。那幢石匠居住的房屋就像一个死宅。一些从前他教过的徒弟，从院墙外往里扔进大豆、麦子和咸猪肉。屋子里有水井，足以养活他。就这样，整整过去了五个年头。\r\n\r\n五年后，这里发了一场洪水。就在山洪向这块平原涌来的那天夜里，人们听到了无数只乌龟划水和爬动的声音，似乎在制止这场洪水。他们互相传递着人们听不懂的语言，呼喊着向他们的王奔去。第二天早上洪水退了。这些村子安然无恙。当人们关心地推开老石匠的院门及大门二门进入他的卧室时，发现他已疲惫地死在床上，地上还有一只和床差不多大的半人半龟的石头形体。猛一看，它很像一只龟王，但走近一看，又非常像人体，是一位裸体的男子。沾着泥水、满是伤痕的脚和手摊开，像是刚与洪水搏斗完毕，平静地卧在那儿。它完全已进化为人了，或者比人更高大些，只不过，它没有肚脐。这不是老石匠的疏忽。它本来不是母体所出。它是从荒野和洪水中爬着来的，它是还要回去的。\r\n\r\n第二年大旱。人们摆上了香案。十几条汉子把这块石龟王抬到干涸的河道中间，挖了一个大坑，埋下了它。一注清泉涌出。雨云相合。以后这块平原再也没有发生过旱灾和水灾。人们平安地过着日子。石匠和龟王被忘记了。也许我是世界上最大的一个傻瓜，居然提起这件大家都已忘记的年代久远的事来。\r\n\r\n+ 1985.5.23夜深\r\n\r\n4.初恋\r\n\r\n从前，有一个人，带着一条蛇，坐在木箱上，在这条大河上漂流，去寻找杀死他父亲的仇人。\r\n\r\n他在这条宽广的河流上漂泊着。他吃着带来的干粮或靠岸行乞。他还在木箱上培土栽了一颗玉米。一路上所有的渔夫都摘下帽子或挥手向他致意。他到过这条河流的许多支系，学到了许多种方言，懂得了爱情、庙宇、生活和遗忘，但一直没有找到杀死自己父亲的仇人。\r\n\r\n这条蛇是父亲在世时救活过来的。父亲把它放养在庄园右边的那片竹林中。蛇越养越大。它日夜苦修，准备有一天报恩。父亲被害的那天，蛇第一次窜出竹林，吐着毒信子，在村外庙宇旁痛苦地扭动着身躯，并围着广场游了好几圈。当时大家只是觉得非常奇怪，觉得这事儿非同小可。后来噩耗就传来了。因此，他以为只有这条蛇还与死去的父亲保持着一线联系。于是他把它装在木箱中，外出寻找杀父的仇人。\r\n\r\n在这位儿子不停地梦到父亲血肉模糊的颜面的时刻，那条蛇却在木箱的底部缩成一团，痛苦地抽搐着，因为它已秘密地爱上了千里之外的另一条蛇。不过那条蛇并不是真正的肉身的蛇，而只是一条竹子编成的蛇。这种秘密的爱，使它不断狂热地通过思念、渴望、梦境、痛苦和暗喜把生命一点一点灌注进那条没有生命的蛇的体内。每到晚上，明月高悬南方的时刻那条竹子编成的蛇就灵气絮绕，头顶上似乎有无数光环和火星飞舞。它的体格逐渐由肉与刺充实起来。它慢慢地成形了。\r\n\r\n终于，在这一天早晨，竹编蛇从玩具房内游出，趁主人熟睡之际，口吐火花似的毒信，咬住了主人的腹部。不一会儿，剧毒发作，主人死去了。这主人就是那位儿子要找寻的杀父仇人。那条木箱内的蛇在把生命和爱注入竹编蛇的体内时，也给它注入了同样深厚的仇恨。\r\n\r\n木箱内的蛇要不告而辞了。夜里它游出了木箱，要穿越无数洪水、沼泽、马群、花枝和失眠，去和那条竹编蛇相会。而它的主人仍继续坐在木箱子上，寻找他的杀父仇人。\r\n\r\n两条相爱的蛇使他这一辈子注定要在河道上漂泊、寻找。一枝火焰在他心头燃烧着。\r\n\r\n+ 1985.5.22\r\n\r\n5.木船\r\n\r\n人们都说，他是从一条木船上被抱下来的。那是日落时分，太阳将河水染得血红，上游驶来一只木船。这个村子的人们都吃惊地睁大眼睛，因为这条河上已经很久很久没有船只航行了。在这个村子的上游和下游都各有一道凶险的夹峡，人称“鬼门老大”和“鬼门老二”。在传说的英雄时代过去以后，就再也没有人在这条河上航行过了。这条河不知坏了多少条性命，村子里的人听够了妇人们沿河哭嚎的声音。可今天，这条船是怎么回事呢？大家心里非常纳闷。这条木船带着一股奇香在村子旁靠了岸。它的形状是那么奇怪，上面洞开着许多窗户。几个好事者跳上船去，抱下一位两三岁的男孩来。那船很快又顺河漂走了，消失在水天交接处。几个好事者只说船上没人。对船上别的一切他们都沉默不语。也许他们是见到什么了。一束光？一个影子？或者一堆神坛前的火？他们只是沉默地四散开。更奇的是，这几位好事者不久以后都出远门去了，再也没有回到这方故乡的土地上来。因此那条木船一直是个谜。（也许，投向他身上的无数束目光已经表明，村里的人们把解开木船之谜的希望寄托在这位与木船有伙伴关系或者血缘关系的男孩身上。）他的养母非常善良、慈爱，他家里非常穷。他从小就酷爱画画。没有笔墨，他就用小土块在地上和墙壁上画。他的画很少有人能看懂。只有一位跛子木匠、一位女占星家和一位异常美丽的、永远长不大的哑女孩能理解他。那会儿他正处于试笔阶段。他的画很类似于一种秘密文字，能够连续地表达不同的人间故事和物体。鱼儿在他这时的画中反复出现，甚至他梦见自己也是一只非常古老的鱼，头枕着陆地。村子里的人们都对这件事感到一种莫名的恐惧，认定这些线条简约形体痛苦的画与自己的贫穷和极力忘却的过去有关系。于是他们就通过他慈爱的养母劝他今后不要再画了，要画也就去画那些大家感到舒服安全的胖娃娃以及莺飞草长小桥流水什么的。但他的手总不能够停止这种活动，那些画像水一样从他的手指流出来，遍地皆是，打湿了别人也打湿他自己。后来人们就随时随地地践踏他的画。不知从什么时候开始，他干脆不用土块了。他坐在那条载他而来的河边，把手指插进水里，画着，这远远看去有些远古仪式的味道，也就没有人再管他了。那些画儿只是在他的心里才存在，永远被层层波浪掩盖着。他的手指唤醒它们，但它们马上又在水中消失。就这样过去了许多岁月，他长成了一条结实的汉子。他的养父死去了，他家更加贫穷。他只得放弃他所酷爱的水与画，去干别的营生。他做过箍桶匠、漆匠、铁匠、锡匠；他学过木工活、裁剪；他表演杂技、驯过兽；他参加过马帮、当过土匪、经历了大大小小的许多场战争，还丢了一条腿；他结过婚、生了孩子；在明丽的山川中他大醉并癜过数次；他爬过无数座高山、砍倒过无数棵大树、渡过无数条波光鳞鳞鱼脊般起伏的河流；他吃过无数只乌龟、鸟、鱼、香喷喷的鲜花和草根；他操持着把他妹子嫁到远方的平原上，又为弟弟娶了一位贤惠温良的媳妇……直到有一天，他把自己病逝的养母安葬了，才长长地舒了一口气。他也老了。大约从这个时候开始，那条木船的气味渐渐地在夜里漾起来了。那气味很特别，不像别的船只散发出的水腥味。那条木船漾出的是一种特别的香气像西方遮天蔽日的史前森林里一种异兽的香气。村子里的人在夜间也都闻到了这香气，有人认为它更近似于月光在水面上轻轻荡起的香气。他坐在床沿上，清楚地看见了自己的一生，同时也清澈地看见了那条木船。它是深红色的，但不像是一般的人间的油漆漆成的。远远看去，它很像是根根原木随随便便地搭成的。但实际上根本不是那么回事，它的结构精巧严密，对着日光和月光齐崭崭的开了排窗户，也许是为了在航行中同时饱饱的吸收那暮春的麦粒、油菜花和千百种昆虫的香味。在木船的边缘上，清晰地永久镌刻着十三颗星辰和一只猫的图案。那星辰和猫的双眼既含满泪水又森然有光。于是，他在家里翻箱倒柜，找出了积攒多年珍藏的碎银玉器，到镇上去换钱买了笔墨开始作画。于是这深宅大院里始终洋溢着一种水的气息，同时还有一种原始森林的气息。偶或，村子里的人们听到了一种声音，一种伐木的丁当声。森林离这儿很远，人们清醒地意识到这是他的画纸上发出的声音。他要画一条木船。他也许诞生在那条木船上。他在那条木船上顺河漂流了很久。而造这条木船的原木被伐倒的声响正在他的画纸上激起回声。然后是许多天叮叮作响的铁器的声音，那是造船的声音。他狂热地握着笔，站在画纸前，画纸上还是什么也没有。他掷笔上床，呼呼睡了三天三夜。直到邻村的人都能听见半空中响起的一条船下水的“嘭嘭”声，他才跳下床来，将笔甩向画纸。最初的形体显露出来了。那是一个云雾遮蔽、峭壁阻挡、太阳曝晒、浑水侵侵的形体。那是一个孤寂的忧伤的形体，船，结实而空洞，下水了，告别了岸，急速驶向“鬼门”。它像死后的亲人们头枕着的陶罐一样，体现了一种存放的愿望，一种前代人的冥冥之根和身脉远隔千年向后代人存放的愿望。船的桅杆上一轮血红的太阳照着它朴实、厚重而又有自责的表情，然后天空用夜晚的星光和温存加以掩盖。就在那条木船在夜间悄悄航行的时辰，孩子们诞生了。这些沾血的健康的孩子们是大地上最沉重的形体。他们的诞生既无可奈何又饱含深情，既合乎规律又意味深长。他艰难的挥动着画笔，描绘这一切。仿佛在行进的永恒的河水中，是那条木船载着这些沉重的孩子们前进。因此那船又很像是一块陆地，一块早已诞生并埋有祖先头盖骨的陆地。是什么推动它前进的呢？是浑浊的河流和从天空吹来的悲壮的风。因此在他的画纸上，船只实实在在地行进着，断断续续地行进着。面对着画和窗外申请生活的缕缕炊烟，他流下了大颗大颗的泪珠。\r\n\r\n终于，这一天到了，他合上了双眼。他留下了遗嘱：要在他的床前对着河流焚烧那幅画。就在灰烬冉冉升上无边的天空的时候，那条木船又出现了。它逆流而上，在村边靠了岸。人们把这位船的儿子的尸首抬上船去，发现船上没有一个人。船舱内盛放着五种不同颜色的泥土。那条木船载着他向上游驶去，向他们共同的诞生地和归宿驶去。有开始就有结束。也许在它消失的地方有一棵树会静静长起。\r\n\r\n+ 1985.5.25\r\n\r\n6.南方\r\n\r\n我81岁那年，得到了一幅故乡的地图。上面绘有断断续续的曲线，指向天空和大地，又似乎形成一个圆圈。其中的河流埋有烂木板、尸体和大鱼。我住在京城的郊外，一个人寂寞地做着活儿，手工活儿，为别人缝些布景和道具。我在房子中间也得把衣领竖起，遮蔽我畏寒的身体。那好像是一个冬天，雪花将飘未飘的时候，一辆黑色的木轮车把我拉往南方。我最早到达的地方有一大片林子。在那里，赶车人把我放在丛树中间的一块花石头上，在我的脚下摆了好些野花。他们把我的衣服撕成旗帜的模样，随风摆动。他们便走了。开始的时候，我不能把这理解为吉兆。直到有一颗星星落在我的头顶上，事情才算有了眉目。我的头顶上火星四溅，把我的衣裳和那张故乡曲折的地图烧成灰烬，似乎连我的骨头也起了大火。就在这时，我睁开了眼睛，肉体新鲜而痛苦，而对面的粗树上奇迹般的拴了一匹马。它正是我年轻力壮时在另一片林子里丢失的。这，我一眼就能看出事情非同小可。为了壮胆，我用手自己握住，做出饮酒的姿式。这匹马被拴在树上，打着响鼻。我牵着它走向水边，准备洗洗身子，忽然发现水面上映出一位三十多岁的汉子，气得我当场往水里扔了块石头。就这样，北方从我的手掌上流失干净。等一路打马，骑回故乡的小城，我发现故乡的小雨下我已经长成二十岁的身躯，又注入了情爱。我奔向那条熟悉的小巷。和几十年前一样：外面下着雨，里面亮着灯。我像几十年前一样攀上窗户，进屋时发现我当年留下的信件还没有拆开。突然，隔壁的房间里传来她吃吃的笑声。我惊呆了，只好跳下窗户，飞身上马，奔向山坡。远远望见了我家的几间屋子，在村头立着。我跃下马，滚入灰尘，在门前的月下跌一跤，膝盖流着血。醒来时已经用红布包好。母亲坐在门前纺线，仿佛做着一个古老的手势。我走向她，身躯越来越小。我长到3岁，抬头望门。马儿早已不见。\r\n\r\n---\r\n\r\n+ 1985.8"},{"id":"short/1983/七月的大海","title":"七月的大海","type":"short","year":"1983","body":"老乡们，谁能在海上见到你们真是幸福！\n我们全都背叛自己的故乡\n我们会把幸福当成祖传的职业\n放下手中痛苦的诗篇\n今天的白浪真大！老乡们，他高过你们的粮仓\n如果我中止诉说，如果我意外地忘却了你\n把我自己的故乡抛在一边\n我连自己都放弃　更不会回到秋收　农民的家中\n在七月我总能突然回到荒凉\n赶上最后一次\n我戴上帽子　穿上泳装　安静地死亡\n在七月我总能突然回到荒凉"},{"id":"short/1986/八月尾","title":"八月尾","type":"short","year":"1986","body":"既使我是一个粗枝大叶的人\n我也看见了红豹子、绿豹子\n当流水淙淙\n八月的泉水\n穿越了山冈\n月亮是红豹子\n树林是绿豹子\n少女是你们俩\n生下的花豹子\n既使我是一个粗枝大叶的人\n少女，树林中\n你也藏不住了\n八月的尾，树林绿，月亮红\n不久我将看到树叶绿落了\n栗树底下\n脊背上挂着鹌鹑的人\n少女，无论如何\n粗枝大叶的人\n看见你啦\n---\n● 1986.8.20夜"},{"id":"short/1987/两行诗","title":"两行诗","type":"short","year":"1987","body":"1.\n海水点亮我\n垂死的头颅\n2.\n我是黄昏安放的灵床：车轮填满我耻辱的形象\n落日染红的河水如阵阵鲜血涌来（86.87.88）\n3.\n起风了\n太阳的音乐　太阳的马\n4.\n在远远被雪山围住的亲人中央\n为他画一果实　画两只乳房\n5.\n疾病中的酒精\n是一对黑眼睛\n6.\n妹妹瞎了　但她有六根手指\n她被荷马抱在怀中\n7.\n寂静太喜爱\n闪电中的猎人"},{"id":"short/1988/乳房","title":"乳房","type":"short","year":"1988","body":"在城外荒山野岭之上\n四季之风常吹的地方\n柔和甘美的蜜形成\n---\n● 1988.4"},{"id":"short/1989/四姐妹","title":"四姐妹","type":"short","year":"1989","body":"荒凉的山冈上站着四姐妹\n所有的风只向她们吹\n所有的日子都为她们破碎\n空气中的一棵麦子\n高举到我的头顶\n我身在这荒芜的山冈\n怀念我空空的房间，落满灰尘\n我爱过的这糊涂的四姐妹啊\n光芒四射的四姐妹\n夜里我头枕卷册和神州\n想起蓝色远方的四姐妹\n我爱过的这糊涂的四姐妹啊\n像爱着我亲手写下的四首诗\n我的美丽的结伴而行的四姐妹\n比命运女神还要多出一个\n赶着美丽苍白的奶牛　走向月亮形的山峰\n到了二月，你是从哪里来的\n天上滚过春天的雷，你是从哪里来的\n不和陌生人一起来\n不和运货马车一起来\n不和鸟群一起来\n四姐妹抱着这一棵\n一棵空气中的麦子\n抱着昨天的大雪，今天的雨水\n明日的粮食与灰烬\n这是绝望的麦子\n请告诉四姐妹：这是绝望的麦子\n永远是这样\n风后面是风\n天空上面是天空\n道路前面还是道路\n---\n● 1989.2.23"},{"id":"essay/日记","title":"日记","type":"essay","year":"unknown","body":"1986年8月\n从哪儿写起呢？这是一个夜里，我想写我身后的，或者说，我房子后边的一片树林子。我常常在黄昏时分，盘亘其中，得到无数昏暗的乐趣，寂寞的乐趣。有一队鸟，在那县城的屋顶上面，被阳光逼近，久久不忍离去。\n（1） 我是说，我是诗，我是肉，抒情就是血。歌德、叶芝，还有俄国的诗人们、英国的诗人们，都是古典抒情的代表。抒情，质言之，就是一种自发的举动。它是人的消极能力：你随时准备歌唱，也就是说，像一枚金币，一面是人，另一面是诗人。不如说你主要是人，完成你人生的动作，这动作一面映在清澈的歌唱的泉水中——诗。不，我还没有说出我的意思，我是说，你首先是恋人，其次是诗人；你首先是裁缝，是叛徒，是同情别人的人，是目击者，是击剑的人，其次才是诗人。因为，诗是被动的，是消极的，也就是在行为的深层下悄悄流动的。与其说它是水，不如说它是水中的鱼；与其说它是阳光，不如说它是阳光下的影子。别的人走向行动，我走向歌唱；就像别的人是渔夫，我是鱼。\n抒情，比如说云，自发的涌在高原上。太阳晒暖了手指、木片和琵琶，最主要的是，湖泊深处的王冠和后冠。湖泊深处，抒情就是，王的座位。其实，抒情的一切，无非是为了那个唯一的人，心中的人，B，劳拉或别人，或贝亚德。她无比美丽，尤其纯洁，够得上诗的称呼。\n就连我这些话也处在阴影之中。\n（2）古典：当我从当代、现代走向古典时，我是遵循泉水的原理或真理的。在那里，抒情还处于一种清澈的状态，处于水中王冠的自我审视。在萨福那里，水中王位不会倾斜。你的牧羊人斜靠门厅而立。岩间陶瓶牵下水来。\n（3）语言层次：是的，中国当前的诗，大都处于实验阶段，基本上还没有进入语言。我觉得，当前中国现代诗歌对意象的关注，损害甚至危及了她的语言要求。\n夜空很高，月亮还没有升起来。\n而月亮的意象，即某种关联自身与外物的象征物，或文字上美丽的呈现，不能代表诗歌中吟咏的本身。它只是活在文字的山坡上，对于流动的语言的小溪则是阻障。\n但是，旧语言旧诗歌中的平滑起伏的节拍和歌唱性差不多已经死去了。死尸是不能出土的，问题在于坟墓上的花枝和青草。新的美学和新语言新诗的诞生不仅取决于感性的再造，还取决于意象与咏唱的合一。意象平民必须高攀上咏唱贵族。语言的姻亲定在这个青月亮的夜里。即，人们应当关注和审视语言自身，那宝石，水中的王，唯一的人。劳拉哦劳拉。\n（4）黎明。黎明并不是一种开始，她应当是最后来到的，收抬黑夜尸体的人。我想，这古典是一种黎明，当彼岸的鹿、水中的鹿和心上的鹿，合而为一时，这古典是一种黎明。\n1986年11月18日\n我觉得今天非得写点儿什么。\n这些天，我觉得全身骨骼格格响，全身的全副的锁链一下挣脱了，非常像《克里斯朵夫》上的一些描写。\n我一直就预感到今天是一个很大的难关。一生中最艰难、最凶险的关头。我差一点被毁了。两年来的情感和烦闷的枷锁，在这两个星期（尤其是前一个星期）以充分显露的死神的面貌出现。我差一点自杀了：我的尸体或许已经沉下海水，或许已经焚化；父母兄弟仍在痛苦，别人仍在惊异，鄙视……但那是另一个我——另一具尸体。那不是我。我坦然地写下这句话：他死了。我曾以多种方式结束了他的生命。但我活下来了，我——一个更坚强的他活下来了，我第一次体会到了强者的尊严、幸福和神圣。我又生活在圣洁之中。过去蜕下了，如一张皮。我对过去的一张面孔，尤其是其中一张大扁脸充满了鄙视……我永远摆脱了，我将大踏步前进。\n我体会到了生与死的两副面孔，似乎是多赚了一条生命。这生命是谁重新赋予的？我将永远珍惜生命——保护她，强化她，使她放出美丽光华。今年是我生命中水火烈撞、龙虎相斗的一年。在我的诗歌艺术上也同样呈现出来。这种绝境。这种边缘。\n在我的身上在我的诗中我被多次撕裂。目前我坚强地行进，像一个年轻而美丽的神在行进。《太阳》的第一篇越来越清晰了。我在她里面看见了我自己美丽的雕像：再不是一些爆炸中的碎片。日子宁静——像高原上的神的日子。\n我现在可以对着自己的痛苦放声大笑！\n而突然之间，克里斯朵夫好像看到自己就躺在死者的地位，那可怕的话就在自己的嘴里喊出来，而虚度了一生，无可挽回地虚度了一生的痛苦，就压在自己的心上。于是他不胜惊骇地想着；“宁可受尽世界上的痛苦，受尽世界上的灾难，可千万不能到这个地步！”……他不是险些到了这一地步吗？他不是想毁灭自己的生命，毫无血气地逃避他的痛苦吗？以死来鄙薄自己，出卖自己，否定自己的信仰……但世界上最大的刑罚，最大的罪过，踉这个罪过相比，所有的痛苦，所有的欺骗，还不等于小孩子的悲伤？\n他看到人生是一场无休、无歇、无情的战斗。凡是要做个够得上称为人的人，都得时时刻刻向无形的敌人作战：本能中那些致人死命的力量、乱人心意的欲望、暧昧的念头、使你堕落使你自行毁灭的念头，都是这一类的顽敌。他看到自己差一点儿坠入深渊，也看到幸福与爱情只是一时的欺罔，为是叫你精神解体，自暴自弃。于是这十五岁的清教徒听见了他的上帝的声音。\n1987年11月14日\n仿佛是很久以前的一支笔，她放在那里，今夜我又重新握起。头绪很多，我简直不知从何写起。而且，因为全身心沉浸在诗歌创作里，任何别的创作或活动都简直被我自己认为是浪费时同。我一直想写一种经历或小说，总有一天它会脱离阵痛而顺利产出。但如今，我实在是全身心沉浸在我的诗歌创造中，这样的日子是可以称之为高原的日子、神的日子、黄金的日子、王冠的日子。我打算明年去南方，去遥远的南国之岛，去海南。在那里，在热带的景色里，我想继续完成我那包孕黑暗和光明的太阳。真的以全部的生命之火和青春之火投身于太阳的创造。以全身的血、土与灵魂来创造永恒而又常新的太阳这就是我现在的日子。\n应该说，现在和这两年，我在向歌德学习精神和诗艺，但首先是学习生话。但是，对于生话是什么？生活的现象又包孕着什么意义？人类又该怎样地生活？我确实也是茫然而混沌，但我确实是一往直前地拥抱生活，充分地生活。我挚烈地活着，亲吻，毁灭和重造，犹如一团大火，我就在大火中心。那只火焰的大鸟：“燃烧”——这个诗歌的词，正像我的名字，正像我自己向着我自己疯狂的微笑。这生活与生活的疯狂，我应该感激吗？我的燃烧似乎是盲目的，燃烧仿佛中心青春的祭典。燃烧指向一切，拥抱一切，又放弃一切，劫夺一切。生活也越来越像劫夺和战斗，像“烈”。随着生命之火、青春之火越烧越旺，内在的生命越来越旺盛，也越来越盲目。因此燃烧也就是黑暗——甚至是黑暗的中心、地狱的中心。我和但丁不一样，我在这样早早的青春中就已步入地狱的大门，开启生活和火焰的大门。我仿佛种种现象，怀抱各自本质的火焰，在黑暗中冲杀与砍伐。我的诗歌之马大汗淋漓，甚至像在流血——仿佛那落日和朝霞是我从耶稣诞生的马厩里牵出的两匹燃烧的马、流血的马——但是它越来越壮丽，美丽得令人不敢逼视。\n我要把粮食和水、大地和爱情这汇集一切的青春统统投入太阳和火，让它们冲突、战斗、燃烧、混沌、盲目、残忍甚至黑暗。我和群龙一起在旷荒的大野闪动着亮如白昼的明亮眼睛，在飞翔，在黑暗中舞蹈、扭动和撕杀。我要首先成为群龙之首，然后我要杀死这群龙之首，让它进入更高的生命形式。生命在荒野不可阻挡地溢出，舞蹈。我和黑夜，同母。\n但黑暗总是永恒，总是充斥我骚乱的内心。它比日子本身更加美丽，是日子的诗歌。创造太阳的人不得不永与黑暗为兄弟，为自己。\n魔——这是我的母亲、我的侍从、我的形式的生命。它以醉为马，飞翔在黑暗之中，以黑暗为粮食，也以黑暗为战场。我与欲望也互通心声，互相壮大生命的凯旋，互为节奏，为夜半的鼓声和急促的屠杀。我透过大火封闭的牢门像一个魔。对我自己困在烈焰的牢中即将被烧死——我放声大笑。我不会笑得比这个更加畅快了！我要加速生命与死亡的步伐。我挥霍生命也挥霍死亡。我同是天堂和地狱的大笑之火的主人。\n想起八年前冬天的夜行列车，想起最初对女性和美丽的温暖感觉——那时的夜晚几乎像白天，而现在的白天则更接近或等于真正的子夜或那劳动的作坊和子宫。我处于狂乱与风暴中心，不希求任何的安慰和岛屿，我旋转犹如疯狂的日。我是如此的重视黑暗。以至我要以《黑夜》为题写诗。这应该是一首真正伟大的诗。伟大的抒情的诗。在《黑夜》中我将回顾一个飞逝而去的过去之夜、夜行的货车和列车、旅程的劳累和不安的辗转迁徙、不安的奔驰于旷野同样迷乱的心，渴望一种夜晚的无家状态。我还要写到我结识的一个个女性、少女和女人。她们在童年似姐妹和母亲，似遥远的滚动而退却远方的黑色的地平线。她们是白天的边界之外的异境，是异国的群山，是别的民族的山河，是天堂的美丽灯盏一般挂下的果实，那样的可望而不可及。这样她们就悸动如地平线和阴影，吸引着我那近乎自恋的童年时代。接下来就是爆炸和暴乱，那革命的少年时代——这疯狂的少年时代的盲目和黑暗里的黑夜至今也未在我的内心平息和结束。少年时代他迷恋超越和辞句，迷恋一切又打碎一切，但又总是那么透明，那么一往情深，犹如清晨带露的花朵和战士手中带露的枪枝。那是没有诗而其实就是盲目之诗的岁月，执着于过眼烟云的一切，忧郁感伤仿佛上一个世纪的少年，为每一张匆匆闪过的脸孔而欣悦。每一年的每一天都会爱上一个新的女性，犹如露珠日日破裂日日重生，对于生命的本体和大地没有损害，只是增添了大地诗意的缤纷、朦胧和空幻。一切如此美好，每一天都有一个新的异常美丽的面孔等着我去爱上。每一个日子我都早早起床，我迷恋于清晨，投身于一个又一个日子，那日子并不是生活——那日子他只是梦，少年的梦。这段时间在我是较为漫长的，因为我的童年时代是结束得太早太快了！\n---\n 以下三页被撕掉。"},{"id":"short/1983/不幸","title":"不幸","type":"short","year":"1983","body":"四月的日子　最好的日子\n和十月的日子　最好的日子\n比四月更好的日子\n像两匹马　拉着一辆车\n把我拉向医院的病床\n和不幸的病痛\n有一座绿色悬崖倒在牧羊人怀中\n两匹马\n在山上飞\n两匹马\n白马和红马\n积雪和枫叶\n犹如姐妹\n犹如两种病痛\n的鲜花"},{"id":"short/1984/不要问我那绿色是什么","title":"不要问我那绿色是什么","type":"short","year":"1984","body":"头发\n灌满阳光和大沙\n我是荒野上第一根被晒坏的石柱\n耕种黑麦\n不要问我那绿色是什么\n小鸟像几管颜料\n粘住我的面颊\n树下有一些穿着服装的陌生人\n那时我已走过青海湖，影子滑过钢蓝的冰大坂\n不要问我那绿色是什么\n木筐挑着土\n一步迈上秦岭\n秦岭，最初的山\n仍然在回忆我们，一窝黄黑的小脑袋——孩子啊\n不要问我那绿色是什么\n我避开所有的道路\n最后长成\n站在风熏寓言的石幕上\n长成\n不要问我那绿色是什么\n---\n● 1984.12"},{"id":"short/1986/哭泣","title":"哭泣","type":"short","year":"1986","body":"哭泣——一朵乌黑的火焰\n我要把你接进我的屋子\n屋顶上有两位天使拥抱在一起\n哭泣——我是湖面上最后一只天鹅\n黑色的天鹅像我黑色的头发在湖水中燃烧\n用你这黑色肉体的谷仓带走我\n哭泣——一朵乌黑的新娘\n我要把你放在我的床上\n我的泪水中有对自己的哀伤\n---\n● 1986.12"},{"id":"short/1987/为什么你不生活在沙漠上","title":"为什么你不生活在沙漠上","type":"short","year":"1987","body":"为什么你不生活在沙漠上\n英雄的可怜而可爱的伴侣\n我那唯一的人在何方？\n用酒调着火所能留下的灰　写下几首诗？\n我的形象开始上升\n主宰着你的心灵！\n孤独守候着\n一个健康的声音！\n绝望之神　你在何方？\n为什么你不生活在沙漠上！\n我是谁手里磨刀的石块？\n我为何要把赤子带进海洋\n海子躺在地上\n天空上\n海子的两朵云\n说：\n你要把事业留给兄弟　留给战友\n你要把爱情留给姐妹　留给爱人\n你要把孤独留给海子　留给自己\n---\n● 1987.5.27夜书"},{"id":"short/1988/在一个阿拉伯沙漠的村镇上","title":"在一个阿拉伯沙漠的村镇上","type":"short","year":"1988","body":"镇子\n而今我一无是处\n坐在镇子的一头\n这是一个不守诺言的时刻\n头巾上星光璀璨\n阿拉伯沙漠的村镇已是茫茫黄昏\n东面一万里是大海\n西边一万里是雪山\n镇子\n三月过去了\n四月过去了\n上一个秋天的谈话过去了\n请在这个日子光临做我的客人\n镇子上——天刚蒙蒙亮\n草原上——夜的马很大\n少言寡语，见一面，短一日\n镇子\n你坐在\n小山坡上\n你坐在小山坡上\n一个人住在旧粮仓里写诗\n又是生日。一匹\n多年的\n马\n飞来了\n一匹多年的\n旧布包不好伤口\n镇子\n点亮一根蜡烛\n我们死后相聚在湖上\n宛如生前。“俄狄普斯——烛光也曾照你杀父娶母。”\n烛火静静叫喊\n绿汪汪的水静静叫喊\n看见草原和女人的一位盲人\n——在烛火静静叫喊\n镇子\n生日中\n你像一位美丽的\n女俘虏\n坐在故乡的\n打麦场上\n夜深在村庄摸门\n我的什么\n遗忘在山上\n浪子　你怎么了　你打算用什么办法\n将那水中明月\n戴在头上\n暮色中的马头\n斜靠在小镇上\n姐妹们早已睡下\n打谷场上　空无一人\n空无一人\n天亮\n守夜人\n走到神秘的村子\n---\n● 1988.5删"},{"id":"short/1989/太平洋的献诗","title":"太平洋的献诗","type":"short","year":"1989","body":"太平洋　丰收之后的荒凉的海\n太平洋　在劳动后的休息\n劳动以前　劳动之中　劳动以后\n太平洋是所有的劳动和休息\n茫茫太平洋　又混沌又晴朗\n海水茫茫　和劳动打成一片\n和世界打成一片\n世界头枕太平洋\n世界头枕太平洋　雨暴风狂\n上帝在太平洋上度过的时光　是茫茫海水隐含不露的希望\n太平洋没有父母　在太阳下茫茫流淌　闪着光芒\n太平洋像是上帝老人看穿一切、眼角含泪的眼睛\n眼泪的女儿，我的爱人\n今天的太平洋不是往日的海洋\n今天的太平洋只为我流淌　为着我闪闪发亮\n我的太阳高悬上空　照耀这广阔太平洋\n---\n● 1989.2.2"},{"id":"essay/民间主题传说原序","title":"民间主题（《传说》原序）","type":"essay","year":"unknown","body":"月亮还需要在夜里积累\n月亮还需要在东方积累\n在隐隐约约的远方，有我们的源头、大鹏鸟和腥日白光。西方和南方的风上一只只明亮的眼睛瞩望着我们。回忆和遗忘都是久远的。对着这块千百年来始终沉默的天空，我们不回答，只生活。这是老老实实的、悠长的生活。磨难中句子变得简洁而短促。那些平静淡泊的山林在绢纸上闪烁出灯火与古道。西望长安，我们一起活过了这么长的年头，有时真想问一声：亲人啊，你们是怎么过来的，甚至甘愿陪着你们一起陷入深深的沉默。但现在我不能。那些民间主题无数次在梦中凸现。为你们的生存作证，是他的义务，是诗的良心。时光与日子各各不同，而诗则提供一个瞬间。让一切人成为一切人的同时代人，无论是生者还是死者。\n老辈人坐在一棵桑树下。只有早起的人，彻夜未眠的人，死去的星星和花的头颅才知道下一个时辰是什么。\n在老人与复活之间，是一段漫长的民间主题，那是些辛苦的，拥挤的，甚至是些平庸的日子，是少数人受难而多数人也并不幸福的日子，是故乡、壮士、坟场陌桑与洞窟金身的日子，是鸟和人挣扎的日子。当然也有宁静的夜晚，沉思，与山顶之悟。清风披发，白鸟如歌，地面上掠过一群低低的喃语和叹息。老树倒下的回声，月光下无数生灵的不眠之夜，醉酒与穷人的诗思，白云下难忘的和钟情的，红豆和鱼雁、雨、牛与奶……反正我怎么也叙述不尽这一切。遥远了，远了——\n克利说：“在最远的地方，我最虔诚。”是啊，这世界需要的不是反复倒伏的芦苇，旗帜和鹅毛，而是一种从最深的根基中长出来的东西。真东西。应该向上生长出来。或许我们已见到了部份肢体，他像星星一样戴着王冠秘密前进。在高原和高原之间，在兄弟和兄弟之间，情谊正在生长。夏季的植物像河流一样流过我的胸脯，甚至日子也将走出传说之门。\n灵性必定要在人群中复活。复活的那一天必定是用火的日子。胚芽上必定会留下创世的黑灰。一层肥沃的黑灰。我向田野深处走去，又遇见那么多母亲、爱人和钟声。\n当然，这样一只铜的或金的胳膊一定已经在传说与现实之间铸造着。可能有一种新的血液早就在呼唤着我们。种子和河流都需要这样一种大风。这风也许是从夜里来的，就像血液是从夜里来的一样。这是一个胚胎中秘密的过程。母亲微笑着感受新生者的力量。这是一个辉煌的瞬间。我和我的伙伴们守候着。有些句子肯定早就存在于我们之间；有些则刚刚痛苦地诞生——他们硬是从胸膛中抠出这些血红的东西；还有些仅仅是一片留给明天的空白。那支给朋友们的歌已这样唱出“月亮还需要在夜里积累／月亮还需要在东方积累”。\n对于血液来说，激动和澄清会不会是同一个过程呢？\n最后一个问题，就是如何从心灵走出来。走出心灵要比走进心灵更难。史诗是一种明澈的客观。在他身上，心灵矫揉夸张的翅膀已蜕去，只剩下肩胛骨上的结疤和一双大脚。走向他，走向地层和实体，还是一项艰难的任务。就像通常所说的那样——就从这里开始吧。"},{"id":"short/1983/东方山脉","title":"东方山脉","type":"short","year":"1983","body":"三角洲和碎花的笑\n一起甩到脑后\n一块大陆在愤怒地骚动\n北方平原上红高粱\n已酿成新生的青春期鲜血\n养育火红的山冈成群\n像浪\n倾斜着地平线和远岸的大陆架\n将东方螺的传说雕成圆锥形\n这里，道道山梁架住了天空\n让大川从胸中涌出\n让头顶长满密林和喷火口\n为了光明\n我生出一对又一对\n深黑的眼睛和穴居的人群\n用雪水在石壁上画了许多匹野牛\n他们赶着羊就出发了\n手中的火种发芽\n和麦粒一道支起窝棚\n后来情歌在平坦的地方\n绘出语法规则\n绘成村落\n敲击着旷野\n即使脚下布满深谷\n即使洪水淹没了我的兄弟\n即使姐妹们的哭泣\n升到天上结成一个又一个响雷\n即使东方的部落群没有写进书本\n因而只在孩子琥珀色眼球里丛生\n根连着根\n像野草一样布满荒原\n即使旗帜迟迟没有\n从那方草坪上升起\n因而文字仿佛艰涩\n历史仿佛漫长\n我捞起岛屿\n和星星般隐逸的情感\n我亲吻每一座坟头\n让它们吐出桑叶\n在所有的河岸上排成行\n划分着大江流向\n划分着领土\n我把最东方留给一片高原\n留给龙族人\n让他们开始治水\n让他们射下多余的太阳\n让他们插上毛羽\n就在那面东亚铜鼓上出发\n会有的，会的\n会有鹭鸶和青草鱼一样的龙舟\n会有创造的季节\n请放出鸥群\n和关在沼地里的绿植被\n把伏向小河的家乡丘陵拉直\n列队，由北压向南\n由西压向东\n把我的岩石和汉子的三角肌\n一同描在族徽上吧\n把我的松涛连成火把吧\n把我的诗篇\n在哭泣后反抗的夜里\n传往远方吧\n让孩子们有一本自己的历史画\n让我去拥抱世界\n---\n● 1983"},{"id":"short/1984/中国器乐","title":"中国器乐","type":"short","year":"1984","body":"锣鼓声\n锵锵\n音乐的墙壁上所有的影子集合\n去寻找一个人\n一个善良的主人\n锵锵\n去寻找中国老百姓\n泪水锵锵\n中国器乐用泪水寻找中国老百姓\n秦腔\n今夜的闪电\n一条条\n跳入我怀中，跳入河中\n蛇皮二胡拉起\n南瓜地里沾满红土的\n孩子思乳的哭声\n夜空漫漫长长\n哭吧\n鱼含芦苇\n爬上岸来准备安慰\n但是\n哭吧\n瞎子阿炳站在泉边说\n月亮今夜也哭得厉害\n断断续续的口弦声钻入港口的外国船舱\n第一水手呆了\n第二水手呆了\n那些歌曲钉在黄发水手的脑袋上\n---\n● 1984.11"},{"id":"short/1986/坐在纸箱上想起疯了的朋友们","title":"坐在纸箱上想起疯了的朋友们","type":"short","year":"1986","body":"旧菊花安全\n旧枣花安全\n扪摸过的一切\n都很安全\n地震时天空很安全\n伴侣很安全\n喝醉酒时酒杯很安全\n心很安全\n---\n● 1986.2"},{"id":"short/1987/九寨之星","title":"九寨之星","type":"short","year":"1987","body":"很久很久的一盏灯\n很久很久以前女神点亮的一盏灯\n落满岁月尘土的一盏灯\n当她面对湖水\n女神的镜子中\n变成了两盏\n那就是你的一双眼睛\n柔似湖水　亮如光明\n---\n● 1987.10"},{"id":"short/1988/夜色","title":"夜色","type":"short","year":"1988","body":"在夜色中\n我有三次受难：流浪、爱情、生存\n我有三种幸福：诗歌、王位、太阳\n---\n● 1988.2.28.夜"},{"id":"short/1989/折梅","title":"折梅","type":"short","year":"1989","body":"站在那里折梅花\n山坡上的梅花\n寂静的太平洋上一封信\n寂静的太平洋上一人站在那里折梅花\n折梅人在天上\n天堂大雪纷纷　一人踏雪无痕\n天堂和寂静的天山一样\n大雪纷纷\n站在那里折梅\n亚洲，上帝的伞\n上帝的斗篷，太平洋\n太平洋上海水茫茫\n上帝带给我一封信\n是她写给我的信\n我坐在茫茫太平洋上折梅，写信\n---\n● 1989.2.3"},{"id":"short/1983/九月","title":"九月","type":"short","year":"1983","body":"目击众神死亡的草原上野花一片\n远在远方的风比远方更远\n我的琴声呜咽　泪水全无\n我把这远方的远归还草原\n一个叫马头　一个叫马尾\n我的琴声呜咽　泪水全无\n远方只有在死亡中凝聚野花一片\n明月如镜高悬草原映照千年岁月\n我的琴声呜咽　泪水全无\n只身打马过草原\n---\n● 1986"},{"id":"short/1984/亚洲铜","title":"亚洲铜","type":"short","year":"1984","body":"亚洲铜，亚洲铜\n祖父死在这里，父亲死在这里，我也将死在这里\n你是唯一的一块埋人的地方\n亚洲铜，亚洲铜\n爱怀疑和飞翔的是鸟，淹没一切的是海水\n你的主人却是青草，住在自己细小的腰上，守住野花的手掌和秘密\n亚洲铜，亚洲铜\n看见了吗？那两只白鸽子，它是屈原遗落在沙滩上的白鞋子\n让我们——我们和河流一起，穿上它吧\n亚洲铜，亚洲铜\n击鼓之后，我们把在黑暗中跳舞的心脏叫做月亮\n这月亮主要由你构成\n---\n● 1984.10"},{"id":"short/1986/我感到魅惑","title":"我感到魅惑","type":"short","year":"1986","body":"天上的音乐不会是手指所动\n手指本是四肢安排的花豆\n我的身子是一份甜蜜的田亩\n我感到魅惑\n我就想在这条魅惑之河上渡过我自己\n我的身子上还有拔不出的春天的钉子\n我感到魅惑\n美丽女儿，一流到底\n水儿仍旧从高向低\n坐在三条白蛇编成的篮子里\n我有三次渡过这条河\n我感到流水滑过我的四肢\n一只美丽鱼婆做成我缄默的嘴唇\n我看见，风中飘过的女人\n在水中产下卵来\n一片霞光中露出来的长长的卵\n我感到魅惑\n满脸草绿的牛儿\n倒在我那牧场的门厅\n我感到魅惑\n有一种蜂箱正沿河送来\n蜂箱在睡梦中张开许多鼻孔\n有一只美丽的鸟面对树枝而坐\n我感到魅惑\n我感到魅惑\n小人儿，既然我们相爱\n我们为什么还在河畔拔柳哭泣\n---\n● 1986.9"},{"id":"short/1987/九首诗的村庄","title":"九首诗的村庄","type":"short","year":"1987","body":"秋夜美丽\n使我旧情难忘\n我坐在微温的地上\n陪伴粮食和水\n九首过去的旧诗\n像九座美丽的秋天下的村庄\n使我旧情难忘\n大地在耕种\n一语不发，住在家乡\n像水滴、丰收或失败\n住在我心上\n---\n● 1987"},{"id":"short/1988/大草原-大雪封山","title":"大草原　大雪封山","type":"short","year":"1988","body":"公社里\n有一个人\n歌唱雨雪\n和倾斜的山坡\n秋天　一闪而过\n多少丰收的村庄不见踪影\n昨天的闪电\n劈碎了车马\n大雪封山\n从今后日子艰难\n---\n● 1988.11.11-20"},{"id":"short/1989/拂晓","title":"拂晓","type":"short","year":"1989","body":"苍茫的拂晓，黎明\n穿上你好久没穿的旧裙子，跟我走\n夜的女儿，朝霞的姐妹，黎明\n穿过这些山峰，坐落\n在这些粗笨的远方和近处\n穿过大地的头颅\n和河畔这些无人问津的稀疏的荒草\n跟我走吧，黎明\n你是太阳之火顶端\n青色的烟飘渺不定\n你就是深夜里刚刚消失又骤然升起的歌声\n你穿着一件昨夜弄脏的衣裙走向今天\n你嘴里叼着光芒和刀子，披散下的头发遮住\n眼睛、乳房和面容\n提着包袱，渡过肮脏的日子，跟我走吧\n这鲜血的包袱一路喧闹\n一路喧闹，不得安宁\n带上你褐色的地母的乳房跟我走吧\n哪怕包袱里只有地瓜，乳房里只有水土\n悄悄沿着这原始的大地走去\n肮脏的大河在尽头猛然将我们推向海洋\n苍茫的拂晓，原始的女人\n原始的日子中原始的母亲\n陌生的妻子披着鱼皮\n在海上遨游着产籽的女儿\n敲打着船壳　海洋的埋葬\n太平洋上没有一口钟和一棵梅树\n没有一枝梅花在太平洋上开放\n只有镇子中央\n废弃不用的土和石头\n堆成的荒凉山坡\n跟我走吧，黎明\n所有的你都是同一个你\n我难以分辨\n谁是你　谁是真正的你\n谁又再一次是你\n绝望的只是你\n永不离开的你\n不在天地间消失\n所有的你都默默包扎着死去的你\n年老丑陋的女王，这黑夜内部无穷无尽的母亲女王\n我早就说过，断头流血的是太阳\n所有的你都默默流向同一个方向\n断头台是山脉全部的地方\n跟我走吧，抛掷头颅，洒尽热血，黎明\n新的一天正在来临\n---\n● 1989.2.24"},{"id":"short/1983/九盏灯组诗","title":"九盏灯（组诗）","type":"short","year":"1983","body":"九盏灯（组诗）\n1.少年儿子怀孕\n呕吐的儿子　低音的鼓\n伏在海水深处\n而离你身（？）体更近\n也就胀破了大地\n一片草蛾\n青草破了\n他破在一个怀孕的花上\n2.月　亮\n海底下的大火，经过山谷中的月亮\n经过十步以外的少女\n风吹过月窟\n少女在木柴上\n每月一次，发现鲜血\n海底下的大火咬着她的双腿\n我看见远离大海的少女\n脸上大火熊熊\n八月的月窟同样大火熊熊\n背负积水的少女走进痛苦的树林\n那鲜血淋注的木柴排成的漆黑的树林\n3.初　恋\n在月亮上我双手捂住眼睛\n在水滴中我双手捂住眼睛\n月亮上一个丫头昏睡不醒\n月亮上一个丫头明亮的眼睛\n月亮上我披衣而起　身如水滴\n4.失恋之夜\n我轻轻走过去关上窗户\n我的手扶着自己　像清风扶着空空的杯子\n我摸黑坐下　询问自己\n杯中幸福的阳光如今何在？\n我脱下破旧的袜子\n想一想明天的天气\n我的名字躺在我身边\n像我重逢的朋友\n我从没有像今夜这样珍惜自己\n---\n● 1985；1986"},{"id":"short/1985/中午","title":"中午","type":"short","year":"1985","body":"中午是一丛美丽的树枝\n中午是一丛眼睛画成的树枝\n看着你\n看着你从门前走过\n或是走进我的门\n走进门\n你在\n你在一生的情义中\n来到\n落下布帆\n仿佛水面上我握住你的手指\n（手指\n是船）\n心上人\n爱着，第一次\n都很累，船\n泊在整个清澈的中午\n“你喝水吧\n我给你倒了\n一碗水”\n写字间里\n中午是一丛眼睛画成的\n看着你\n---\n● 1985.1.26半夜"},{"id":"short/1984/单翅鸟","title":"单翅鸟","type":"short","year":"1984","body":"单翅鸟为什么要飞呢\n为什么\n头朝着天地\n躺着许多束朴素的光线\n菩提，菩提想起\n石头\n那么多被天空磨平的面孔\n都很陌生\n堆积着世界的一半\n摸摸周围\n你就会拣起一块\n砸碎另一块\n单翅鸟为什么要飞呢\n我为什么\n喝下自己的影子\n揪着头发作为翅膀\n离开\n也不知天黑了没有\n穿过自己的手掌比穿过别人的墙壁还难\n单翅鸟\n为什么要飞呢\n肥胖的花朵\n喷出水\n我眯着眼睛离开\n居住了很久的心和世界\n你们都不醒来\n我为什么\n为什么要飞呢\n---\n● 1984.9"},{"id":"short/1986/梭罗这人有脑子","title":"梭罗这人有脑子","type":"short","year":"1986","body":"1．\n梭罗这人有脑子\n像鱼有水、鸟有翅\n云彩有天空\n2．\n好在这人不是女性\n否则会有一对\n洁白的冬熊\n摇摇晃晃上路\n靠近他乳房\n凑上嘴唇\n3．\n梭罗这人有脑子\n梭罗手头没有别的\n抓住了一根棒木\n那木棍揍了我\n狠狠揍了我\n像春天揍了我\n4．\n梭罗这人有脑子\n看见湖泊就高兴\n5．\n梭罗这人有脑子\n用鸟巢做邮筒\n两封信同时飞到\n还生下许多小信\n羽毛翩跹\n6．\n梭罗这人有脑子\n不言不语让东窗天亮西窗天黑\n其实他哪有窗子\n梭罗这人有脑子\n不言不语做男人又做女人\n其实生下的儿子还是他自己\n7．\n灯火的屋中\n梭罗的盔\n——一卷荷马\n这人有脑子\n以雪代马\n渡我过水\n8．\n梭罗这人有脑子\n月亮照着他的鼻子\n9．\n那个抒情的鼻子\n靠近他的脑子\n靠近他深如树林的眼睛\n靠近他饮水的唇\n（愿饮得更深）\n构成脑袋\n或者叫头\n10．\n白天和黑夜\n像一白一黑\n两只寂静的猫\n睡在你肩头\n你倒在林间路途上\n让床在木屋中生病\n梭罗这人有脑子\n让野花结成果子\n11．\n梭罗这人有脑子\n像鱼有水、鸟有翅\n云彩有天空\n梭罗这人就是\n我的云彩，四方邻国\n的云彩，安静\n在豆田之西\n我的草帽上\n12．\n太阳，我种的\n豆子，凑上嘴唇\n我放水过河\n梭罗这人有脑子\n梭罗的盔\n——一卷荷马\n---\n● 1986.8.15"},{"id":"short/1987/五月的麦地","title":"五月的麦地","type":"short","year":"1987","body":"全世界的兄弟们\n要在麦地里拥抱\n东方，南方，北方和西方\n麦地里的四兄弟，好兄弟\n回顾往昔\n背诵各自的诗歌\n要在麦地里拥抱\n有时我孤独一人坐下\n在五月的麦地　梦想众兄弟\n看到家乡的卵石滚满了河滩\n黄昏常存弧形的天空\n让大地上布满哀伤的村庄\n有时我孤独一人坐在麦地里为众兄弟背诵中国诗歌\n没有了眼睛也没有了嘴唇\n---\n● 1987.5"},{"id":"short/1988/大风","title":"大风","type":"short","year":"1988","body":"起风的黄昏好像去年秋天\n树木损伤的香味弥漫四周\n想她头发飘飘\n面颊微微发凉\n守着她的母亲\n抱着她的女儿\n坐在盆地中央\n坐在她的家中\n黄昏幽暗降临\n大风刮过天空\n万风之王起舞\n化为树木受伤\n---\n● 1988.2.4"},{"id":"short/1989/日落时分的部落","title":"日落时分的部落","type":"short","year":"1989","body":"日落时分的部落\n晚霞映着血红的皇后\n夜晚的血，梦中的火\n照亮了破碎的城市\n北京啊，你城门四面打开，内部空空\n在太平洋的中央你眼看就要海水灭顶\n海水照亮这破碎的城，北京\n你这日落时分的部落凄凉而尖锐\n皇后带走了所有的蜜蜂\n这样的日子谁能忍受\n日落时分的部落，血污涂满全身\n在草原尽头，染红了遥远的秋天\n她传下这些灾难，传下这些子孙\n躲避灾难，或迎着灾难走去\n---\n● 1989.3.11"},{"id":"short/1983/农耕民族","title":"农耕民族","type":"short","year":"1983","body":"在发蓝的河水里\n洗洗双手\n洗洗参加过古代战争的双手\n围猎已是很遥远的事\n不再适合\n我的血\n把我的宝剑\n盔甲\n以至王冠\n都埋进四周高高的山上\n北方马车\n在黄土的情意中住了下来\n而以后世代相传的土地\n正睡在种子袋里\n---\n● 1983"},{"id":"short/1985/为了美丽","title":"为了美丽","type":"short","year":"1985","body":"为了美丽\n我砸了一个坑\n也是为了下雨\n清亮的积水上\n高一只\n低一只\n小雨儿如鸟\n羽毛湿湿\n掀动你的红头巾\n都是为了美丽\n摸着裤带的小男孩\n那时刻\n戴一只黑帽子\n---\n● 1985.1"},{"id":"short/1984/印度之夜","title":"印度之夜","type":"short","year":"1984","body":"月亮神秘地西渡\n恒河，佛洞里摆满了别人的牙齿\n星星和菜豆\n天地间一串紫色的连线，真正的连线\n黑色疯长八丈\n大风隐隐\n城市，最近才出现的小东西\n跟沙漠一样爱吃植物和小鱼\n月光下一群群乌鸦\n自己以为是黑衣新嫁娘\n没有人向她们求婚\n只好边叫边梳理头发\n睡在仓库的老人\n影子在手掌上漫游，影子是劳动\n面壁，面壁，出现思想者自己\n祈求小麦花永远美丽\n---\n● 1984.11"},{"id":"short/1986/海子小夜曲","title":"海子小夜曲","type":"short","year":"1986","body":"以前的夜里我们静静地坐着\n我们双膝如木\n我们支起了耳朵\n我们听得见平原上的水和诗歌\n这是我们自己的平原，夜晚和诗歌\n如今只剩下我一个\n只有我一个双膝如木\n只有我一个支起了耳朵\n只有我一个听得见平原上的水\n诗歌中的水\n在这个下雨的夜晚\n如今只剩下我一个\n为你写着诗歌\n这是我们共同的平原和水\n这是我们共同的夜晚和诗歌\n是谁这么说过　海水\n要走了　要到处看看\n我们曾在这儿坐过\n---\n● 1986.8"},{"id":"short/1987/但丁来到此时此地","title":"但丁来到此时此地","type":"short","year":"1987","body":"自杀者各自逃离树枝\n但丁来到此时此地\n自杀者各自逃离树枝\n罪人在地狱\n像荒山上嵌住的闪闪发光的钻石\n感情只是陪伴我的小灯\n时明时灭的地狱之门\n树桠裂开，浅水灌耳\n在香气的平原上\n贝亚德丽丝\n你站在另一头，低声唱歌\n我的鳞片剥落\n魂入肉体\n巨大的灵找自由的河流\n一些白色而善良\n的草秸\n里面埋葬野兽经常的抖动\n贝亚德丽丝\n的指引\n卧室或劳动的市民的圣母\n美丽阳光"},{"id":"short/1988/太阳和野花","title":"太阳和野花","type":"short","year":"1988","body":"——给ＡＰ\n太阳是他自己的头\n野花是她自己的诗\n我对你说\n你的母亲不像我的母亲\n在月光照耀下\n你的母亲是樱桃\n我的母亲是血泪\n我对天空说\n月亮，她是你篮子里纯洁的露水\n太阳，我是你场院上发疯的钢铁\n太阳是他自己的头\n野花是她自己的诗\n在一株老榆树底下\n平原上\n流过我的骨头\n在猎人夫妻的眼中　在山地\n那自由的尸首\n淌向何方\n两位母亲在不同的地方梦着我\n两位女儿在不同的地方变成了母亲\n当田野还有百合，天空还有鸟群\n当你还有一张大弓、满袋好箭\n该忘记的早就忘记\n该留下的永远留下\n太阳是他自己的头\n野花是她自己的诗\n总是有寂寞的日子\n总是有痛苦的日子\n总是有孤独的日子\n总是有幸福的日子\n然后再度孤独\n是谁这么告诉过你：\n答应我\n忍住你的痛苦\n不发一言\n穿过整座城市\n远远地走来\n去看看他　去看看海子\n他可能更加痛苦\n他在写一首孤独而绝望的诗歌\n死亡的诗歌\n他写道：\n平原上\n流过我的骨头\n当高原的人　在榆树底下休息\n当猎人和众神\n或起或坐，时而相视，时而相忘\n当牛羊和牛羊在草上\n看见一座悬崖上\n牧羊人堕下，额角流血\n再也救不活他了——\n他写道：\n平原上\n流过我的骨头\n这时，你要\n去看看他\n答应我\n忍住你的痛苦\n不发一言\n穿过整座城市\n那个牧羊人\n也许会被你救活\n你们还可以成亲\n在一对大红蜡烛下\n这时他就变成了我\n我会在我自己的胸脯找到一切幸福\n红色荷包、羊角、蜂巢、嘴唇\n和一对白羊儿般的乳房\n我会给你念诗：\n太阳是他自己的头\n野花是她自己的诗\n到那时　到那一夜\n也可以换句话说：\n太阳是野花的头\n野花是太阳的诗\n他们只有一颗心\n他们只有一颗心\n---\n● 1988.5.16夜\n删86年以来许多旧诗稿而得"},{"id":"short/1989/春天_1","title":"春天","type":"short","year":"1989","body":"春天的时刻上登天空\n舔着十指上的鲜血\n春天空空荡荡\n培养欲望　鼓吹死亡\n风是这样大\n尘土这样强暴\n再也不愿从事埋葬\n多少头颅破土而出\n春天，残酷的春天\n每一只手，每一位神\n都鲜血淋淋\n撕裂了大地胸膛\n太阳啊\n你那愚蠢的儿子呢\n他去了何方\n天空如此辽阔\n烧死在悲痛的表面\n大海啊\n这阳光闪烁\n的悲痛表面\n秋天的儿子\n他去了何方\n千秋万代中那唯一的儿子\n去了何方？\n女儿内心充满仇恨和寒冷\n想念你，爱着你，但看不见你\n她没有你就像天空没有边缘\n天空空空荡荡，一派生机\n我们无可奈何\n我们无法生活在悲痛的中心\n天空上的光明\n你照亮我们\n给我们温暖的生命\n但我们不是为你而活着\n我们活着只为了自我\n也只有短暂的一个春天的早晨\n愿你将我宽恕\n轧你在这原始的中心安宁而幸福地居住\n你坐在太阳中央把斧子越磨越亮，放着光明\n愿你在一个宁静的早晨将我宽恕\n将我收起在一个光明的中心\n愿我在这个宁静的早晨随你而去\n忘却所有的诗歌\n我会在中心安宁地居住，就像你一样\n把他的斧子越磨越亮，吃，劳动，舞蹈\n沉浸于太阳的光明\n在羊群踩出的道上是羊群的灵魂蜂拥而过\n在豹子踩出的道上是豹子的灵魂蜂拥而过\n哪儿有我们人类的通道\n有着锐利感觉的斧子\n像光芒　杂我胸口\n越磨越亮\n太阳的波浪\n隐隐作痛\n我进入太阳\n粗糙而光明\n那前一个夜晚\n人类携带妻子\n疯狂奔跑四散\n这是春天\n这是最后的春天\n他们去了何方？\n天空辽阔\n低垂黄昏\n人类破碎\n我内心混沌一片\n我面对着春天\n我就是她的鲜血和黑暗\n我内心浑浊而宁静\n我在这里粗糙而光明\n大地啊\n你过去埋葬了我\n今天又使我复活\n和春天一起\n沉默在我内部\n天空之火在我内部\n吹向旷野\n旷野自己照亮\n在最后的时刻　海底\n在最后的黎明之前　他们去了何方？\n1987.7草稿\n1988.2二稿\n---\n● 1989.3三稿"},{"id":"short/1983/北斗七星七座村庄","title":"北斗七星七座村庄","type":"short","year":"1983","body":"北斗星　七座村庄\n——献给萍水相逢的额济纳姑娘\n村庄　水上运来的房梁　漂泊不定\n还有十天　我就要结束漂泊的生涯\n回到五谷丰盛的村庄　废弃果园的村庄\n村庄　是沙漠深处你所居住的地方　额济纳！\n秋天的风早早的吹　秋天的风高高地吹\n静静面对额济纳\n白杨树下我吹灭你的两只眼睛\n额济纳　大沙漠上静静的睡\n额济纳姑娘　我黑而秀美的姑娘\n你的嘴唇在诉说　在歌唱\n五谷的风儿吹过骆驼和牛羊\n翻过沙漠　你是镇子上最令人难忘的姑娘\n---\n● 1986"},{"id":"short/1985/主人","title":"主人","type":"short","year":"1985","body":"你在渔市上\n寻找下弦月\n我在月光下\n经过小河流\n你在婚礼上\n使用红筷子\n我在向阳坡\n栽下两行竹\n你的夜晚\n主人美丽\n我的白天\n客人笨拙\n---\n● 1985.1"},{"id":"short/1984/我以及其他的证人","title":"我，以及其他的证人","type":"short","year":"1984","body":"故乡的星和羊群\n像一支支白色美丽的流水\n跑过\n小鹿跑过\n夜晚的目光紧紧追着\n在空旷的野地上，发现第一枚植物\n脚插进土地\n再也拔不出\n那些寂寞的花朵\n是春天遗失的嘴唇\n为自己的日子\n在自己的脸上留下伤口\n因为没有别的一切为我们作证\n我和过去\n隔着黑色的土地\n我和未来\n隔着无声的空气\n我打算卖掉一切\n有人出价就行\n除了火种、取火的工具\n除了眼睛\n被你们打得出血的眼睛\n一只眼睛留给纷纷的花朵\n一只眼睛永不走出铁铸的城门\n黑井\n---\n● 1984.6"},{"id":"short/1986/给b的生日","title":"给B的生日","type":"short","year":"1986","body":"给Ｂ的生日 \n天亮我梦见你的生日\n好像羊羔滚向东方\n——那太阳升起的地方\n黄昏我梦见我的死亡\n好像羊羔滚向西方\n——那太阳落下的地方\n秋天来到，一切难忘\n好象两只羊羔在途中相遇\n在运送太阳的途中相遇\n碰碰鼻子和嘴唇\n——那友爱的地方\n那秋风吹凉的地方\n那片我曾经吻过的地方\n---\n● 1986.9.10\n——————————\n B为海子初恋的女友，北京中国政法大学1983级学生。"},{"id":"short/1987/光棍","title":"光棍","type":"short","year":"1987","body":"神秘客人那位食玉米担玉米\n草筐中埋着牛肝的那光棍\n在春天用了一把大火\n烧光家园　使众人受伤\n大家伤心唏嘘不已\n穷得丁当响的酒柜上\n光棍光芒万丈\n老英雄\n走上前来\n抱住那光棍\n坐在黄昏\n歌唱江山\n布满眼泪\n---\n● 1987（？）"},{"id":"short/1988/山楂树","title":"山楂树","type":"short","year":"1988","body":"今夜我不会遇见你\n今夜我遇见了世上的一切\n但不会遇见你\n一棵夏季最后\n火红的山楂树\n象一辆高大女神的自行车\n象一女孩　畏惧群山\n呆呆站在门口\n她不会向我\n跑来!\n我走过黄昏\n像风吹向远处的平原\n我将在暮色中抱住一棵孤独的树干\n山楂树!　一闪而过　啊!　山楂\n我要在你火红的乳房下坐到天亮。\n又小又美丽的山楂的乳房\n在高大女神的自行车上\n在农奴的手上\n在夜晚就要熄灭\n---\n● 1988.6.8-10"},{"id":"short/1989/春天十个海子","title":"春天，十个海子","type":"short","year":"1989","body":"春天，十个海子全部复活\n在光明的景色中\n嘲笑这一个野蛮而悲伤的海子\n你这么长久地沉睡究竟为了什么?\n春天，十个海子低低地怒吼\n围着你和我跳舞，唱歌\n扯乱你的黑头发，骑上你飞奔而去，尘土飞扬\n你被劈开的疼痛在大地弥漫\n在春天，野蛮而悲伤的海子\n就剩下这一个，最后一个\n这是一个黑夜的孩子，沉浸于冬天，倾心死亡\n不能自拔，热爱着空虚而寒冷的乡村\n那里的谷物高高堆起，遮住了窗户\n它们把一半用于一家六口人的嘴，吃和胃\n一半用于农业，他们自己的繁殖\n大风从东刮到西，从北刮到南，无视黑夜和黎明\n你所说的曙光究竟是什么意思\n---\n● 1989.3.14凌晨3点-4点"},{"id":"short/1983/半截的诗","title":"半截的诗","type":"short","year":"1983","body":"你是我的\n半截的诗\n半截用心爱着\n半截用肉体埋着\n你是我的\n半截的诗\n不许别人更改一个字"},{"id":"short/1985/你的手","title":"你的手","type":"short","year":"1985","body":"北方\n拉着你的手\n手\n摘下手套\n她们就是两盏小灯\n我的肩膀\n是两座旧房子\n容纳了那么多\n甚至容纳过夜晚\n你的手\n在他上面\n把他们照亮\n于是有了别后的早上\n在晨光中\n我端起一碗粥\n想起隔山隔水的\n北方\n有两盏灯\n只能远远地抚摸\n---\n● 1985.2"},{"id":"short/1984/新娘","title":"新娘","type":"short","year":"1984","body":"故乡的小木屋、筷子、一缸清水\n和以后许许多多日子\n许许多多告别\n被你照耀\n今天\n我什么也不说\n让别人去说\n让遥远的江上船夫去说\n有一盏灯\n是河流幽幽的眼睛\n闪亮着\n这盏灯今天睡在我的屋子里\n过完了这个月，我们打开门\n一些花开在高高的树上\n一些果结在深深的地下\n---\n● 1984.7"},{"id":"short/1986/给你","title":"给你","type":"short","year":"1986","body":"1．\n在赤裸的高高的草原上\n我相信这一切：\n我的脚，一颗牝马的心\n两道犁沟，大麦和露水\n在那高高的草原上，白云浮动\n我相信天才，耐心和长寿\n我相信有人正慢慢地艰难地爱上我\n别的人不会，除非是你\n我俩一见钟情\n在那高高的草原上\n赤裸的草原上\n我相信这一切\n我相信我俩一见钟情\n2．\n我爱你\n跑了很远的路\n马睡在草上\n月亮照着他的鼻子\n3．\n爱你的时刻\n住在旧粮仓里\n写诗在黄昏\n我曾和你在一起\n在黄昏中坐过\n在黄色麦片的黄昏\n在春天的黄昏\n我该对你说些什么\n黄昏是我的家乡\n你是家乡静静生长的姑娘\n你是在静静的情义中生长\n没有一点声响\n你一直走到我心上\n4．\n当她在北方草原摘花的时候\n我的双手驶过南方水草\n用十指拨开\n寂寞的家门\n她家木门下几个姐妹的脸\n亲人的脸\n像南方的雨\n真正的雨水\n落在我头上\n5．\n冬天的人\n像神祗一样走来\n因为我在冬天爱上了你\n---\n● 1986.8"},{"id":"short/1987/八月-黑色的火把","title":"八月　黑色的火把","type":"short","year":"1987","body":"太阳映红的旷原\n垂下衰老的乳房\n一如黑夜的火把\n人是八月的田野上血肉模糊的火把\n怀抱夜晚的五谷\n遁入黑暗之中\n温暖的五谷\n霉烂的五谷\n坐在火把上\n---\n● 1987"},{"id":"short/1988/我飞遍草原的天空","title":"我飞遍草原的天空","type":"short","year":"1988","body":"草原上的天空不可阻挡\n互相击碎的刀剑飞回家乡\n佩在姐妹的脖子上\n让乳房裸露，子夜的金银顺河流淌\n月亮啊　月亮\n把新娘的尸体抬到草原上\n一只野花的杯子里　鬼魂千万\n“我死在野花杯中　我也是一条命啊”\n不可饶恕草原上的鬼魂\n不可饶恕杀人的刀枪\n不可饶恕埋人的石头\n更不可饶恕　天空\n我从大海来到落日的正中央\n飞遍了天空找不到一块落脚之地\n今日有粮食却没有饥饿\n今天的粮食飞遍了天空\n找不到一只饥饿的腹部\n饥饿用粮食喂养\n更加饥饿，奄奄一息\n草原的天空不可阻挡\n今天有家的　必须回家\n今天有书的　必须读书\n今天有刀的　必须杀人\n草原的天空不可阻挡\n---\n● 1988.8.13拉萨"},{"id":"short/1989/最后一夜和第一日的献诗","title":"最后一夜和第一日的献诗","type":"short","year":"1989","body":"今夜你的黑头发\n是岩石上寂寞的黑夜\n牧羊人用雪白的羊群\n填满飞机场周围的黑暗\n黑夜比我更早睡去\n黑夜是神的伤口\n你是我的伤口\n羊群和花朵也是岩石的伤口\n雪山　用大雪填满飞机场周围的黑暗\n雪山女神吃的是野兽穿的是鲜花\n今夜　九十九座雪山高出天堂\n使我彻夜难眠\n1989.1.16草稿\n---\n● 1989.1.24改"},{"id":"short/1983/历史","title":"历史","type":"short","year":"1983","body":"我们的嘴唇第一次拥有\n蓝色的水\n盛满陶罐\n还有十几只南方的星辰\n火种\n最初忧伤的别离\n岁月呵\n你是穿黑色衣服的人\n在野地里发现第一枝植物\n脚插进土地\n再也拔不出\n那些寂寞的花朵\n是春天遗失的嘴唇\n岁月呵，岁月\n公元前我们太小\n公元后我们又太老\n没有人见到那一次真正美丽的微笑\n那我还是举手敲门\n带来的象形文字\n撒落一地\n岁月呵\n岁月\n到家了\n我缓缓摘下帽子\n靠着爱我的人\n合上眼睛\n一座古老的铜像坐在墙壁中间\n青铜浸透了泪水\n岁月呵\n---\n● 1984"},{"id":"short/1985/写给脖子上的菩萨","title":"写给脖子上的菩萨","type":"short","year":"1985","body":"呼吸，呼吸\n我们是装满热气的\n两只小瓶\n被菩萨放在一起\n菩萨是一位很愿意\n帮忙的\n东方女人\n一生只帮你一次\n这也足够了\n通过她\n也通过我自己\n双手碰到了你，你的\n呼吸\n两片抖动的小红帆\n含在我的唇间\n菩萨知道\n菩萨住在竹林里\n她什么都知道\n知道今晚\n知道一切恩情\n知道海水是我\n洗着你的眉\n知道你就在我身上呼吸\n，呼吸\n菩萨愿意\n菩萨心里非常愿意\n就让我出生\n让我长成的身体上\n挂着潮湿的你\n---\n● 1985.4"},{"id":"short/1984/春天的夜晚和早晨","title":"春天的夜晚和早晨","type":"short","year":"1984","body":"夜里\n我把古老的根\n背到地里去\n青蛙绿色的小腿月亮绿色的眼窝\n还有一枚绿色的子弹壳，绿色的\n在我脊背上\n纷纷开花\n早晨\n我回到村里\n轻轻敲门\n一只饮水的蜜蜂\n落在我的脖子上\n她想\n我可能是一口高出地面的水井\n妈妈打开门\n隔着水井\n看见一排湿漉漉的树林\n对着原野和她\n整齐地跪下\n妈妈——他们嚷着——\n妈妈\n---\n● 1984.10"},{"id":"short/1986/给卡夫卡","title":"给卡夫卡","type":"short","year":"1986","body":"囚徒核桃的双脚\n在冬天放火的囚徒\n无疑非常需要温暖\n这是亲如母亲的火光\n当他被身后的几十根玉米砸倒\n在地，这无疑又是\n富农的田地\n当他想到天空\n无疑还是被太阳烧得一干二净\n这太阳低下头来，这脚镣明亮\n无疑还是自己的双脚，如同核桃\n埋在故乡的钢铁里\n工程师的钢铁里\n---\n● 1986.6.16"},{"id":"short/1987/八月之杯","title":"八月之杯","type":"short","year":"1987","body":"八月逝去　山峦清晰\n河水平滑起伏\n此刻才见天空\n天空高过往日\n有时我想过\n八月之杯中安坐真正的诗人\n仰视来去不定的云朵\n也许我一辈子也不会将你看清\n一只空杯子　装满了我撕碎的诗行\n一只空杯子——可曾听见我的喊叫？!\n一只空杯子内的父亲啊\n内心的鞭子将我们绑在一起抽打\n---\n● 1987"},{"id":"short/1988/无名的野花","title":"无名的野花","type":"short","year":"1988","body":"看不见你，十六岁的你\n看不见无名的，芳香的\n正在开花的你。\n看不见提着鞋子　在雨中\n走在大草原上的\n恍惚的女神\n看不见你，小小的年纪\n一身红色地走在\n空荡荡的风中\n来到我身边，\n你已经成熟，\n你的头发垂下像黑夜。\n我是黑夜中孤独的僧侣\n埋下种籽在石窟中，\n我将这九盏灯\n嵌入我的肋骨。\n无论是白色的还是绿色的\n起自天堂或地府的\n青海湖上的大风\n吹开了紫色血液\n开上我的头颅，\n我何时成了这一朵\n无名的野花？\n---\n● 1988.11.2"},{"id":"short/1989/月全食","title":"月全食","type":"short","year":"1989","body":"我的爱人住在县城的伞中\n我的爱人住在贫穷山区的伞中，双手捧着我的鲜血\n一把斧子浸在我自己的鲜血中\n火把头朝下在海水中燃烧\n我的愚蠢而残酷的青春\n是同胞兄弟和九个魔鬼\n他一直走到黑暗和空虚的深处\n火光明亮，我像一条河流将血红的头颅举起\n又喧哗着，放到了海水下面\n大海的波浪，回到尘土中去\n我将你们美丽的骨头带到村头\n挂上妻子们的脖子\n我的庄园在山顶上越来越寂静\n寂静！我随身携带的万年的闪电\n暴君，宝剑和伞\n混沌中的嘴和剑、鼓、脊椎\n暴君双手捧着宝剑，头颅和梅花\n在早晨灿烂，信任我的肋骨\n天生就是父亲的我\n回到尘土中去吧\n将被废弃不用\n黑色的鸟群，内部团结\n内部团结的黑夜\n在草原的天空上，黑色羽毛下黑色的肉\n黑色的肉有一颗暗红色的星\n一群鸟比一只鸟更加孤独\n鸟群的父亲，鸟群唯一的父亲\n铁打的人也在忍受生活\n铁打的人也在风雨飘摇\n所有的道路都通向天堂\n只是要度过路上的痛苦时光\n那一天我正走在路上\n两边的荒草，比人还高\n遥远的路程是我生命的一部分\n有一半是在群山上伴着羊群和雨雪，独自一人守候黎明\n有一半下到海底看守那些废弃不用的石头和火\n那些神秘的母亲们\n我看见这景色中只有我自己被上帝废弃不用\n我构成我自己，用一个人形，血肉用花朵与火包围着\n空虚的混沌\n我看见我的斧子闪现着人类劳动的光辉\n也有疲倦和灰尘\n遥远的路程\n作为国王我不能忍受\n我在这遥远的路程上\n我自己的牺牲\n我不能忍受太多的秘密\n这些全都是你的\n超市的冬天双手捧给你的\n这个全身是雨滴的爱人\n这个在闪电中心生活的暴君\n也看见姐妹们正在启程\n1989.1草稿\n---\n● 1989.3.9删"},{"id":"short/1983/哑脊背","title":"哑脊背","type":"short","year":"1983","body":"一个穿雨衣的陌生人\n来到这座干旱已久的城\n（阳光下\n他水国的口音很重）\n这里的日头直射\n人们的脊背\n只有夜晚\n月亮吸住面孔\n月亮也是古诗中\n一座旧矿山\n只有一个穿雨衣的陌生人\n来到这座干旱已久的城\n在众人的脊背上\n看出了水涨潮，看到了黄河波浪\n只有解缆者\n又咸又腥\n---\n● 1985"},{"id":"short/1985/北方门前","title":"北方门前","type":"short","year":"1985","body":"北方门前\n一个小女人\n在摇铃\n我愿意\n愿意像一座宝塔\n在夜里悄悄建成\n晨光中她突然发现我\n她眺起眼睛\n她看得我浑身美丽\n---\n● 1985.2"},{"id":"short/1984/木鱼儿","title":"木鱼儿","type":"short","year":"1984","body":"八千年三万里\n问你何在？\n猫的笑声\n穿过生锈的铁羽毛\n青年人\n爆晒土地\n宝塔回到城市\n车祸丛生\n宝塔摸摸脖子
