果吐树\r\n\r\n吃人人繁殖\r\n\r\n生产我的头骨\r\n\r\n天灵盖地虎 \r\n\r\n吃，在半坡埋下\r\n\r\n多少饥饿\r\n\r\n多少内心的空虚\r\n\r\n长出一张嘴\r\n\r\n听南风说话\r\n\r\n以玉米为牙\r\n\r\n一二三四五\r\n\r\n六七八九十\r\n\r\n长成了土地\r\n\r\n肉滚滚\r\n\r\n巨日一轮\r\n\r\n物象原始\r\n\r\n肉体之诗\r\n\r\n命运让我喜悦\r\n\r\n割下我的头颅\r\n\r\n喂在嘴的腹部\r\n\r\n白骨吱吱作响\r\n\r\n星球残缺\r\n\r\n神与马相似\r\n\r\n生产我的头骨\r\n\r\n巨大猎人乘坐我的头骨　飞过了……\r\n\r\n飞过了……\r\n\r\n飞过了海水\r\n\r\n飞过了崇山峻岭\r\n\r\n宇宙如巨马寂静\r\n\r\n苍茫而饱满的马\r\n\r\n苍茫而饱满的马\r\n\r\n在黄昏　在黎明\r\n\r\n多像我的白头骨\r\n\r\n披上了金黄稻草\r\n\r\n在原野之上飞翔\r\n\r\n嘴　和头骨\r\n\r\n世界的洞穴\r\n\r\n位于巨兽的尾部\r\n\r\n繁殖力极强\r\n\r\n风神十三姐妹　乳房十三\r\n\r\n巨神三万六千　负地而行\r\n\r\n……到此洞为止。\r\n\r\n装着兽油或伤药\r\n\r\n由白发苍苍的世纪老人\r\n\r\n采自山涧、美学　或毒龙的舌头\r\n\r\n那只鹰抓过这位老人的头颅\r\n\r\n放在她自己的篮子里。\r\n\r\n（第一段完）\r\n\r\n难道我已把你……\r\n\r\n把……把更为凄苦的灵感\r\n\r\n把黑夜，这巨大的唱歌的车辆\r\n\r\n饥饿说，你劈开吧，你劈吧\r\n\r\n……紫色的硫磺之火焙烧过的土地。\r\n\r\n“嘴”说\r\n\r\n那“食火的”说\r\n\r\n我是火身上的一个洞。\r\n\r\n此洞叫做人。\r\n\r\n这人叫山顶洞人。\r\n\r\n垒起锅灶。\r\n\r\n饥饿是男人\r\n\r\n嘴是女人\r\n\r\n他们结婚了\r\n\r\n在昏暗的洞中\r\n\r\n抱在一起。\r\n\r\n有一天\r\n\r\n铁砧　梦见自己\r\n\r\n走在一具尸体上\r\n\r\n按住了这具尸体\r\n\r\n坐在上面变成头\r\n\r\n06 铁　匠\r\n\r\n天空。\r\n\r\n射去的\r\n\r\n天空\r\n\r\n再不回头\r\n\r\n扔下孤儿寡母\r\n\r\n手握笨重的弓\r\n\r\n坐在北方\r\n\r\n荒凉的尽头\r\n\r\n是在哪一个黑夜\r\n\r\n伸出了岩石\r\n\r\n又随闪电逃走\r\n\r\n此时此刻\r\n\r\n在村子东头\r\n\r\n刀中睡入了第一位\r\n\r\n铁匠。\r\n\r\n现在来说说那碎了的。\r\n\r\n那破碎的虽然破碎了\r\n\r\n却是无法毁灭的。\r\n\r\n他在本性上是一个欢乐的人。\r\n\r\n是一个少年人。\r\n\r\n我现在说的是人类。\r\n\r\n他顶天立地地长着\r\n\r\n很像一条道路\r\n\r\n从大地走向天空。\r\n\r\n现在来说说那根通天的柱子\r\n\r\n虽然有人说长在须弥山上\r\n\r\n支撑着天空，是虚无的　光明的\r\n\r\n一根火柱。但也有人说\r\n\r\n那是赤着上身　正在打铁\r\n\r\n村里打铁的李二\r\n\r\n打出的一条金剑\r\n\r\n当然也是立在山顶\r\n\r\n的岩石之中。\r\n\r\n07 洞穴与屋子\r\n\r\n黄昏嘴里吐出一口血　染红了他的脸\r\n\r\n染红了他的枪\r\n\r\n他的子官\r\n\r\n十三颗头颅\r\n\r\n排得像车轮\r\n\r\n的轮辐一样\r\n\r\n在远方　无头的人\r\n\r\n喜悦地获得了头\r\n\r\n把头颅抱进山洞\r\n\r\n一夜无话\r\n\r\n尝试了多少次\r\n\r\n赶在日出之前\r\n\r\n肩扛头颅　一颗铁砧\r\n\r\n喜悦地走出山洞\r\n\r\n十三颗头颅\r\n\r\n排得像车轮\r\n\r\n的轮辐一样\r\n\r\n诗被压下去\r\n\r\n黄昏的形式　和芬芳被压下去\r\n\r\n在豹子出没的峡谷\r\n\r\n豹子之子，七个黑孩子\r\n\r\n为了喜悦，为了末日\r\n\r\n而哭泣。\r\n\r\n……我头颅泼血行进\r\n\r\n我是末日之火的一位旅伴\r\n\r\n我是末日的旅伴。我不是琴甚至也不是人\r\n\r\n我可能就是末日\r\n\r\n我很有可能\r\n\r\n就是末日\r\n\r\n豹子之子，十三个黑猩猩喜悦地哭着\r\n\r\n我不能劝他止住哭泣\r\n\r\n我就是他就是我自己\r\n\r\n我说得够清楚的了——呜姆姆姆姆姆姆姆姆姆姆\r\n\r\n我的铁砧上\r\n\r\n有万物末日的声音\r\n\r\n夜 歌\r\n\r\n天梯上的夜歌，天堂的夜歌\r\n\r\n天梯上的夜歌\r\n\r\n天堂的夜歌\r\n\r\n夜歌歌唱了我\r\n\r\n弓箭放下，\r\n\r\n我画出山坡\r\n\r\n太阳放下弓箭\r\n\r\n夜晚画出山坡\r\n\r\n一群群哑巴\r\n\r\n头戴牢房\r\n\r\n身穿铁条和火\r\n\r\n坐在黑夜山坡\r\n\r\n一群群哑巴\r\n\r\n高唱黑夜之歌\r\n\r\n这是我的夜歌\r\n\r\n这是我的夜歌\r\n\r\n歌唱那些人\r\n\r\n那些黑夜\r\n\r\n那些秘密火柴\r\n\r\n投入天堂之火              \r\n\r\n黑夜　年青而秘密\r\n\r\n像苦难之火\r\n\r\n像苦难的黑色之火\r\n\r\n看不见自己的火焰\r\n\r\n这是我的夜歌\r\n\r\n黑夜抱着谁\r\n\r\n坐在底部\r\n\r\n烧得漆黑\r\n\r\n黑夜抱着谁\r\n\r\n坐在热情中\r\n\r\n坐在灰烬和深渊\r\n\r\n他茫然的望着我\r\n\r\n这是我的夜歌\r\n\r\n坐在天堂\r\n\r\n坐在天梯上\r\n\r\n看着这一片草原\r\n\r\n属于哪一个国王\r\n\r\n多少马\r\n\r\n多少羊\r\n\r\n多少金头箭壶\r\n\r\n多少望不到边的金帐\r\n\r\n如此荒凉\r\n\r\n将我的夜歌歌唱\r\n\r\n天堂里的流水声\r\n\r\n（合唱部分）\r\n\r\n在天堂里\r\n\r\n大地只是一片苦树叶\r\n\r\n珍藏在天堂\r\n\r\n大海只是燃烧的泉水\r\n\r\n只有一滴\r\n\r\n而太阳是其中狩猎\r\n\r\n和剥削的猎人\r\n\r\n苦叶子\r\n\r\n是那三千赤子之一\r\n\r\n被那名为青春\r\n\r\n的无头英雄\r\n\r\n领着杀下天空\r\n\r\n的三千赤子之一\r\n\r\n在天堂\r\n\r\n在夜歌中\r\n\r\n一片苦叶子\r\n\r\n和半根豹骨\r\n\r\n我造人\r\n\r\n男人和女人\r\n\r\n在天堂相遇\r\n\r\n在天堂的黄昏\r\n\r\n转眼即是夜晚\r\n\r\n在夜歌中相遇\r\n\r\n扔下开天斧子\r\n\r\n住进了天堂歌声\r\n\r\n三个神明合上他的眼睛\r\n\r\n住进一片苦树叶\r\n\r\n没有他的树\r\n\r\n没有他的树枝和树根\r\n\r\n没有他的种子\r\n\r\n没有他的父母\r\n\r\n三个人扔下开天的斧子\r\n\r\n住在其中\r\n\r\n一片苦树叶就是大地的全部内容\r\n\r\n也是他的形成和全部重量\r\n\r\n也是幸福　也是地母　也是深渊和空虚\r\n\r\n欢乐女神住在其中\r\n\r\n一片苦叶子的幸福\r\n\r\n大地不能承受\r\n\r\n大地必然倾斜\r\n\r\n只有一片苦叶子\r\n\r\n珍藏大地的秘密\r\n\r\n他的苦草根没有经历过死亡\r\n\r\n没有人能在大地上\r\n\r\n找到这一片名叫大地的树叶\r\n\r\n这一片苦树叶住在天堂\r\n\r\n大地不能承受，大地必然倾斜\r\n\r\n这一片苦树叶住在天堂的合唱\r\n\r\n左边是大海这一滴的泉水燃烧\r\n\r\n右边是正在狩猎和剥皮的太阳\r\n\r\n天梯上一位猎人的歌声：小叙事\r\n\r\n太阳中的猎人\r\n\r\n射死了石头\r\n\r\n外表的猎人\r\n\r\n点亮了石头内部的猎手\r\n\r\n过就是我和我们\r\n\r\n都是他的狩猎仪式\r\n\r\n都是他的猎物牺牲\r\n\r\n太阳剥了我的皮\r\n\r\n削尖了我的骨头\r\n\r\n砍成两截\r\n\r\n白为昼，黑为夜\r\n\r\n一截是黑暗\r\n\r\n另一截是光明\r\n\r\n紧跟其后\r\n\r\n太阳猎人\r\n\r\n剥下我的皮\r\n\r\n坐在我皮上唱歌\r\n\r\n忽然又和我变成了一个\r\n\r\n太阳也把他内脏之火光\r\n\r\n照亮在我的皮上\r\n\r\n我们的皮紧紧拥抱着火\r\n\r\n和光明和火无内也无外\r\n\r\n太阳削尖我的骨头\r\n\r\n从我的体内抽出\r\n\r\n像抽出一把宝剑\r\n\r\n像树叶，插在大地\r\n\r\n我从这根被太阳\r\n\r\n剥皮、砍断、削尖\r\n\r\n的骨头上重新感到\r\n\r\n一个新的我自己\r\n\r\n无限痛楚的新自我\r\n\r\n他叫“二十一”\r\n\r\n一个叫“二十一”的陌生人\r\n\r\n或者叫“二十一”的新自我\r\n\r\n坐在天梯上唱歌：\r\n\r\n我叫“二十一”\r\n\r\n我是陌生人\r\n\r\n我对他是陌生人\r\n\r\n我对你是陌生人\r\n\r\n我对我是陌生人\r\n\r\n无限痛楚的新自我\r\n\r\n痛楚近乎一种光明\r\n\r\n我只是一根骨头\r\n\r\n在无边寂静中\r\n\r\n分开日夜，四根燃烧的泉水\r\n\r\n照亮泉水中新的他和我\r\n\r\n珍藏一片苦叶子\r\n\r\n珍藏我的秘密\r\n\r\n我只是我\r\n\r\n新的我\r\n\r\n只是一根削尖剥皮\r\n\r\n的新的骨头\r\n\r\n竖立在天梯之上\r\n\r\n我竖立在我之上\r\n\r\n我竖立在我头顶\r\n\r\n一根新的骨头\r\n\r\n竖在太阳那寂静的山坡\r\n\r\n风向我吹来\r\n\r\n这是天堂的风\r\n\r\n这是天空上的风\r\n\r\n这是天堂的合唱声\r\n\r\n我参加在合唱队中\r\n\r\n歌唱一个新的自我\r\n\r\n无边寂静中\r\n\r\n风向我吹来\r\n\r\n海浪和尘土裹住我\r\n\r\n我像空气中的寂静在正在成长\r\n\r\n化身为人\r\n\r\n我被太阳砍断\r\n\r\n的两截又长在一起\r\n\r\n给世界唱了一只新赞歌\r\n\r\n我的夜歌\r\n\r\n我开口歌唱我的夜歌\r\n\r\n“心爱的火为我在天堂\r\n\r\n在天堂的岩石上裸露着\r\n\r\n在天堂我歌唱我的夜歌\r\n\r\n饥饿成熟粮食就成熟”\r\n\r\n“法官家族也终于进入了\r\n\r\n沉默，进入了欢乐的曙光\r\n\r\n还有黑暗之神也放着光芒”\r\n\r\n小叙事；由天梯下层\r\n\r\n一个旧我歌唱\r\n\r\n刀剥开我\r\n\r\n此刀剥开我\r\n\r\n抱住我的内脏\r\n\r\n刀抱着内脏\r\n\r\n一同飞往天上\r\n\r\n犬　追着它们\r\n\r\n愤怒而快乐\r\n\r\n的女神之火\r\n\r\n追着它们\r\n\r\n女神之火\r\n\r\n筑向无底的篮天\r\n\r\n追不上了\r\n\r\n正在死亡的泥土搂抱住我\r\n\r\n追不上了　他和旧我\r\n\r\n急得嚷起来\r\n\r\n火　追不上刀和内脏\r\n\r\n这一对姐妹\r\n\r\n坐在天堂\r\n\r\n围着弓箭\r\n\r\n苦树叶\r\n\r\n和燃烧的泉水\r\n\r\n刻划在一根骨头\r\n\r\n追不上了　他急得嚷起来\r\n\r\n这位神仙遇见人类\r\n\r\n在这一天　回家告诉天堂\r\n\r\n“这一天是好的”\r\n\r\n我在火中·我在何方·告诉我\r\n\r\n火　追着一把抱住我内脏的刀\r\n\r\n（像母亲抱着女儿）\r\n\r\n飞向天上\r\n\r\n七只星宿\r\n\r\n……琴和马\r\n\r\n染红了泉水\r\n\r\n我的内脏在天堂\r\n\r\n变成了琴和马\r\n\r\n染红了泉水·染红了\r\n\r\n天堂的泉水不见那刀一把\r\n\r\n琴的声音就是那刀\r\n\r\n马也叫着　马也飞着\r\n\r\n身下的天梯下的草原\r\n\r\n像绿色的血海流淌\r\n\r\n我还是它们的主人吗？\r\n\r\n我在何方？\r\n\r\n琴和马\r\n\r\n又在草原头顶\r\n\r\n构筑弧形天空\r\n\r\n天空多么高\r\n\r\n又回到我的胸腔和腹部\r\n\r\n我在火中·火·还没有追上它们\r\n\r\n我没想到我在升向天空·我\r\n\r\n新的我·现在·三张脸朝向三方\r\n\r\n站在天空之上\r\n\r\n我到达不应到达的高度\r\n\r\n没有倾听但是听见了\r\n\r\n呜姆姆姆姆姆姆姆姆姆——万物的声音。\r\n\r\n石头和天空\r\n\r\n没有内容\r\n\r\n也没有声音\r\n\r\n只能为他取名\r\n\r\n叫天空\r\n\r\n石头感到\r\n\r\n自己的内脏\r\n\r\n一下子\r\n\r\n突然空了\r\n\r\n能看见　自己的头顶了\r\n\r\n越来越远\r\n\r\n自己腥臭的内脏\r\n\r\n亮起未\r\n\r\n空出来\r\n\r\n越空越大\r\n\r\n越大越空\r\n\r\n被消灭了\r\n\r\n被撕碎\r\n\r\n被撒开\r\n\r\n无边无际地\r\n\r\n变成我\r\n\r\n居住在世界的边缘\r\n\r\n自我无数\r\n\r\n不能沉默\r\n\r\n不能躲开\r\n\r\n一经走动\r\n\r\n便无踪影\r\n\r\n是过样的\r\n\r\n天空这样\r\n\r\n直截了当\r\n\r\n一阵大笑\r\n\r\n一片虚无\r\n\r\n我们置身其中\r\n\r\n炎热和寒冷\r\n\r\n躲过他的一切：\r\n\r\n火\r\n\r\n闪电\r\n\r\n风暴\r\n\r\n雷霆\r\n\r\n天堂\r\n\r\n和太阳\r\n\r\n我们必须\r\n\r\n躲开这些\r\n\r\n躲开这些\r\n\r\n这第一次革命\r\n\r\n大概　不会是\r\n\r\n最后一次革命\r\n\r\n简单的陈述中\r\n\r\n它到底是什么？\r\n\r\n中间逃走的部分\r\n\r\n主宰了我们\r\n\r\n中间逃走的\r\n\r\n有时回来\r\n\r\n在深夜\r\n\r\n坐着车子\r\n\r\n大乘为火\r\n\r\n小乘唯心\r\n\r\n它到底是什么呢？\r\n\r\n有一天\r\n\r\n这两块野蛮的石头\r\n\r\n突然意识到\r\n\r\n内脏被消灭了\r\n\r\n有一个\r\n\r\n还这样想\r\n\r\n也许是逃走了\r\n\r\n但肯定在逃走的路上\r\n\r\n被消灭了\r\n\r\n这种消灭\r\n\r\n就是天空\r\n\r\n消灭飞来\r\n\r\n天空飞去\r\n\r\n没有固定内容\r\n\r\n也没有获得内容\r\n\r\n它到底是什么？\r\n\r\n两块野蛮的石头\r\n\r\n放走了它自己的飞鸟\r\n\r\n它能理解吗？\r\n\r\n还能挽回吗\r\n\r\n火（火囚在石中\r\n\r\n就是人）\r\n\r\n火 火（人类）\r\n\r\n□与□联系\r\n\r\n中间经过□□\r\n\r\n改造两块石头\r\n\r\n使他成为人\r\n\r\n内脏飞向天空\r\n\r\n放心走上天梯\r\n\r\n使两块石头\r\n\r\n站立\r\n\r\n变形\r\n\r\n自己形成\r\n\r\n以自我为中心\r\n\r\n石头变人太可怕\r\n\r\n同时击杀野蛮\r\n\r\n主人和兽兄\r\n\r\n也不能与他相遇\r\n\r\n它到底是什么\r\n\r\n它决不会\r\n\r\n居住下来\r\n\r\n另一块石头喃喃自语：\r\n\r\n这野蛮之王\r\n\r\n在天梯上说\r\n\r\n我膝下无子\r\n\r\n石窟空空\r\n\r\n山腹中有\r\n\r\n人在秘密谈活\r\n\r\n天梯上也有\r\n\r\n几乎没有听见的可能\r\n\r\n它没有内容\r\n\r\n火吃着石头\r\n\r\n吃着\r\n\r\n循环着\r\n\r\n喂养着\r\n\r\n我是食物\r\n\r\n又是食者\r\n\r\n在石头的\r\n\r\n食谱和子孙中\r\n\r\n人是其中软弱\r\n\r\n的一种\r\n\r\n火吃着石头\r\n\r\n骑上了人\r\n\r\n抓住了他的鬃毛\r\n\r\n那就住下吧\r\n\r\n这是故事里的话\r\n\r\n与故事毫不相关\r\n\r\n那就住下\r\n\r\n总有一天\r\n\r\n你自己的\r\n\r\n陌生人会来敲门\r\n\r\n人 人　火 火\r\n\r\n以上画的\r\n\r\n是两块岩石\r\n\r\n保持了他\r\n\r\n野蛮的牢房结构\r\n\r\n“野蛮的石头集团的语言”\r\n\r\n火的朋友，人类之友\r\n\r\n面对这野蛮的统一性\r\n\r\n那就住下吧\r\n\r\n这是两块最好的岩石\r\n\r\n保持沉默是不可能的\r\n\r\n让我们从黑夜的道路\r\n\r\n从泉水的道路　从大神的道路\r\n\r\n走回到人的道路上来吧\r\n\r\n我们离开得已太久太久\r\n\r\n那破碎的虽然破碎了\r\n\r\n却是无法毁灭的。\r\n\r\n羊儿在山坡上吃草\r\n\r\n他本性上是一个欢乐的人\r\n\r\n少年人。住下来\r\n\r\n石　匠\r\n\r\n金字塔\r\n\r\n献给维特根斯坦\r\n\r\n红色高原\r\n\r\n荒无人烟\r\n\r\n而金字塔指天而立\r\n\r\n“如果这块巨石\r\n\r\n此时纹丝不动\r\n\r\n被牢牢楔入\r\n\r\n那首先就移动\r\n\r\n别的石头\r\n\r\n放在它的周围”\r\n\r\n世界是这样的\r\n\r\n人类\r\n\r\n在褐色高原\r\n\r\n被火用尽\r\n\r\n之后\r\n\r\n就是这个样子。\r\n\r\n公式　石头\r\n\r\n四面围起\r\n\r\n几何形式\r\n\r\n简洁而笨重\r\n\r\n没有表面的灰尘\r\n\r\n没有复杂的抒情\r\n\r\n没有美好的自我\r\n\r\n没有软弱的部分\r\n\r\n黑色的火　沉默的　过去的　业已消逝的\r\n\r\n不可说的\r\n\r\n住在正中\r\n\r\n消灭了阶级的、性别的、生物的\r\n\r\n逻辑的大门五十吨石头没有僧侣\r\n\r\n一切进入石头变得结实而坚硬。\r\n\r\n一切都存在\r\n\r\n世界是这样的。\r\n\r\n一切存在的都是他的事实的主人公。\r\n\r\n风中突然飞入\r\n\r\n太阳强大的车轮\r\n\r\n是尖锐的　石头的　向天说话的　是本能的\r\n\r\n世界是这样的。\r\n\r\n粘土固然消失。\r\n\r\n存在尚未到来。\r\n\r\n石头　发生\r\n\r\n在数学中\r\n\r\n一线光明\r\n\r\n人类的本能是石头的本能\r\n\r\n消灭自我后尽可能牢固地抱在一起\r\n\r\n没有繁殖。\r\n\r\n也没有磨损。\r\n\r\n没有兄弟和子孙。\r\n\r\n也没有灰烬。\r\n\r\n事物巨大。\r\n\r\n事实简单。\r\n\r\n事件纯粹而精确。\r\n\r\n事情稳定。\r\n\r\n而石头以此为生。\r\n\r\n四肢全无\r\n\r\n坐在大地\r\n\r\n面朝天空\r\n\r\n埃及的猎人\r\n\r\n在高山上\r\n\r\n什么也没有了\r\n\r\n什么也没找到\r\n\r\n世界之上\r\n\r\n是天空\r\n\r\n万有的天空\r\n\r\n一阵沉默\r\n\r\n又是一阵\r\n\r\n沉默。\r\n\r\n埃及的猎人\r\n\r\n在高山上\r\n\r\n什么也没有了\r\n\r\n什么也没找到\r\n\r\n是石头和数学\r\n\r\n把他找到\r\n\r\n把他变成了\r\n\r\n我认不出的\r\n\r\n他坐在那里\r\n\r\n一动不动\r\n\r\n饥饿的石头、愤怒的石头\r\n\r\n流进了他。成为他。\r\n\r\n天空万有　天空以万有高喊万有　召唤\r\n\r\n人类的本能是石头的本能\r\n\r\n人类的数学成为石头内部的人\r\n\r\n四条底边正向东南西北，坐地朝天\r\n\r\n天空在世界之上　一线光明\r\n\r\n公式　石头与光\r\n\r\n围在一起　中央是沉默的\r\n\r\n金光闪烁的\r\n\r\n逃走的大神\r\n\r\n一堆石头和公式固步自封\r\n\r\n一座无人的　火与逻辑的城\r\n\r\n数学和石头是他的感情\r\n\r\n世界是这样的\r\n\r\n总是这样的\r\n\r\n火是相同的\r\n\r\n不管这次是为谁　吐出大火\r\n\r\n不管烧毁的是谁\r\n\r\n火总是相同的。\r\n\r\n火总是他自己。\r\n\r\n一卷经书\r\n\r\n吐火\r\n\r\n吐火后\r\n\r\n一卷经书疲倦了　坐下来\r\n\r\n成为石头\r\n\r\n好像自己坐下自己离去\r\n\r\n自己成了自己的座位\r\n\r\n一卷经书如此疲倦\r\n\r\n自己成了自己的石头大座\r\n\r\n吐火的是我吗　一卷经书自问\r\n\r\n一卷经书自问又繁殖　是我吗\r\n\r\n骤然变成了七卷　经书不辨真伪\r\n\r\n吐火的　逃往天上\r\n\r\n地上荒无人居，石头疲倦\r\n\r\n七卷经书不辨真伪\r\n\r\n那从天空跌落的\r\n\r\n人类的数学和书\r\n\r\n成为石头内部的人\r\n\r\n铁　匠\r\n\r\n打　铁\r\n\r\n“汉族的铁匠打出的铁柜中装满不能呼喊的语言”\r\n\r\n我走进火中\r\n\r\n陈述：\r\n\r\n1. 世界只有天空和石头。\r\n\r\n2. 世界是我们这个世界。\r\n\r\n3. 世界是唯一的。\r\n\r\n附属的陈述：\r\n\r\n1.　a. 世界的中央是天空，四周是石头。\r\n\r\nb. 天空是封闭的，但可以进入。\r\n\r\nc. 这种进入只能是从天空之外进入天空。\r\n\r\nd. 从石头不可能飞越天空到另一块石。\r\n\r\ne. 天空行走者不可能到达天空中央。\r\n\r\nf. 在天空上行走是没有速度的行走。\r\n\r\ng. 在天空上行走越走越快，最后的速度最快是静止。\r\n\r\nh. 但不可能到达那种速度。\r\n\r\ni. 那就是天空中央。\r\n\r\nj. 天空中央是静止的。\r\n\r\nk. 天空中央的周围是飞行的。\r\n\r\nl. 天空的边缘是封闭的。\r\n\r\nm. 天空中间是没有内容的。\r\n\r\nn. 在天空上行走是没有方向的行走。\r\n\r\no. 没有前没有后。\r\n\r\np. 没有前进没有后退。\r\n\r\nq. 人类有飞在天空的愿望。\r\n\r\nr. 但不能实现。\r\n\r\n2.　a. 人类保持在某种脆弱性之上。\r\n\r\nb. 人类基本上是一个野蛮的结构。\r\n\r\nc. “野蛮的石头集团的语言”。\r\n\r\nd. 天空越出人类正是由于它的浑然一体。\r\n\r\ne. 它与世界的浑然一体。\r\n\r\nf. 它的虚无性。\r\n\r\ng. 它都知道。\r\n\r\nh. 它能忍受。\r\n\r\ni. 我们感不到它的内容。\r\n\r\nj. 它有一根固定的轴。\r\n\r\nk. 它在旋转。\r\n\r\nl. 轴心是实体。\r\n\r\nm. 其他是元素。\r\n\r\nn. 它的内容是生长。\r\n\r\no. 也就是变化。\r\n\r\n关于火的陈述：\r\n\r\n1. 没有形式又是一切的形式。\r\n\r\n2. 没有居所又是一切的居所。\r\n\r\n3. 没有属性又是一切的属性。\r\n\r\n4. 没有内容又是一切的内容。\r\n\r\n5. 互相产生。\r\n\r\n6. 互相替代。\r\n\r\n7. 火总是同样的火。\r\n\r\n8. 从好到好。\r\n\r\n9. 好上加好。\r\n\r\n10. 不好也好。\r\n\r\n11. 对于火只能忍受。\r\n\r\n化身为人\r\n\r\n－－献给赫拉克利特\r\n\r\n和释伽牟尼\r\n\r\n献给我自己\r\n\r\n献给火\r\n\r\n一\r\n\r\n1. 这是献给我自己的某种觉悟的诗歌。\r\n\r\n2. 我觉悟我是火。（被划掉）\r\n\r\n3. 在火中心恰恰是盲目的　也就是黑暗。\r\n\r\n4. 火只照亮别人。火是一切的形式。是自己的形式。\r\n\r\n5. 火是找不到形式的一份痛苦的赠礼和惩罚。\r\n\r\n6. 火没有形式，只有生命，或者说只有某种内在的秘密。\r\n\r\n7. 火是一切的形式。（被划掉）\r\n\r\n8. 火是自己的形式（被划掉）\r\n\r\n9. 火使石头围着天空，\r\n\r\n10. 我们的宇宙是球形。表面是石头　中间是天空。\r\n\r\n11. 我们身边和身上的火来自别的地方。\r\n\r\n12. 来自球的中心。\r\n\r\n13. 那空荡荡的地方。\r\n\r\n（一）\r\n\r\n1. 这是注定的。\r\n\r\n2. 真理首先是一种忍受。\r\n\r\n3. 真理是对真理的忍受。\r\n\r\n4. 真理有时是形式，有时是众神。\r\n\r\n5. 真理是形式和众神自己的某种觉悟的诗歌。\r\n\r\n6. 诗歌是它自己。\r\n\r\n7. 诗歌不是真理在说话时的诗歌。\r\n\r\n8. 诗歌必须是在诗歌内部说话。\r\n\r\n9. 诗歌不是故乡。\r\n\r\n10. 也不是艺术。\r\n\r\n11. 诗歌是某种陌生的力量。\r\n\r\n12. 带着我们从石头飞向天空。\r\n\r\n13. 进入球的内部。\r\n\r\n（二）\r\n\r\n1. 真理是一次解放。\r\n\r\n2. 是形式和众神的自我解放。\r\n\r\n二\r\n\r\n形式A，形式B，形式C，形式D\r\n\r\n1. 形式A是没有形式。\r\n\r\n2. 宗教和真理是形式A。\r\n\r\n3. 形式B是纯粹形式。\r\n\r\n4. 形式C是巨大形式。\r\n\r\n5. 巨大形式是指我们宇宙和我们自己的边界。\r\n\r\n6. 就是球的表面。和石头与天空的分界线。\r\n\r\n7. 形式D是人。\r\n\r\n（三）形式B是纯粹形式\r\n\r\n1. 形式B只能通过形式D才能经历。\r\n\r\n2. 这就是化身为人。\r\n\r\n3. 我们人类的纯粹形式是天空的方向。\r\n\r\n4. 是在大地上感受到的天空的方向。\r\n\r\n5. 这种方向就是时间。\r\n\r\n6. 是通过轮回进入元素。\r\n\r\n7. 是节奏。\r\n\r\n8. 节奏。\r\n\r\n（四）形式C是巨大的形式\r\n\r\n1. 这就是大自然。\r\n\r\n2. 是他背后的元素。\r\n\r\n3. 人类不能选择形式C。\r\n\r\n4. 人类是偶然的。\r\n\r\n5. 人类来自球的内部。\r\n\r\n6. 也去往球的内部。\r\n\r\n7. 经过大自然。\r\n\r\n8. 光明照在石头上。\r\n\r\n9. 化身为人。\r\n\r\n10. 大自然与人类互相流动。\r\n\r\n11. 大自然与人类没有内外。\r\n\r\n（五）形式D是人\r\n\r\n1. 真理是从形式D逃向其他形式（形式ABC）。\r\n\r\n疯公主\r\n\r\n背后是雪白的光\r\n\r\n这儿非常热\r\n\r\n它站在那儿，一动不动\r\n\r\n光不断从它背后照射出来\r\n\r\n光束越来越粗\r\n\r\n啊……我快要支持不住了\r\n\r\n把我救出去！\r\n\r\n让我离开这里！\r\n\r\n把我救出去！啊……我的双手\r\n\r\n没有任何知觉了。啊\r\n\r\n呀！我的手，我的脚，我的腿呀！\r\n\r\n……我的手颤抖得厉害\r\n\r\n我的脚也颤抖……哎哟……\r\n\r\n啊，我开始感到有些凉快了。\r\n\r\n哎哟……我的手啊，啊！我的手真……\r\n\r\n我的面前出现了一堆火。\r\n\r\n像是一小堆火在燃烧。\r\n\r\n我不知道那是什么。\r\n\r\n我的双手感到很疼痛\r\n\r\n……好像烧着了\r\n\r\n（大鸟不见了！\r\n\r\n在它原先站立的地方\r\n\r\n有一小堆火。火光逐渐变暗\r\n\r\n发出红色的光亮，最后\r\n\r\n变成了一堆带有红色余火的灰\r\n\r\n那堆火渐渐地灭了，只剩下一些\r\n\r\n现在，我感到冷了。\r\n\r\n我感到冷了。\r\n\r\n发着红光的碳块般的东西……\r\n\r\n暗红——灰白——带有暗红色斑点的\r\n\r\n（一堆火\r\n\r\n……火渐渐地熄灭下去——\r\n\r\n灰烬变成了一条粗大的\r\n\r\n灰褐色的、陶土似的虫子）\r\n\r\n呀！看上去像一条虫子，\r\n\r\n又粗又大的虫子！\r\n\r\n\r\n\r\n这一夜\r\n\r\n天堂在下雪\r\n\r\n整整一夜天堂在下雪\r\n\r\n相当于我们一个世纪天堂在下雪\r\n\r\n这就是我们的冰川纪\r\n\r\n冰河时期多么漫长而荒凉\r\n\r\n多么绝望\r\n\r\n而天堂降下了比雨水还温暖的大雪\r\n\r\n天梯上也积满了白雪\r\n\r\n那是幸福的大雪\r\n\r\n天堂的大雪\r\n\r\n天堂的大雪纷纷\r\n\r\n充满了节日气氛\r\n\r\n这是诞生的日子\r\n\r\n天堂有谁在诞生\r\n\r\n天堂的大雪一直降到盲人的眼里\r\n\r\n这是天堂里的合唱队\r\n\r\n由九个盲人组成\r\n\r\n两个国王　七个歌手\r\n\r\n这九个盲人坐在天堂\r\n\r\n变成了合唱队九长老\r\n\r\n两个希腊人\r\n\r\n两个中国人\r\n\r\n两个德国人\r\n\r\n一个英国人\r\n\r\n一个拉美人\r\n\r\n一个印度人\r\n\r\n天堂的大雪一直降到盲人的眼里\r\n\r\n充满了光明\r\n\r\n充满了诞生的光明\r\n\r\n高声的唱起来，长老们\r\n\r\n长老们\r\n\r\n合唱队的歌声、在天堂的大雪\r\n\r\n（盲目的颂歌\r\n\r\n在盲目中见到光明的颂歌）\r\n\r\n（名称为“视而不见”的合唱队由以下这些人组成：持国、俄狄普斯、荷马、老子、阿炳、韩德尔、巴赫、弥尔顿、博尔赫斯）             \r\n\r\n\r\n---\r\n\r\n+ 1988.12.1\r\n\r\n+ 本诗从序号02开始，显无01，文中也无04，大概是“片断”的意思。\r\n\r\n+ 京剧《智取威虎山》中土匪黑话。\r\n\r\n+ 海子《弥赛亚》（《太阳》中天堂大合唱）第四稿就写到这里，未完成。"},{"id":"short/1983/房屋","title":"房屋","type":"short","year":"1983","body":"你在早上\n碰落的第一滴露水\n肯定和你的爱人有关\n你在中午饮马\n在一枝青丫下稍立片刻\n也和她有关\n你在暮色中\n坐在屋子里，不动\n还是与她有关\n你不要不承认\n巨日消隐，泥沙相合，狂风奔起\n那雨天雨地哭得有情有意\n而爱情房屋温情地坐着\n遮蔽母亲也遮蔽儿子\n遮蔽你也遮蔽我\n---\n● 1985"},{"id":"short/1987/日出","title":"日出","type":"short","year":"1987","body":"——见于一个无比幸福的早晨的日出\n在黑暗的尽头\n太阳，扶着我站起来\n我的身体像一个亲爱的祖国，血液流遍\n我是一个完全幸福的人\n我再也不会否认\n我是一个完全的人我是一个无比幸福的人\n我全身的黑暗因太阳升起而解除\n我再也不会否认　天堂和国家的壮丽景色\n和她的存在……在黑暗的尽头！\n---\n● 1987.8.30　醉后早晨"},{"id":"short/1983/抱着白虎走过海洋","title":"抱着白虎走过海洋","type":"short","year":"1983","body":"倾向于宏伟的母亲\n抱着白虎走过海洋\n陆地上有堂屋五间\n一只病床卧于故乡\n倾向于故乡的母亲\n抱着白虎走过海洋\n扶病而出的儿子们\n开门望见了血太阳\n倾向于太阳的母亲\n抱着白虎走过海洋\n左边的侍女是生命\n右边的侍女是死亡\n倾向于死亡的母亲\n抱着白虎走过海洋\n---\n● 1986"},{"id":"short/1987/昌平柿子树","title":"昌平柿子树","type":"short","year":"1987","body":"柿子树\n镇子边的柿子树\n枝叶稀疏的秋之树\n我只能站在路口望着她\n在镇子边的小村庄\n有两棵秋天的柿子树\n柿子树下\n不是我的家\n秋之树\n枝叶稀疏的秋之树\n---\n● 1987.11.2"},{"id":"short/1983/敦煌","title":"敦煌","type":"short","year":"1983","body":"敦煌石窟像马肚子下\n挂着一只只木桶\n乳汁的声音滴破耳朵——\n像远方草原上撕破的耳朵上\n悬挂着花朵\n敦煌是千年以前\n起了大火的森林\n在陌生的山谷\n是最后的桑林——我交换\n食盐和粮食的地方\n我筑下岩洞，在死亡之前，画上你\n最后一个美男子的形象\n为了一只母松鼠\n为了一只母蜜蜂\n为了让她们在春天再次怀孕\n---\n● 1986"},{"id":"short/1987/晨雨时光","title":"晨雨时光","type":"short","year":"1987","body":"小马在草坡上一跳一跳\n这青色麦地晚风吹拂\n在这个时刻　我没有想到\n五盏灯竟会同时亮起\n青麦地像马的仪态　随风吹拂\n五盏灯竟会一盏一盏地熄灭\n往后　雨会下到深夜　下到清晨\n天色微明\n山梁上定会空无一人\n不能携上路程\n当众人齐集河畔　空声歌唱生活\n我定会孤独返回空无一人的山峦\n---\n● 1987.5.24"},{"id":"short/1983/无题","title":"无题","type":"short","year":"1983","body":"给我粮食\n给我婚礼\n给我星辰和马匹\n给我歌曲\n给我安息！\n我的生日\n这是位美丽的\n折磨人的女俘虏\n坐在故乡的打麦场上\n在月光下\n使村子里的二流子\n如痴如醉！"},{"id":"short/1987/月光","title":"月光","type":"short","year":"1987","body":"今夜美丽的月光　你看多好!\n照着月光\n饮水和盐的马\n和声音\n今夜美丽的月光　你看多美丽\n羊群中　生命和死亡宁静的声音\n我在倾听!\n这是一支大地和水的歌谣，月光!\n不要说　你是灯中之灯　月光!\n不要说心中有一个地方\n那是我一直不敢梦见的地方\n不要问　桃子对桃花的珍藏\n不要问　打麦大地　处女　桂花和村镇\n今夜美丽的月光　你看多好!\n不要说死亡的烛光何须倾倒\n生命依然生长在忧愁的河水上\n月光照着月光　月光普照\n今夜美丽的月光合在一起流淌\n1986.7初稿\n---\n● 1987.5改"},{"id":"short/1983/日光","title":"日光","type":"short","year":"1983","body":"梨花\n在土墙上滑动\n牛铎声声\n大婶拉过两位小堂弟\n站在我面前\n像两截黑炭\n日光其实很强\n一种万物生长的鞭子和血！"},{"id":"short/1987/枫","title":"枫","type":"short","year":"1987","body":"广天一夜\n暖如血\n高寒的秋之树\n长风千万叶\n暖如血\n一叶知秋\n（秋在北方——\n青涩坚硬\n火焰焰闪闪的少女\n走向成熟和死亡）\n多灾多难多梦幻\n的北国氏族之女\n镰刀和筐内\n秋天的头颅落地\n姐妹血迹殷红\n北国氏族之女\n北国之秋住家乡\n明日天寒地冻\n日短夜长\n路远马亡\n北国氏族之女\n一火灭千秋\n虽果亡树在\n北国氏族之女\n——柿子和枫\n相抢（？）于此秋天\n刀刃闪闪发亮\n人头落地　血迹殷红\n一只空空的杯子权做诗歌之棺\n暖如地血　寒比天风\n---\n● 1987.11.2"},{"id":"short/1983/春天","title":"春天","type":"short","year":"1983","body":"你迎面走来\n冰消雪融\n你迎面走来\n在地微微颤栗\n大地微微颤栗\n曾经饱经忧患\n在这个节日里\n你为什么更加惆怅\n野花是一夜喜筵的酒杯\n野花是一夜喜筵的新娘\n野花是我包容新娘\n的彩色屋顶\n白雪抱你远去\n全凭风声默默流逝\n春天啊\n春天是我的品质"},{"id":"short/1987/水抱屈原","title":"水抱屈原","type":"short","year":"1987","body":"举着火把、捕捉落入\n水的人\n水抱屈原：如夜打门的火把倒向怀中\n水中之墓呼唤鱼群\n我要离开一只平静的水罐\n骄傲者的水罐——\n宝剑埋在牛车的下边\n水抱屈原：一双眼睛如火光照亮\n水面上千年羊群\n我在这时听见了世界上美丽如画\n水抱屈原是我\n如此尸骨难收"},{"id":"short/1983/春天断片","title":"春天（断片）","type":"short","year":"1983","body":"0．\n一匹跛了多年的\n红色小马\n躺在我的小篮子里\n故乡晴空万里\n故乡白云片片\n故乡水声汩汩\n我的红色小马躺在小篮子里\n就像我手心的红果实\n听不见窗户下面\n生锈的声音\n就像一把温暖的果实\n1．\n我的头随草起伏\n如同纸糊的歪灯\n我的胳膊是\n一条运猫的小船\n停在河岸\n一条草\n看见走过来的\n干净的身子\n不多\n2．\n远方寂寞的母亲\n也只有依靠我这\n负伤的身体。母亲\n望着猎户消匿的北方\n刮断梅花\n窗户长久地存满冰块\n村子中间\n淘井的门前\n说话的依旧在轻声说话\n树林中孤独的父亲\n正对我的弟弟细细讲清：\n你去学医\n因为你哥哥\n那位受伤的猎户\n星星在他脸上\n映出船样的伤疤\n3．\n两个温暖的水勺子中\n住着一对旧情人\n4．\n突然想起旧砖头很暖和\n想起河里的石子\n磨过森林的古鹿之唇\n想起青草上花朵如此美丽如此平庸\n背对着短树枝\n你只有泪水没有言语\n而我\n手缠树叶\n春天的阳光晒到马尾\n马的屁股温暖得像一块天上落下的石头\n5．\n春天是农具所有者的春天\n长花短草\n贴河而立\n这些都是在诗人的葬礼上\n隔水梦见一扇门\n诗人家中的丑丫头\n嫁在南山上\n6．\n最后的夜雪如孩\n手指拨开水\n我就在这片乌黑的屋顶上坐下\n是不是这片村庄\n是不是这个夜晚\n有人在头顶扔下\n一匹蓝色大马\n就把我埋在\n这匹蓝色大马里\n7．\n有伤的季节\n拖着尾巴\n来到\n大家来到\n我肉体的外面\n---\n● 1986"},{"id":"short/1987/汉俳","title":"汉俳","type":"short","year":"1987","body":"1.河　水\n亡灵游荡的河\n在过去我有多少恐惧\n只对你诉说\n2.王位上的诗人\n还没剥开羊皮　举着火把\n还没剥开少女和母亲美丽的身体\n3.打麦黄昏，老年打麦者\n在梨子树下\n晚霞常驻\n4.草原上的死亡\n在白色夜晚张开身子\n我的脸儿，就像我自己圣洁的姐姐\n5.西　藏\n回到我们的山上去\n荒凉高原上众神的火光\n6.意大利文艺复兴\n那是我们劳动的时光\n朋友们都来自采石场\n7.风　吹\n茫茫水面上天鹅村庄神奇的门窗合上\n8.黄　昏\n在此刻　销声匿迹的人　突然出现\n他们神秘而哀伤的马匹在树下站定\n9.诗歌皇帝\n当众人齐集河畔　高声歌唱生活\n我定会孤独返回空无一人的山峦\n---\n● 1987"},{"id":"short/1983/月","title":"月","type":"short","year":"1983","body":"炊烟上下\n月亮是掘井的白猿\n月亮是惨笑的河流上的白猿\n多少回天上的伤口淌血\n白猿流过钟楼\n流过南方老人的头顶\n掘井的白猿\n村庄喂养的白猿\n月亮是惨笑的白猿\n月亮自己心碎\n月亮早已心碎"},{"id":"short/1987/灯","title":"灯","type":"short","year":"1987","body":"我们坐在灯上\n我们火光通明\n我们做梦的胳膊搂在一起\n我们栖息的桌子飘向麦地\n我们安坐的灯火涌向星辰\n灯光，我明丽又温暖\n的橘黄的雪\n披上新娘的微黄的发辫\n（灯\n只有你\n你仿佛无鞋\n你总是行色匆匆）\n灯，你的名字\n掌在我手上\n灯，月亮上\n亮起的心\n和眼睛\n灯\n躲在山谷\n躲在北方山顶的麦地\n灯啊\n我们做梦的房子飘向麦田\n桌子上安放求婚的杯盏\n祈求和允诺的嘴唇\n是灯\n灯\n一丛美丽\n暖和\n一个名字\n我的秘密\n我的新娘\n叫小灯\n灯\n明天的雪中新娘\n安坐屋中\n你为什么无鞋\n你为什么\n竖起一根通红的手指\n挡住出嫁日期\n---\n● 1985；1987"},{"id":"short/1983/村庄","title":"村庄","type":"short","year":"1983","body":"村庄里住着\n母亲和儿子\n儿子静静地长大\n母亲静静地注视\n芦花丛中\n村庄是一只白色的船\n我妹妹叫芦花\n我妹妹很美丽\n---\n● 1984"},{"id":"short/1987/灯诗","title":"灯诗","type":"short","year":"1987","body":"灯，从门窗向外生活\n灯啊是我内心的春天向外生活\n黑暗的蜜之女王\n向外生活，“有这样一只美丽的手向外生活”\n火种蔓延的灯啊\n是我内心的春天一人放火\n没有火光，没有火光烧坏家乡的门窗\n春天也向外生长\n度过炎炎大火的一颗火\n却被秋天遍地丢弃\n让白雪走在酒上享受生活\n你是灯\n是我胸脯上的黑夜之蜜\n灯，怀抱着黑夜之心\n烧坏我从前的生活和诗歌\n灯，一手放火，一手享受生活\n茫茫长夜从四放围拢\n如一场黑色的大火\n春天也向外生长\n还给我自由，还给我黑暗的蜜、空虚的蜜\n孤独一人的蜜\n我宁愿在明媚的春光中默默死去\n“有这样一只美丽的手在酒上生活”\n要让白雪走在酒上享受生活\n---\n● 1987（？）"},{"id":"short/1983/村庄_1","title":"村庄","type":"short","year":"1983","body":"村庄，在五谷丰盛的村庄，我安顿下来\n我顺手摸到的东西越少越好！\n珍惜黄昏的村庄，珍惜雨水的村庄\n万里无云如同我永恒的悲伤\n---\n● 1986"},{"id":"short/1987/献诗","title":"献诗","type":"short","year":"1987","body":"——给Ｓ\n谁在美丽的早晨\n谁在这一首诗中\n谁在美丽的火中　飞行\n并对我有无限的赠予\n谁在炊烟散尽的村庄\n谁在晴朗的高空\n天上的白云\n是谁的伴侣\n谁身体黑如夜晚　两翼雪白\n在思念　在鸣叫\n谁在美丽的早晨\n谁在这一首诗中\n---\n● 1987.2.11"},{"id":"short/1983/果园","title":"果园","type":"short","year":"1983","body":"鹿的眼\n两扇有婴儿啼哭\n的窗户。沉积在\n有河水的果园中\n鹿的角\n打下果实\n打下果实中\n劳动的妇人\n体内美如白雪的婴儿\n已被果园的火光\n烧伤。妇人依然\n低坐\n比果树\n比鹿\n比夜晚\n更低。更沉\n比谷地更黑"},{"id":"short/1987/献诗_2","title":"献诗","type":"short","year":"1987","body":"黑夜降临，火回到一万年前的火\n来自秘密传递的火　他又是在白白地燃烧\n火回到火　黑夜回到黑夜　永恒回到永恒\n黑夜从大地上升起　遮住了天空\n---\n● 1989"},{"id":"short/1983/歌-阳光打在地上","title":"歌：阳光打在地上","type":"short","year":"1983","body":"歌：光打在地上\n阳光打在地上\n并不见得\n我的胸口在疼\n疼又怎样\n阳光打在地上\n这地上\n有人埋过羊骨\n有人运过箱子、陶瓶和定石\n有人见过牧猪人，那是长久的漂流之后\n阳光打在地上，阳光依然打在地上\n这地上\n少女们多得好像\n我真有这么多女儿\n真的曾经这样幸福\n用一根水勺子\n用小豆、菠菜、油菜\n把它们养大\n阳光打在地上\n---\n● 1986"},{"id":"short/1987/生殖","title":"生殖","type":"short","year":"1987","body":"夜间雨从天堂滴落，滴到我的青色眼皮上\n那夜的森林之门洞开若火焰咬在大腿上\n一只长吻伸过万里动物的湖泊\n人类咬紧牙关　音乐历历有声\n四月之麦在黎明大雾弥漫中露出群仙般脑壳\n雷声中　闪出一万只青蛙\n血液的红马本像水　流过石榴和子宫\n林子破了\n人破口大骂\n破门而出的感觉\n构筑一个无人停留的小岛\n我将告诉这些在生活中感到无限欢乐的人们\n他们早已在千年的洞中一面盾上锈迹斑斑\n---\n● 1987（？）"},{"id":"short/1983/歌或哭","title":"歌或哭","type":"short","year":"1983","body":"我把包袱埋在果树下\n我是在马厩里歌唱\n是在歌唱\n木床上病中的亲属\n我只为你歌唱\n你坐在拖鞋上\n像一只白羊默念拖着尾巴的\n另一只白羊\n你说你孤独\n就像很久以前\n长星照耀十三个州府\n的那种孤独\n你在夜里哭着\n像一只木头一样哭着\n像花色的土散着香气"},{"id":"short/1987/病少女","title":"病少女","type":"short","year":"1987","body":"白蛾子像美丽\n黄昏的伤口\n在诗人的眼里想起黄昏\n听见村庄在外被风吹拂\n当你一家三口走下月台\n我端坐车中\n如月球居民\n病少女　无遮拦的盐碱地上的风\n吹在你脸上\n病少女　清澈如草\n眉目清朗，使人一见难忘\n听见了美丽村庄被风吹拂\n我爱你的生病的女儿，陌生的父亲\n---\n● 1987.2"},{"id":"short/1983/死亡之诗之一","title":"死亡之诗（之一）","type":"short","year":"1983","body":"漆黑的夜里有一种笑声笑断我坟墓的木板\n你可知道，这是一片埋葬老虎的土地\n正当水面上渡过一只火红的老虎\n你的笑声使河流漂浮\n的老虎\n断了两根骨头\n正在这条河流开始在存有笑声的黑夜里结冰\n断腿的老虎顺河而下来到我的\n窗前\n一块埋葬老虎的木板\n被一种笑声笑断两截"},{"id":"short/1987/盲目","title":"盲目","type":"short","year":"1987","body":"——给维特根施坦\n那个人躲在山谷里研究刑法\n那个人打扰了语言本身\n打扰了那个俘虏和园丁\n扰乱了谷草的图案\n那个人躲在山谷里\n研究犯罪和刑罚\n那个人在寒冷草原搬动木桶\n那个人牵着骆驼，模仿沉默的园丁\n那个人咀嚼谷草犹如牲畜\n那个人仿佛就是语言自身的饥饿\n多欲的父亲\n娶下饱满的母亲\n在部落里怀孕\n在酒馆里怀孕\n在渔船上怀孕\n船舱内消瘦的哲学家思索多欲的父亲\n是多么懊恼\n多欲的父亲　央求家宅存在　门窗齐全\n多欲的父亲　在我们身上　如此使我们恼火\n（挺矛而上的哲学家\n是一个赤裸裸的人）\n是我的裸体\n骑上时间绿色的群马\n冲向语言在时间中的饥饿和犯罪\n那个人躲在山谷里研究刑法\n---\n● 1987.7.16"},{"id":"short/1983/死亡之诗之二-采摘葵花","title":"死亡之诗（之二：采摘葵花）","type":"short","year":"1983","body":"——给凡．高的小叙事：自杀过程\n雨夜偷牛的人\n爬进了我的窗户\n在我做梦的身子上\n采摘葵花\n我仍在沉睡\n在我睡梦的身子上\n开放了彩色的葵花\n那双采摘的手\n仍像葵花田中\n美丽笨拙的鸽子\n雨夜偷牛的人\n把我从人类\n身体中偷走\n我仍在沉睡\n我被带到身体之外\n葵花之外，我是世界上\n第一头母牛（死的皇后）\n我觉得自己很美\n我仍在沉睡\n雨夜偷牛的人\n于是非常高兴\n自己变成了另外的彩色母牛\n在我的身体中\n兴高彩烈地奔跑"},{"id":"short/1987/盲目_1","title":"盲目","type":"short","year":"1987","body":"手在果园里\n就不再孤单\n两只自己的手\n在怀孕别人的手\n---\n● 1987"},{"id":"short/1983/河伯","title":"河伯","type":"short","year":"1983","body":"蛇翼，农业之翼\n他披满农妇之手\n稻种前自\n所有野兔的素囊\n蛇翼，渔民之翼\n桦皮裤子\n桦皮船\n鹿血养好了渔业月亮\n蛇翼，采掘之翼\n一杆根\n一杆笛子\n在牛脚下痛过，呜呜一片小雏\n蛇翼，疾病之翼\n八月之东水\n是匹匹白布\n人们拔木为棺\n蛇翼，情郎之翼\n风中采莲做张你的身子\n一株泥丸，两叶手\n男人是没有河流的河伯"},{"id":"short/1987/石头的病或八七年","title":"石头的病或八七年","type":"short","year":"1987","body":"石头的病　疯狂的病\n不可治疗的病\n不会被理会的病\n被大理石同伙\n视为疾病的石头\n可制造石斧\n以及贫穷诗人的屋顶\n让他不再漂泊　四海为家\n让他在此处安家落户\n此处我就是那颗生病的石头的心\n让他住在你的屋顶上\n鸟鸣清晨如幸福一生\n石头的病　疯狂的病\n石头打开自己的门户　长出房子和诗人\n看见美丽的你\n石头竞相生病\n我身上一块又一块\n全部生病——全变成了柔弱的心\n不堪一击\n从遍是石头的荒野中长出一位美丽女人\n那是石头的疾病——万物的疾病\n石头怎么会在荒野的黑暗中胀开\n石头也会生病　长出鲜花和酒杯\n如果石头健康\n如果石头不再生病\n他哪会开花\n如果我也健康\n如果我也不再生病\n也就没有命运\n---\n● 1987.10"},{"id":"short/1983/泪水","title":"泪水","type":"short","year":"1983","body":"最后的山顶树叶渐红\n群山似穷孩子的灰马和白马\n在十月的最后一夜\n倒在血泊中\n在十月的最后一夜\n穷孩子夜里提灯还家　泪流满面\n一切死于中途　在远离故乡的小镇上\n在十月的最后一夜\n背靠酒馆白墙的那个人\n问起家乡的豆子地里埋葬的人\n在十月的最后一夜\n问起白马和灰马为谁而死……鲜血殷红\n他们的主人是否提灯还家\n秋天之魂是否陪伴着他\n他们是否都是死人\n都在阴间的道路上疯狂奔驰\n是否此魂替我打开窗户\n替我扔出一本破旧的诗集\n在十月的最后一夜\n我从此不再写你"},{"id":"short/1987/祖国或以梦为马","title":"祖国（或以梦为马）","type":"short","year":"1987","body":"我要做远方的忠诚的儿子\n和物质的短暂情人\n和所有以梦为马的诗人一样\n我不得不和烈士和小丑走在同一道路上\n万人都要将火熄灭　我一人独将此火高高举起\n此火为大　开花落英于神圣的祖国\n和所有以梦为马的诗人一样\n我籍次火得度一生的茫茫黑夜\n此火为大　祖国的语言和乱石投筑的梁山城寨\n以梦为上的敦煌——那七月也会寒冷的骨骼\n如白雪的柴和坚硬的条条白雪　横放在众神之山\n和所有以梦为马的诗人一样\n我投入此火　这三者是囚禁我的灯盏　吐出光辉\n万人都要从我刀口走过　去建筑祖国的语言\n我甘愿一切从头开始\n和所有以梦为马的诗人一样\n我也愿将牢底坐穿\n众神创造物中只有我最易朽　带着不可抗拒的死亡的速度\n只有粮食是我的珍爱　我将她紧紧抱住　抱住她在故乡生儿育女\n和所有以梦为马的诗人一样\n我也愿自己埋葬在四周高高的山上　守望平静家园\n面对大河我无限惭愧\n我年华虚度　空有一身疲倦\n和所有以梦为马的诗人一样\n岁月易逝　一滴不剩　水滴中有一匹马儿一命归天\n千年后如若我再生于祖国的河岸\n千年后我再次拥有中国的稻田　和周天子的雪山　天马赐踏\n和所有以梦为马的诗人一样\n我选择永恒的事业\n我的事业　就是要成为太阳的一生\n他从古到今——“日”——他无比辉煌无比光明\n和所有以梦为马的诗人一样\n最后我被黄昏的众神抬入不朽的太阳\n太阳是我的名字\n太阳是我的一生\n太阳的山顶埋葬　诗歌的尸体——千年王国和我\n骑着五千年凤凰和名字叫“马”的龙——我必将失败\n但诗歌本身以太阳必将胜利\n---\n● 1987"},{"id":"short/1983/浑曲","title":"浑曲","type":"short","year":"1983","body":"妹呀\n竹子胎中的儿子\n木头胎中的儿子\n就是你满头秀发的新郎\n妹呀\n晴天的儿子\n雨天的儿子\n就是滚遍你身体的新娘\n妹呀\n吐出香鱼的嘴唇\n航海人花园一样的嘴唇\n就是咬住你的嘴唇"},{"id":"short/1987/秋","title":"秋","type":"short","year":"1987","body":"用我们横陈于地的骸骨\n在沙滩上写下：青春。然后背起衰老的父亲\n时日漫长　方向中断\n动物般的恐惧充塞着我们的诗歌\n谁的声音能抵达秋之子夜　长久喧响\n掩盖我们横陈于地上的骸骨——\n秋已来临。\n没有丝毫的宽恕和温情：秋已来临\n---\n● 1987.8"},{"id":"short/1983/海上婚礼","title":"海上婚礼","type":"short","year":"1983","body":"海湾\n蓝色的手掌\n睡满了沉船和岛屿\n一对对桅杆\n在风上相爱\n或者分开\n风吹起你的\n头发\n一张棕色的小网\n撒满我的面颊\n我一生也不想挣脱\n或者如传说那样\n我们就是最早的\n两个人\n住在遥远的阿拉伯山崖后面\n苹果园里\n蛇和阳光同时落入美丽的小河\n你来了\n一只绿色的月亮\n掉进我年轻的船舱"},{"id":"short/1987/秋_1","title":"秋","type":"short","year":"1987","body":"秋天深了，神的家中鹰在集合\n神的故乡鹰在言语\n秋天深了，王在写诗\n在这个世界上秋天深了\n得到的尚未得到\n该丧失的早已丧失\n---\n● 1987"},{"id":"short/1983/海水没顶","title":"海水没顶","type":"short","year":"1983","body":"原始的妈妈\n躲避一位农民\n把他的柴刀丢地在里\n把自己的婴儿溺死井中\n田地任其荒芜\n灯上我恍惚遇见这个灵魂\n跳上大海而去\n大海在粮仓上汹涌\n似乎我和我的父亲\n雪白的头发在燃烧"},{"id":"short/1987/秋天_1","title":"秋天","type":"short","year":"1987","body":"你带来水　酒瓶和粮食\n秋天　千里内外\n树叶安睡大地\n果实沉落桶底\n发出闷闷声响\n让镰刀平放\n丰收的草原\n秋天的水　上升\n直到果实　果实\n回声似的对称的乳房\n秋天　丰收的篮子\n天堂的篮子\n盛放——“果实”\n病床头刻划的\n阿拉伯或恒河\n的永久文字\n而鱼唱着　梦着　村落\n水离开了形状\n离开了手\n回声\n这是两只丰收的篮子　彼此对称\n乳房\n手\n1986.1草稿\n1987.5改\n---\n● 1987.9再改"},{"id":"short/1983/海滩上为女士算命","title":"海滩上为女士算命","type":"short","year":"1983","body":"你不用算命\n命早就在算你\n你举着筷子\n你坐在碗沿上\n你脱下黑色的女靴\n就盖住城市的尸体\n你裹着布匹\n仍然是吃米的老鼠\n半截泡在沙滩上\n太阳或者钞票上彩色的狗\n啃你的脚被\n你不用算命\n命早就在算你\n---\n● 1986"},{"id":"short/1987/秋天的祖国","title":"秋天的祖国","type":"short","year":"1987","body":"——致毛泽东，他说“一万年太久”。\n一万次秋天的河流拉着头颅　犁过烈火燎烈的城邦\n心还张开着春天的欲望滋生的每一道伤口\n秋雷隐隐　圣火燎烈\n神秘的春天之火化为灰烬落在我们的脚旁\n携带一只头盖骨嗑嗑作响的囚徒\n让我把他的头盖制成一只金色的号角　在秋天吹响\n他称我为青春的诗人　爱与死的诗人\n他要我在金角吹响的秋天走遍祖国和异邦\n从新疆到云南　坐上十万座大山\n秋天　如此遥远的群狮　相会在飞翔中\n飞翔的祖国的群狮　携带着我走遍圣火燎烈的城邦\n如今是秋风阵阵　吹在我暮色苍茫的嘴唇上\n土地表层　那温暖的信风和血滋生的种种欲望\n如今全要化为尸首和肥料　金角吹响\n如今只有他　宽恕一度喧嚣的众生\n把春天和夏天的血痕从嘴唇上抹掉\n大地似乎苦难而丰盛"},{"id":"short/1983/燕子和蛇组诗","title":"燕子和蛇（组诗）","type":"short","year":"1983","body":"1.离　合\n美丽在春天\n疼成草叶\n一种三节的草\n爱你成病\n美丽在天上\n鸟是拖鞋\n长草的拖鞋\n嘴埋在水里\n美丽在水里\n鱼是草的棺材\n一种草\n一种心尖上的草\n美丽在草原上\n枕着鹿头\n2.三位姑娘\n——写给莱蒙托夫不幸的爱情\n我看见\n莱蒙托夫的旧报纸上\n三只燕子\n三只肉体的燕子\n使我的灯光\n受伤\n用手指推推\n不醒的\n你自己\n扶着自己\n像扶着一匹笨马\n用手指推推身边的燕子：我不是\n灯，我是火灾\n燕子交叉地\n穿过\n诗人的胳膊\n落入家俱的间间新房\n只当诗人就是笨马\n过早到死在上\n3.包谷地\n丑女人脊背上有条条花蛇\n花蛇滑下，她就坐在那儿繁殖包谷\n幸福又痛苦\n我要说\n没有男人能配得上她\n丑女人脊背上有种种命运\n命运降临，她只坐在那儿繁殖包谷\n河水泛滥流过无数美丽的女人\n我要说\n没有女人能比得上她\n4.母亲的姻缘\n一碗泥\n一碗水\n半截木梳插在地上\n母亲的姻缘\n真是好姻缘\n村庄，村庄\n木桶中女婴摇晃\n村庄，村庄\n母亲的姻缘\n真是好姻缘\n鱼尾之上\n灯盏敲门\n一团泥巴走进屋来\n母亲的姻缘\n真是好姻缘\n白鱼流过\n桃树树根\n嘴唇碰破在桃花上\n母亲的姻缘\n真是好姻缘\n秤杆上天空的星星压住\n半两土\n半两雪\n母亲的姻缘\n真是好姻缘\n她沉在何方\n谁也不清楚\n村庄中一枚痛苦的小戒指\n母亲的姻缘\n真是好姻缘\n5.手\n离开劳动\n和爱情，我的手\n变成自我安慰的狗\n这两只狗\n一样的\n孤独\n在我脸上摸索\n擦掉眼泪\n这是不是我的狗\n是不是我最后的家乡的狗？\n6.鱼\n村民像牛一样撞进屋子，亲他的妻子\n又数着\n十二粒麦种\n内陆深处\n我跪在一条鱼身上\n整个村庄是我的儿子\n再长的爱情也不算久\n嘿你刚好被我想起\n我在鱼身上写下少女的名字\n一边询问一边自己回答\n女巫的嘴唇一开一合\n真诚的爱情\n真诚的爱情错误百出\n整个村庄是你的儿子\n河流噢河\n再美的爱情也不像花朵\n人类的泪水养家糊口\n人类的泪水中\n鱼群像草一样生长\n泪水噢河\n整个村庄是我们的儿子\n村民像牛一样撞进屋子，亲他的妻子"},{"id":"short/1987/秋日山谷","title":"秋日山谷","type":"short","year":"1987","body":"我手捧秋天脱下的盔甲\n崇山峻岭大火熊熊\n秋天宛若昨日的梦境\n我们脱落的睫毛　在山谷变成火把\n照亮百花凋零的山谷\n把她们变幻无常的一生做成酒精\n那是秋天的灯　凛然神采坐在远方\n那是醉卧荒山野岭的我们……\n……饱经四季的摧残\n在山谷，我们的头颅在夜里变成明亮的灯盏和酒杯\n相互照亮和祝福之后\n此刻我们就要逃遁\n---\n● 1987"},{"id":"short/1983/爱情诗集","title":"爱情诗集","type":"short","year":"1983","body":"坐在烛台上\n我是一只花圈\n想着另一只花圈\n不知道何时献上\n不知道怎样安放"},{"id":"short/1987/秋日想起春天的痛苦也想起雷锋","title":"秋日想起春天的痛苦也想起雷锋","type":"short","year":"1987","body":"春天　春天\n他何其短暂\n春天的一生痛苦\n他一生幸福\n又想起你撞开门扇你怀抱春天\n你坐下。快坐下，在这如痴如醉的地方\n春天的一生痛苦\n他一生幸福\n春天　春天　春天的一生痛苦\n我的村庄中有一个好人叫雷锋叔叔\n春天的一生痛苦\n他一生幸福\n如今我长得比雷锋还大\n村庄中痛苦女神安然入睡\n春天的一生痛苦\n他一生幸福\n---\n● 1985；1987"},{"id":"short/1983/粮食","title":"粮食","type":"short","year":"1983","body":"埋着猎人的山冈\n是猎人生前唯一的粮食\n粮食\n是图画中的妻子\n西边山上\n九只母狼\n东边山上\n一轮月亮\n反复抱过的妻子是枪\n枪是沉睡爱情的村庄"},{"id":"short/1987/秋日黄昏","title":"秋日黄昏","type":"short","year":"1987","body":"火焰的顶端\n落日的脚下\n茫茫黄昏　华美而无上\n在秋天的悲哀中成熟\n日落大地　大火熊熊　烧红地平线滚滚而来\n使人壮烈　使人光荣与寿同在　分割黄昏的灯\n百姓一万倍痛感黑夜来临\n在心上滚动万寿无疆的言语\n时间的尘土　抱着我\n在火红的山冈上跳跃\n没有谁来应允我\n万寿无疆或早夭襁褓\n相反的是　这个黄昏无限痛苦\n无限漫长　令人痛不欲生\n切开血管\n落日殷红\n愿有情人终成眷属\n愿爱情保持一生\n或者相反　极为短暂　匆匆熄灭\n愿我们从此再不提起\n再不提起过去\n痛苦与幸福\n生不带来　死不带去\n唯黄昏华美而无上。\n1987.9.3草稿\n---\n● 1987.10.4改"},{"id":"short/1983/给1986","title":"给1986","type":"short","year":"1983","body":"“就像两个凶狠的僧侣点火烧着了野菊花地\n——这就是我今年的心脏”\n（或者绿宝石的湖泊中马匹淹没时仅剩的头颅）\n马脑袋里无尽的恐惧！无尽的对于水和果实的恐惧！\n“（当我摇着脖子漫游四方）\n你的嘴唇像深入果园的云彩）\n（而我脑袋中残存着马头的恐惧\n对于嘴唇和果实的恐惧）”\n“（我那清凉的井水\n洗着我的脚像洗着两件兵器\n（天鹅的遗赅远远飞来\n墓地的喇叭歌唱一个在天鹅身体上砍伐的人）”\n---\n● 1986"},{"id":"short/1987/粮食两节","title":"粮食两节","type":"short","year":"1987","body":"1.\n在人类的遭遇中\n在远方亲人的手中\n为什么有这样的简朴\n而单一的粮食\n仿佛它饶恕了我们\n仿佛以粮食的名义\n它理解了我们\n安慰了我们\n2.谷\n“谷”字很奇怪　说粮食——“谷”\n这仿佛是诗人的一句话　诗人的创造\n粮食——头顶大火——下面张开嘴来　\n粮食　头上是火　下面或整个身躯是嘴　张开\n大火熊熊的头颅和嘴\n粮食\n——————————\n　海子在此使用的是拆字法，将“谷”字上下拆开。"},{"id":"short/1983/给安徒生","title":"给安徒生","type":"short","year":"1983","body":"1．\n让我们砍下树枝做好木床\n一对天鹅的眼睛照亮\n一块可供下蛋的岩石\n让我们砍下树枝做好木床\n我的木床上有一对幸福天鹅\n一只匆匆下蛋，一只匆匆死亡\n2．\n天鹅的眼睛落在杯子里\n就像日月落在大地上\n---\n● 1986"},{"id":"short/1987/给伦敦","title":"给伦敦","type":"short","year":"1987","body":"马克思、维特根施坦\n两个人，来到伦敦\n一前一后，来到这个大雾弥漫的\n岛国之城\n一个宏伟的人，一个简洁的人\n同样的革命和激进\n同样的一生清贫\n却带有同样一种摧毁性的笑容\n内心虚无\n内心贫困\n在货币和语言中出卖一生\n这还不是人类的一切啊！\n石头，石头，卖了石头买石头\n卖了石头换来石头\n卖了石头还有石头\n石头还是石头，人类还是人类"},{"id":"short/1983/给母亲组诗","title":"给母亲（组诗）","type":"short","year":"1983","body":"1.风\n风很美　果实也美\n小小的风很美\n自然界的乳房也美\n水很美　水啊\n无人和你\n说话的时刻很美\n你家中破旧的门\n遮住的贫穷很美\n风　吹遍草原\n马的骨头　绿了\n2.泉水\n泉水　泉水\n生物的嘴唇\n蓝色的母亲\n用肉体\n用野花的琴\n盖住岩石\n盖住骨头和酒杯\n3.云\n母亲\n老了，垂下白发\n母亲你去休息吧\n山坡上伏着安静的儿子\n就像山腰安静的水\n流着天空\n我歌唱云朵\n雨水的姐妹\n美丽的求婚\n我知道自己颂扬情侣的诗歌没有了用场\n我歌唱云朵\n我知道自己终究会幸福\n和一切圣洁的人\n相聚在天堂\n4.雪\n妈妈又坐在家乡的矮凳子上想我\n那一只凳子仿佛是我积雪的屋顶\n妈妈的屋顶\n明天早上\n霞光万道\n我要看到你\n妈妈，妈妈\n你面朝谷仓\n脚踏黄昏\n我知道你日见衰老\n5.语言和井\n语言的本身\n像母亲\n总有话说，在河畔\n在经验之河的两岸\n在现像之河的两岸\n花朵像柔美的妻子\n倾听的耳朵和诗歌\n长满一地\n倾听受难的水\n水落在远方\n---\n● 1984；1985改；1986再改"},{"id":"short/1987/给安庆","title":"给安庆","type":"short","year":"1987","body":"五岁的黎明\n五岁的马\n你面朝江水\n坐下\n四处漂泊\n向不谙世事的少女\n向安庆城中心神不定的姨妹\n打听你，谈论你\n可能是妹妹\n也可能是姐妹\n可能是姻缘\n也可能是友情\n---\n● 1987"},{"id":"short/1983/给萨福","title":"给萨福","type":"short","year":"1983","body":"美丽如同花园的女诗人们\n相互热爱，坐在谷仓中\n用一只嘴唇摘取另一只嘴唇\n我听见青年中时时传言道：萨福\n一只失群的\n钥匙下的绿鹅\n一样的名字。盖住\n我的杯子\n托斯卡尔的美丽的女儿\n草药和黎明的女儿\n执杯者的女儿\n你野花\n的名字\n就像蓝色冰块上\n淡蓝色水清的溢出\n萨福萨福\n红色的云缠在头上\n嘴唇染红了每一片飞过的鸟儿\n你散着身体香味的\n鞋带被风吹断\n在泥土里\n谷色中的嘤嘤之声\n萨福萨福\n亲我一下\n你装饰额角的诗歌何其甘美\n你凋零的棺木像一盘美丽的\n棋局"},{"id":"short/1987/美丽白杨树","title":"美丽白杨树","type":"short","year":"1987","body":"灵魂像山腰或者山顶四只恼人的蹄子\n移动步履，幻变无常的人类\n可还记得白色的杨树　平静而美丽\n可还记得　一阵雷声　自远方滚来\n高高的天空回荡天堂的声响\n幻变无常的人类　可还记得\n闪电和雨水中的　白色杨树\n在你的河岸上　女人　月亮　马　匆匆而去\n四只蹄子在你的河岸上\n拥有一间雪中的屋子　婚姻　或一面镜子\n这就是大地上你全部的居所\n难忘有一日歇脚白杨树下\n白色美丽的树！\n在黄金和允诺的地上\n陪伴花朵和诗歌　静静地开放　安详地死亡\n美丽的白杨树　这是一位无名的诗人\n使女儿惊讶　而后长成幸福的主妇　不免中老于斯\n这是一位无名的诗人使女儿惊讶\n美丽的白杨树\n这多像弟弟和父亲对她们的忠实\n---\n● 1987.5.7"},{"id":"short/1983/肉体之二","title":"肉体（之二）","type":"short","year":"1983","body":"肉体美丽\n肉体是树林中\n唯一活着的肉体\n肉体，远离其他的财宝\n远离其他的神秘兄弟\n肉体独自站立\n看见了鸟和鱼\n肉体睡在河水两岸\n雨和森林的新娘\n睡在河水两岸\n垂着谷子的大地上\n太阳和肉体\n一升一落，照耀四方\n像寂静的\n节日的\n财宝和村庄\n照耀\n只有肉体美丽\n野花，太阳明亮的女儿\n河川和忧愁的妻子\n感激肉体来临\n感激灵魂有所附丽\n（肉体是野花的琴\n盖住骨骼的酒杯）\n感激我自己沉重的骨骼\n也能做梦\n肉体是河流的梦\n肉体看见了采茴香的人迎着泉水\n肉体美丽\n肉体是树林中\n唯一活着的肉体\n死在树林里\n迎着墓地\n肉体美丽\n---\n● 1986"},{"id":"short/1987/耶稣","title":"耶稣","type":"short","year":"1987","body":"（圣之羔羊）\n从罗马回到山中\n铜嘴唇变成肉嘴唇\n在我的身上　青铜的嘴唇飞走\n在我的身上　羊羔的嘴唇苏醒\n从城市回到山中\n回到山中羊群旁\n的悲伤\n像坐满了的一地羊群\n---\n● 1987.12.28夜"},{"id":"short/1983/自杀者之歌","title":"自杀者之歌","type":"short","year":"1983","body":"伏在下午的水中\n窗帘一掀一掀\n一两根树枝伸过来\n肉体，水面的宝石\n是对半分裂的瓶子\n瓶里的水不能分裂\n伏在一具斧子上\n像伏在一具琴上\n还有绳索\n盘在床底下\n林间的太阳砍断你\n像砍断南风\n你把枪打开，独自走回故乡\n像一只鸽子\n倒在猩红的篮子上"},{"id":"short/1987/酒杯-情诗一束","title":"酒杯：情诗一束","type":"short","year":"1987","body":"1.火热的嘴唇\n两万只酒杯从你诞生\n万物的疾病从你诞生\n2.月亮\n沉默的活着的镰刀形的火光\n似一颗焚烧的头颅在荒野滚动\n沉默的活着的镰刀形的牧场\n神秘、寒冷而宁静\n3.乳房\n埃及的河水\n在埃及的子夜\n——这黑夜的酒\n这黑夜的酒　变成我的双手\n4.盲目\n手在果园里\n就不再孤单\n两只自己的手\n在怀孕别的手\n5.火热的嘴唇\n那是花朵　那是头颅做成的酒杯\n酒杯在草原上轻轻碰撞\n盛满酒精的头颅空空荡荡\n火苗熏黑的山梁\n帐篷诞生又死亡\n火灾中升起的灯光　把大地照亮"},{"id":"short/1983/自画像","title":"自画像","type":"short","year":"1983","body":"镜子是摆在桌上的\n一只碗\n我的脸\n是碗中的土豆\n嘿，从地里长出了\n这些温暖的骨头\n---\n● 1984"},{"id":"short/1987/酒杯","title":"酒杯","type":"short","year":"1987","body":"你的泪水为我洗去尘土和孤独\n你的泪水为我在飞机场周围的稻谷间珍藏\n酒杯，你这石头的少女，你这石头的牢房，石头的伞\n酒，石头的牢房囚禁又释放的满天奔腾的闪电\n昨天一夜明亮的闪电使我的杯子又满又空\n看哪！河水带来的泥沙堆起孤独的房屋\n看哪！你的房子小得像一只酒杯\n你的房子小得像一把石头的伞\n多云的天空下　潮湿的风吹干的道路\n你找不到我，你就是找不到我，你怎么也找不到我\n在昔日山坡的羊群中\n酒杯，你是一间又破又黑的旧教室\n淹没在一片海水\n---\n● 1989（？）1.14"},{"id":"short/1983/莫扎特在安魂曲中说","title":"莫扎特在《安魂曲》中说","type":"short","year":"1983","body":"我所能看见的妇女\n水中的妇女\n请在麦地之中\n清理好我的骨头\n如一束芦花的骨头\n把它装在琴箱里带回\n我所能看见的\n洁净的妇女，河流\n上的妇女\n请把手伸到麦地之中\n当我没有希望\n坐在一束麦子上回家\n请整理好我那零乱的骨头\n放入那暗红色的小木柜，带回它\n像带回你们富裕的嫁妆"},{"id":"short/1987/重建家园","title":"重建家园","type":"short","year":"1987","body":"在水上　放弃智慧\n停止仰望长空\n为了生存你要流下屈辱的泪水\n来浇灌家园\n生存无须洞察\n大地自己呈现\n用幸福也用痛苦\n来重建家乡的屋顶\n放弃沉思和智慧\n如果不能带来麦粒\n请对诚实的大地\n保持缄默　和你那幽暗的本性\n风吹炊烟\n果园就在我身旁静静叫喊\n“双手劳动\n慰籍心灵”\n---\n● 1987"},{"id":"short/1983/门关户闭","title":"门关户闭","type":"short","year":"1983","body":"门关户闭\n诗歌的乞讨人\n一只布口袋\n装满女儿的三顿剩饭\n坐在树底下\n洗着几代人的脏袜子\n我就是那女儿\n农民的女儿\n中国农民的女儿\n波兰农民的女儿\n洗着几代人的袜子\n等着冰融雪化\n在所有的人中\n只有我粗笨\n善良的只有我\n熟悉身边的木头\n瓦片和一代代\n诚实的婚姻\n---\n● 1986"},{"id":"short/1987/野花","title":"野花","type":"short","year":"1987","body":"野花\n和平与情歌\n的村庄\n女儿的女儿\n野花\n中国丁香的少女！\n在林中酣睡\n长发似水\n容貌美丽无比\n你是囚禁在一颗褐色星球上孤独的情人！\n野兽的琴\n各色小鸟秘密的隐衷\n大地彩色的屋顶\n太小太美\n如心\n心啊\n雨和幸福\n的女儿\n水滴爱你\n伴侣爱你\n我爱你\n野花自己也爱你\n---\n● 1987.10"},{"id":"short/1983/阿尔的太阳","title":"阿尔的太阳","type":"short","year":"1983","body":"阿尔的太阳 \n——给我的瘦哥哥\n“一切我所向着的自然创作的，是栗子，从火中取出来的。啊，那不信仰太阳的人是背弃了神的人。”\n到南方去\n到南方去\n你的血液里没有情人和春天\n没有月亮\n面包甚至都不够\n朋友更少\n只有一群苦痛的孩子，吞噬着一切\n瘦哥哥凡·高，凡·高啊\n从地下强劲喷出的\n火山一样不计后果的\n是丝杉和麦田\n还是你自己\n喷出多余的活命的时间\n其实，你的一只眼睛就可以照亮世界\n但你还要使用第三只眼，阿尔的太阳\n把星空烧成粗糙的河流\n把土地烧得旋转\n举起黄色的痉挛的手，向日葵\n邀请一切火中取栗的人\n不要再画基督的橄榄园\n要画就画橄榄收获\n画强暴的一团火\n代替天上的老爷子\n洗净生命\n红头发的哥哥，喝完苦艾酒\n你就开始点这把火吧\n烧吧\n---\n● 1984.4\n—————————————\n　阿尔系法国南部一小镇，凡·高在此创作了七八十幅画，这是他的黄金时期。——海子自注。\n　摘自凡·高致其弟泰奥书信。"},{"id":"short/1987/长发飞舞的姑娘","title":"长发飞舞的姑娘","type":"short","year":"1987","body":"（五月之歌）\n玫瑰谢了，玫瑰谢了\n如早嫁的姐妹漂落，漂落四方\n我红色的姐姐，我白色的妹妹\n大地和水挽留了她们　熄灭了她们\n她们黯然熄灭，永远沉默却是为何？\n姐妹们，你们能否告诉我\n你们永久的沉默是为了什么\n长发飞舞的黑眼睛姑娘\n不像我的姐姐　也不像妹妹\n不似早嫁的姐妹迟迟不归\n如今我坐在街镇的一角\n为你歌唱，远离了五谷丰盛的村庄\n---\n● 1987.5"},{"id":"short/1983/马断片","title":"马（断片）","type":"short","year":"1983","body":"马\n（断片）\n0．\n……而你无知的母亲\n还是生下了你\n总有一天\n你我相遇\n而那无知的马受惊的马一跃而起\n踏碎了我\n1．\n太阳，吐血的母马\n她一头倒在\n我身上\n我全身起了大火\n因此我四肢在空中燃烧，翻腾\n碰到一匹匹受伤的马阵亡的马\n你还在上面，还在上面\n我的沉重的身子却早在下沉\n一路碰撞\n接着双手摸到的只有更低处的谷子\n还有平原的谷仓\n你还在上面，在上面，而平原的谷仓坍塌\n匆匆把我掩埋\n2．\n燃烧的马，拉着尸体，冲出了大地\n所行的路上\n大马的头颅\n拖着人头\n晃动\n如几株大麦\n挡不住！\n3．\n当另一批白色马群来到\n破门而入\n倒在你室内的地上\n久久昏睡不醒\n久久\n要知道\n她们跑过了许多路\n她们——\n我诗歌的女儿\n就只好破门而入\n蒙古的城市噢\n青色的城\n4．\n我就是那疯狂的、裸着身子\n驮过死去诗人的\n马\n整座城市被我的创伤照亮\n斜插在我身上无数箭枝\n被血浸透\n就像火红的玉米\n---\n● 1986"},{"id":"short/1987/雨","title":"雨","type":"short","year":"1987","body":"打一支火把走到船外去看山头被雨淋湿的麦地\n又弱又小的麦子!\n然后在神像前把火把熄灭\n我们沉默地靠在一起\n你是一个仙女，住在庄园的深处\n月亮　你寒冷的火焰　你雨衣中裸体少女依然新鲜\n今天夜晚的火焰穿戴得像一朵鲜花\n在南方的天空上游泳\n在夜里游泳　越过我的头顶\n高地的小村庄又小又贫穷\n像一颗麦子\n像一把伞\n伞中裸体少女沉默不语\n贫穷孤独的少女　像女王一样　住在一把伞中\n阳光和雨水只能给你尘土和泥泞\n你在伞中，躲开一切\n拒绝泪水和回忆"},{"id":"short/1983/黄金草原","title":"黄金草原","type":"short","year":"1983","body":"草原上的羊群\n在水泊上照亮了自己\n像白色温柔的灯\n睡在男人怀抱中\n而牧羊人来自黄金草原\n头颅像一颗树根\n把羊抱进谷仓里\n然后面对黄金和酒杯\n称呼你为女人\n女人，我知心的朋友\n风吹来风吹去\n你如星的名字\n或者羊肉的腥\n你在山崖下睡眠\n七只绵羊七颗星辰\n你含在我口中似雪未化\n你是天空上的羊群"},{"id":"short/1987/雨鞋","title":"雨鞋","type":"short","year":"1987","body":"我的双脚在你之中\n就像火走在柴中\n雨鞋和羊和书一起塞进我的柜子\n我自己被塞进像框，挂在故乡\n那粘土和石头的房子，房子里用木生火\n潮湿的木条上冒着烟\n我把撕碎的诗稿和被雨打湿\n改变了字迹的潮湿的书信\n卷起来，这些灰色的信\n我没有再读一遍\n普希金将她们和拖鞋一起投进壁炉\n我则把这些温暖的灰烬\n把这些信塞进一双小雨鞋\n让她们沉睡千年\n梦见洪水和大雨\n---\n● 1987.1.12达县"},{"id":"short/1983/龙","title":"龙","type":"short","year":"1983","body":"黄色的月光\n奇怪又空荡\n远方就是你一无所有的地方\n风吹来的方向\n庄稼\n音乐\n船\n龙听着\n火光\n在高原上\n云朵\n家乡\n原来的地方\n草原蒙水\n罐\n天下龙听着\n水流汩汩"},{"id":"short/1987/马火灰鼎","title":"马、火、灰——鼎","type":"short","year":"1987","body":"有了安慰，马飞来了，甚至有了盐，有了死亡\n有了安慰，有了爪子，有了牙，甚至有了故乡，不缺乏春天\n仍然缺少一具多么坚强的骷髅牢牢锁住我　多么牢固\n我的舞蹈举起一片消费人血的灯\n和耗尽什么的头颅　麦芒在煮光了自己之后\n只剩下空杆之火　不尽诉说\n有了安慰，有了马、火、灰、鼎，甚至有了夜晚\n仍然缺少鬼魂，死过一次的缺少再次死亡\n两姐妹只死了一个，天空却需要她们全部死亡\n最好是无人收拾雪白的骨殖　任荒山更加荒芜下去\n只剩下一片沙漠　和　戈壁\n有了安慰，而我们是多么缺少绝望\n我所在的地方滴水不存，寸草不生，没有任何生长"},{"id":"short/1987/马雅可夫斯基自传","title":"马雅可夫斯基自传","type":"short","year":"1987","body":"微微发紫的光线里一个胎儿、一朵向日葵\n诗人在小镇一角度完一生\n在那家残破的灯下\n旅馆破旧\n石头流动\n梨花阵阵\n迟钝和内心冲突\n一棵梨子树，梨花阵阵\n头盖骨龟裂——箭壶愚蠢摇动\n火烧山地　白色梨花阵阵\n刮去遍体鳞伤\n一切噪音进入我的语言\n化成诗歌与音乐　梨花阵阵\n在我弃绝生活的日子里\n黑脑袋——杀死了我\n以我血为生　背负冰凉斧刃\n黑脑袋　长出一片胳膊\n挥舞一片胳膊\n露出一切牙齿、匕首\n黑头里垒满了石头\n像青铜一样站着\n站到最后　站到末日\n---\n● 1987"},{"id":"short/1987/麦地-或遥远","title":"麦地　或遥远","type":"short","year":"1987","body":"发自内心的困扰　饱含麦粒的麦地\n内心暴烈\n麦粒在手上缠绕\n麦粒　大地的裸露\n大地的裸露　在家乡多孤独\n坐在麦地上忘却粮仓　歉收或充盈的痛苦\n谷仓深处倾吐一句真挚的诗　亲人的询问\n幸福不是灯火\n幸福不能照亮大地\n大地遥远　清澈镌刻\n痛苦\n海水的光芒\n映照在绿色粮仓上\n鱼鲜撞动\n沙漠之上的雪山\n天空的刀刃\n冰川　散开大片羽毛的光\n大片的光　在河流上空　痛苦地飞翔"},{"id":"short/1987/麦地与诗人","title":"麦地与诗人","type":"short","year":"1987","body":"询问\n在青麦地上跑着\n雪和太阳的光芒\n诗人，你无力偿还\n麦地和光芒的情义\n一种愿望\n一种善良\n你无力偿还\n你无力偿还\n一颗放射光芒的星辰\n在你头顶寂寞燃烧\n答复\n麦地\n别人看见你\n觉得你温暖，美丽\n我则站在你痛苦质问的中心\n被你灼伤\n我站在太阳　痛苦的芒上\n麦地\n神秘的质问者啊\n当我痛苦地站在你的面前\n你不能说我一无所有\n你不能说我两手空空\n麦地啊，人类的痛苦\n是他放射的诗歌和光芒\n---\n● 1987"},{"id":"short/1987/黎明-一首小诗","title":"黎明：一首小诗","type":"short","year":"1987","body":"黎明\n我挣脱\n一只陶罐\n或大地的边缘\n我的双手　向着河流飞翔\n我挣脱一只刻划麦穗的陶罐　太阳\n我看见自己的面容　火焰\n在黎明的风中飘忽不定\n我看见自己的面容\n火焰　像一片升上天空的大海\n像静静的天马\n向着河流飞翔\n1985草稿\n---\n● 1987改"},{"id":"short/1987/黎明和黄昏","title":"黎明和黄昏","type":"short","year":"1987","body":"——两次嫁妆，两位姐妹\n黄昏自我断送\n夜色美好\n夜色在山上越长越大\n马与羊　钻出石头　在山上越长越大\n白雪飘落　在这个黄昏\n向我隐隐献出\n她们自己\n我的秘密的女神\n我该用怎样的韵律\n告诉你，侍奉你\n我该用怎样的流血\n在山头舔好自己的伤口\n了望一望无际的大地\n以此慰藉\n以“遗忘”为伴侣\n我将把自己带出那些可以辨认嘴脸的火把之光\n从此踏上无可救药的道路\n把肉体当作草原上最后的帐篷\n那些神秘的编织女人\n纺轮被黄昏的天空映得泛红\n血液颜色的轮轴　一夜作响\n我屈从于她们\n死于剑下的晚霞的姐妹\n在夜色中起飞\n我屈从于黄昏秘密的飞行\n肉体回到黑夜的高空\n两半血红的月亮抱在一起\n迟至今日\n我仍难以诉说\n那些背叛父母和家园\n却热爱生活的人\n为什么要和我结伴上路\n我的青春　我的几卷革命札记\n被道路上的难民镌刻在一只乞讨生活的木碗上\n那只碗曾盛过殷红如血的晚霞和往日一切生活\n在死到临头\n他是否摔碎\n还是留传孩子\n晚霞燃烧\n厄运难逃\n我在人生的尽头\n抱住一位宝贵的诗人痛哭失声\n却永远无法改变自己的命运\n我就是那位被人拥抱的诗人\n宝贵的诗人\n看见晚霞映照草原\n内心痛苦甚于别人\n人类犹如黄昏和夜晚的灰烬\n散布在河畔　忧伤疲倦\n人类犹如火种的脚　在大地上行走\n晚霞充满大火\n和焦味。一望无际\n伸展在平原和荒凉的海滩\n两半血红的月亮抱在一起\n那是诗人孤独的王座\n愿有情人终成眷属\n愿麦子和麦子长在一起\n愿河流与河流流归一处\n浩瀚无际的河水顺着夜色流淌\n神秘的流浪国王\n在夜色中回到故乡\n城市破碎\n流浪的国王\n我为你歌唱\n夜色使平原广大　使北方无限　使烈火吹遍\n把北方无尽的黄昏抬向滚滚高空\n黎明更高　铺在海洋上\n---\n● 1987"}];
