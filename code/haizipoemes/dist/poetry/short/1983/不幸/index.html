</span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline> </svg> </a> </div> <div class="poem-divider"></div> <div class="poem-text prose"> <p>四月的日子　最好的日子</p>
<p>和十月的日子　最好的日子</p>
<p>比四月更好的日子</p>
<p>像两匹马　拉着一辆车</p>
<p>把我拉向医院的病床</p>
<p>和不幸的病痛</p>
<p>有一座绿色悬崖倒在牧羊人怀中</p>
<p>两匹马</p>
<p>在山上飞</p>
<p>两匹马</p>
<p>白马和红马</p>
<p>积雪和枫叶</p>
<p>犹如姐妹</p>
<p>犹如两种病痛</p>
<p>的鲜花</p> </div> <!-- 上一首 / 下一首导航 --> <nav class="poem-nav"> <a href="/poetry/short/1983/七月的大海" class="poem-nav-link poem-nav-link--prev"> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> <path d="M19 12H5M12 19l-7-7 7-7"></path> </svg> <span class="poem-nav-title">七月的大海</span> </a> <a href="/poetry/short/1983/东方山脉" class="poem-nav-link poem-nav-link--next"> <span class="poem-nav-title">东方山脉</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> <path d="M5 12h14M12 5l7 7-7 7"></path> </svg> </a> </nav> </article> <!-- 桌面端：右侧 sticky 目录 -->  </div>   </div> <!-- 返回顶部按钮（定位在主容器内） --> <button class="back-to-top" aria-label="返回顶部" title="返回顶部"> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> <path d="M12 19V5M5 12l7-7 7 7"></path> </svg> </button> </div> </div> <script type="module">const e=document.querySelector(".back-to-top");if(e){const o=e.parentElement?.querySelector(".overflow-y-auto")||document.documentElement;o.addEventListener("scroll",()=>{e.classList.toggle("visible",o.scrollTop>300)},{passive:!0}),e.addEventListener("click",()=>{o.scrollTo({top:0,behavior:"smooth"})})}</script> </body> </html> <script type="module" src="/_astro/_...slug_.astro_astro_type_script_index_0_lang.ByC4cZG7.js"></script>
